[project]
name = "helmstudio-pipelines"
version = "0.1.0"
description = "helmstudio pipelines_service: runs batches (one workflow per row) as LangGraph threads, driven by NATS"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langgraph>=1.2.22,<1.3",
    "langgraph-checkpoint>=4.3.2,<5",
    "langgraph-checkpoint-postgres>=3.2.1,<4",
    "psycopg[binary]>=3.3.9",
    "psycopg-pool>=3.3.3",
    "nats-py>=2.16.0",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0", "ruff==0.17.5"]

[tool.uv]
package = false
required-version = "==0.13.8"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# langsmith (pulled in by langgraph, unused) calls a 3.14-deprecated asyncio helper
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["gen"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]  # tracing is forced off before the imports
