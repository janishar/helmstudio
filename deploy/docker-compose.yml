# The helmstudio stack: compose project helmstudio (Kong on 127.0.0.1:${KONG_HTTP_PORT}, the services, NATS, Postgres,
# SeaweedFS). From the repo root (or use the Makefile):
#   .tools/copy-envs && .tools/make-secrets          # per-service .env files + deploy/secrets/ (git-ignored)
#   docker compose -f deploy/docker-compose.yml -f deploy/compose/fake.yml up -d --build --wait
#   docker compose -f deploy/docker-compose.yml run --rm -T auth apikey helm     # issue the CLI's API key
name: helmstudio

# The services: one fragment each (paths in them are relative to deploy/). No fakes here: the fake runner and the fake
# servers are in the overlay compose/fake.yml (dev and test stacks); production adds compose/prod.yml instead.
include:
  - {path: compose/studio.yml, project_directory: .}
  - {path: compose/files.yml, project_directory: .}
  - {path: compose/web.yml, project_directory: .}
  - {path: compose/pipelines.yml, project_directory: .}
  - {path: compose/media-tools.yml, project_directory: .}

# Secrets (DB passwords and URLs, NATS users, S3 keys, the JWT key, the web app's API key, the /files signing key) are
# files made by .tools/make-secrets; services read them through <VAR>_FILE (mounted at /run/secrets/<name>).
secrets:
  postgres_password: {file: "${HELM_SECRETS:-secrets}/postgres_password"}
  auth_db_password: {file: "${HELM_SECRETS:-secrets}/auth_db_password"}
  studio_db_password: {file: "${HELM_SECRETS:-secrets}/studio_db_password"}
  pipelines_db_password: {file: "${HELM_SECRETS:-secrets}/pipelines_db_password"}
  auth_database_url: {file: "${HELM_SECRETS:-secrets}/auth_database_url"}
  studio_database_url: {file: "${HELM_SECRETS:-secrets}/studio_database_url"}
  pipelines_database_url: {file: "${HELM_SECRETS:-secrets}/pipelines_database_url"}
  nats_admin_password: {file: "${HELM_SECRETS:-secrets}/nats_admin_password"}
  nats_auth_password: {file: "${HELM_SECRETS:-secrets}/nats_auth_password"}
  nats_studio_password: {file: "${HELM_SECRETS:-secrets}/nats_studio_password"}
  nats_runner_password: {file: "${HELM_SECRETS:-secrets}/nats_runner_password"}
  nats_pipelines_password: {file: "${HELM_SECRETS:-secrets}/nats_pipelines_password"}
  nats_runner_mac_torch_password: {file: "${HELM_SECRETS:-secrets}/nats_runner_mac_torch_password"}   # the native Mac runners (make runners)
  nats_runner_mac_mlx_password: {file: "${HELM_SECRETS:-secrets}/nats_runner_mac_mlx_password"}
  nats_runner_mac_native_password: {file: "${HELM_SECRETS:-secrets}/nats_runner_mac_native_password"}
  nats_admin_url: {file: "${HELM_SECRETS:-secrets}/nats_admin_url"}
  nats_auth_url: {file: "${HELM_SECRETS:-secrets}/nats_auth_url"}
  nats_studio_url: {file: "${HELM_SECRETS:-secrets}/nats_studio_url"}
  nats_runner_url: {file: "${HELM_SECRETS:-secrets}/nats_runner_url"}
  nats_pipelines_url: {file: "${HELM_SECRETS:-secrets}/nats_pipelines_url"}
  s3_access_key_id: {file: "${HELM_SECRETS:-secrets}/s3_access_key_id"}
  s3_secret_access_key: {file: "${HELM_SECRETS:-secrets}/s3_secret_access_key"}
  jwt_private_key: {file: "${HELM_SECRETS:-secrets}/jwt_private_key"}
  web_api_key: {file: "${HELM_SECRETS:-secrets}/web_api_key"}
  helm_api_key: {file: "${HELM_SECRETS:-secrets}/helm_api_key"}      # the CLI's key (client "helm")
  file_url_secret: {file: "${HELM_SECRETS:-secrets}/file_url_secret"}  # studio signs /files links with it, files verifies them
  nats_gpu_hosts: {file: "${HELM_SECRETS:-secrets}/nats_gpu_hosts.conf"}  # remote GPU hosts' NATS passwords (nats.conf includes it)
  s3_config: {file: "${HELM_SECRETS:-secrets}/s3_config.json"}        # SeaweedFS identities: the admin key + one runner-<h> per GPU host

# Fixed addresses for the two hops allowed to set X-Forwarded-For: Kong (trusted by auth) and the web BFF (trusted
# by Kong and auth), so sign-in rate limits key on the browser's IP and a header sent from outside is ignored. Every
# other container gets an address from .128/25, so a new service can never take .10 or .11 first.
networks:
  default:
    ipam: {config: [{subnet: "${HELM_NET:-172.30.97}.0/24", ip_range: "${HELM_NET:-172.30.97}.128/25"}]}

services:
  kong:
    build: ../kong
    image: ${IMAGE_PREFIX:-helmstudio/}kong:${IMAGE_TAG:-dev}
    environment:
      KONG_PORT_MAPS: "${KONG_HTTP_PORT:-8300}:8000"   # X-Forwarded-Port = the host port (web's redirects)
      KONG_TRUSTED_IPS: ${HELM_NET:-172.30.97}.11      # only the web BFF may name the client (X-Forwarded-For)
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      # a recreated service gets a new IP and is briefly unresolvable: re-resolve in seconds, never cache "no such host"
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_DNS_STALE_TTL: "1"
    networks: {default: {ipv4_address: "${HELM_NET:-172.30.97}.10"}}
    ports: ["127.0.0.1:${KONG_HTTP_PORT:-8300}:8000"]   # the only published service port
    healthcheck: {test: [CMD, kong, health], interval: 5s, timeout: 5s, retries: 20}
    depends_on:
      auth: {condition: service_healthy}
      studio: {condition: service_healthy}
      files: {condition: service_healthy}
      web: {condition: service_healthy}

  auth:
    build: {context: ../auth_service, additional_contexts: {helmgo: ../helmgo}}
    image: ${IMAGE_PREFIX:-helmstudio/}auth:${IMAGE_TAG:-dev}
    env_file: [{path: ../auth_service/.env, required: false}]
    environment:
      DATABASE_URL_FILE: /run/secrets/auth_database_url
      NATS_URL_FILE: /run/secrets/nats_auth_url
      NATS_USER: ""                                   # the user is in the URL
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      WEB_API_KEY_FILE: /run/secrets/web_api_key      # ensured as the web client's key on every start
      HELM_API_KEY_FILE: /run/secrets/helm_api_key    # the same for the CLI (client "helm")
      TRUSTED_PROXIES: ${HELM_NET:-172.30.97}.10,${HELM_NET:-172.30.97}.11   # Kong, the web BFF
    secrets: [auth_database_url, nats_auth_url, jwt_private_key, web_api_key, helm_api_key]
    healthcheck: {test: [CMD, /app/auth, health], interval: 5s, timeout: 3s, retries: 20}
    depends_on:
      postgres: {condition: service_healthy}
      nats-setup: {condition: service_completed_successfully}

  nats:
    image: nats:2.15.3-alpine3.22
    # nats.conf reads the users' passwords from the environment; they come from the secrets here (the remote GPU
    # hosts' from the included secret nats_gpu_hosts). NATS_CONF=nats-tls.conf (compose/tls.yml) adds TLS.
    # /tmp/started marks its start: the root Makefile's nats_reload restarts it when a config file is newer.
    entrypoint: [sh, -c, 'touch /tmp/started; for u in admin auth studio runner runner_mac_torch runner_mac_mlx runner_mac_native pipelines; do export NATS_$$(echo $$u | tr a-z A-Z)_PASSWORD="$$(cat /run/secrets/nats_$${u}_password)"; done; exec nats-server -c /etc/nats/$${NATS_CONF:-nats.conf}']
    secrets: [nats_admin_password, nats_auth_password, nats_studio_password, nats_runner_password,
              nats_runner_mac_torch_password, nats_runner_mac_mlx_password, nats_runner_mac_native_password,
              nats_pipelines_password, nats_gpu_hosts]
    ports: ["127.0.0.1:${NATS_HOST_PORT:-4322}:4222"]   # for native runners (make runners) and the GPU host tunnel
    volumes: [./nats:/etc/nats:ro, natsdata:/data]
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats-setup:                                         # one-shot: streams CMD/EVT/DLQ + KV registry/hosts/cancels, idempotent
    image: natsio/nats-box:0.20.2
    entrypoint: [sh, /tools/nats-setup]
    environment: {NATS_URL_FILE: /run/secrets/nats_admin_url}
    secrets: [nats_admin_url]
    volumes: [../.tools/nats-setup:/tools/nats-setup:ro]
    depends_on:
      nats: {condition: service_healthy}

  postgres:
    # Alpine (musl): collations come from Postgres's builtin provider (C.UTF-8), not libc, so they never shift with the
    # image's libc. A cluster made under the old glibc image must not be reused here: hence the new volume pgdata18a.
    # The old dev volume (helmstudio_pgdata) is kept as a fallback; the owner deletes it by hand when
    # no longer needed: docker volume rm helmstudio_pgdata
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password   # init.sh reads <svc>_db_password the same way
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
    secrets: [postgres_password, auth_db_password, studio_db_password, pipelines_db_password]
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5463}:5432"]
    volumes: [pgdata18a:/var/lib/postgresql, ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U postgres -d auth"], interval: 2s, timeout: 3s, retries: 30}

  seaweedfs:
    build: ./seaweedfs                                # only `weed` from chrislusf/seaweedfs:4.53, on Alpine
    image: ${IMAGE_PREFIX:-helmstudio/}seaweedfs:${IMAGE_TAG:-dev}
    profiles: [s3local]
    restart: unless-stopped   # it gets OOM-killed when Docker's VM is short of memory; every upload fails until it is back
    # identities from -s3.config (secret s3_config, .tools/make-secrets): the admin key of the s3_* secrets (also
    # exported, as before) and runner-<h> per remote GPU host, Read and Write on the bucket only; a new host's identity
    # needs a seaweedfs restart (make gpu-host-reload). S3_TLS_ARGS (compose/tls.yml) adds https on 8334; 8333 stays http.
    # -volume.max=0 and -master.volumeSizeLimitMB=1024 are upstream's entrypoint defaults: without them it idles at ~210 MB.
    entrypoint: [sh, -c, 'export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/s3_access_key_id)" AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_access_key)"; exec weed -logtostderr=true server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/run/secrets/s3_config $${S3_TLS_ARGS:-} -ip=seaweedfs -ip.bind=0.0.0.0']
    secrets: [s3_access_key_id, s3_secret_access_key, s3_config]
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8433}:8333"        # the S3 API, for native runners (make runners)
      - "127.0.0.1:${S3_TLS_HOST_PORT:-8443}:8334"    # the same over https when TLS is on, for the GPU host tunnel
    volumes: [seaweeddata:/data]
    healthcheck: {test: [CMD, wget, -qO-, http://localhost:8333/healthz], interval: 3s, timeout: 3s, retries: 30}

  storage-setup:                                      # one-shot: creates the bucket, idempotent
    build: ./seaweedfs
    image: ${IMAGE_PREFIX:-helmstudio/}seaweedfs:${IMAGE_TAG:-dev}
    profiles: [s3local]
    entrypoint: [sh, /tools/storage-setup]
    environment: {S3_BUCKET: "${S3_BUCKET:-helmstudio}", WEED_MASTER: "seaweedfs:9333"}
    volumes: [../.tools/storage-setup:/tools/storage-setup:ro]
    depends_on:
      seaweedfs: {condition: service_healthy}

volumes:
  pgdata18a:
  natsdata:
  seaweeddata:
