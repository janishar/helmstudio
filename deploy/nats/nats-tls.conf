# nats.conf plus TLS on the client port (contracts/README.md, A remote GPU host: TLS). Chosen by deploy/compose/tls.yml
# (NATS_CONF): on in helmstudio-test, opt-in on the dev stack (STACK_TLS=on). allow_non_tls keeps the stack's own
# services plain on the compose network; a remote runner always uses tls:// and verifies against tls_ca. Cert and key
# are deploy/secrets/stack_tls_{cert,key} from .tools/make-secrets (SANs localhost, 127.0.0.1, nats, seaweedfs and
# STACK_TLS_NAMES). Client certs (verify: true, ca_file) are optional and off here.
include ./nats.conf
tls {
  cert_file: "/run/secrets/stack_tls_cert"
  key_file: "/run/secrets/stack_tls_key"
  timeout: 2
  # a TLS client may start with the handshake (nats-py upgrades after INFO only when tls_required, which
  # allow_non_tls clears: a runner on tls:// must use tls_handshake_first); a plain one gets INFO after 300 ms
  handshake_first: "300ms"
}
allow_non_tls: true
