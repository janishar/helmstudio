# helmstudio NATS: JetStream on, monitoring for health checks. Streams + KV come from .tools/nats-setup.
# One account (JetStream streams and the KV buckets live in it) with a user per service, each limited to its
# subjects. Passwords: $NATS_<USER>_PASSWORD, set from the compose secrets nats_<user>_password.
port: 4222
http_port: 8222
server_name: helm-nats
jetstream {
  store_dir: /data
  max_file_store: 10GB
}
max_payload: 1MB

accounts {
  HELM {
    jetstream: enabled
    users: [
      # nats-setup (streams, KV) and message tests
      {user: admin, password: $NATS_ADMIN_PASSWORD}

      # answers auth.validate.* requests, publishes evt.auth.revoked; $SRV.> is the NATS micro service's discovery verbs
      {user: auth, password: $NATS_AUTH_PASSWORD, permissions: {
        publish: ["evt.auth.revoked"]
        subscribe: ["auth.validate.*", "$SRV.>"]
        allow_responses: true
      }}

      # studio_service: publishes cmd.run.> (outbox relay), consumes evt.run.> on EVT (durable studio-projector),
      # writes KV cancels, reads KV registry and hosts, asks auth.validate.*, listens to evt.auth.revoked;
      # $SRV.> is its micro service. (files_service and web use no NATS.)
      {user: studio, password: $NATS_STUDIO_PASSWORD, permissions: {
        publish: [
          "cmd.run.>", "auth.validate.*", "$KV.cancels.>",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.EVT",
          "$JS.API.CONSUMER.CREATE.EVT.studio-projector.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVT.studio-projector",
          "$JS.API.CONSUMER.INFO.EVT.studio-projector", "$JS.API.CONSUMER.MSG.NEXT.EVT.studio-projector",
          "$JS.ACK.EVT.studio-projector.>",
          "$JS.API.STREAM.INFO.KV_cancels",
          "$JS.API.STREAM.INFO.KV_registry", "$JS.API.DIRECT.GET.KV_registry.>", "$JS.FC.KV_registry.>",
          "$JS.API.CONSUMER.CREATE.KV_registry.>", "$JS.API.CONSUMER.DELETE.KV_registry.>",
          "$JS.API.STREAM.INFO.KV_hosts", "$JS.API.DIRECT.GET.KV_hosts.>", "$JS.FC.KV_hosts.>",
          "$JS.API.CONSUMER.CREATE.KV_hosts.>", "$JS.API.CONSUMER.DELETE.KV_hosts.>"
        ]
        subscribe: ["_INBOX.>", "evt.auth.revoked", "$SRV.>"]
        allow_responses: true
      }}

      # the fake runner (host fake, env fake): consumes cmd.run.fake.fake on CMD (durable runner-fake-fake), publishes
      # evt.run.> and dlq.>, writes only its own registry keys (fake.fake.*) and hosts key (fake.fake), watches KV cancels
      {user: runner, password: $NATS_RUNNER_PASSWORD, permissions: {
        publish: [
          "evt.run.>", "dlq.>", "$KV.registry.fake.fake.>", "$KV.hosts.fake.fake",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.CMD",
          "$JS.API.CONSUMER.CREATE.CMD.runner-fake-fake", "$JS.API.CONSUMER.CREATE.CMD.runner-fake-fake.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.runner-fake-fake", "$JS.API.CONSUMER.INFO.CMD.runner-fake-fake",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.runner-fake-fake", "$JS.ACK.CMD.runner-fake-fake.>",
          "$JS.API.STREAM.MSG.GET.CMD", "$JS.API.STREAM.MSG.DELETE.CMD",
          "$JS.API.STREAM.INFO.KV_registry", "$JS.API.STREAM.INFO.KV_hosts",
          "$JS.API.STREAM.INFO.KV_cancels", "$JS.API.DIRECT.GET.KV_cancels.>", "$JS.FC.KV_cancels.>",
          "$JS.API.CONSUMER.CREATE.KV_cancels", "$JS.API.CONSUMER.CREATE.KV_cancels.>",
          "$JS.API.CONSUMER.INFO.KV_cancels.>", "$JS.API.CONSUMER.DELETE.KV_cancels.>"
        ]
        subscribe: ["_INBOX.>", "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.CMD.runner-fake-fake"]
        allow_responses: true
      }}
    ]
  }
}
