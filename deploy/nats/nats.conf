# helmstudio NATS: JetStream on, monitoring for health checks. Streams + KV come from .tools/nats-setup.
# One account (JetStream streams and the KV buckets live in it) with a user per service, each limited to its
# subjects and to its own reply inboxes (_INBOX_<user>, set by the client), so no user reads another's replies.
# Passwords: $NATS_<USER>_PASSWORD, set from the compose secrets nats_<user>_password.
port: 4222
http_port: 8222
server_name: helm-nats
jetstream {
  store_dir: /data
  max_file_store: 10GB
}
max_payload: 1MB

accounts {
  HELM {
    jetstream: enabled
    users: [
      # nats-setup (streams, KV) and message tests
      {user: admin, password: $NATS_ADMIN_PASSWORD}

      # answers auth.validate.* requests, publishes evt.auth.revoked; $SRV.> is the NATS micro service's discovery verbs
      {user: auth, password: $NATS_AUTH_PASSWORD, permissions: {
        publish: ["evt.auth.revoked"]
        subscribe: ["auth.validate.*", "$SRV.>"]
        allow_responses: true
      }}

      # studio_service: publishes cmd.run.> and cmd.pipeline.> (outbox relay) and purges a lost run's cmd.run subject on CMD,
      # publishes evt.studio.> (run_finished, outbox relay), consumes evt.run.> on EVT (durable studio-projector) and
      # evt.pipeline.> (durable studio-pipelines), answers studio.runs.create (queue group studio),
      # writes KV cancels, reads KV registry and hosts, asks auth.validate.*, pipelines.state.get, pipelines.memory and runner.unload.> (the GPU
      # gate), listens to evt.auth.revoked; API 1.16 (M5a): publishes cmd.model.> (outbox relay), writes KV host_settings,
      # consumes evt.model.> on EVT (durable studio-models); API 1.17 (M5b): publishes cmd.media.> (outbox relay: exports and
      # frames), consumes evt.media.> on EVT (durable studio-media);
      # $SRV.> is its micro service. (files_service and web use no NATS.)
      {user: studio, password: $NATS_STUDIO_PASSWORD, permissions: {
        publish: [
          "cmd.run.>", "cmd.pipeline.>", "cmd.model.>", "cmd.media.>", "evt.studio.>", "auth.validate.*", "pipelines.state.get", "pipelines.memory",
          "pipelines.providers.test",
          "runner.unload.>",
          "$KV.cancels.>", "$JS.API.STREAM.PURGE.CMD",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.EVT",
          "$JS.API.CONSUMER.CREATE.EVT.studio-projector.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVT.studio-projector",
          "$JS.API.CONSUMER.INFO.EVT.studio-projector", "$JS.API.CONSUMER.MSG.NEXT.EVT.studio-projector",
          "$JS.ACK.EVT.studio-projector.>",
          "$JS.API.CONSUMER.CREATE.EVT.studio-pipelines.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVT.studio-pipelines",
          "$JS.API.CONSUMER.INFO.EVT.studio-pipelines", "$JS.API.CONSUMER.MSG.NEXT.EVT.studio-pipelines",
          "$JS.ACK.EVT.studio-pipelines.>",
          "$JS.API.CONSUMER.CREATE.EVT.studio-models.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVT.studio-models",
          "$JS.API.CONSUMER.INFO.EVT.studio-models", "$JS.API.CONSUMER.MSG.NEXT.EVT.studio-models",
          "$JS.ACK.EVT.studio-models.>",
          "$JS.API.CONSUMER.CREATE.EVT.studio-media.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVT.studio-media",
          "$JS.API.CONSUMER.INFO.EVT.studio-media", "$JS.API.CONSUMER.MSG.NEXT.EVT.studio-media",
          "$JS.ACK.EVT.studio-media.>",
          "$KV.host_settings.>", "$JS.API.STREAM.INFO.KV_host_settings",
          "$JS.API.STREAM.INFO.KV_cancels",
          "$JS.API.STREAM.INFO.KV_registry", "$JS.API.DIRECT.GET.KV_registry.>", "$JS.FC.KV_registry.>",
          "$JS.API.CONSUMER.CREATE.KV_registry.>", "$JS.API.CONSUMER.DELETE.KV_registry.>",
          "$JS.API.STREAM.INFO.KV_hosts", "$JS.API.DIRECT.GET.KV_hosts.>", "$JS.FC.KV_hosts.>",
          "$JS.API.CONSUMER.CREATE.KV_hosts.>", "$JS.API.CONSUMER.DELETE.KV_hosts.>"
        ]
        subscribe: ["_INBOX_studio.>", "evt.auth.revoked", "studio.runs.create", "studio.tools", "$SRV.>"]
        allow_responses: true
      }}

      # pipelines_service: consumes cmd.pipeline.> on CMD (durable pipelines) and evt.studio.> on EVT (durable
      # pipelines-runs: run_finished), publishes evt.pipeline.> and dlq.>, asks studio.runs.create and studio.tools,
      # answers pipelines.state.get, pipelines.memory and pipelines.providers.test (queue group pipelines), writes
      # registry key pipelines.engine.custom. API 1.15: the `server` env runner of hosts fake and mac (consumes
      # cmd.run.<host>.server, durable pipelines-server-<host>; registry <host>.server.*, hosts <host>.server,
      # publishes evt.run.*.status, reads KV cancels). Its consumers can be created only with those filters (the
      # filtered CREATE subject; no bare or DURABLE.CREATE form)
      {user: pipelines, password: $NATS_PIPELINES_PASSWORD, permissions: {
        publish: [
          "evt.pipeline.>", "dlq.>", "studio.runs.create",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.CMD", "$JS.API.STREAM.INFO.EVT",
          "$JS.API.CONSUMER.CREATE.CMD.pipelines.cmd.pipeline.>", "$JS.API.CONSUMER.INFO.CMD.pipelines",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.pipelines", "$JS.ACK.CMD.pipelines.>",
          "$JS.API.CONSUMER.CREATE.EVT.pipelines-runs.evt.studio.>", "$JS.API.CONSUMER.INFO.EVT.pipelines-runs",
          "$JS.API.CONSUMER.MSG.NEXT.EVT.pipelines-runs", "$JS.ACK.EVT.pipelines-runs.>",
          "studio.tools", "$KV.registry.pipelines.engine.custom", "$JS.API.STREAM.INFO.KV_registry",
          "$JS.API.STREAM.INFO.KV_hosts", "$JS.API.STREAM.INFO.KV_cancels", "$JS.API.DIRECT.GET.KV_cancels.>",
          "$JS.API.STREAM.MSG.GET.KV_cancels",
          "evt.run.*.status", "$KV.registry.fake.server.>", "$KV.hosts.fake.server",
          "$JS.API.CONSUMER.CREATE.CMD.pipelines-server-fake.cmd.run.fake.server",
          "$JS.API.CONSUMER.INFO.CMD.pipelines-server-fake", "$JS.API.CONSUMER.MSG.NEXT.CMD.pipelines-server-fake",
          "$JS.ACK.CMD.pipelines-server-fake.>",
          "$KV.registry.mac.server.>", "$KV.hosts.mac.server",
          "$JS.API.CONSUMER.CREATE.CMD.pipelines-server-mac.cmd.run.mac.server",
          "$JS.API.CONSUMER.INFO.CMD.pipelines-server-mac", "$JS.API.CONSUMER.MSG.NEXT.CMD.pipelines-server-mac",
          "$JS.ACK.CMD.pipelines-server-mac.>"
        ]
        subscribe: [
          "_INBOX_pipelines.>", "pipelines.state.get", "pipelines.memory", "pipelines.providers.test",
          "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.CMD.pipelines",
          "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.EVT.pipelines-runs"
        ]
        allow_responses: true
      }}

      # the fake runner (host fake, env fake): consumes cmd.run.fake.fake on CMD (durable runner-fake-fake), publishes
      # evt.run.> and dlq.>, writes only its own registry keys (fake.fake.*) and hosts key (fake.fake), watches KV cancels;
      # API 1.16 (every runner): consumes cmd.model.<host>.<env> (durable models-<host>-<env>), publishes
      # evt.model.<host>.*, watches KV host_settings, answers runner.unload (the admin's Unload); API 1.17: consumes
      # cmd.media.<host>.<env> (durable media-<host>-<env>: exports, frames), publishes evt.media.<host>.*
      {user: runner, password: $NATS_RUNNER_PASSWORD, permissions: {
        publish: [
          "evt.run.>", "dlq.>", "$KV.registry.fake.fake.>", "$KV.hosts.fake.fake",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.CMD",
          "$JS.API.CONSUMER.CREATE.CMD.runner-fake-fake", "$JS.API.CONSUMER.CREATE.CMD.runner-fake-fake.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.runner-fake-fake", "$JS.API.CONSUMER.INFO.CMD.runner-fake-fake",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.runner-fake-fake", "$JS.ACK.CMD.runner-fake-fake.>",
          "evt.model.fake.>",
          "$JS.API.CONSUMER.CREATE.CMD.models-fake-fake", "$JS.API.CONSUMER.CREATE.CMD.models-fake-fake.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.models-fake-fake", "$JS.API.CONSUMER.INFO.CMD.models-fake-fake",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.models-fake-fake", "$JS.ACK.CMD.models-fake-fake.>",
          "evt.media.fake.>",
          "$JS.API.CONSUMER.CREATE.CMD.media-fake-fake", "$JS.API.CONSUMER.CREATE.CMD.media-fake-fake.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.media-fake-fake", "$JS.API.CONSUMER.INFO.CMD.media-fake-fake",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.media-fake-fake", "$JS.ACK.CMD.media-fake-fake.>",
          "$JS.API.STREAM.INFO.KV_host_settings", "$JS.API.DIRECT.GET.KV_host_settings.>", "$JS.FC.KV_host_settings.>",
          "$JS.API.CONSUMER.CREATE.KV_host_settings", "$JS.API.CONSUMER.CREATE.KV_host_settings.>",
          "$JS.API.CONSUMER.INFO.KV_host_settings.>", "$JS.API.CONSUMER.DELETE.KV_host_settings.>",
          "$JS.API.STREAM.INFO.KV_registry", "$JS.API.STREAM.INFO.KV_hosts",
          "$JS.API.STREAM.INFO.KV_cancels", "$JS.API.DIRECT.GET.KV_cancels.>", "$JS.FC.KV_cancels.>",
          "$JS.API.CONSUMER.CREATE.KV_cancels", "$JS.API.CONSUMER.CREATE.KV_cancels.>",
          "$JS.API.CONSUMER.INFO.KV_cancels.>", "$JS.API.CONSUMER.DELETE.KV_cancels.>"
        ]
        subscribe: ["_INBOX_runner.>", "runner.unload.fake.fake", "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.CMD.runner-fake-fake"]
        allow_responses: true
      }}

      # the native runners on this Mac (host mac, envs torch and mlx; make runners, outside Docker), one user each:
      # the same shape as runner above for cmd.run.mac.<env> (durable runner-mac-<env>), registry keys mac.<env>.*,
      # hosts key mac.<env>; each answers only its own runner.unload.mac.<env> (neither can speak for the other env)
      {user: runner_mac_torch, password: $NATS_RUNNER_MAC_TORCH_PASSWORD, permissions: {
        publish: [
          "evt.run.>", "dlq.>", "$KV.registry.mac.torch.>", "$KV.hosts.mac.torch",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.CMD",
          "$JS.API.CONSUMER.CREATE.CMD.runner-mac-torch", "$JS.API.CONSUMER.CREATE.CMD.runner-mac-torch.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.runner-mac-torch", "$JS.API.CONSUMER.INFO.CMD.runner-mac-torch",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.runner-mac-torch", "$JS.ACK.CMD.runner-mac-torch.>",
          "evt.model.mac.>",
          "$JS.API.CONSUMER.CREATE.CMD.models-mac-torch", "$JS.API.CONSUMER.CREATE.CMD.models-mac-torch.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.models-mac-torch", "$JS.API.CONSUMER.INFO.CMD.models-mac-torch",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.models-mac-torch", "$JS.ACK.CMD.models-mac-torch.>",
          "evt.media.mac.>",
          "$JS.API.CONSUMER.CREATE.CMD.media-mac-torch", "$JS.API.CONSUMER.CREATE.CMD.media-mac-torch.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.media-mac-torch", "$JS.API.CONSUMER.INFO.CMD.media-mac-torch",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.media-mac-torch", "$JS.ACK.CMD.media-mac-torch.>",
          "$JS.API.STREAM.INFO.KV_host_settings", "$JS.API.DIRECT.GET.KV_host_settings.>", "$JS.FC.KV_host_settings.>",
          "$JS.API.CONSUMER.CREATE.KV_host_settings", "$JS.API.CONSUMER.CREATE.KV_host_settings.>",
          "$JS.API.CONSUMER.INFO.KV_host_settings.>", "$JS.API.CONSUMER.DELETE.KV_host_settings.>",
          "$JS.API.STREAM.INFO.KV_registry", "$JS.API.STREAM.INFO.KV_hosts",
          "$JS.API.STREAM.INFO.KV_cancels", "$JS.API.DIRECT.GET.KV_cancels.>", "$JS.FC.KV_cancels.>",
          "$JS.API.CONSUMER.CREATE.KV_cancels", "$JS.API.CONSUMER.CREATE.KV_cancels.>",
          "$JS.API.CONSUMER.INFO.KV_cancels.>", "$JS.API.CONSUMER.DELETE.KV_cancels.>"
        ]
        subscribe: [
          "_INBOX_runner_mac_torch.>", "runner.unload.mac.torch",
          "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.CMD.runner-mac-torch"
        ]
        allow_responses: true
      }}

      {user: runner_mac_mlx, password: $NATS_RUNNER_MAC_MLX_PASSWORD, permissions: {
        publish: [
          "evt.run.>", "dlq.>", "$KV.registry.mac.mlx.>", "$KV.hosts.mac.mlx",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.CMD",
          "$JS.API.CONSUMER.CREATE.CMD.runner-mac-mlx", "$JS.API.CONSUMER.CREATE.CMD.runner-mac-mlx.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.runner-mac-mlx", "$JS.API.CONSUMER.INFO.CMD.runner-mac-mlx",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.runner-mac-mlx", "$JS.ACK.CMD.runner-mac-mlx.>",
          "evt.model.mac.>",
          "$JS.API.CONSUMER.CREATE.CMD.models-mac-mlx", "$JS.API.CONSUMER.CREATE.CMD.models-mac-mlx.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.models-mac-mlx", "$JS.API.CONSUMER.INFO.CMD.models-mac-mlx",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.models-mac-mlx", "$JS.ACK.CMD.models-mac-mlx.>",
          "evt.media.mac.>",
          "$JS.API.CONSUMER.CREATE.CMD.media-mac-mlx", "$JS.API.CONSUMER.CREATE.CMD.media-mac-mlx.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.CMD.media-mac-mlx", "$JS.API.CONSUMER.INFO.CMD.media-mac-mlx",
          "$JS.API.CONSUMER.MSG.NEXT.CMD.media-mac-mlx", "$JS.ACK.CMD.media-mac-mlx.>",
          "$JS.API.STREAM.INFO.KV_host_settings", "$JS.API.DIRECT.GET.KV_host_settings.>", "$JS.FC.KV_host_settings.>",
          "$JS.API.CONSUMER.CREATE.KV_host_settings", "$JS.API.CONSUMER.CREATE.KV_host_settings.>",
          "$JS.API.CONSUMER.INFO.KV_host_settings.>", "$JS.API.CONSUMER.DELETE.KV_host_settings.>",
          "$JS.API.STREAM.INFO.KV_registry", "$JS.API.STREAM.INFO.KV_hosts",
          "$JS.API.STREAM.INFO.KV_cancels", "$JS.API.DIRECT.GET.KV_cancels.>", "$JS.FC.KV_cancels.>",
          "$JS.API.CONSUMER.CREATE.KV_cancels", "$JS.API.CONSUMER.CREATE.KV_cancels.>",
          "$JS.API.CONSUMER.INFO.KV_cancels.>", "$JS.API.CONSUMER.DELETE.KV_cancels.>"
        ]
        subscribe: [
          "_INBOX_runner_mac_mlx.>", "runner.unload.mac.mlx",
          "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.CMD.runner-mac-mlx"
        ]
        allow_responses: true
      }}
    ]
  }
}
