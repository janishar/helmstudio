# ora-catalog NATS: JetStream on, monitoring for health checks. Streams + KV come from .tools/nats-setup.
# One account (JetStream streams and the registry KV live in it) with a user per service, each limited to its
# subjects. Passwords: $NATS_<USER>_PASSWORD, set from the compose secrets nats_<user>_password.
port: 4222
http_port: 8222
server_name: ora-nats
jetstream {
  store_dir: /data
  max_file_store: 10GB
}
max_payload: 1MB

accounts {
  ORA {
    jetstream: enabled
    users: [
      # nats-setup (streams, KV) and the agents message test
      {user: admin, password: $NATS_ADMIN_PASSWORD}

      # answers auth.validate.* requests, publishes evt.auth.revoked; $SRV.> is the NATS micro service's discovery verbs
      {user: auth, password: $NATS_AUTH_PASSWORD, permissions: {
        publish: ["evt.auth.revoked"]
        subscribe: ["auth.validate.*", "$SRV.>"]
        allow_responses: true
      }}

      # catalog_service: publishes cmd.catalog.>, consumes evt.catalog.> (durable catalog-projector), reads the registry KV,
      # asks auth.validate.* and the agents' catalog.interpret / catalog.poses.suggest, broadcasts agents.cancel and agents.cancel.image (Stop),
      # listens to evt.auth.revoked; $SRV.> is its micro service. (files_service uses no NATS.)
      {user: catalog, password: $NATS_CATALOG_PASSWORD, permissions: {
        publish: [
          "cmd.catalog.>", "auth.validate.*", "catalog.interpret", "catalog.poses.suggest", "agents.cancel", "agents.cancel.image",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.EVT", "$JS.API.STREAM.INFO.KV_registry",
          "$JS.API.CONSUMER.CREATE.EVT.catalog-projector.>", "$JS.API.CONSUMER.DURABLE.CREATE.EVT.catalog-projector",
          "$JS.API.CONSUMER.INFO.EVT.catalog-projector", "$JS.API.CONSUMER.MSG.NEXT.EVT.catalog-projector",
          "$JS.ACK.EVT.catalog-projector.>",
          "$JS.API.CONSUMER.CREATE.KV_registry.>", "$JS.API.CONSUMER.DELETE.KV_registry.>",
          "$JS.API.DIRECT.GET.KV_registry.>", "$JS.FC.KV_registry.>"
        ]
        subscribe: ["_INBOX.>", "evt.auth.revoked", "$SRV.>"]
        allow_responses: true
      }}

      # agents_service: consumes cmd.catalog.> (durable agents on CMD), publishes evt.catalog.> and dlq.>, answers
      # catalog.interpret / catalog.poses.suggest (replies to _INBOX.>), writes the registry KV, hears agents.cancel and agents.cancel.image
      {user: agents, password: $NATS_AGENTS_PASSWORD, permissions: {
        publish: [
          "evt.catalog.>", "dlq.>", "$KV.registry.>", "_INBOX.>",
          "$JS.API.INFO", "$JS.API.STREAM.INFO.CMD", "$JS.API.STREAM.INFO.KV_registry",
          "$JS.API.CONSUMER.CREATE.CMD.agents", "$JS.API.CONSUMER.CREATE.CMD.agents.>", "$JS.API.CONSUMER.DURABLE.CREATE.CMD.agents",
          "$JS.API.CONSUMER.INFO.CMD.agents", "$JS.API.CONSUMER.MSG.NEXT.CMD.agents", "$JS.ACK.CMD.agents.>",
          "$JS.API.STREAM.MSG.GET.CMD", "$JS.API.STREAM.MSG.DELETE.CMD"
        ]
        subscribe: [
          "_INBOX.>", "agents.cancel", "agents.cancel.image", "catalog.interpret", "catalog.poses.suggest",
          "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.CMD.agents"
        ]
        allow_responses: true
      }}
    ]
  }
}
