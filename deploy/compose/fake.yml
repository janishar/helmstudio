# Overlay (-f) for the dev and test stacks: the fake services (the fake runner too; the base file has no fakes). The admin comes from auth_service/.env on the dev
# stack; the test stack adds compose/test-admin.yml for its known test admin (owner, 2026-11-24).
#   docker compose -f deploy/docker-compose.yml -f deploy/compose/fake.yml up -d --build --wait      # make up
services:
  # The fake OpenAI-compatible server (API 1.15; contract_tests/fake_openai): local servers and remote providers are
  # proven against it, never a real one. Inside the compose network only (no host port): http://fake-openai:8000/v1
  # (a server) and https://fake-openai:8443/v1 (a remote; its self-signed certificate is fake-openai.pem on the
  # fakeai-certs volume, for pipelines to trust). Tests script it with docker exec (server.py call).
  fake-openai:
    build: ../contract_tests/fake_openai
    image: ${IMAGE_PREFIX:-helmstudio/}fake-openai:${IMAGE_TAG:-dev}
    volumes: [fakeai-certs:/certs]

  # pipelines is the server executor of host fake, trusts only the fake's certificate (SSL_CERT_FILE replaces the CA
  # bundle) and finds a placeholder (not a key) under key_secret fake-openai. API 1.52: a saved key goes into the
  # container's own /tmp/provider-keys (made at start, gone with the container); the real folder is mounted read-only
  # and is not in the list, so a test never writes or removes a real key
  pipelines:
    environment:
      PIPELINES_SERVER_HOSTS: ${SERVER_HOSTS:-fake}
      PIPELINES_PROVIDER_KEYS_DIR: /tmp/provider-keys:/fake-keys
      PIPELINES_REMOTE_ALLOW_PRIVATE: "on"  # the fake's remote (https://fake-openai:8443) is a compose address
      SSL_CERT_FILE: /certs/fake-openai.pem
    volumes: [fakeai-certs:/certs:ro, "./${HELM_SECRETS:-secrets}/providers:/run/secrets/providers:ro"]
    configs: [{source: fake_provider_key, target: /fake-keys/fake-openai}]
    depends_on:
      fake-openai: {condition: service_healthy}

  # The fake Hugging Face Hub (API 1.16, M5a; contract_tests/fake_hub): model downloads are proven against it, never
  # the real Hub. Inside the compose network only (no host port): http://fake-hub:8000. It writes the placeholder
  # token file (not a token) the fake runner reads to the hubsecrets volume; tests remove and restore it with
  # docker exec (server.py call POST /__token).
  fake-hub:
    build: ../contract_tests/fake_hub
    image: ${IMAGE_PREFIX:-helmstudio/}fake-hub:${IMAGE_TAG:-dev}
    volumes: [hubsecrets:/hubsecrets]

  # once: the fake runners' scratch models roots (volumes fake-models, fake-models-b; API 1.78 fake-models-2, the fake
  # host's second model folder at /models2) belong to the runner user (10001)
  fake-models:
    build: ../contract_tests/fake_hub
    image: ${IMAGE_PREFIX:-helmstudio/}fake-hub:${IMAGE_TAG:-dev}
    user: root
    entrypoint: [sh, -c, "chown 10001 /models /models-b /models2"]
    volumes: [fake-models:/models, fake-models-b:/models-b, fake-models-2:/models2]

  # The fake runner (host fake, env fake: the echo family). It talks only to NATS and the object store, never to
  # Postgres; real runners run natively on GPU hosts (M1). It downloads the echo pack's tiny model
  # (runner_service/packs/echo) from the fake hub into a throwaway models root, never ~/GenAI/models; the host starts
  # with it missing. Reserve 1 GB of the container's RAM.
  runner:
    build: ../runner_service
    image: ${IMAGE_PREFIX:-helmstudio/}runner:${IMAGE_TAG:-dev}
    env_file: [{path: ../runner_service/.env, required: false}]
    environment:                                      # credentials come from the secrets (<VAR>_FILE)
      RUNNER_HOST: fake
      RUNNER_ENV: fake
      NATS_URL_FILE: /run/secrets/nats_runner_url
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-helmstudio}
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      HF_ENDPOINT: http://fake-hub:8000
      HELMSTUDIO_MODELS: /models
      RUNNER_HF_TOKEN_FILE: /hubsecrets/hf_token
      RUNNER_RESERVE_GB: "1"
    secrets: [nats_runner_url, s3_access_key_id, s3_secret_access_key]
    volumes: [fake-models:/models, fake-models-2:/models2, hubsecrets:/hubsecrets:ro]
    healthcheck: {test: [CMD, python, health.py], interval: 5s, timeout: 5s, retries: 20}   # GET /health: NATS connected
    depends_on:
      nats-setup: {condition: service_completed_successfully}
      storage-setup: {condition: service_completed_successfully, required: false}
      fake-hub: {condition: service_healthy}
      fake-models: {condition: service_completed_successfully}

  # the second fake host (API 1.18, M6: contract_tests/tests/test_hosts.py, resilience.sh batch-hostb): host fakeb, env
  # fake (the echo family), joined as a remote GPU host is: its own NATS user runner_fakeb_fake over tls:// and its own
  # S3 identity runner-fakeb over https (.tools/make-secrets), so it needs the TLS overlay (helmstudio-test). Created,
  # not started (profile hosts): the modules that want two hosts start and stop it.
  runner-b:
    image: ${IMAGE_PREFIX:-helmstudio/}runner:${IMAGE_TAG:-dev}
    profiles: [hosts]
    env_file: [{path: ../runner_service/.env, required: false}]
    environment:
      RUNNER_HOST: fakeb
      RUNNER_ENV: fake
      NATS_URL_FILE: /run/secrets/nats_runner_fakeb_fake_url
      NATS_CA_FILE: /run/secrets/tls_ca
      S3_ENDPOINT: https://seaweedfs:8334
      S3_CA_FILE: /run/secrets/tls_ca
      S3_BUCKET: ${S3_BUCKET:-helmstudio}
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_runner_fakeb_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_runner_fakeb_secret_access_key
      HF_ENDPOINT: http://fake-hub:8000
      HELMSTUDIO_MODELS: /models
      RUNNER_HF_TOKEN_FILE: /hubsecrets/hf_token
      RUNNER_RESERVE_GB: "1"
    secrets: [nats_runner_fakeb_fake_url, tls_ca, s3_runner_fakeb_access_key_id, s3_runner_fakeb_secret_access_key]
    volumes: [fake-models-b:/models, hubsecrets:/hubsecrets:ro]
    healthcheck: {test: [CMD, python, health.py], interval: 5s, timeout: 5s, retries: 20}
    depends_on:
      runner: {condition: service_healthy}
      fake-models: {condition: service_completed_successfully}

secrets:
  nats_runner_fakeb_fake_url: {file: "${HELM_SECRETS:-secrets}/nats_runner_fakeb_fake_url"}
  tls_ca: {file: "${HELM_SECRETS:-secrets}/tls_ca"}
  s3_runner_fakeb_access_key_id: {file: "${HELM_SECRETS:-secrets}/s3_runner_fakeb_access_key_id"}
  s3_runner_fakeb_secret_access_key: {file: "${HELM_SECRETS:-secrets}/s3_runner_fakeb_secret_access_key"}

configs:
  fake_provider_key: {content: "placeholder-not-a-key"}

volumes:
  fakeai-certs:
  hubsecrets:
  fake-models:
  fake-models-b:
  fake-models-2:
