# Overlay (-f) for the test stack only (make test): a known test admin instead of auth_service/.env's, so
# contract_tests can sign in as it to create users A and B. The dev stack uses auth_service/.env (owner, 2026-11-24).
services:
  auth:
    environment:
      ADMIN_EMAIL: admin@helm.test
      ADMIN_PASSWORD: ${HELM_TEST_ADMIN_PASSWORD:-helm test admin pass 1}
  # API 1.61: the fake plugins (contract_tests/fake_plugins: the fake OpenAI server as a provider and as tools) beside
  # the repo's plugins/
  studio:
    environment:
      STUDIO_PLUGINS_DIRS: /plugins:/fake-plugins
    # API 1.64: a test ~/.helm/plugins, never the real one
    volumes: [../contract_tests/fake_plugins:/fake-plugins:ro, ../contract_tests/fake_helm/plugins:/helm-plugins:ro]
  # API 1.65: the fake runner supervises the fake plugins that start themselves (fake-run, fake-crash), logs in a test
  # HELM_HOME inside the container, never the real ~/.helm
  runner:
    environment:
      RUNNER_PLUGINS: "on"
      RUNNER_PLUGINS_DIRS: /run-plugins
      HELM_HOME: /tmp/helm
    volumes: [../contract_tests/fake_plugins:/run-plugins:ro]
