# studio_service on the helmstudio stack. Paths are relative to deploy/ (the project directory):
#   docker compose -f deploy/docker-compose.yml up -d --build studio
services:
  studio:
    build: {context: ../studio_service, additional_contexts: {helmgo: ../helmgo}}
    image: ${IMAGE_PREFIX:-helmstudio/}studio:${IMAGE_TAG:-dev}
    env_file: [{path: ../studio_service/.env, required: false}]
    environment:                                      # credentials come from the secrets (<VAR>_FILE)
      DATABASE_URL_FILE: /run/secrets/studio_database_url
      NATS_URL_FILE: /run/secrets/nats_studio_url
      NATS_USER: ""                                   # the user is in the URL
      FILE_URL_SECRET_FILE: /run/secrets/file_url_secret   # signs the /files links files_service verifies
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${KONG_HTTP_PORT:-8300}}
      STORAGE_DRIVER: s3                              # checks uploads, removes deleted takes' objects
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-helmstudio}
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      STUDIO_REMOTE_MODELS: ${REMOTE_MODELS:-off}       # API 1.15: kind remote providers only while on
    secrets: [studio_database_url, nats_studio_url, file_url_secret, s3_access_key_id, s3_secret_access_key]
    # API 1.61: plugins/*/plugin.json are read from here (read-only; studio never runs a plugin)
    volumes: [../plugins:/plugins:ro]
    # the host rule resolves a server's host.docker.internal at Save, as pipelines does at every call (pipelines.yml)
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck: {test: [CMD, /app/studio, health], interval: 5s, timeout: 3s, retries: 20}
    depends_on:
      postgres: {condition: service_healthy}
      nats-setup: {condition: service_completed_successfully}
