# studio_service on the helmstudio stack. Paths are relative to deploy/ (the project directory):
#   docker compose -f deploy/docker-compose.yml up -d --build studio
services:
  studio:
    build: {context: ../studio_service, additional_contexts: {orago: ../orago}}
    image: helmstudio/studio:${IMAGE_TAG:-dev}
    env_file: [{path: ../studio_service/.env, required: false}]
    environment:                                      # credentials come from the secrets (<VAR>_FILE)
      DATABASE_URL_FILE: /run/secrets/studio_database_url
      NATS_URL_FILE: /run/secrets/nats_studio_url
      NATS_USER: ""                                   # the user is in the URL
      FILE_URL_SECRET_FILE: /run/secrets/file_url_secret   # signs the /files links files_service verifies
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${KONG_HTTP_PORT:-8300}}
    secrets: [studio_database_url, nats_studio_url, file_url_secret]
    healthcheck: {test: [CMD, /app/studio, health], interval: 5s, timeout: 3s, retries: 20}
    depends_on:
      postgres: {condition: service_healthy}
      nats-setup: {condition: service_completed_successfully}
