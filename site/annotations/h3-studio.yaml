file: studios/h3-studio.yaml
digest: sha256:89a4de216bb23643233636a16fec130f6e0020b6f2dc7f83d8b6c64b00d4696b
title: h3 studio's manifest
intro: >-
  h3 studio makes video with synchronised sound from MiniMax-H3, through a
  native Metal engine written in C behind a Go server: no Python, and no
  PyTorch. Its own repository ships this manifest as helmstudio.yaml; the copy
  here is the registry's, kept in step with it. Scored against the criteria, it
  passes six of the seven a manifest can answer; it declares no test profile.
notes:
  /id: "The id the studio is known by everywhere, and the file is named for it."
  /repo: "Where helmstudio clones from. It reads the repository with git, never through a forge's API."
  /ref: "A branch, so an install takes whatever it points at when the clone runs. A registry entry normally pins a commit; docs/decisions.md 2026-09-19 says why this one does not."
  /manifest: "Inline, because the repository ships no helmstudio.yaml at this commit. Where it sets id, repo and ref, each must equal the pointer's, and the validator checks that they do."
  /manifest/id: "The same id as the pointer's."
  /manifest/name: "The name people see."
  /manifest/description: "One sentence saying what the studio does."
  /manifest/kinds: "What it makes: video with sound, so both kinds."
  /manifest/hue: "Its identity colour in each theme: a stripe, a dot and its clips on the timeline in the launcher, and the accent on its own page."
  /manifest/license: "The studio's own licence. A weight has no licence field yet, so the model's licence is not declared anywhere in the manifest."
  /manifest/repo: "The same repository as the pointer's."
  /manifest/ref: "The same branch as the pointer's."
  /manifest/submodules: "The engine, h3c, is a submodule, and the first build step runs inside it, so the clone fetches submodules too."
  /manifest/peak_ram_gb: "What the model occupies once loaded. It is the number the arithmetic uses when another heavy studio is running; the comment says where it came from."
  /manifest/requires: "An Apple Silicon Mac with 64 GB of memory and 200 GB of disk, and the tools the build and the studio call, ffmpeg among them."
  /manifest/runtime: "A native kernel on Metal, in C: the framework and the backends are separate fields because they make separate claims."
  /manifest/capabilities: "Settings and sessions, the files it makes, the gallery and the timeline: four sentences on the approval screen, and a token for exactly those."
  /manifest/network: "The hosts it is expected to contact, for its weights."
  /manifest/sdk: "Pins major 1 of the runtime SDK and helm-css, which is what criterion 15 asks for."
  /manifest/build: "Two steps, in order: the Metal engine, built with make in its submodule, then the Go server."
  /manifest/weights: "Two pipelines from one Hugging Face repository, in one directory, each scoped to its own files. Both are required here, so an install fetches both before the studio is ready."
  /manifest/processes: "One process: the Go server, which drives the engine."
  /manifest/processes/0/heavy: "It holds the model, so only one heavy studio runs beside it: none."
  /manifest/processes/0/cmd: "{models.fl2va} becomes the real path of the weights directory, and {data} the data directory helmstudio keeps for the studio."
  /manifest/processes/0/busy: "Declared, so the switch dialog asks before stopping it. Until h3 serves the busy answer, the dialog reads it as unknown, never as idle."
