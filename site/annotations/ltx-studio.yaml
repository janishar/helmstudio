file: studios/ltx-studio.yaml
digest: sha256:f985996cb2ae08f06894af59cc34683c8f240d237431e05728e11751a9b664e5
title: ltx studio's manifest
intro: >-
  ltx studio makes video with sound from LTX-2.5 on MLX, behind a Python
  server with no front-end toolchain. Its own repository ships this manifest as
  helmstudio.yaml; the copy here is the registry's, kept in step with it. It
  passes six of the seven criteria a manifest can answer; it declares no test
  profile.
notes:
  /id: "The id the studio is known by everywhere, and the file is named for it."
  /repo: "Where helmstudio clones from, with git."
  /ref: "A branch, so an install takes whatever it points at when the clone runs. A registry entry normally pins a commit; docs/decisions.md 2026-09-19 says why this one does not."
  /manifest: "Inline, because the repository ships no helmstudio.yaml at this commit. Its id, repo and ref must equal the pointer's."
  /manifest/id: "The same id as the pointer's."
  /manifest/name: "The name people see."
  /manifest/description: "One sentence saying what the studio does."
  /manifest/kinds: "Video with sound."
  /manifest/hue: "Its identity colour in each theme: a stripe, a dot and its clips on the timeline in the launcher, and the accent on its own page."
  /manifest/license: "The studio's own licence."
  /manifest/repo: "The same repository as the pointer's."
  /manifest/ref: "The same branch as the pointer's."
  /manifest/python: "Python 3.11. helmstudio creates an environment with uv, pinned to this version, before the build step, and the studio runs with it active. No other studio shares it."
  /manifest/peak_ram_gb: "The memory at the validated default. The comment says why one number cannot carry the range: a longer, larger clip peaked far higher."
  /manifest/requires: "An Apple Silicon Mac with 64 GB of memory and 90 GB of disk. uv is the one tool it needs; the build fetches everything else."
  /manifest/runtime: "MLX on Metal, quantised on load: Apple-native, like a Metal kernel, and a different claim from one."
  /manifest/capabilities: "Settings and sessions, the files it makes, the gallery and the timeline."
  /manifest/storage: "One collection, folders, indexed by session: the folders a training tool writes, which ltx studio keeps as records rather than as files of its own."
  /manifest/sdk: "Pins major 1 of the runtime SDK, helm-css and helm-ui — the components it draws its gallery, timeline and terminal with, which is why this one names three where a studio drawing its own names two."
  /manifest/network: "The hosts it is expected to contact, for its weights."
  /manifest/build: "One step: install exactly the locked dependencies, and fail rather than change the lock file in the checkout."
  /manifest/weights: "Three weights, all from one repository into one directory. The first set is required. The AV video VAE and the dev transformer are optional, so an install does not wait for them: the first is what --video-decoder diffusion decodes with, the second, the dev transformer with the distilled LoRA its stage 2 fuses, is what the two-stage, HQ, a2v and keyframe pipelines run."
  /manifest/processes: "One process: the Python server in web/."
  /manifest/processes/0/cwd: "The command runs in web/, relative to the checkout."
  /manifest/processes/0/cmd: "Plain python, not uv run, which would sync the environment and reach the network at every launch."
  /manifest/processes/0/busy: "Declared, so the switch dialog asks before stopping it. Its answer is not the busy contract yet, so the dialog reads it as unknown, never as idle."
