file: studios/iris-studio.yaml
digest: sha256:a3670cbcdc74bdb1cd34ea283b38750ff66d6c0abbcdecdfd257a299eb310802
title: iris studio's manifest
intro: >-
  iris studio makes images from FLUX.2 Klein, FLUX.3 Image Klein and Z-Image
  through a native Metal engine in C behind a Go server — the same shape as h3
  studio, for stills.
  Its repository ships this manifest, and the registry entry carries a copy so
  the studio can be described before it is fetched. It passes five of the seven
  criteria a manifest can answer: it declares neither memory nor disk, and no
  test profile.
notes:
  /id: "The id the studio is known by everywhere, and the file is named for it."
  /repo: "Where helmstudio clones from, with git."
  /ref: "A branch, so an install takes whatever it points at when the clone runs. A registry entry normally pins a commit; docs/decisions.md 2026-09-19 says why this one does not."
  /manifest: "A copy of the helmstudio.yaml the repository ships. Resolution never reaches the network, so this is the only manifest there is until the studio is fetched — an entry without one is shown as not fetched. What matters is that it agrees with the repository; one that had drifted described iris before it ran under helmstudio at all. Its id, repo and ref must equal the pointer's."
  /manifest/id: "The same id as the pointer's."
  /manifest/name: "The name people see."
  /manifest/description: "One sentence saying what the studio does."
  /manifest/kinds: "Images."
  /manifest/hue: "Its identity colour in each theme: a stripe, a dot and its clips on the timeline in the launcher, and the accent on its own page."
  /manifest/license: "The studio's own licence."
  /manifest/repo: "The same repository as the pointer's."
  /manifest/submodules: "The engine, iris.c, is a submodule, and the first build step runs inside it."
  /manifest/peak_ram_gb: "Measured on FLUX.3 distilled at the default size, as the comment says. FLUX.2 and Z-Image have not been measured. The prompt upsampler peaks at 21 GB and exits before iris loads, so it does not add to this."
  /manifest/requires: "An Apple Silicon Mac and five tools. No memory or disk is declared, which is why criterion 2 fails. uv is not one of the five: only the optional upsampler needs it."
  /manifest/runtime: "A native kernel on Metal, in C."
  /manifest/capabilities: "Three. A finished take is adopted as an asset and recorded as one gallery item, and a render is reported as a task job with its log. No timeline: a sequence is an edit of video clips and this studio makes stills. This is also what earns it a token — a studio declaring none gets none, and iris refuses to start without one."
  /manifest/sdk: "The majors its page loads through the /helm/ proxy: the runtime client, the components it draws helmstudio's gallery and the render log with, and helm-css."
  /manifest/network: "The hosts it is expected to contact: Hugging Face for its weights, and the Go module proxy because the second build step resolves helmstudio's runtime SDK through it, and github.com because the upsampler's lock pins diffusers to a git revision."
  /manifest/build: "Three steps, in order: the engine, built with make in its submodule, the Go server, then the prompt upsampler's Python environment. The last is optional: if it fails, uv missing included, it is skipped and the studio runs without Upsample. There is no python block because one would refuse to launch the studio without that environment."
  /manifest/weights: "Seven checkpoints, all selectable: one is chosen before install, install downloads only that one, and the others are fetched or linked when they are wanted. The eighth weight is the prompt upsampler, optional and so fetched only when asked for. The command does not name it, because an unfetched optional weight refuses any command that does; the studio looks for it beside the checkpoint."
  /manifest/processes: "One process: the Go server, which drives the engine."
  /manifest/processes/0/heavy: "It holds the model."
  /manifest/processes/0/cmd: "{models.selected} becomes the path of whichever checkpoint was chosen. {data} is the directory the studio keeps sessions in; it makes none of its own and will not start without one, and a take has to be inside it for helmstudio to adopt it."
  /manifest/processes/0/health: "A TCP connection on its port is enough to call it ready."
  /manifest/processes/0/busy: "Where the launcher asks whether the studio is mid-render before offering to stop it. /api/busy answers that contract with a busy flag and the render's progress."
