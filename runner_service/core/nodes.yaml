# The core nodes, in every runner, in the stage grammar of packs/README.md (no family: the kind is the name).
# Functions of the same names are in core/nodes.py. A runner publishes the ones its workflows use (and those a
# pack lists in `publish`): the sources first, then the packs' nodes, then the sinks (nodes without outputs).
stages:
  prompt:
    title: Prompt
    help: The text the workflow starts from.
    params:
      text: {type: text, label: Prompt, default: "", min: 0, max: 4000}
    outputs: {text: Text}
  seed:
    title: Seed
    help: The noise seed; -1 picks a random one, reported with the result.
    params:
      seed: {type: seed, label: Seed, default: -1, min: -1, max: 9007199254740991, step: 1}
    outputs: {seed: Seed}
  canvas:
    title: Canvas
    help: The output size in pixels; auto follows the last reference in an edit.
    params:
      mode: {type: enum, label: Size, default: auto, enum: [auto, fixed],
             help: "auto: with references, about 1 MP (1024 × 1024 area) at the last reference's aspect, sides rounded to 32; without, width × height. fixed: always width × height."}
      width: {type: int, label: Width, default: 1024, min: 256, max: 4096, step: 32}
      height: {type: int, label: Height, default: 1024, min: 256, max: 4096, step: 32}
    outputs: {canvas: Canvas}
  image:
    title: Image
    help: An image from the gallery, as an input.
    params:
      image: {type: image, label: Image, default: null}
    outputs: {image: Image}
  output:
    title: Output
    help: "Stores its input as a run output: an image or a video take."
    inputs: {media: Media}
