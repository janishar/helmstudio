# The fake model family `echo` (env fake, no GPU, no weights): node echo/echo reports one progress step per
# `steps` (each after `delay_ms`, a cancel point before each), then draws its text on a gradient, or fails when
# `fail` is true. Its `refs` are read and checked by the core before the first step (contract tests, no GPU).
# Its registry values equal the canonical contract fixtures (tests/test_packs.py).
id: echo
family: echo
title: Echo (fake)
runtimes:
  fake: {env: fake}
stages:
  echo:
    title: Echo
    help: "Fake model: draws its text on a gradient, one progress step at a time."
    inputs: {text: Text}
    outputs: {image: Image}
    params:
      steps: {type: int, label: Steps, default: 10, min: 1, max: 200, help: Progress steps to report.}
      delay_ms: {type: int, label: Delay per step (ms), default: 300, min: 0, max: 10000}
      fail: {type: bool, label: Fail, default: false,
             help: "Fail after the last step, without an output, to test errors."}
      refs: {type: rows, label: References, default: [], min: 0, max: 10, item: {image: Image},
             mention: "<image{n}>",
             help: "Images the fake runner reads (and checks) before it echoes; the PNG is unchanged."}
  lora-stack:
    title: LoRA Stack
    help: "Fake LoRA stack: adds the LoRAs and strengths it received to the text. Empty: the text as it is."
    inputs: {text: Text}
    outputs: {text: Text}
    params:
      rows:
        type: rows
        label: LoRAs
        default: []
        min: 0
        max: 8
        item:
          lora: Lora
          strength: {type: float, label: Strength, default: 1, min: -4, max: 4, step: 0.05}
          mode: {type: enum, label: Mode, default: adapter, enum: [adapter, bake]}
        help: "Each row: a LoRA, its strength and mode; the fake runner applies nothing, it only names them."
# The fake family takes LoRAs (registry models[].lora): exactly the modules the contract LoRA fixtures
# (contracts/fixtures/loras) name, so they fit echo on a stack without a GPU. Family detection prefers a family a
# non-fake env publishes, so a real Qwen LoRA is qwen-image wherever both are published. Model-free: no component is
# patched and echo/lora-stack (a Text -> Text stand-in) is written by hand above, not generated.
lora:
  component: transformer
  modules: ["img_in", "modulation.1", "proj_out", "time_text_embed.timestep_embedder.linear_1",
            "transformer_blocks.0.attn.to_k", "transformer_blocks.0.attn.to_out.0", "transformer_blocks.0.attn.to_q",
            "transformer_blocks.0.attn.to_v", "transformer_blocks.0.img_mlp.gate_layer",
            "transformer_blocks.30.img_mlp.out", "transformer_blocks.31.img_mlp.proj",
            "transformer_blocks.7.attn.to_out.0", "transformer_blocks.7.attn.to_q"]
  renames: []
  ignore: []
