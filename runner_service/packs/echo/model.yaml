# The fake model family `echo` (env fake, no GPU, no weights): node echo/echo reports one progress step per
# `steps` (each after `delay_ms`, a cancel point before each), then draws its text on a gradient, or fails when
# `fail` is true; echo/video does the same, then writes a still MP4 of its text (mp4.py) at its canvas size and
# duration; echo/keyframes names the images it received (frame, size, strength) in its text and echo/sample is
# echo/video with stage-bound steps (workflow echo-image-to-video, the fake ltx-image-to-video). Image values are
# read and checked by the core before the first step (contract tests, no GPU). Duration `auto` resolves to 2 s.
# The kinds of API 1.11 equal the canonical contract fixtures; keyframes, sample and `auto` (1.12) have none yet.
# echo/retake, echo/a2v and echo/extend (API 1.19, workflows echo-retake, echo-a2v, echo-extend) take a video or audio take as a media
# input (the core reads and checks it) and report the output's source_map.
# echo/speak (API 1.30, workflow echo-voice-over) is the fake speech model; starter voices in voices/.
# echo/ask (API 1.14, workflow echo-ask) is the fake llm: it answers what the prompt scripts (fake.py `ask`).
id: echo
family: echo
title: Echo (fake)
runtimes:
  fake: {env: fake}
media: [image]
# The tiny fake model (API 1.16, M5a: model jobs without the internet): three variants on the fake hub
# (contract_tests/fake_hub, HF_ENDPOINT in deploy/compose/fake.yml), a few small safetensors files each. plus and
# gated share tiny's vae (the same bytes on the hub: shared by content hash); gated needs the host's (placeholder)
# token; every source has the echo-test licence to accept. The fake host starts with all three missing; echo/tiny
# (workflow echo-tiny) loads both components through packs/echo/loader.py (plain bytes, no GPU), so they are resident.
licences:
  echo-test: {title: Echo Test Licence}
model:
  help: "Which tiny fake weights to load (downloaded from the fake hub)."
  variant: {label: Variant}
variants:
  tiny:
    dir: Echo-Tiny
    title: Tiny
    source: {repo: helm-test/echo-tiny, revision: b5800734cb8cbaf5f439eaec38cf987d912ddf8c,
             allow_patterns: [config.json, "transformer/*", "vae/*"], licence: echo-test, must_accept: true,
             gated: false, bytes: 98502}
  plus:
    dir: Echo-Tiny-Plus
    title: Plus
    shares: [vae]
    source: {repo: helm-test/echo-tiny-plus, revision: bd41ceaa49a7a29228baa60c8c7ab952b736893b,
             allow_patterns: [config.json, "transformer/*"], licence: echo-test, must_accept: true, gated: false,
             bytes: 25166027}
  gated:
    dir: Echo-Tiny-Gated
    title: Gated
    shares: [vae]
    source: {repo: helm-test/echo-tiny-gated, revision: 0ae47312f432cb40425628796865750b44b948ce,
             allow_patterns: [config.json, "transformer/*"], licence: echo-test, must_accept: true, gated: true,
             bytes: 16500}
components:
  transformer: {files: "transformer/*.safetensors", dtype: bf16, precision: [bf16]}
  vae: {files: "vae/*.safetensors", dtype: bf16, precision: [bf16]}
stages:
  tiny:
    title: Echo tiny
    component: transformer
    help: "Fake model stage: loads the tiny model's transformer and vae, then draws its text and the variant."
    uses: [transformer, vae]
    inputs: {model: Model, text: Text}
    outputs: {image: Image}
    params:
      steps: {type: int, label: Steps, default: 3, min: 1, max: 200, help: Progress steps to report.}
      delay_ms: {type: int, label: Delay per step (ms), default: 100, min: 0, max: 10000}
    peak_gb: "0.01"
  echo:
    title: Echo
    help: "Fake model: draws its text on a gradient, one progress step at a time."
    inputs: {text: Text}
    outputs: {image: Image}
    params:
      steps: {type: int, label: Steps, default: 10, min: 1, max: 200, help: Progress steps to report.}
      delay_ms: {type: int, label: Delay per step (ms), default: 300, min: 0, max: 10000}
      fail: {type: bool, label: Fail, default: false,
             help: "Fail after the last step, without an output, to test errors."}
      refs: {type: rows, label: References, default: [], min: 0, max: 10, item: {image: Image},
             mention: "<image{n}>",
             help: "Images the fake runner reads (and checks) before it echoes; the PNG is unchanged."}
  lora-stack:
    title: LoRA Stack
    help: "Fake LoRA stack: adds the LoRAs and strengths it received to the text. Empty: the text as it is."
    inputs: {text: Text}
    outputs: {text: Text}
    params:
      rows:
        type: rows
        label: LoRAs
        default: []
        min: 0
        max: 8
        item:
          lora: Lora
          strength: {type: float, label: Strength, default: 1, min: 0, max: 2, step: 0.05}
          mode: {type: enum, label: Mode, default: adapter, enum: [adapter, bake]}
        help: "Each row: a LoRA, its strength and mode; the fake runner applies nothing, it only names them."
  canvas:
    title: Canvas
    help: "The fake video's size in pixels, on a 64 px grid."
    params:
      width: {type: int, label: Width, default: 256, min: 64, max: 1024, step: 64}
      height: {type: int, label: Height, default: 128, min: 64, max: 1024, step: 64}
    outputs: {canvas: Canvas}
  duration:
    title: Duration
    help: "The fake video's length in frames on an 8k + 1 grid, and its frame rate."
    params:
      frames: {type: frames, label: Length, default: 25, min: 9, max: 121, step: 8, fps: fps,
               auto: {min_s: 1, max_s: 5},
               help: "Auto: the fake model always predicts 2 s, reported with the result."}
      fps: {type: int, label: Frame rate, default: 24, min: 1, max: 60, step: 1}
    outputs: {duration: Duration}
  video:
    title: Echo video
    help: "Fake video model: as Echo, then a still MP4 of its text (H.264, silent AAC stereo) and a poster."
    inputs: {text: Text, canvas: Canvas, duration: Duration}
    outputs: {video: Video}
    params:
      steps: {type: int, label: Steps, default: 10, min: 1, max: 200, help: Progress steps to report.}
      delay_ms: {type: int, label: Delay per step (ms), default: 300, min: 0, max: 10000}
      fail: {type: bool, label: Fail, default: false,
             help: "Fail after the last step, without an output, to test errors."}
      refs: {type: rows, label: References, default: [], min: 0, max: 10, item: {image: Image},
             mention: "<image{n}>",
             help: "Images the fake runner reads (and checks) before it renders; the video is unchanged."}
  keyframes:
    title: Keyframes
    help: "Fake keyframes: adds the frame, size and strength of each image it received to the text. Bypassed: text to video."
    inputs: {text: Text, duration: Duration}
    outputs: {text: Text}
    params:
      images:
        type: rows
        label: Frames
        default: []
        min: 1
        max: 8
        item:
          image: Image
          seconds: {type: float, label: At, default: 0, min: 0, max: 320, step: 0.1, position: seconds,
                    help: "Where in the clip, in seconds: 0 is the first frame, the clip's length its last."}
          strength: {type: float, label: Strength, default: 1, min: 0, max: 1, step: 0.05}
        help: "Each row: an image, where it goes and how strongly it holds (the fake runner only names them)."
  sample:
    title: Echo sample
    help: "Fake two-stage video model: as Echo video, with steps fixed by the stage (stage1 4, stage2 2)."
    inputs: {text: Text, canvas: Canvas, duration: Duration}
    outputs: {video: Video}
    params:
      role: {type: enum, label: Stage, default: stage1, enum: [stage1, stage2]}
      steps: {type: int, label: Steps, default: 4, min: 2, max: 4, step: 1, values: [2, 4],
              values_by: {param: role, values: {stage1: [4], stage2: [2]}},
              help: "Fixed by the stage: stage1 runs 4 steps, stage2 runs 2."}
      delay_ms: {type: int, label: Delay per step (ms), default: 300, min: 0, max: 10000}
  # media inputs (API 1.19): the platform's retake and audio-to-video paths without a GPU (fake.py retake, a2v)
  retake:
    title: Echo retake
    help: "Fake retake: reads the source, then a still MP4 of its text as long as the source (the source's size and fps), reporting source_map {source, 0, span}."
    inputs: {text: Text}
    outputs: {video: Video}
    params:
      source: {type: media, label: Source video, default: null, accepts: [video], grid: 32, max_frames: 321,
               help: The video the fake reads (and checks) before it renders.}
      span: {type: span, label: Retake, default: null, help: Reported back as the generated part.}
      delay_ms: {type: int, label: Delay per step (ms), default: 300, min: 0, max: 10000}
  a2v:
    title: Echo audio to video
    help: "Fake audio to video: reads the part in..out, then a still MP4 of its text as long as the part (24 fps, 256 x 128) with that part as its sound, reporting source_map {source, -in, 0, out - in}."
    inputs: {text: Text}
    outputs: {video: Video}
    params:
      source: {type: media, label: Audio, default: null, accepts: [audio], trim: true, max_s: 13.375,
               help: "The audio (or a video's sound) the fake reads (and checks) before it renders; in and out pick the part."}
      delay_ms: {type: int, label: Delay per step (ms), default: 300, min: 0, max: 10000}
  extend:
    title: Echo extend
    help: "Fake extend: reads the source, then a still MP4 of its text at the source's size and fps, as long as ltx/extend's result, reporting its source_map (extend_map)."
    inputs: {text: Text}
    outputs: {video: Video}
    params:
      source: {type: media, label: Source video, default: null, accepts: [video], grid: 32, max_frames: 321,
               help: The video the fake reads (and checks) before it renders.}
      seconds: {type: float, label: Add, default: 2, min: 0.1, max: 10, step: 0.1,
                help: "Seconds to add, rounded up to whole 8-frame steps."}
      direction: {type: enum, label: Where, default: after, enum: [after, before]}
      delay_ms: {type: int, label: Delay per step (ms), default: 300, min: 0, max: 10000}
  # speech (API 1.30, workflow echo-voice-over): an Audio output and a voice param without a GPU (fake.py speak)
  speak:
    title: Echo speak
    help: "Fake speech: a WAV (24 kHz, PCM 16-bit, mono) of one sine tone per character, 1/15 s each (so it lasts exactly the planned seconds), its pitch from the character and the voice, its phase from the seed; one progress step per 15 characters. An empty text fails `<node>: nothing to say`."
    inputs: {text: Text}
    outputs: {audio: Audio}
    params:
      voice: {type: voice, label: Voice, default: null, accepts: [preset, design],
              help: "The saved voice it speaks in: an echo starter voice or a designed voice."}
      seed: {type: seed, label: Seed, default: -1, min: -1, max: 9007199254740991, step: 1}
      delay_ms: {type: int, label: Delay per step (ms), default: 300, min: 0, max: 10000}
  ask:
    title: Ask (fake)
    help: "Fake ask: answers the JSON after the last ECHO-ANSWER: in the prompt (contracts/README.md, The llm pack: the fake)."
    outputs: {answer: Text}
    params:
      system: {type: string, label: System, default: "", max: 4000, help: The system turn.}
      prompt: {type: string, label: Prompt, default: "", max: 32768,
               help: "The filled template (pipelines writes it). Not scanned for mentions."}
      media: {type: rows, label: Takes, default: [], min: 0, max: 8, item: {take: Media},
              help: "Image or video takes, in order; each is sent as a thumbnail (a video as 3 keyframes)."}
      schema: {type: string, label: Answer schema, default: "", max: 16384,
               help: "A JSON schema the answer must match; empty = plain text."}
      max_tokens: {type: int, label: Max tokens, default: 800, min: 16, max: 4096}
# The fake family takes LoRAs (registry models[].lora): exactly the modules the contract LoRA fixtures
# (contracts/fixtures/loras) name, so they fit echo on a stack without a GPU. Family detection prefers a family a
# non-fake env publishes, so a real Qwen LoRA is qwen-image wherever both are published. Model-free: no component is
# patched and echo/lora-stack (a Text -> Text stand-in) is written by hand above, not generated.
lora:
  component: transformer
  modules: ["img_in", "modulation.1", "proj_out", "time_text_embed.timestep_embedder.linear_1",
            "transformer_blocks.0.attn.to_k", "transformer_blocks.0.attn.to_out.0", "transformer_blocks.0.attn.to_q",
            "transformer_blocks.0.attn.to_v", "transformer_blocks.0.img_mlp.gate_layer",
            "transformer_blocks.30.img_mlp.out", "transformer_blocks.31.img_mlp.proj",
            "transformer_blocks.7.attn.to_out.0", "transformer_blocks.7.attn.to_q"]
  renames: []
  ignore: []
