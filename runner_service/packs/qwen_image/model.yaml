# Qwen Image 2.1 (base and Turbo) on torch: text-to-image and multi-reference edit, ported from the qwen-image-2.1
# studio's generation path (diffusers QwenImage21Pipeline). Generates exactly the canonical qwen-image node schemas
# (tests/test_packs.py).
# peak_gb: measured on MPS (64 GB, torch 2.15, int8) with tests/test_qwen_golden.py; see the numbers there.
id: qwen-image-2.1
family: qwen-image
title: Qwen Image 2.1
publish: [image]   # the core Image source, for graphs built on this pack (no workflow uses it yet)
runtimes:
  torch: {env: torch, devices: [mps, cuda]}   # Linux + NVIDIA from M6 (packs/README.md "CUDA")
model:
  help: Which weights to load and at what precision.
  variant: {label: Variant, help: "Turbo: 8 fixed steps, much faster. fp8: smaller community weights, NVIDIA hosts only."}
  precision:
    label: Precision
    default: int8
    help: "int8 quantizes the transformer and text encoder at load: about half the memory."
media: [image]
licences:                         # licences/<id>.md holds each text, shown before a download
  apache-2.0: {title: Apache License 2.0, url: https://www.apache.org/licenses/LICENSE-2.0}
  qwen-research: {title: Qwen Research License Agreement, url: https://huggingface.co/Qwen/Qwen-Image-2.1-PE-T2I}
variants:
  base:
    dir: Qwen-Image-2.1
    title: Base
    source: {repo: Qwen/Qwen-Image-2.1, revision: 790c92633540aa0cb11d9abf19eb46d861714758,
             allow_patterns: [model_index.json, "transformer/*", "text_encoder/*", "vae/*", "processor/*",
                              "scheduler/*"],
             licence: apache-2.0, must_accept: false, gated: false, bytes: 33131601593}
  turbo:
    dir: Qwen-Image-2.1-Turbo
    title: Turbo
    shares: [text_encoder, vae]
    source: {repo: Qwen/Qwen-Image-2.1-Turbo, revision: fc13ba1986fcb905854dc8de2f52eee395f49b5b,
             allow_patterns: [model_index.json, "transformer/*", "processor/*", "scheduler/*"],
             licence: apache-2.0, must_accept: false, gated: false, bytes: 14241746072}
  # The alternate path for NVIDIA hosts (docs/plan/17-nvidia-quantized.md): unsloth's pre-quantized FP8 weights (torchao
  # per-row FP8: X._weight_qdata + X._weight_scale; the text encoder a plain FP8 cast; the VAE bf16), configs from
  # the official repos. Byte counts from the HF API at these revisions (source: all of the variant's files).
  base-fp8:
    dir: Qwen-Image-2.1-FP8
    title: Base fp8
    precision: [fp8]
    component_precision: {transformer: [fp8], text_encoder: [fp8]}
    devices: [cuda]
    files: {transformer: Qwen-Image-2.1-FP8.safetensors, text_encoder: Qwen-Image-2.1-text_encoder-FP8.safetensors,
            vae: vae/qwen_image_2.1_vae_bf16.safetensors}
    source: {repo: Qwen/Qwen-Image-2.1, revision: 790c92633540aa0cb11d9abf19eb46d861714758,
             allow_patterns: [model_index.json, "*/config.json", text_encoder/generation_config.json, "processor/*",
                              "scheduler/*"],
             licence: apache-2.0, must_accept: false, gated: false, bytes: 17208806915}
    sources:
      - {repo: unsloth/Qwen-Image-2.1-FP8, revision: bb21a8ba7f0371c19ad1f72c82a5e8fc10f39939,
         allow_patterns: [Qwen-Image-2.1-FP8.safetensors, Qwen-Image-2.1-text_encoder-FP8.safetensors,
                          vae/qwen_image_2.1_vae_bf16.safetensors],
         gated: false, bytes: 17192916808}
  turbo-fp8:
    dir: Qwen-Image-2.1-Turbo-FP8
    title: Turbo fp8
    precision: [fp8]
    component_precision: {transformer: [fp8], text_encoder: [fp8]}
    devices: [cuda]
    shares: [text_encoder, vae]   # unsloth's Turbo card: base's FP8 text encoder and bf16 VAE (Turbo's VAE, same SHA)
    shares_from: base-fp8
    files: {transformer: Qwen-Image-2.1-Turbo-FP8.safetensors}
    source: {repo: Qwen/Qwen-Image-2.1-Turbo, revision: fc13ba1986fcb905854dc8de2f52eee395f49b5b,
             allow_patterns: [model_index.json, transformer/config.json, "processor/*", "scheduler/*"],
             licence: apache-2.0, must_accept: false, gated: false, bytes: 7134331373}
    sources:
      - {repo: unsloth/Qwen-Image-2.1-Turbo-FP8, revision: 3162aea250af0c50101b75f454aa54ed49832292,
         allow_patterns: [Qwen-Image-2.1-Turbo-FP8.safetensors], gated: false, bytes: 7122899992}
components:
  transformer:
    files: "transformer/*.safetensors"
    dtype: bf16
    precision: [bf16, int8]
    quantize: ["transformer_blocks.*"]
  text_encoder:
    files: "text_encoder/*.safetensors"
    dtype: bf16
    precision: [bf16, int8]
    quantize: ["*.language_model.layers.*", "lm_head"]
  vae: {files: "vae/*.safetensors", dtype: bf16, precision: [bf16]}
  # Qwen's own prompt enhancers (API 1.36 optional add-ons, each its own folder): fine-tuned Qwen3.5-VL 9B
  # (Qwen3_5ForConditionalGeneration), one per task with its own system_prompt.txt (QwenLM/Qwen-Image-2.1
  # prompt_rewrite). bf16 as stored, as the old studio and the model cards run them (17.5 GB, one at a time).
  # Byte counts from the HF API at these revisions (the files allow_patterns fetch).
  text_enhancer:
    dir: Qwen-Image-2.1-PE-T2I
    addon:
      title: Text enhancer
      short: Enhancer             # API 1.40: the greyed controls' `Enhancer not downloaded` (board CreateEnhance)
      tag: PE-T2I                 # API 1.40: the Models card's mono line (board Models)
      refs: false                 # API 1.40: text to image needs it, an edit does not
      help: "Qwen-Image-2.1-PE-T2I. Enhance prompt without references."
      source: {repo: Qwen/Qwen-Image-2.1-PE-T2I, revision: f3ed7985c788ad75b3ab7223e0c4c51e2a43545b,
               allow_patterns: ["*.json", chat_template.jinja, system_prompt.txt, "model-*.safetensors"],
               licence: qwen-research, must_accept: true, gated: false, bytes: 18839796212}
    files: "model-*.safetensors"
    dtype: bf16
    precision: [bf16]
  edit_enhancer:
    dir: Qwen-Image-2.1-PE-I2I
    addon:
      title: Edit enhancer
      short: Enhancer
      tag: PE-I2I
      refs: true                  # API 1.40: an edit (references) needs it, text to image does not
      help: "Qwen-Image-2.1-PE-I2I. Enhance prompt with references."
      source: {repo: Qwen/Qwen-Image-2.1-PE-I2I, revision: 72927bc08afc99b7888ceb7d7d51a12db3700bbd,
               allow_patterns: ["*.json", chat_template.jinja, system_prompt.txt, "model-*.safetensors"],
               licence: qwen-research, must_accept: true, gated: false, bytes: 18839804437}
    files: "model-*.safetensors"
    dtype: bf16
    precision: [bf16]
lora:                             # LoRAs: the generated qwen-image/lora-stack node and the registry lora block
  component: transformer          # the component LoRAs patch; only stages that use it see the Model's LoRA set
  renames: []                     # {from, to} prefix rewrites of a key's module part (most families: none)
  ignore: []                      # fnmatch globs over raw keys counted as ignored, not unapplied
  modes: [adapter, bake]          # [bake] for a runtime without adapters yet
  max_rows: 8
  strength: {min: 0, max: 2, default: 1}
stages:
  enhance:
    title: Enhance prompt
    component: prompt enhancer
    help: "Rewrites the prompt with Qwen-Image-2.1-PE: PE-T2I without references, PE-I2I with them (9B each), and picks an aspect for an auto canvas; it sees the references of the encode node its text feeds. Bypassed: the prompt and canvas pass through."
    uses: [text_enhancer, edit_enhancer]   # one of them per run: the add-ons' `refs` say which (API 1.40)
    unload_after: [text_enhancer, edit_enhancer]
    alone: true                   # none of the model's other components stay beside it, as MiniMax's enhance
    sees: {refs: text}            # the refs param of the node its text feeds (the encode node)
    reports: [text]               # evt.run.status resolved.texts {"<node>.text": …}
    inputs: {prompt: Text, canvas: Canvas, seed: Seed}
    outputs: {text: Text, canvas: Canvas}
    params:
      think: {type: bool, label: Think, default: false,
              help: "Think longer: better prompts, slower (minutes)."}
    # measured 1.86 GB above its 17.5 (PE-T2I bf16, think off: 2452 prompt tokens, 445 new; phys_footprint, the load
    # included; tests/test_qwen_golden.py enhance-turbo-1024-s42). An edit's PE-I2I prompt is ~2k tokens longer and
    # each reference (at most 1 MP) ~1k vision tokens through a 27-block ViT: ~1 GB each, as MiniMax's enhancer.
    # ponytail: the edit and think-on slopes are extrapolated, unmeasured; measure a 10-reference edit with think on
    peak_gb: "2.5 + images"
  encode:
    title: Encode
    component: text encoder
    help: Encodes the prompt and up to 10 reference images; with references the run is an edit.
    uses: [text_encoder, vae]
    inputs: {model: Model, prompt: Text}
    outputs: {cond: Conditioning}
    params:
      transparent: {type: bool, label: Transparent, default: false,
                    help: Ask for an RGBA image with a transparent background.}
      refs: {type: rows, label: References, default: [], min: 0, max: 10, item: {image: Image},
             mention: "<image{n}>",
             help: "Images to edit or combine, in order; the prompt names them <image1>, <image2>, …"}
    # measured warm (above weights, 20 ms sampling): 2.4 GB text only, 3.5 with one ~1 MP reference, 4.1 with two;
    # each reference is VAE-encoded whole at ~1 MP, one at a time, + ~1k vision tokens. Slack for missed spikes.
    peak_gb: "2.5 + 1.5 * images"
  sample:
    title: Sample
    component: transformer
    help: Denoises from the seed's noise.
    uses: [transformer]
    inputs: {model: Model, cond: Conditioning, canvas: Canvas, seed: Seed}
    outputs: {latent: Latent}
    params:
      steps: {type: int, label: Steps, default: 40, min: 1, max: 200, step: 1,
              when: "model.variant != 'turbo' && model.variant != 'turbo-fp8'",
              help: Turbo uses its own 8-step schedule and ignores this.}
    # each reference adds ~4k latent tokens (1 MP / 16²) to the sequence: measured at 1024², 1.0 GB text only,
    # 3.0 with one reference, 5.0 with two (the edit goldens, tests/test_qwen_golden.py)
    peak_gb: "0.9 + 5.1 * mp + 2 * images"
    stall_s: 600
  decode:
    title: Decode
    component: vae
    help: Turns the latent into an RGBA image with the VAE.
    uses: [vae]
    inputs: {model: Model, latent: Latent}
    outputs: {image: Image}
    params:
      tiled: {type: enum, label: Tiled decode, default: auto, enum: ["auto", "on", "off"],
              help: "Tiling cuts decode memory (27 GB vs 65 GB at 4 MP) but changes pixels; auto tiles only when needed."}
    # auto tiles above 2.5 MP (torch.py AUTO_TILE_MP); whole decodes grow faster than linear (65 GB at 4 MP)
    peak_gb: "6 if tiled == 'on' or (tiled == 'auto' and mp > 2.5) else 12 * mp"  # measured 6.1 GB at 0.59 MP, 11.9 at 1 MP
  ask:
    title: Ask
    component: text encoder
    help: "Asks Qwen Image's own text encoder (Qwen3-VL 8B) one question about its takes: no extra load when it is resident. Temperature 0, thinking off, one more try in the same run when the answer does not match the schema."
    uses: [text_encoder]   # the encode stage's residency entry: after a still it loads nothing
    inputs: {model: Model}
    outputs: {answer: Text}
    params:
      system: {type: string, label: System, default: "", max: 4000, help: The system turn.}
      prompt: {type: string, label: Prompt, default: "", max: 32768,
               help: "The filled template (pipelines writes it). Not scanned for mentions."}
      media: {type: rows, label: Takes, default: [], min: 0, max: 8, item: {take: Media},
              help: "Image or video takes, in order; each is sent as a thumbnail (a video as 3 keyframes)."}
      schema: {type: string, label: Answer schema, default: "", max: 16384,
               help: "A JSON schema the answer must match; empty = plain text."}
      max_tokens: {type: int, label: Max tokens, default: 800, min: 16, max: 4096}
    # measured 2026-11-15 through the stage (torch 2.15 MPS, int8 text encoder 9.28 GB, footprint loaded 11.52): peak
    # above it 2.3 GB judging 4 x 512 px (1427 tokens, 7.7 s), 3.51 at 4 x 1024 px (4499 tokens, 12.8 s); greedy,
    # identical across two processes, JSON valid on the first try. A bound over both, extrapolated beyond 4.
    peak_gb: "2.2 + 0.35 * images"
