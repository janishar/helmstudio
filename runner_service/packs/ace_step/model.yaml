# ACE-Step 1.5 on torch (plan 38 section 44, P2a): songs from a style and lyrics, and Repaint, Cover and Extend of a
# song, on diffusers 0.43's AceStepPipeline classes built on meta from the original checkpoint layout (torch.py
# build / rename, after diffusers' scripts/convert_ace_step_to_diffusers.py), with the planner (the 5 Hz LM) ported
# from ACE-Step's own llm_inference.py two-phase loop. Two DiTs as variants of one pack: the 2B turbo in fp32 (as the
# repo runs it on MPS) and the XL (4B) turbo in bf16 (half the memory, twice as fast; owner's brief); the LM, text
# encoder and VAE are the 2B repo's, shared. Measured on the M5 Pro 64 GB (tests/test_ace_step_golden.py).
# Generates exactly the canonical ace-step fixtures (contracts/fixtures/registry/ace-step.*.valid.json).
id: ace-step-1.5
family: ace-step
title: ACE-Step 1.5
media: [audio]
sound: music                     # API 1.79: its takes are songs (contracts/README.md, Music and sound)
runtimes:
  torch: {env: torch, devices: [mps, cuda]}   # CUDA declared, its goldens wait for a GCP slot (plan 38 44.5)
licences:
  mit: {title: MIT License, url: https://opensource.org/license/mit}
model:
  help: Which DiT makes the song; the planner, text encoder and VAE are shared.
  variant: {label: Model, help: "2B turbo: fast drafts and edits. XL turbo (4B): better, bf16 on a Mac. Either about 24 GB for 30 s (26 GB for 2 min)."}
  precision: {label: Precision, help: "Fixed: the 2B's DiT runs in float32, XL's in bf16; the planner and text encoder in float32, the VAE in float16."}
variants:
  turbo-2b:
    dir: ACE-Step-1.5
    title: 2B turbo
    precision: [bf16]            # no choice (the components' own precisions hold: model.precision help)
    source: {repo: ACE-Step/Ace-Step1.5, revision: 19671f406d603126926c1b7e2adc169acbcade22,
             allow_patterns: [acestep-v15-turbo/config.json, acestep-v15-turbo/model.safetensors,
                              acestep-v15-turbo/silence_latent.pt, "acestep-5Hz-lm-1.7B/*", "Qwen3-Embedding-0.6B/*",
                              "vae/*"],
             licence: mit, must_accept: false, gated: false}
  xl-turbo:
    dir: ACE-Step-1.5-XL-Turbo
    title: XL turbo
    precision: [bf16]
    shares: [lm, text_encoder, vae]   # from ACE-Step-1.5's folder
    source: {repo: ACE-Step/acestep-v15-xl-turbo, revision: d4a0b288b83ebb7e25a8c0b32c573c22e134e8ee,
             allow_patterns: [config.json, model.safetensors.index.json, "model-*-of-00004.safetensors",
                              silence_latent.pt],
             licence: mit, must_accept: false, gated: false}
components:
  # the DiT checkpoint holds four diffusers modules (decoder, condition encoder, audio tokenizer and detokenizer):
  # one component each variant, so the 2B loads float32 and XL bf16 (a component's dtype is its own)
  transformer: {files: acestep-v15-turbo/model.safetensors, dtype: fp32, precision: [fp32], variants: [turbo-2b]}
  transformer_xl: {files: "model-*-of-00004.safetensors", dtype: bf16, precision: [bf16], variants: [xl-turbo]}
  lm: {files: acestep-5Hz-lm-1.7B/model.safetensors, dtype: fp32, precision: [fp32]}   # Qwen3 1.7B + audio codes
  text_encoder: {files: Qwen3-Embedding-0.6B/model.safetensors, dtype: fp32, precision: [fp32]}
  vae: {files: vae/diffusion_pytorch_model.safetensors, dtype: fp16, precision: [fp16]}
plan_media: {audio: {duration_s: 30, has_audio: true, in: 0, out: 30}}
stages:
  song:
    title: Song
    help: "The song's lyrics and its settings: BPM, key, time, length and vocal language. Auto leaves a value to the plan (a plain 30 s and no value without it)."
    inputs: {}
    outputs: {song: Conditioning}
    params:
      lyrics: {type: text, label: Lyrics, default: "", min: 0, max: 4096, tags: [verse, chorus, bridge, intro, outro],
               when: "instrumental == false",
               help: "Section tags in square brackets, one per line: [verse], [chorus]. Empty: an instrumental."}
      instrumental: {type: bool, label: Instrumental, default: false, help: "No vocals: the lyrics are not sung."}
      seconds: {type: float, label: Length, default: 0, auto: true, min: 10, max: 600, step: 1,
                help: "Auto: the plan picks it from the lyrics (30 s without the plan). Repaint, Cover and Extend keep the song's length."}
      bpm: {type: int, label: BPM, default: 0, auto: true, min: 30, max: 300, help: "Auto: the plan picks it."}
      key: {type: enum, label: Key, default: auto,
            enum: [auto, C major, C minor, "C# major", "C# minor", D major, D minor, Eb major, Eb minor, E major,
                   E minor, F major, F minor, "F# major", "F# minor", G major, G minor, Ab major, Ab minor, A major,
                   A minor, Bb major, Bb minor, B major, B minor],
            help: "Auto: the plan picks it."}
      time: {type: enum, label: Time, default: auto, enum: [auto, "2/4", "3/4", "4/4", "6/8"],
             help: "Beats per bar. Auto: the plan picks it."}
      language: {type: enum, label: Vocal language, default: auto,
                 enum: [auto, en, zh, ja, ko, es, fr, de, it, pt, ru, hi, ar, nl, pl, tr, sv, vi, th, id, yue],
                 when: "instrumental == false", help: "The language the lyrics are sung in. Auto: the plan tells it from the lyrics."}
  plan:
    title: Plan
    component: planner
    help: "The planner (ACE-Step's 5 Hz LM, 1.7B) rewrites the style, fills BPM, key, time, length and language where they are Auto, then writes the song's 5 Hz audio codes for the DiT to follow; seeded, so a seed repeats. Bypassed (Let it rewrite off): the style and the song pass through."
    uses: [lm]
    reports: [style, plan]
    inputs: {model: Model, song: Conditioning, text: Text, seed: Seed}
    outputs: {song: Conditioning, style: Text, plan: Text}
    params: {}
    # measured (torch 2.15 MPS, phys_footprint every 50 ms, tests/test_ace_step_golden.py and 30 s / 2 min songs):
    # the LM's run 1.2 GB over its 6.9 GB; all components stay resident (no `alone`: GOTCHAS.md)
    peak_gb: "1.5"
    stall_s: 120                  # a cancel point every token
  compose:
    title: Compose
    component: transformer
    help: "Makes the song with the DiT in 8 steps from the style, the lyrics and the plan's audio codes (without them, from the text alone); a reference song lends its sound (the first 30 s)."
    uses: [transformer, transformer_xl, text_encoder, vae]
    inputs: {model: Model, song: Conditioning, text: Text, seed: Seed}
    outputs: {latent: Latent}
    params:
      reference: &reference
        type: rows
        label: Reference
        default: []
        min: 0
        max: 1
        item:
          audio: {type: media, label: Song, default: null, accepts: [audio], max_s: 600,
                  help: "A song, voice or sound whose sound the new song borrows; the first 30 s are read."}
        help: "A song whose sound (timbre, mix) the new one borrows; the first 30 s are used."
      steps: &steps {type: int, label: Steps, default: 8, min: 1, max: 20, step: 1,
                     help: "The turbo DiT is distilled to 8 steps."}
    peak_gb: &dit_peak "3"        # measured 1.8 GB over the resident 18.4 GB (2B) at 10 and 30 s
    stall_s: 300
  repaint:
    title: Repaint
    component: transformer
    help: "Makes a range of a song again in the style and lyrics given, keeping the rest (spliced back sample for sample)."
    uses: [transformer, transformer_xl, text_encoder, vae]
    inputs: {model: Model, song: Conditioning, text: Text, seed: Seed}
    outputs: {latent: Latent}
    params:
      source: {type: media, label: Song, default: null, accepts: [audio], max_s: 600,
               help: "The song to repaint."}
      span: {type: span, label: Repaint, default: null, help: "The part to make again, in the song's seconds."}
      steps: *steps
    peak_gb: *dit_peak
    stall_s: 300
  cover:
    title: Cover
    component: transformer
    help: "The same song in a new style: its melody and words through the DiT's audio tokenizer, the new style and lyrics from the text; Keep the song is how close to stay."
    uses: [transformer, transformer_xl, text_encoder, vae]
    inputs: {model: Model, song: Conditioning, text: Text, seed: Seed}
    outputs: {latent: Latent}
    params:
      source: {type: media, label: Song, default: null, accepts: [audio], max_s: 600, help: "The song to cover."}
      strength: {type: float, label: Keep the song, default: 0.6, min: 0, max: 1, step: 0.05,
                 help: "1 stays with the song's melody and words; lower lets the new style take over."}
      steps: *steps
    peak_gb: *dit_peak
    stall_s: 300
  extend:
    title: Extend
    component: transformer
    help: "Adds time at the end (or the start) of a song, carrying on in its style: a repaint of silence past its edge, the song itself kept."
    uses: [transformer, transformer_xl, text_encoder, vae]
    inputs: {model: Model, song: Conditioning, text: Text, seed: Seed}
    outputs: {latent: Latent}
    params:
      source: {type: media, label: Song, default: null, accepts: [audio], max_s: 590, help: "The song to extend."}
      seconds: {type: float, label: Add, default: 30, min: 5, max: 300, step: 1,
                help: "Seconds to add; the song may last at most 600 s."}
      where: {type: enum, label: Where, default: end, enum: [end, start]}
      steps: *steps
    peak_gb: *dit_peak
    stall_s: 300
  decode:
    title: Decode
    component: vae
    help: "Turns the latent into 48 kHz stereo with the VAE (tiled past 20 s), levelled to -1 dBFS peak; a repaint's or extend's kept parts are the source's own samples. A song with tagged lyrics carries its sections."
    uses: [vae]
    inputs: {model: Model, latent: Latent}
    outputs: {audio: Audio}
    params: {}
    # measured over the 18.4 GB resident (2B; XL 18.7): 3.0 GB at 10 s, 6.0 at 30 s, 7.3 at 2 min (the decoder's
    # 20 s tiles bound it; MPS keeps the freed tiles' buffers). No length reaches the formula (the song's is upstream,
    # not a frames param): ponytail: the 2 min figure for every length; a 10 min song is unmeasured
    peak_gb: "7.5"
    stall_s: 300

# The assistant's recipes (API 1.71, contracts/README.md "Assistant: model guides"): named settings as data, values by
# <node>.<param> (<node>.bypass: the node's bypass), each checked against its workflow's node schemas.
recipes:
  - {name: song-with-plan, title: Song with the plan, workflow: ace-step-music,
     params: {plan.bypass: false, song.seconds: 0, song.bpm: 0},
     note: "Style plus [verse] / [chorus] lyrics; the plan fills length, BPM, key and language."}
  - {name: quick-instrumental, title: Quick instrumental, workflow: ace-step-music,
     params: {song.instrumental: true, song.seconds: 30, plan.bypass: false},
     note: "A 30 s cue or bed: describe instruments, mood and tempo in the style."}
  - {name: exact-tempo, title: Exact tempo and key, workflow: ace-step-music,
     params: {song.bpm: 120, song.key: A minor, song.time: "4/4"},
     note: "Set BPM, key and time; the plan still picks the length unless set."}
  - {name: close-cover, title: Close cover, workflow: ace-step-cover, params: {cover.strength: 0.8},
     note: "The new style in the text; high Keep the song stays with the melody and words."}
  - {name: loose-cover, title: Loose cover, workflow: ace-step-cover, params: {cover.strength: 0.4},
     note: "Lower Keep the song: the new style takes over."}
