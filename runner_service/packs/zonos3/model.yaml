# ZONOS3-Mini speech (plan 15-voices 19.4), run by the native zonos3-server (the pinned ggml build in vendor/zonos3,
# `make zonos3`) as a child process of the native runner (core.child.serve; docs/reference-notes/voices.md): one
# server per run on 127.0.0.1, which normalizes the text and speaks every piece of it in one load, killed after. The
# runner loads no component (`uses: []`); peak_gb is the child's whole peak. Generates exactly the canonical zonos3
# fixtures (contracts/fixtures/registry/zonos3.*.valid.json; tests/test_packs.py, tests/test_zonos3.py). GOTCHAS.md.
id: zonos3-mini
family: zonos3
title: ZONOS3
media: [audio]
runtimes:
  native: {env: native, devices: [mps, cuda]}   # Metal (`make zonos3`) or CUDA (`make zonos3-cuda`, Dockerfile.cuda)
licences:
  apache-2.0: {title: Apache License 2.0, url: https://www.apache.org/licenses/LICENSE-2.0}
model:
  help: "ZONOS3-Mini: the backbone, the keep2 decoder, the speaker encoder and the steering table, run by zonos3-server."
  variant: {label: Variant}
  precision:
    label: Precision
    default: int8
    help: "Stored quantized (q8_0 and q4_0 with f16 in backbone-ptq.gguf); loaded as it is. Not a choice."
variants:
  mini:
    dir: ZONOS3-Mini
    title: Mini
    # only these files of the 9.3 GB repo (edit, f16, raw-reference and the 2 GB zac.gguf are left out); revision from
    # the .cache/huggingface sidecars of the downloaded files
    source: {repo: Zyphra/ZONOS3-Mini, revision: d2d142a86b1e6aeb4252679673c86ecd86177bf8,
             allow_patterns: [gguf/backbone-ptq.gguf, gguf/zac-keep2.gguf, gguf/spk-encoder.gguf, gguf/steer.gguf,
                              "gguf/voices/*/*", gguf/voices/README.md],
             licence: apache-2.0, must_accept: false, gated: false}
# presence, bytes and downloads only: the server child loads them (the speaker encoder embeds a clip voice)
components:
  backbone: {files: gguf/backbone-ptq.gguf, dtype: stored, precision: [int8]}
  decoder: {files: gguf/zac-keep2.gguf, dtype: stored, precision: [int8]}
  speaker_encoder: {files: gguf/spk-encoder.gguf, dtype: stored, precision: [int8]}
  steer: {files: gguf/steer.gguf, dtype: stored, precision: [int8]}
stages:
  speak:
    title: Speak
    component: whole model
    help: "Reads the text in one voice, a preset or a clip it clones, at 44.1 kHz. Long text is split on sentences and joined; at most 900 characters (about 60 s)."
    uses: []
    inputs: {model: Model, text: Text, seed: Seed}
    outputs: {audio: Audio}
    params:
      voice: {type: voice, label: Voice, default: null, accepts: [preset, clip],
              help: "One of the 27 ZONOS3 presets, or any saved voice with a clip (cloned, or designed and saved with its clip)."}
      language: &language {type: enum, label: Language, default: en-US,
                 enum: [en-US, en-GB, fr, de, es, it, pt-BR, ja, zh, ko, ar, bn, bg, cs, da, nl, fi, ka, el, gu, he, hi,
                        hu, id, kn, ms, ml, mr, "no", or, pl, pa, ro, ru, sk, sv, tl, ta, te, th, tr, uk, ur, vi],
                 help: "The language of the text: it decides how numbers and abbreviations are read."}
      emotion: &emotion {type: float, label: Emotion, default: 0.5, min: 0, max: 1, step: 0.05,
                help: "Valence: low sounds sad, high sounds happy; 0.5 adds nothing."}
      energy: &energy {type: float, label: Energy, default: 0.5, min: 0, max: 1, step: 0.05,
               help: "Arousal: low is calm and soft, high is excited; 0.5 adds nothing."}
      whisper: &whisper {type: float, label: Whisper, default: 0, min: 0, max: 1, step: 0.05,
                help: "0 speaks out loud; 1 whispers every word."}
      speaking_rate: &speaking_rate {type: float, label: Speaking rate, default: 1, min: 0.5, max: 1.5, step: 0.05,
                      help: "1× is a normal pace."}
      guidance: &guidance {type: float, label: Guidance, default: 2, min: 1, max: 5, step: 0.1,
                 help: "How closely it keeps to the voice; 1 is off, high strains."}
    # the scout measured the CLI child at 1.53-1.56 GB, flat in length (2.6-4.8 s); the server child with only
    # zac-keep2: see GOTCHAS.md for this pack's own measure
    peak_gb: "2.0"
    max_seconds: 60
  # API 1.32 (contracts/README.md "Dialogue and Timeline audio"): a script's lines in one server, each in its voice,
  # its style words mapped onto its Delivery (native.STYLE), one take with cues; one line at a time: speak's memory
  dialogue:
    title: Dialogue
    component: whole model
    help: "Speaks each line in its speaker's voice (a preset, or a clip it clones) at 44.1 kHz, with pauses, as one take; reports each line's start and end."
    uses: []
    inputs: {model: Model, seed: Seed}
    outputs: {audio: Audio}
    params:
      script: {type: text, script: true, label: Script, default: "", min: 0, max: 8000,
               help: "One line each: @name: text or @name (style): text. An empty line is a longer pause. Each @name speaks in its element's voice."}
      lines: {type: rows, label: Lines, default: [], min: 1, max: 40,
              item: {voice: {type: voice, label: Voice, default: null, accepts: [preset, clip]},
                     text: {type: string, label: Line, default: "", max: 600},
                     style: {type: string, label: Style, default: "", max: 200},
                     pause_s: {type: float, label: Pause after, default: 0.35, min: 0, max: 5, step: 0.05,
                               help: "Silence after the line, before the next (the last line's is not used)."}},
              help: "One item per spoken line, in order. Studio writes them from the script; the Graph view and agents may set them instead."}
      pause: {type: float, label: Pause between lines, default: 0.35, min: 0, max: 2, step: 0.05,
              help: "The silence between two lines; each empty line in the script adds it once more."}
      language: *language
      emotion: *emotion
      energy: *energy
      whisper: *whisper
      speaking_rate: *speaking_rate
      guidance: *guidance
    peak_gb: "2.0"
    max_seconds: 60

# The assistant's recipes (API 1.71, contracts/README.md "Assistant: model guides"): named settings as data, values by
# <node>.<param> (<node>.bypass: the node's bypass), each checked against its workflow's node schemas (tests/test_guides.py
# against the canonical fixtures; the runner, the ones it publishes). assistant.md says when to use each.
recipes:
  - {name: voice-line, title: Voice line (neutral), workflow: zonos3-voice-over,
     params: {speak.emotion: 0.5, speak.energy: 0.5, speak.whisper: 0, speak.speaking_rate: 1, speak.guidance: 2}}
  - {name: warm-narration, title: Warm narration, workflow: zonos3-voice-over,
     params: {speak.emotion: 0.7, speak.energy: 0.45, speak.whisper: 0, speak.speaking_rate: 0.95, speak.guidance: 2}}
  - {name: tense-line, title: Tense line, workflow: zonos3-voice-over,
     params: {speak.emotion: 0.3, speak.energy: 0.75, speak.whisper: 0, speak.speaking_rate: 1.1, speak.guidance: 2.5}}
  - {name: whisper, title: Whisper, workflow: zonos3-voice-over,
     params: {speak.emotion: 0.5, speak.energy: 0.25, speak.whisper: 0.9, speak.speaking_rate: 0.9, speak.guidance: 2}}
  - {name: cloned-character, title: Cloned character, workflow: zonos3-voice-over,
     params: {speak.emotion: 0.5, speak.energy: 0.5, speak.whisper: 0, speak.speaking_rate: 1, speak.guidance: 2.5},
     note: "A voice with a clip; guidance 2.5 if it wanders from its clip (untested)."}
  - {name: dialogue-scene, title: Dialogue scene, workflow: zonos3-dialogue,
     params: {dialogue.emotion: 0.5, dialogue.energy: 0.5, dialogue.whisper: 0, dialogue.speaking_rate: 1,
              dialogue.guidance: 2, dialogue.pause: 0.5},
     note: "(style) words per line; every @name in the Cast."}
