# The llm pack (M4b stage A): a local vision-language model for judge, write and decide nodes, asked as a queue item
# (a run of the text workflow llm-ask). Qwen3.8-27B-4bit (Qwen3_5ForConditionalGeneration: vision tower + 64-layer
# hybrid-attention LM, stored MLX 4-bit, group 64) on mlx-vlm (the env's `llm` extra); the stage, the prompt and the
# answer rules are core/ask.py + mlx.py. Generates exactly contracts/fixtures/registry/llm.{nodes,workflows}.
# Memory, measured 2026-11-15 through this pack's stage (graph.run, the residency manager, Metal cache cap 2 GB;
# mlx 0.32.4, mlx-vlm 0.7.12, 64 GB M-series, both runners stopped): the component is the stored safetensors at
# their own dtypes (core.pack.size_gb, U32 packed: 14.95 GB); footprint after load 15.87 (load 1-2 s, warm page
# cache). Process peak during an ask: 16.2 text only (127 prompt tokens, incl. the load), 19.38 judging 4 x 512 px
# (1432 tokens, 14.3 s), 20.84 judging 4 x 1024 px (4504 tokens, 21.5 s); two fresh processes gave byte-identical
# answers and thumbnails, JSON valid on the first try (constrained by llguidance).
id: qwen3.8-27b
family: llm
title: Qwen3.8 27B
runtimes:
  mlx: {env: mlx}
model:
  help: "The local vision-language model for judge, write and decide nodes (MLX 4-bit)."
  variant: {label: Variant}
  precision:
    label: Precision
    help: "Stored 4-bit; nothing is quantized at load."
licences:
  apache-2.0: {title: Apache License 2.0, url: https://www.apache.org/licenses/LICENSE-2.0}
variants:
  4bit:
    dir: Qwen3.8-27B-4bit
    title: 4-bit
    source: {repo: mlx-community/Qwen3.8-27B-4bit, revision: b935172e4bb5dcd0543774a34748fb92422e3027,
             allow_patterns: ["*.safetensors", "*.json", "*.jinja"],
             licence: apache-2.0, must_accept: false, gated: false, bytes: 16074309358}
components:
  model: {files: "*.safetensors", dtype: stored, precision: [int4]}   # loaded whole by mlx-vlm (mlx.py)
stages:
  ask:
    title: Ask
    component: language model
    help: "Asks the model one question about its takes: temperature 0, thinking off, one more try in the same run when the answer does not match the schema."
    uses: [model]
    inputs: {model: Model}
    outputs: {answer: Text}
    params:
      system: {type: string, label: System, default: "", max: 4000, help: The system turn.}
      prompt: {type: string, label: Prompt, default: "", max: 32768,
               help: "The filled template (pipelines writes it). Not scanned for mentions."}
      media: {type: rows, label: Takes, default: [], min: 0, max: 8, item: {take: Media},
              help: "Image or video takes, in order; each is sent as one picture (a video as a grid of 12 frames with their times)."}
      schema: {type: string, label: Answer schema, default: "", max: 16384,
               help: "A JSON schema the answer must match; empty = plain text."}
      max_tokens: {type: int, label: Max tokens, default: 800, min: 16, max: 4096}
    # peak above the 14.95 GB component: 4.43 at 4 x 512 px, 5.89 at 4 x 1024 px (~1024 tokens per thumbnail);
    # a bound over both, extrapolated beyond 4 thumbnails (a video counts 3)
    peak_gb: "4 + 0.5 * images"

# The assistant's recipes (API 1.71, contracts/README.md "Assistant: model guides"): named settings as data, values by
# <node>.<param> (<node>.bypass: the node's bypass), each checked against its workflow's node schemas (tests/test_guides.py
# against the canonical fixtures; the runner, the ones it publishes). assistant.md says when to use each.
recipes:
  - {name: judge-takes, title: Judge takes, workflow: llm-ask, params: {ask.max_tokens: 800},
     note: "A schema with per-take checks, reason and ranking; up to 4 stills."}
  - {name: quick-yes-no, title: Quick yes or no, workflow: llm-ask,
     params: {ask.max_tokens: 64, ask.schema: '{"type": "object", "properties": {"answer": {"type": "boolean"}, "reason": {"type": "string"}}, "required": ["answer", "reason"]}'},
     note: "One take."}
  - {name: write-prompt, title: Write a prompt, workflow: llm-ask, params: {ask.max_tokens: 400},
     note: "No takes, plain text."}
  - {name: many-takes, title: Many takes, workflow: llm-ask, params: {ask.max_tokens: 1200},
     note: "8 stills or 2 videos plus 2 stills; about 23 GB peak."}
