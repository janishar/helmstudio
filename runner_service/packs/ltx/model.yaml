# LTX-2.5 distilled two-stage text-to-video with audio on MLX, ported from ltx-2-studio's DistilledPipeline
# (`ltx-2-mlx generate --distilled`); the model code is vendored in vendor/ (VENDORED.md), the pipeline is mlx.py.
# Generates exactly the canonical ltx node schemas (contracts/fixtures/registry/ltx.*; tests/test_packs.py).
# Weights: the official split files under <models>/ltx-2.5, read in place (no conversion is ever written).
# Memory: components' GB from the headers at the target precision (core.pack.size_gb: int8 transformer 19.18, text
# encoder 12.66, connector 5.91, upscaler 0.93, vae 0.76, vocoder 0.48, audio vae 0.06). peak_gb is a stage's peak
# physical memory (the larger of the process footprint and MLX active + cache, sampled every 20 ms) minus the
# components resident after it, with the Metal cache capped at core/loaders_mlx.py CACHE_GB (2), measured 2026-11-15
# (64 GB M-series, mlx 0.32.4, int8) at 448x256x49 and 704x448x97, t2v and i2v (GOTCHAS.md, Measured); fitted
# linear in tokens between them, extrapolated beyond.
# Stage B (measured 2026-11-15, mlx 0.32.4, int8, 448x256x49): the VAE encoder 0.59 GB; keyframe images add < 0.1 GB
# over the sampler's own peak at that size (the image term below is a guess beyond it); a baked transformer (the
# synthetic rank-8 LoRA, 338 modules) loads in 5.8 s against 4.8 s, peaks 1.4 GB above a plain load (module by
# module; the old all-at-once fuse +5.3) and keeps 0.57 GB more (float32 scales and biases on baked layers).
id: ltx-2.5
family: ltx
title: LTX-2.5
runtimes:
  mlx: {env: mlx}
model:
  help: Which weights to load and at what precision.
  variant: {label: Variant, help: "Distilled: few fixed steps, no guidance."}
  precision:
    label: Precision
    default: int8
    enum: [int8, int4, bf16]
    help: "Quantized at load: int8 about 19 GB for the transformer, bf16 about 38 GB."
variants:
  distilled: {dir: ltx-2.5}
components:
  # Gemma 4 12B tower (`model.*` of the text encoder file): ~12.7 GB at int8, ~23 GB at bf16
  text_encoder:
    files: "text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"
    dtype: stored
    precision: [bf16, int8, int4]
    quantize: ["*.self_attn.q_proj", "*.self_attn.k_proj", "*.self_attn.v_proj", "*.self_attn.o_proj",
               "*.mlp.gate_proj", "*.mlp.up_proj", "*.mlp.down_proj"]
  # the text connector: the two 8-layer stacks inside the transformer file + the text encoder file's projection
  connector:
    files: ["diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors",
            "text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"]
    dtype: stored
  # the 22B audio-video DiT (distilled: the dev model with the distilled LoRA fused in): 19.2 GB at int8
  transformer:
    files: "diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors"
    dtype: stored
    precision: [bf16, int8, int4]
    quantize: ["transformer_blocks.*"]
  upscaler: {files: "latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors", dtype: stored}
  vae: {files: "vae/ltx-2.5-video-vae-conv-bf16.safetensors", dtype: stored}   # conv decoder + latent statistics
  vae_encoder: {files: "vae/ltx-2.5-video-vae-conv-bf16.safetensors", dtype: stored}   # encodes keyframe images
  audio_vae: {files: "vae/ltx-2.5-audio-vae-bf16.safetensors", dtype: stored}  # its decoder
  vocoder: {files: "vae/ltx-2.5-audio-vae-bf16.safetensors", dtype: fp32}      # BigVGAN + BWE, run in fp32
# LoRAs: bake only (the old MLX code fuses every LoRA into the transformer; no adapter exists to copy or prove). The
# renames are the old LTXV_LORA_COMFY_RENAMING_MAP as end-of-module-part rewrites; kohya files match none: refused.
lora:
  component: transformer
  renames:
    - {from: ".to_out.0", to: ".to_out", at: end}
    - {from: ".audio_ff.net.0.proj", to: ".audio_ff.proj_in", at: end}
    - {from: ".audio_ff.net.2", to: ".audio_ff.proj_out", at: end}
    - {from: ".ff.net.0.proj", to: ".ff.proj_in", at: end}
    - {from: ".ff.net.2", to: ".ff.proj_out", at: end}
    - {from: ".linear_1", to: ".linear1", at: end}
    - {from: ".linear_2", to: ".linear2", at: end}
  ignore: []
  modes: [bake]
  max_rows: 8
  strength: {min: -4, max: 4, default: 1}
  help: "Bakes LoRAs into the model's transformer at load, in order. Empty: the model as it is."
  rows_help: "Each row: a LoRA that fits this model and its strength."
  mode_help: "Bake: merged into the transformer at load (its own copy in memory; a strength change reloads it). LTX on MLX has no adapter yet."
  # the distilled transformer is the dev one with this LoRA fused in: a row naming it would apply it twice
  prefused: [{file: loras/ltx-2.5-22b-distilled-lora-450-bf16.safetensors, variant: distilled}]
stages:
  canvas:
    title: Canvas
    help: The video size in pixels, on the 64 px grid of two-stage LTX (stage 1 runs at half of it). About 0.1 to 2.1 MP.
    params:
      width: {type: int, label: Width, default: 704, min: 128, max: 1920, step: 64}
      height: {type: int, label: Height, default: 448, min: 128, max: 1920, step: 64}
    outputs: {canvas: Canvas}
  duration:
    title: Duration
    help: "The clip's length in frames on LTX's 8k + 1 grid, and its frame rate (fps changes the generated motion, not only playback)."
    params:
      frames: {type: frames, label: Length, default: 49, min: 9, max: 321, step: 8, fps: fps,
               auto: {min_s: 1, max_s: 20},
               help: "Auto: the model predicts the length from the prompt, 1 to 20 s (at most 321 frames), reported with the result."}
      fps: {type: int, label: Frame rate, default: 24, min: 1, max: 60, step: 1,
            help: "LTX was trained at 24; values far from it drift."}
    outputs: {duration: Duration}
  encode:
    title: Encode prompt
    help: "Encodes the prompt (and its beats, as one prompt) for video and audio with Gemma 4 and the connector; the text encoder is unloaded before sampling."
    uses: [text_encoder, connector]
    unload_after: [text_encoder, connector]   # Gemma never sits beside the DiT (GOTCHAS: watchdog, jetsam)
    inputs: {model: Model, prompt: Text}
    outputs: {cond: Conditioning}
    params:
      beats:
        type: rows
        label: Prompt beats
        default: []
        min: 0
        max: 8
        item:
          text: {type: string, label: Beat, default: "", min: 1, max: 500}
          seconds: {type: float, label: Length, default: 0, min: 0, max: 20, step: 0.1,
                    help: "How long this beat lasts, in seconds; 0 shares what the others leave equally."}
        help: "Prompt Relay: each beat steers the picture (not the sound) for its stretch of the clip, in order; the prompt above holds for the whole clip."
    peak_gb: "5.3"   # measured 4.9 / 5.0 (t2v), 5.1 (i2v): Gemma's int8 load transient and the encode
  keyframes:
    title: Keyframes
    help: "Pins gallery images at chosen times of the clip: at 0 s the clip starts from the image, later ones are frames it passes through. Bypassed: text to video."
    inputs: {cond: Conditioning}
    outputs: {cond: Conditioning}
    params:
      images:
        type: rows
        label: Frames
        default: []
        min: 1
        max: 8
        item:
          image: Image
          seconds: {type: float, label: At, default: 0, min: 0, max: 320, step: 0.1, position: seconds,
                    help: "Where in the clip, in seconds: 0 is the first frame, the clip's length its last."}
          strength: {type: float, label: Strength, default: 1, min: 0, max: 1, step: 0.05,
                     help: "1 holds the frame to the image; lower lets the model drift from it."}
        help: "Each row: an image, where it goes and how strongly it holds."
    # one libx264 round trip of the largest image at a time (host memory, not MLX); not measured: an estimate
    peak_gb: "0.5 + 0.03 * mp_in"
  sample:
    title: Sample
    help: "Denoises video and audio together. Stage 1 starts from the seed's noise at half size (canvas and duration); stage 2 refines an upscaled latent at full size (latent)."
    uses: [transformer, vae_encoder]   # the VAE encoder turns the keyframe images into latents at this stage's grid
    inputs:
      model: Model
      cond: Conditioning
      seed: Seed
      canvas: {type: Canvas, optional: true}
      duration: {type: Duration, optional: true}
      latent: {type: Latent, optional: true}
    outputs: {latent: Latent}
    params:
      role: {type: enum, label: Stage, default: stage1, enum: [stage1, stage2],
             help: "stage1: half size, ancestral sampler, 8 steps. stage2: full size from latent, renoised at 0.909, 3 steps."}
      # the distilled sigma tables end at 0 only in full: the old --stageN-steps n truncated them (table[:n + 1]),
      # leaving noise in the clip for any other n (docs/reference-notes/ltx.md 11.6)
      steps: {type: int, label: Steps, default: 8, min: 3, max: 8, step: 1,
              help: "Fixed by the stage's distilled schedule: stage 1 runs 8 steps, stage 2 runs 3 (fewer would stop with noise left in).",
              values: [3, 8], values_by: {param: role, values: {stage1: [8], stage2: [3]}}}
    # video tokens ~ (frames / 8 + 1) * mp * 977 at full size, a quarter in stage 1; each keyframe appends a latent
    # frame of tokens (counted for every image, frame 0 too: an upper bound) and encodes its image at the stage's grid.
    # The fused attention keeps memory linear in tokens (stage 2 grew 0.85 GB for 5x the tokens).
    # measured (448x256x49 / 704x448x97 t2v, 448x256x49 i2v): stage 1 2.61 / 3.54 / 3.51; stage 2 3.33 / 4.18 / 4.20
    peak_gb: "images * (0.7 + 1.5 * mp) + (3.15 + 0.26 * (frames / 8 + 1 + images) * mp if role == 'stage2' else 2.4 + 0.28 * (frames / 8 + 1 + images) * mp)"
  upscale:
    title: Upscale latent
    help: "Doubles the video latent's width and height with the spatial upsampler; the audio latent passes through."
    uses: [upscaler, vae]
    inputs: {model: Model, latent: Latent}
    outputs: {latent: Latent}
    peak_gb: "2.2 + 0.5 * mp * frames / 49"   # measured 2.12 / 1.45 / 2.13 (MLX alone 0.7 / 0.9: the rest is stage 1's freed cache the OS takes back late)
  decode:
    title: Decode
    help: Decodes video and audio and writes an MP4 (H.264 + AAC 48 kHz stereo) with a poster frame.
    uses: [vae, audio_vae, vocoder]
    inputs: {model: Model, latent: Latent}
    outputs: {video: Video}
    params:
      audio: {type: bool, label: Audio, default: true,
              help: "Off: an MP4 without a sound track. The picture is the same: the model always generates both."}
    # the full-resolution 128-channel stages dominate (bf16 128 x frames x H x W is 7.8 GB at 704x448x97); the vendored
    # temporal tiling looks only at block 3 (8 GB budget) and does not start below about 2 MP x 321 frames, so the
    # decode grows linearly past that: measured 10.6 / 23.4 / 10.6 (audio decode 4.4 / 5.1 before it)
    peak_gb: "7.7 + 25.2 * mp * frames / 49"
