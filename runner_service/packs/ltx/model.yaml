# LTX-2.5 distilled two-stage text-to-video with audio on MLX, ported from ltx-2-studio's DistilledPipeline
# (`ltx-2-mlx generate --distilled`); the model code is vendored in vendor/ (VENDORED.md), the pipeline is mlx.py.
# Generates exactly the canonical ltx node schemas (contracts/fixtures/registry/ltx.*; tests/test_packs.py).
# Weights: the official split files under <models>/ltx-2.5, read in place (no conversion is ever written).
# Memory: components' GB from the headers at the target precision (core.pack.size_gb: int8 transformer 19.18, text
# encoder 12.66, connector 5.91, upscaler 0.93, vae 0.76, vocoder 0.48, audio vae 0.06). peak_gb is a stage's peak
# physical memory (the larger of the process footprint and MLX active + cache, sampled every 20 ms) minus the
# components resident after it, with the Metal cache capped at core/loaders_mlx.py CACHE_GB (2), measured 2026-11-15
# (64 GB M-series, mlx 0.32.4, int8) at 448x256x49 and 704x448x97, t2v and i2v (GOTCHAS.md, Measured); fitted
# linear in tokens between them, extrapolated beyond.
# Stage B (measured 2026-11-15, mlx 0.32.4, int8, 448x256x49): the VAE encoder 0.59 GB; keyframe images add < 0.1 GB
# over the sampler's own peak at that size (the image term below is a guess beyond it); a baked transformer (the
# synthetic rank-8 LoRA, 338 modules) loads in 5.8 s against 4.8 s, peaks 1.4 GB above a plain load (module by
# module; the old all-at-once fuse +5.3) and kept 0.57 GB more (float32 scales and biases on baked layers; since the
# 0.18 sync a bake keeps the loaded dtype: core/loaders_mlx.py extra_gb counts what is held).
# M7 pack 1 (retake, extend, audio to video on the dev transformer), measured 2026-11-19 on this port (mlx 0.32.2,
# int8, the goldens at 448x256x49; MLX peak over the stage minus what stays resident): encode-guided 3.3, encode-video
# 8.7 (the all-at-once VAE encode), encode-audio 0.5, the retake / extend loop 1.7, sample-guided 1.6, decode 8.8;
# ltx/sample after ltx/distill 9.3 (the baked load's transient: 29.5 over 20.3 kept, not in its formula; the plan's
# peak, the warm encode, stays above it). Process footprint per run: retake 26.8, extend 27.5, a2v 32.8; a retake warm
# after a2v (both transformers resident) 45.7. Times: encode 9 s, retake 262 s, extend 283 s, a2v 137 s (GOTCHAS.md).
id: ltx-2.5
family: ltx
title: LTX-2.5
runtimes:
  mlx: {env: mlx}
  torch: {env: torch, devices: [cuda]}   # the NVIDIA variants: torch.py on the vendored ltx-core (plan 17, 21.6)
model:
  help: Which weights to load and at what precision.
  variant: {label: Variant, help: "Distilled: 8 steps without guidance, about 10× faster. Dev: guided steps, CFG and STG, and Extend before (retake, extend, audio to video). fp8 / int8: smaller community weights, NVIDIA hosts only."}
  precision:
    label: Precision
    default: int8
    enum: [int8, int4, bf16, fp8]
    help: "Quantized at load: int8 about 19 GB for the transformer, bf16 about 38 GB."
  # API 1.39: a load option, not a per-run cast (set_compute_dtype also casts the float parameters, which a baked
  # layer's float32 scales would not survive): core keys the transformer by it; torch.py ignores it (bf16)
  compute: {label: Compute, default: float32, enum: [float32, float16], components: [transformer], runtime: mlx,
            help: "float16 runs attention and feed-forward in half precision: 10–20 % faster, the picture changes slightly. NVIDIA ignores it."}
media: [video, audio]
licences:
  ltx-2-community: {title: LTX-2 Community License, url: https://huggingface.co/Lightricks/LTX-2.5}
variants:
  distilled:
    dir: ltx-2.5
    title: Distilled
    devices: [mps]   # the official pair stays the Mac's (MLX) until it has run on CUDA
    source:
      repo: Lightricks/LTX-2.5
      revision: 5e6e71018ee1756ed329b697a7b4aedc934dfce9
      allow_patterns:
        - diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors
        - text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors
        - latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors
        - vae/ltx-2.5-video-vae-conv-bf16.safetensors
        - vae/ltx-2.5-audio-vae-bf16.safetensors
        - model_patches/ltx-2.5-duration-head-bf16.safetensors
        - loras/ltx-2.5-22b-distilled-lora-450-bf16.safetensors
      licence: ltx-2-community
      must_accept: true
      gated: true   # Lightricks/LTX-2.5 is gated (auto): the host needs a Hub token
      bytes: 79998697238
  # the full (non-distilled) transformer, in the same folder (core/models.py: one folder, two variants); every other
  # component is the distilled variant's (the connector too: the old studio read it from the distilled file first)
  dev:
    dir: ltx-2.5
    title: Dev
    devices: [mps]
    shares: [text_encoder, connector, upscaler, vae, vae_encoder, audio_vae, vocoder, audio_encoder]
    files: {transformer: "diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors"}
    source:
      repo: Lightricks/LTX-2.5
      revision: 5e6e71018ee1756ed329b697a7b4aedc934dfce9
      allow_patterns: [diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors]
      licence: ltx-2-community
      must_accept: true
      gated: true   # Lightricks/LTX-2.5 is gated (auto): the host needs a Hub token
      bytes: 42018190584
  # The alternate path for NVIDIA hosts (docs/plan/17-nvidia-quantized.md 21.6): community weights, FP8 where one
  # exists, else int8 ConvRot, run by torch.py on the vendored ltx-core. distilled-fp8: unsloth's per-row FP8
  # transformer (the dev one with the distilled LoRA fused at 1) and its bf16 connector shards (projection included),
  # DmitryDB's int8 ConvRot Gemma text encoder (the official file's layout and tokenizer), the official upscaler,
  # VAEs and duration head. dev-int8: DmitryDB's int8 ConvRot dev transformer, the rest distilled-fp8's. Byte counts
  # from the HF API at these revisions (source: all of the variant's files).
  distilled-fp8:
    dir: ltx-2.5-nvidia
    title: Distilled fp8
    precision: [fp8]
    component_precision: {transformer: [fp8], text_encoder: [int8]}
    devices: [cuda]
    files: {transformer: LTX-2.5-FP8.safetensors, connector: "connectors/*.safetensors",
            text_encoder: text_encoders/gemma4-12b-with-proj-ltx-2.5-int8.safetensors}
    source: {repo: Lightricks/LTX-2.5, revision: 5e6e71018ee1756ed329b697a7b4aedc934dfce9,
             allow_patterns: [latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors,
                              vae/ltx-2.5-video-vae-conv-bf16.safetensors, vae/ltx-2.5-audio-vae-bf16.safetensors,
                              model_patches/ltx-2.5-duration-head-bf16.safetensors],
             licence: ltx-2-community, must_accept: true, gated: true, bytes: 43721932016}
    sources:
      - {repo: unsloth/LTX-2.5-FP8, revision: 9001a61f9b788e21ae7e7e2eca2ea2ee66041570,
         allow_patterns: [LTX-2.5-FP8.safetensors, "connectors/*"], gated: false, bytes: 25400522558}
      - {repo: DmitryDB/LTX-2.5-ComfyUI-Quants, revision: a7136f485a7a469cbcc4fbacc067cf880766d754,
         allow_patterns: [text_encoders/gemma4-12b-with-proj-ltx-2.5-int8.safetensors], gated: false,
         bytes: 15504650554}
  dev-int8:
    dir: ltx-2.5-nvidia
    title: Dev int8
    precision: [int8]
    component_precision: {transformer: [int8], text_encoder: [int8]}
    devices: [cuda]
    shares_from: distilled-fp8
    distill_from: distilled-fp8   # ltx/distill: that variant's transformer (the distilled LoRA fused in), no LoRA
    shares: [text_encoder, connector, upscaler, vae, vae_encoder, audio_vae, vocoder, audio_encoder]
    files: {transformer: diffusion_models/ltx-2.5-22b-dev-transformer-int8-convrot.safetensors}
    source: {repo: DmitryDB/LTX-2.5-ComfyUI-Quants, revision: a7136f485a7a469cbcc4fbacc067cf880766d754,
             allow_patterns: [diffusion_models/ltx-2.5-22b-dev-transformer-int8-convrot.safetensors],
             licence: ltx-2-community, must_accept: true, gated: false, bytes: 21638185024}
# memory plans (core/registry.py): a media input is planned at the goldens' size (measured there); audio to video gets
# its own item (it loads the upscaler and the baked transformer the others do not)
plan_media:
  video: {width: 448, height: 256, frames: 49, fps: 24, duration_s: 2.0417, has_audio: true}
  audio: {duration_s: 2.0417, has_audio: true, in: 0, out: 2.0417}
planned_alone: [ltx-audio-to-video]
components:
  # Gemma 4 12B tower (`model.*` of the text encoder file): ~12.7 GB at int8, ~23 GB at bf16
  text_encoder:
    files: "text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"
    dtype: stored
    precision: [bf16, int8, int4]
    quantize: ["*.self_attn.q_proj", "*.self_attn.k_proj", "*.self_attn.v_proj", "*.self_attn.o_proj",
               "*.mlp.gate_proj", "*.mlp.up_proj", "*.mlp.down_proj"]
  # the text connector: the two 8-layer stacks inside the transformer file + the text encoder file's projection
  connector:
    files: ["diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors",
            "text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"]
    dtype: stored
  # the 22B audio-video DiT (distilled: the dev model with the distilled LoRA fused in): 19.2 GB at int8
  transformer:
    files: "diffusion_models/ltx-2.5-22b-distilled-transformer-bf16.safetensors"
    dtype: stored
    precision: [bf16, int8, int4]
    quantize: ["transformer_blocks.*"]
  upscaler: {files: "latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors", dtype: stored}
  vae: {files: "vae/ltx-2.5-video-vae-conv-bf16.safetensors", dtype: stored}   # conv decoder + latent statistics
  vae_encoder: {files: "vae/ltx-2.5-video-vae-conv-bf16.safetensors", dtype: stored}   # encodes keyframe images
  audio_vae: {files: "vae/ltx-2.5-audio-vae-bf16.safetensors", dtype: stored}  # its decoder
  vocoder: {files: "vae/ltx-2.5-audio-vae-bf16.safetensors", dtype: fp32}      # BigVGAN + BWE, run in fp32
  audio_encoder: {files: "vae/ltx-2.5-audio-vae-bf16.safetensors", dtype: stored}  # encodes source sound (16 kHz mel)
  # plan 19 phase 4: the DurationHead (auto length, 3.8 MB, read outside the residency manager), a part of the
  # distilled variants only (auto length is text and image to video's), so Dev's shares stay 8
  duration_head: {files: "model_patches/ltx-2.5-duration-head-bf16.safetensors", dtype: stored,
                  variants: [distilled, distilled-fp8]}
  # Recipe Detail's detailing IC-LoRA (Lightricks' Pixel-Spatial-Upscaler, reference_downscale_factor 2): an
  # optional add-on (owner's decision, 23.11), attached by ltx/ic-lora as a run-time adapter of the transformer
  ic_lora:
    files: "loras/ltx-2.5-22b-ic-lora-pixel-spatial-upscaler-x2-1.0.safetensors"
    dtype: stored
    addon:
      title: Detailer
      help: "Recipe: Detail. Lightricks' Pixel-Spatial-Upscaler."
      # dir (model.yaml only, not published): the folder the repo's file lands in, inside the add-on's folder
      source: {repo: Lightricks/LTX-2.5-22b-IC-LoRA-Pixel-Spatial-Upscaler,
               revision: 59f26f1e0c11af42f1affa924b4ef231e9e98b2a,
               allow_patterns: [ltx-2.5-22b-ic-lora-pixel-spatial-upscaler-x2-1.0.safetensors], dir: ltx-2.5/loras,
               licence: ltx-2-community, must_accept: true, gated: true, bytes: 327322640}
# LoRAs: adapter (the default, as upstream's unfused LoRAs: core/loaders_mlx.py activate) or bake (the old MLX code's
# fuse into the transformer). The renames are the old LTXV_LORA_COMFY_RENAMING_MAP as end-of-module-part rewrites;
# kohya files match none: refused. MLX only (runtime: mlx): the torch path (NVIDIA) refuses LoRA rows (no bake into
# FP8 or ConvRot weights, no adapter yet), so the torch runner publishes no lora block and no ltx/lora-stack; the
# renames are MLX's module names.
lora:
  runtime: mlx
  component: transformer
  renames:
    - {from: ".to_out.0", to: ".to_out", at: end}
    - {from: ".audio_ff.net.0.proj", to: ".audio_ff.proj_in", at: end}
    - {from: ".audio_ff.net.2", to: ".audio_ff.proj_out", at: end}
    - {from: ".ff.net.0.proj", to: ".ff.proj_in", at: end}
    - {from: ".ff.net.2", to: ".ff.proj_out", at: end}
    - {from: ".linear_1", to: ".linear1", at: end}
    - {from: ".linear_2", to: ".linear2", at: end}
  ignore: []
  modes: [adapter, bake]
  max_rows: 8
  strength: {min: 0, max: 2, default: 1}
  rows_help: "Each row: a LoRA that fits this model and its strength."
  mode_help: "Adapter: applied at run time, a strength change needs no reload. Bake: merged at load."
  # the distilled transformer is the dev one with this LoRA fused in: a row naming it would apply it twice
  prefused: [{file: loras/ltx-2.5-22b-distilled-lora-450-bf16.safetensors, variant: distilled}]
stages:
  canvas:
    title: Canvas
    help: The video size in pixels, on the 64 px grid of two-stage LTX (stage 1 runs at half of it). About 0.1 to 2.1 MP.
    params:
      width: {type: int, label: Width, default: 704, min: 128, max: 1920, step: 64}
      height: {type: int, label: Height, default: 448, min: 128, max: 1920, step: 64}
    outputs: {canvas: Canvas}
  duration:
    title: Duration
    help: "The clip's length in frames on LTX's 8k + 1 grid, and its frame rate (fps changes the generated motion, not only playback)."
    params:
      frames: {type: frames, label: Length, default: 49, min: 9, max: 321, step: 8, fps: fps,
               auto: {min_s: 1, max_s: 20},
               help: "Auto: the model predicts the length from the prompt, 1 to 20 s (at most 321 frames), reported with the result."}
      fps: {type: int, label: Frame rate, default: 24, min: 1, max: 60, step: 1,
            help: "LTX was trained at 24; values far from it drift."}
    outputs: {duration: Duration}
  encode:
    title: Encode
    component: text encoder
    help: "Encodes the prompt (and its beats, as one prompt) for video and audio with Gemma 4 and the connector, and a negative prompt for NAG; the text encoder is unloaded before sampling."
    uses: [text_encoder, connector]
    unload_after: [text_encoder, connector]   # Gemma never sits beside the DiT (GOTCHAS: watchdog, jetsam)
    inputs: {model: Model, prompt: Text}
    outputs: {cond: Conditioning}
    params:
      beats:
        type: rows
        label: Prompt beats
        default: []
        min: 0
        max: 8
        item:
          text: {type: string, label: Beat, default: "", min: 1, max: 500}
          seconds: {type: float, label: Length, default: 0, min: 0, max: 20, step: 0.1,
                    help: "How long this beat lasts, in seconds; 0 shares what the others leave equally."}
        help: "Prompt Relay: each beat steers the picture and the sound for its stretch of the clip, in order; the prompt above holds for the whole clip."
      # API 1.39: NAG (Normalized Attention Guidance) on the distilled path, upstream's NAGConfig defaults
      negative: {type: text, label: Negative prompt, default: "", min: 0, max: 500,
                 help: "What the clip should not show, applied with NAG (about 10 % slower). Empty: off. Mac only."}
    peak_gb: "5.3"   # measured 4.9 / 5.0 (t2v), 5.1 (i2v): Gemma's int8 load transient and the encode
  keyframes:
    title: Keyframes
    help: "Pins gallery images at chosen times of the clip: at 0 s the clip starts from the image, later ones are frames it passes through. Bypassed: text to video."
    inputs: {cond: Conditioning}
    outputs: {cond: Conditioning}
    params:
      images:
        type: rows
        label: Frames
        default: []
        min: 1
        max: 8
        item:
          image: Image
          seconds: {type: float, label: At, default: 0, min: 0, max: 320, step: 0.1, position: seconds,
                    help: "Where in the clip, in seconds: 0 is the first frame, the clip's length its last."}
          strength: {type: float, label: Strength, default: 1, min: 0, max: 1, step: 0.05,
                     help: "1 holds the frame to the image; lower lets the model drift from it."}
        help: "Each row: an image, where it goes and how strongly it holds."
    # one libx264 round trip of the largest image at a time (host memory, not MLX); not measured: an estimate
    peak_gb: "0.5 + 0.03 * mp_in"
  sample:
    title: Sample
    component: transformer
    help: "Denoises video and audio together. Stage 1 starts from the seed's noise at half size (canvas and duration); stage 2 refines an upscaled latent at full size (latent)."
    uses: [transformer, vae_encoder]   # the VAE encoder turns the keyframe images into latents at this stage's grid
    inputs:
      model: Model
      cond: Conditioning
      seed: Seed
      canvas: {type: Canvas, optional: true}
      duration: {type: Duration, optional: true}
      latent: {type: Latent, optional: true}
      reference: {type: Latent, optional: true}   # the IC reference (stage 1's latent): read when the Model carries an IC-LoRA
    outputs: {latent: Latent}
    params:
      role: {type: enum, label: Stage, default: stage1, enum: [stage1, stage2],
             help: "stage1: half size, ancestral sampler, 8 steps. stage2: full size from latent, renoised at 0.909, 3 steps."}
      # the distilled sigma tables end at 0 only in full: the old --stageN-steps n truncated them (table[:n + 1]),
      # leaving noise in the clip for any other n (docs/reference-notes/ltx.md 11.6)
      steps: {type: int, label: Steps, default: 8, min: 3, max: 8, step: 1,
              help: "Fixed by the stage's distilled schedule: stage 1 runs 8 steps, stage 2 runs 3 (fewer would stop with noise left in).",
              values: [3, 8], values_by: {param: role, values: {stage1: [8], stage2: [3]}}}
      # plan 19 phase 4: DFR's layout (Recipe Detail), Mac only
      detail: {type: bool, label: Detail pass, default: false,
               help: "Stage 1 pads the clip to whole 24 or 32 frame segments with a generated keyframe slot at each boundary; stage 2 refines with them and the IC-LoRA's reference (stage 1's latent), keeps stage 1's sound and trims the padding. Distilled only; Mac only."}
    # video tokens ~ (frames / 8 + 1) * mp * 977 at full size, a quarter in stage 1; each keyframe appends a latent
    # frame of tokens (counted for every image, frame 0 too: an upper bound) and encodes its image at the stage's grid.
    # The fused attention keeps memory linear in tokens (stage 2 grew 0.85 GB for 5x the tokens).
    # measured (448x256x49 / 704x448x97 t2v, 448x256x49 i2v): stage 1 2.61 / 3.54 / 3.51; stage 2 3.33 / 4.18 / 4.20
    # detail (plan 23.7): stage 1 + the padding (at most 31 frames) and one latent frame per slot; stage 2 + the IC
    # reference (a quarter of the stage's tokens at factor 2) and the slots
    peak_gb: "images * (0.7 + 1.5 * mp) + (3.15 + 0.26 * (frames / 8 + 1 + images) * mp + (0.26 * ((frames / 8 + 1) / 4 + frames / 24) * mp if detail else 0) if role == 'stage2' else 2.4 + 0.28 * ((frames + 32 if detail else frames) / 8 + 1 + images + (frames / 24 if detail else 0)) * mp)"
  # plan 19 phase 4: Model -> Model, the IC-LoRA (ic_lora) added to the handle as an adapter use. Both runtimes publish
  # it (so a host without the add-on is never eligible for a run that needs it); the torch path refuses the detail pass
  ic-lora:
    title: IC-LoRA
    help: "Attaches the model's IC-LoRA to the transformer as a run-time adapter; a sampler fed a reference refines against it. Bypassed: the model as it is."
    uses: [ic_lora]
    inputs: {model: Model}
    outputs: {model: Model}
    params:
      strength: {type: float, label: Strength, default: 1, min: 0, max: 2, step: 0.05}
  upscale:
    title: Upscale latent
    component: upscaler
    help: "Doubles the video latent's width and height with the spatial upsampler; the audio latent passes through."
    uses: [upscaler, vae]
    inputs: {model: Model, latent: Latent}
    outputs: {latent: Latent}
    peak_gb: "2.2 + 0.5 * mp * frames / 49"   # measured 2.12 / 1.45 / 2.13 (MLX alone 0.7 / 0.9: the rest is stage 1's freed cache the OS takes back late)
  decode:
    title: Decode
    component: vae
    help: "Decodes video and audio and writes an MP4 (H.264 + AAC 48 kHz stereo) with a poster frame; a clip made from source audio carries that audio, trimmed to the clip."
    uses: [vae, audio_vae, vocoder]
    inputs: {model: Model, latent: Latent}
    outputs: {video: Video}
    params:
      audio: {type: bool, label: Audio, default: true,
              help: "Off: an MP4 without a sound track. The picture is the same: the model always generates both."}
    # the full-resolution 128-channel stages dominate (bf16 128 x frames x H x W is 7.8 GB at 704x448x97); the vendored
    # temporal tiling looks only at block 3 (8 GB budget) and does not start below about 2 MP x 321 frames, so the
    # decode grows linearly past that: measured 10.6 / 23.4 / 10.6 (audio decode 4.4 / 5.1 before it)
    peak_gb: "7.7 + 25.2 * mp * frames / 49"
  # --- M7 pack 1: retake, extend and audio to video (docs/reference-notes/ltx.md 12; contracts README, Media inputs).
  # The dev transformer with guidance: 4 sequential passes per step (cond, negative prompt, STG, modality), so memory is
  # one pass's; time grows with the WHOLE clip's tokens. Measured: GOTCHAS.md, M7 pack 1.
  encode-guided:
    title: Encode (guided)
    component: text encoder
    help: "Encodes the prompt and, for Dev's guided samplers, the negative prompt (typed, else the fixed one) for video and audio with Gemma 4 and the connector (Distilled: the prompt only); the text encoder is unloaded before sampling."
    uses: [text_encoder, connector]
    unload_after: [text_encoder, connector]
    by_variant: true   # Dev and Distilled share Gemma and the connector; only Dev's Conditioning holds the negative
    inputs: {model: Model, prompt: Text}
    outputs: {cond: Conditioning}
    params:
      # API 1.39 (owner's decision 9): a typed negative for Dev's CFG; a distilled model ignores it
      negative: {type: text, label: Negative prompt, default: "", min: 0, max: 500,
                 when: "model.variant == 'dev' || model.variant == 'dev-int8'",
                 help: "What the clip should not show, for Dev's guidance (CFG). Empty: the fixed negative prompt. Distilled ignores this."}
    peak_gb: "5.3"
  encode-video:
    title: Source video
    component: vae encoder
    help: "Encodes a gallery video and its sound with the video and audio VAEs, at its own size and frame rate; its length is floored to 8k + 1 frames."
    uses: [vae_encoder, audio_encoder]
    inputs: {model: Model}
    outputs: {latent: Latent}
    params:
      source: {type: media, label: Source video, default: null, accepts: [video], grid: 32, max_frames: 321,
               help: "A video whose sides are multiples of 32, at most 321 frames."}
    # the conv VAE encodes every frame at once (as the old studio): measured 8.7 over its components at 448x256x49
    # (the old studio 6.9); linear in pixels x frames from that one size
    peak_gb: "1.0 + 68 * mp * frames / 49"
  encode-audio:
    title: Source audio
    component: audio encoder
    help: "Encodes a stretch of a gallery audio take (or a video's sound) at 16 kHz stereo; the clip lasts as long as that stretch, floored to 8k + 1 frames (at most 321)."
    uses: [audio_encoder]
    inputs: {model: Model}
    outputs: {latent: Latent, duration: Duration}
    params:
      source: {type: media, label: Audio, default: null, accepts: [audio], trim: true, max_s: 13.375,
               help: "An audio take, or a video with sound; in and out pick the part the clip follows (at most 13.375 s: 321 frames at 24 fps)."}
      fps: {type: int, label: Frame rate, default: 24, min: 1, max: 60, step: 1, values: [24],
            help: Audio to video runs at 24 fps.}
    peak_gb: "0.5 + 0.1 * frames / 49"
  retake:
    title: Retake
    component: transformer
    help: "Regenerates a stretch of the source clip (and, unless kept, its sound): Dev with guidance, Distilled in its 8 steps without; the rest of the clip is kept as context. The result is the whole clip."
    uses: [transformer]
    inputs: {model: Model, cond: Conditioning, seed: Seed, latent: Latent}
    outputs: {latent: Latent}
    params:
      span: {type: span, label: Retake, default: null, help: "The stretch to regenerate, snapped to LTX's 8-frame latent grid."}
      audio: {type: bool, label: Regenerate audio, default: true,
              help: "Off: the sound is not regenerated (it is re-encoded through the audio VAE)."}
      # Dev only (Qwen Turbo's pattern): a distilled model runs its own 8 steps without guidance and ignores these
      steps: &steps {type: int, label: Steps, default: 30, min: 1, max: 60, step: 1,
                     when: "model.variant == 'dev' || model.variant == 'dev-int8'",
                     help: "Euler steps of the guided loop; each runs the model four times over the whole clip. Distilled runs its own 8 steps and ignores this."}
      cfg: &cfg {type: float, label: CFG, default: 3, min: 1, max: 10, step: 0.1,
                 when: "model.variant == 'dev' || model.variant == 'dev-int8'",
                 help: "How strongly the prompt is followed against the fixed negative prompt. Distilled ignores this."}
      stg: &stg {type: float, label: STG, default: 1, min: 0, max: 3, step: 0.1,
                 when: "model.variant == 'dev' || model.variant == 'dev-int8'",
                 help: "Spatio-temporal guidance (block 28 skipped); 0 turns it off. Distilled ignores this."}
    # one pass at a time over the whole clip's tokens (frames / 8 + 1) * mp * 977
    peak_gb: "1.2 + 0.7 * (frames / 8 + 1) * mp"
  extend:
    title: Extend
    component: transformer
    help: "Generates new frames (and sound) after or before the source clip. Dev: guided, with the whole clip as context. Distilled: after only, two stages over the clip's last 25 frames and the new part (sides on a 64 px grid). The result is the whole extended clip."
    uses: [transformer, vae_encoder, upscaler, vae]   # Distilled: the tail re-encoded at half size, stage 2 at x2
    inputs: {model: Model, cond: Conditioning, seed: Seed, latent: Latent}
    outputs: {latent: Latent}
    params:
      seconds: {type: float, label: Add, default: 2, min: 0.1, max: 10, step: 0.1,
                help: "Seconds to add, rounded up to whole 8-frame steps."}
      # API 1.39 (a cross-node values_by): a distilled extend continues the clip's tail, so only after
      direction: {type: enum, label: Where, default: after, enum: [after, before],
                  values_by: {param: model.variant,
                              values: {distilled: [after], dev: [after, before], distilled-fp8: [after], dev-int8: [after, before]}}}
      steps: *steps
      cfg: *cfg
      stg: *stg
    # Distilled: the half-size re-encode of the tail (a quarter of encode-video's) before the window's two stages
    peak_gb: "max(1.2 + 0.7 * ((frames + seconds * fps) / 8 + 2) * mp, 1.3 + 17 * mp * frames / 49)"
  sample-guided:
    title: Sample (guided)
    component: transformer
    help: "Stage 1 of audio to video: denoises the video at half size (Dev with guidance, Distilled in its 8 steps) while the source audio stays fixed and steers it."
    uses: [transformer, vae_encoder]   # the VAE encoder turns optional keyframe images into latents
    # stage 2 runs a baked copy (ltx/distill: its own residency entry): one transformer at a time, as the old code
    unload_after: [transformer]
    inputs: {model: Model, cond: Conditioning, seed: Seed, canvas: Canvas, duration: Duration, audio: Latent}
    outputs: {latent: Latent}
    params:
      steps: *steps
      cfg: *cfg
      stg: *stg
      # plan 19 phase 4b: DFR on audio to video, the frozen source audio zero-padded to the canvas (a2vid_dfr)
      # no `when`: a Recipe choice sets it on Dev too, which the run check refuses (board LtxFeatures frame 9)
      detail: {type: bool, label: Detail pass, default: false,
               help: "As text to video's: the padded canvas with keyframe slots, the source audio padded with silence. Distilled only; Mac only."}
    peak_gb: "images * (0.7 + 1.5 * mp) + 1.2 + 0.7 * ((frames + 32 if detail else frames) / 8 + 1 + images + (frames / 24 if detail else 0)) * mp / 4"
  distill:
    title: Distilled LoRA
    help: "Fuses the distilled LoRA into the dev transformer at strength 1, so a stage-2 sampler can refine with the distilled schedule. Distilled has it fused in: passed through."
    inputs: {model: Model}
    outputs: {model: Model}
