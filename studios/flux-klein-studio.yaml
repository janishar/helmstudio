# A registry entry: a pointer at flux klein studio's repository
# (schema/registry-entry.json, docs/design/05-sdk-and-custom-studios.md §5a).
#
# The manifest belongs in the studio's own repository as helmstudio.yaml, beside
# the code it describes, and flux klein studio ships one. This copy is not dead
# weight for that: resolution reaches nothing over the network (M7 Q7), so before
# a studio is fetched this is the only manifest there is, and an entry without one
# shows on the shelf as `not_fetched` — no description, no hue, no checkpoint to
# choose. So the copy stays, and the thing that matters about it is that it
# agrees with the repository.
#
# Where the inline manifest sets id, repo or ref, each must equal this entry's;
# the validator enforces it. There is no `certified` field: a level is derived
# from what has actually been checked, never declared by the thing being
# checked (docs/decisions.md M7 Q4, Q15).

id: flux-klein-studio
repo: https://github.com/janishar/flux-3-klein-studio
ref: main
manifest:
  id: flux-klein-studio
  name: flux klein studio
  description: FLUX 3 Image Klein, distilled in 16 steps or Base in 50, for text-to-image and multi-image editing on PyTorch (mps), with its upsampler.
  kinds: [image]
  # Green, at least 30° from helmstudio's accent and every other studio's hue (Qwen is teal, AuK is violet).
  hue: { dark: "#8fcf4f", light: "#4f8a1f" }
  # MIT is for this code. The Klein weights carry their own licence, which their repos gate on.
  license: MIT
  repo: https://github.com/janishar/flux-3-klein-studio
  ref: main
  python: { version: "3.12" }
  # An estimate, not measured: ~19 GB of weights (transformer 10, text encoder 8.3, VAE 0.3)
  # plus activations. The 19 GB upsampler is freed before the image model loads.
  peak_ram_gb: 32
  requires:
    os: [darwin]
    arch: [arm64]
    tools: [uv]
    ram_gb: 48 # an estimate too, not measured
  runtime:
    framework: pytorch
    backends: [mps, cuda, cpu]
    precision: [bf16]
    language: python
  # Sessions keep their settings and reference images (kv for the page's paths);
  # references and takes are assets; takes with their settings are gallery items;
  # renders with their logs are jobs. There is no timeline: this studio makes stills.
  capabilities: [kv, assets, gallery, jobs]
  sdk: { runtime: "^1", ui: "^1", css: "^1" }
  # github.com because uv.lock pins diffusers to its git main, for the Flux3 modular pipelines.
  network: [huggingface.co, cdn-lfs.huggingface.co, github.com]
  build:
    # --locked: install exactly uv.lock, and fail rather than rewrite it.
    - name: Sync dependencies
      run: uv sync --locked
  # The Klein repos are gated: accept the licence on Hugging Face, and helmstudio asks for a token.
  weights:
    - name: klein
      repo: black-forest-labs/flux-3-image-klein
      dest: flux-3-image-klein
      size_gb: 21
      files: ["transformer/**", "text_encoder/**", "vae/**"]
    # The 50-step checkpoint, chosen per render in the page. Optional, so it is not in
    # the command (an unfetched optional weight refuses any command naming it): the studio looks
    # for it beside klein, at flux-3-image-klein-base, or wherever Paths points.
    - name: base
      repo: black-forest-labs/flux-3-image-klein-base
      dest: flux-3-image-klein-base
      size_gb: 21
      files: ["transformer/**", "text_encoder/**", "vae/**"]
      optional: true
    - name: pup
      repo: black-forest-labs/flux-3-image-klein-pup
      dest: flux-3-image-klein-pup
      size_gb: 19
  processes:
    - name: studio
      role: main
      heavy: true
      cwd: web
      # Not `uv run`, which would sync the environment at every launch.
      cmd: "python server.py --host 127.0.0.1 --port {port} --model {models.klein} --pup {models.pup}"
      port: { prefer: 8740 }
      health: { tcp: true, timeout_s: 30, interval_s: 2 }
      busy: { path: /api/queue }
      ui: /
