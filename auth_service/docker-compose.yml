# Isolated dev: auth_service + its own Postgres and NATS (the full stack is deploy/docker-compose.yml).
name: ora-auth-dev
services:
  auth:
    build: {context: ., additional_contexts: {orago: ../orago}}
    env_file: .env
    environment:
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_USER: ""
    volumes: ["./keys:/app/keys"]
    ports: ["127.0.0.1:8093:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
  postgres:
    image: postgres:18.6-alpine3.24
    environment: {POSTGRES_USER: auth, POSTGRES_PASSWORD: auth, POSTGRES_DB: auth}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "auth"], interval: 2s, retries: 20}
  nats:
    image: nats:2.15.2-alpine3.22
