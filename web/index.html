<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>helmstudio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- The theme before first paint, so a dark launcher never flashes light.
     The stored setting arrives with the first request; until then the OS
     preference applies, which is what `system` means anyway. -->
<link rel="stylesheet" href="/sdk/v1/helm.css">
<link rel="stylesheet" href="launcher.css">
<script type="module" src="/sdk/v1/helm-ui.js"></script>
<script type="module">
  import { start } from "./app.js";
  start();
</script>
</head>
<body class="helm-body">
<div class="helm-app" id="app">
  <p class="helm-micro" style="padding: var(--helm-space-4)">Loading…</p>
</div>
</body>
</html>
