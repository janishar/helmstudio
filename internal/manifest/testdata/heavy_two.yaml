id: fixture-heavy-two
name: fixture studio
kinds: [image]
requires: { os: [darwin], arch: [arm64] }
runtime: { framework: native-kernel, backends: [metal] }
repo: https://example.com/fixture
processes:
  - name: studio
    role: main
    heavy: true
    cmd: "./bin/studio --port {port}"
  - name: worker
    role: worker
    heavy: true
    cmd: "./bin/worker"
