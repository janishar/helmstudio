id: fixture-selected-no-selectable
name: fixture studio
kinds: [image]
requires: { os: [darwin], arch: [arm64] }
runtime: { framework: native-kernel, backends: [metal] }
repo: https://example.com/fixture
weights:
  - { name: w1, repo: org/repo, dest: w1 }
processes:
  - name: studio
    role: main
    cmd: "./bin/studio --model {models.selected} --port {port}"
