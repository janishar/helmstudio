openapi: 3.1.0
info:
  title: ORA Catalog Agent — public API
  version: 3.3.0
  description: |
    Public HTTP contract of ORA Catalog Agent (the paths behind Kong): `/v1/catalog/*` is served by
    catalog_service, `/files/*` by files_service, `/auth/*` by auth_service. contract_tests/ checks them against this
    file. Design: docs/ARCHITECTURE.md; feature spec: docs/reference/.

    Conventions:
    - Every `/v1` call needs the client's `x-api-key` (Kong) and the user's `Authorization: Bearer <access token>`.
    - Errors are `{"detail": string}` (`Error`), 422 included; Kong's own errors are `{message}` (`GatewayError`).
    - Ids are UUIDs unless named otherwise (library ids such as pose, model and background ids are short strings
      published by agents_service). A malformed id in a path is treated as unknown: 404, never 422. Another
      user's id is a 404 too.
    - `*_url` fields are signed, time-limited links (`/files/{path}?exp=&sig=`). Clients treat them as opaque.
      Library pictures (`image_url`, `example_url`) are static web paths served by web_service (`/catalog/...`).
    - Every mutating call returns the updated slice (session, SKUs, images…) so the chat renders without a refetch.
    - Long work (processing, runs, regenerations) answers 202 and is followed through
      `GET /v1/catalog/sessions/{session_id}/events`.
    - 409 means the session's state forbids the call: a blocking question is open, processing or a run is in
      progress, the session is not started yet, or nothing is left to do.
    - Steps of the Input flow (keys of `Inputs`): `raw` (required), `guidelines`, `output` (resolution & ratio), `poses`,
      `models`, `backgrounds`, `details` (additional details / instructions). The spec's pose "subcategory" step
      (Rings → Necklaces → Anklets) is a `category` here (a product, e.g. Ring or Sofa, inside a `family`: jewellery,
      furniture, garments); `subcategory` is the finer group inside one.
    - Credits are a quote (`credits_quoted`, registry prices); nothing is charged (there is no credit ledger).
    - `/auth/*` (tag `auth`) is served by auth_service and marked `x-status: built`; operations marked
      `x-status: deferred` are specified but not implemented. Its internal `GET /verify/apikey` (Kong plugin only)
      and the NATS request/reply `auth.validate.*` are documented in contracts/README.md, not here.
servers:
  - url: http://localhost:8100
security:
  - {ApiKey: [], BearerJWT: []}
tags:
  - {name: catalog, description: 'Catalog Agent: session, inputs, processing, SKUs, runs, review, download'}
  - {name: files, description: signed file downloads}
  - name: auth
    description: 'auth_service: users, sessions (JWT access + rotating refresh tokens), roles, client API keys'

paths:
  # ------------------------------------------------------------------ catalog: session
  /v1/catalog/sessions:
    post:
      tags: [catalog]
      operationId: catalogCreateSession
      summary: A new, empty session (stage setup, flow at raw)
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionCreate'}}}
      responses:
        '201': {description: the session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    get:
      tags: [catalog]
      operationId: catalogListSessions
      summary: The caller's sessions, newest first (at most 100, not paginated)
      responses:
        '200': {description: sessions, content: {application/json: {schema: {$ref: '#/components/schemas/SessionList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/catalog/sessions/{session_id}:
    get:
      tags: [catalog]
      operationId: catalogGetSession
      summary: Session with its SKUs, questions, runs and images (the server copy wins over the browser's)
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {description: the session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [catalog]
      operationId: catalogPatchSession
      summary: Save step inputs, flow position, chat messages or the project name
      description: |
        Only the fields sent change; inside `inputs` only the steps sent change, and a step's `items` replaces that
        step's list (send the whole list: × on an item is a PATCH without it). `upload_id`s must be this session's
        uploads or the caller's own from another session (an item reused from memory): those are copied into this
        session under new ids, which the answer shows (422 for any other id). While stage is `setup` and SKUs exist, a
        change to guidelines, output, poses, models, backgrounds or details re-runs the processing checks (`cmd.catalog.process` with no new raw sources);
        `session.processing` shows it. `raw` items can only be removed here (they are added by `POST .../raw`).
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionPatch'}}}
      responses:
        '200': {description: the updated session, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogSession'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/refresh:
    post:
      tags: [catalog]
      operationId: catalogRefreshSession
      summary: Clear Input for the next batch; SKUs, runs, images and memory stay
      description: Inputs are emptied, flow_position goes back to `raw`, stage stays `ready` when it was. 409 while processing or a run is in progress.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {description: the session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/catalog/sessions/{session_id}/reset:
    post:
      tags: [catalog]
      operationId: catalogResetSession
      summary: Start over — clear inputs, messages, SKUs, questions, runs and images; memory stays
      description: Stage goes back to `setup`, flow_position to `raw`. The session's uploads go too, except those memory's items name (so they can still be reused). 409 while processing or a run is in progress.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {description: the session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ------------------------------------------------------------------ catalog: memory, library, favorites, estimate
  /v1/catalog/memory:
    get:
      tags: [catalog]
      operationId: catalogGetMemory
      summary: Last-used value per step (saved by Start processing), with the project it came from
      description: Steps never started have no entry. Raw images are never in memory.
      responses:
        '200': {description: memory, content: {application/json: {schema: {$ref: '#/components/schemas/Memory'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/catalog/stats:
    get:
      tags: [catalog]
      operationId: catalogGetStats
      summary: The caller's totals for the account page (sessions, SKUs, approved images, credits quoted)
      responses:
        '200': {description: totals, content: {application/json: {schema: {$ref: '#/components/schemas/Stats'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/catalog/metrics:
    get:
      tags: [catalog]
      operationId: catalogGetMetrics
      summary: The caller's render quality by product for the account page (first-try pass rate, tries, cost per approved image)
      description: Computed from the caller's images that finished rendering, grouped by the product their SKU was when they rendered. Another user's session id gives an empty list.
      parameters:
        - {name: session_id, in: query, required: false, schema: {type: string, format: uuid}, description: only this session's images}
      responses:
        '200': {description: metrics by product, content: {application/json: {schema: {$ref: '#/components/schemas/Metrics'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/jobs:
    get:
      tags: [catalog]
      operationId: catalogListJobs
      summary: The caller's newest 100 jobs (processing jobs and runs), newest first, for the dev Jobs view
      description: Only the caller's own jobs, whatever their role.
      responses:
        '200': {description: the jobs, content: {application/json: {schema: {$ref: '#/components/schemas/JobList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/catalog/jobs/{job_id}:
    get:
      tags: [catalog]
      operationId: catalogGetJob
      summary: One of the caller's jobs and every event it produced, oldest first (its steps, logs, images, progress)
      parameters:
        - {name: job_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: the job, content: {application/json: {schema: {$ref: '#/components/schemas/JobDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/catalog/library:
    get:
      tags: [catalog]
      operationId: catalogGetLibrary
      summary: Categories, poses, built-in models and backgrounds, resolutions, ratios, credits and the caller's favorites
      description: The registry slice agents_service publishes (registry keys `catalog_library`, `catalog_prices`) plus the caller's favorites. 503 until agents_service has published it.
      responses:
        '200': {description: the library, content: {application/json: {schema: {$ref: '#/components/schemas/Library'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/catalog/favorites/{kind}/{item_id}:
    put:
      tags: [catalog]
      operationId: catalogAddFavorite
      summary: Mark a library item as a favorite (idempotent)
      parameters: [{$ref: '#/components/parameters/FavoriteKind'}, {$ref: '#/components/parameters/LibraryItemId'}]
      responses:
        '200': {description: the caller's favorites, content: {application/json: {schema: {$ref: '#/components/schemas/Favorites'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404':
          $ref: '#/components/responses/NotFound'
          description: unknown kind, or no such item in the library
    delete:
      tags: [catalog]
      operationId: catalogRemoveFavorite
      summary: Unmark a favorite (idempotent)
      parameters: [{$ref: '#/components/parameters/FavoriteKind'}, {$ref: '#/components/parameters/LibraryItemId'}]
      responses:
        '200': {description: the caller's favorites, content: {application/json: {schema: {$ref: '#/components/schemas/Favorites'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404':
          $ref: '#/components/responses/NotFound'
          description: unknown kind

  /v1/catalog/estimate:
    get:
      tags: [catalog]
      operationId: catalogGetEstimate
      summary: Credits for n images at a resolution (registry prices)
      parameters:
        - {name: images, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 10000}}
        - {name: resolution, in: query, required: false, schema: {type: string, default: 2K}, description: a library resolution id}
      responses:
        '200': {description: the quote, content: {application/json: {schema: {$ref: '#/components/schemas/Estimate'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  # ------------------------------------------------------------------ catalog: inputs
  /v1/catalog/sessions/{session_id}/raw:
    post:
      tags: [catalog]
      operationId: catalogAddRaw
      summary: Add raw images (files, CSV, Drive folder or website link) and start processing
      description: |
        `multipart/form-data`: `files` (JPEG, PNG or WEBP, at most 25 MiB each, at most 500 per call) stored under
        `u/<owner>/catalog/<session>/raw/`, or one CSV/TSV/TXT `files` part with `kind=csv`. JSON: `{kind: drive|website,
        url}` or `{kind: csv, csv_text}`. A CSV needs the columns SKU, name, category, image_url (header row, any
        order, case-insensitive); its rows give `expected_skus`; a category that matches a product (id or name, e.g.
        `rings`, `Sofa`) picks that product. Optional `families` ("What are we shooting?") limits the products these
        images are sorted into. Adds one `raw` input item and enqueues `cmd.catalog.process` with the new source and
        `families`; 409 while a previous processing job of this session is still
        running, or once the session is started (stage `ready`: use Refresh first).
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/RawUpload'}
            encoding:
              files: {contentType: 'image/jpeg, image/png, image/webp, text/csv, text/tab-separated-values, text/plain'}
          application/json:
            schema: {$ref: '#/components/schemas/RawLink'}
      responses:
        '202': {description: stored; processing queued, content: {application/json: {schema: {$ref: '#/components/schemas/RawAccepted'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '411': {$ref: '#/components/responses/LengthRequired'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/guidelines:
    post:
      tags: [catalog]
      operationId: catalogAddGuideline
      summary: Add a guideline or project-brief document or link
      description: |
        `multipart/form-data` with one `file` (pdf, txt, csv, md, docx are read; doc, ppt, pptx, key, xls, xlsx are
        stored and flagged unreadable in `item.detail`; at most 25 MiB), or JSON `{url}`. `target: guidelines`
        (default) adds a `guidelines` item, `target: details` a `details` item (project brief). When the session
        has SKUs and stage is `setup`, processing re-reads the documents and re-runs the checks.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/GuidelineUpload'}
          application/json:
            schema: {$ref: '#/components/schemas/GuidelineLink'}
      responses:
        '201': {description: stored, content: {application/json: {schema: {$ref: '#/components/schemas/InputAdded'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '411': {$ref: '#/components/responses/LengthRequired'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/uploads:
    post:
      tags: [catalog]
      operationId: catalogUpload
      summary: Upload the brand's own model, background or pose reference photo into the session
      description: |
        One `file` (JPEG, PNG or WEBP, at most 25 MiB). The returned `upload.id` is used as a model or background id
        in input items and briefs, or in `upload_ids` of a pose brief. It is not added to any input by itself.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/PhotoUpload'}
            encoding:
              file: {contentType: 'image/jpeg, image/png, image/webp'}
      responses:
        '201': {description: stored, content: {application/json: {schema: {$ref: '#/components/schemas/Upload'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '411': {$ref: '#/components/responses/LengthRequired'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/poses/suggest:
    post:
      tags: [catalog]
      operationId: catalogSuggestPoses
      summary: Turn a brief, links or reference photos per category into suggested pose ids (LLM, req.catalog.poses.suggest)
      description: Nothing is saved; the client puts the answer into the `poses` input (poses, custom_poses, and refs as pose_refs). 503 (retryable) when agents_service does not answer in time.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PoseSuggestRequest'}}}
      responses:
        '200': {description: suggestions, content: {application/json: {schema: {$ref: '#/components/schemas/PoseSuggestion'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  # ------------------------------------------------------------------ catalog: processing
  /v1/catalog/sessions/{session_id}/events:
    get:
      tags: [catalog]
      operationId: catalogSessionEvents
      summary: Session events after a cursor — JSON polling, or server-sent events with `Accept text/event-stream`
      description: |
        Every `evt.catalog.<session_id>.*` message the projector stored, oldest first, each numbered by a per-session
        `seq`. JSON: the events with `seq > since` (at most 500) and `last_seq`. SSE: replays `seq > since` (or
        `Last-Event-ID`), then streams live ones; `id:` = seq, `event:` = the event's `type`, `data:` = the
        `SessionEvent` JSON; `: keep-alive` comments every 15 s. The stream does not end by itself.
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {name: since, in: query, schema: {type: integer, minimum: 0, default: 0}, description: cursor — the last seq the client has}
      responses:
        '200':
          description: events
          content:
            application/json: {schema: {$ref: '#/components/schemas/EventPage'}}
            text/event-stream: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/questions/{question_id}/answer:
    post:
      tags: [catalog]
      operationId: catalogAnswerQuestion
      summary: Answer a processing question with one of its two options
      description: Applies the option's SKU changes (published by agents with the question) and records the answer. 409 when it is already answered.
      parameters: [{$ref: '#/components/parameters/QuestionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AnswerRequest'}}}
      responses:
        '200': {description: the answered question and the SKUs it changed, content: {application/json: {schema: {$ref: '#/components/schemas/Answered'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/start:
    post:
      tags: [catalog]
      operationId: catalogStart
      summary: Start processing — resolve every SKU's brief, save memory, move the session to stage ready
      description: |
        Fills each SKU's model, background, poses, resolution and ratio from the inputs, else the defaults (registry
        category defaults, 2K · 1:1); randomized models/backgrounds are spread across SKUs; a models or backgrounds
        step `text` goes on every SKU as its description, and with no pick the SKU's model or background stays null
        (described only). Saves the
        guidelines, output, poses, models, backgrounds and details inputs as the caller's memory under the session's
        project name. 409 when there are no SKUs, processing is running or a blocking question is open. Calling it
        again on a ready session re-resolves the briefs of SKUs not run yet.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {description: the started session, content: {application/json: {schema: {$ref: '#/components/schemas/Started'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ------------------------------------------------------------------ catalog: generation
  /v1/catalog/sessions/{session_id}/next-step:
    get:
      tags: [catalog]
      operationId: catalogNextStep
      summary: The Next step card (spec "Next step rules"), worked out from SKU statuses and group keys
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {description: the card, content: {application/json: {schema: {$ref: '#/components/schemas/NextStep'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/catalog/sessions/{session_id}/runs:
    post:
      tags: [catalog]
      operationId: catalogCreateRun
      summary: Run a SKU set — a sample, the next batch, all of a category, or chosen SKUs
      description: |
        `sample`: the first `Not run` SKU of `category`. `batch`: the `Not run` SKUs of `category` with `group_key`.
        `all`: every `Not run` SKU of `category` (or of the session when `category` is absent). `skus`: exactly
        `sku_ids` (reruns allowed). Creates one `generating` image per SKU × brief pose (`missing_only`: only poses
        with no live image) and enqueues `cmd.catalog.run`. 409 when the session is not started, any chosen SKU is
        Queued or Running, or nothing is left to run there.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}
      responses:
        '202': {description: queued, content: {application/json: {schema: {$ref: '#/components/schemas/RunAccepted'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/runs/{run_id}/stop:
    post:
      tags: [catalog]
      operationId: catalogStopRun
      summary: Stop a queued or running run
      description: |
        The run becomes `failed` with error `Stopped` and its still-`generating` images are deleted (they have no
        picture yet), so each SKU shows what it showed before the run; images the run already finished stay. A
        `status` event (failed, `Stopped`) follows on the session's events, and agents_service is told to stop the job
        (`agents.cancel`). A render already sent to the image provider still finishes there (and is billed by it);
        its result is discarded. 404 for an unknown run or one of another session; 409 when it already ended.
      parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: stopped, content: {application/json: {schema: {$ref: '#/components/schemas/RunStopped'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/catalog/sessions/{session_id}/images/stop:
    post:
      tags: [catalog]
      operationId: catalogStopImages
      summary: Stop chosen generating images (one tile, or a SKU's); the rest of their runs keep going
      description: |
        Each chosen image still `generating` in a queued or running run is deleted (its SKU and shot fall back to the
        previous revision, or Not run), and agents_service is told to skip it in that job (`agents.cancel.image`);
        chosen images already finished are left alone. A run left with nothing generating is stopped whole, as
        `POST .../runs/{run_id}/stop` does (`failed`, `Stopped`). A render already sent to the image provider still
        finishes there (and is billed); its result is discarded. 404 when an id is not in this session; 409 when none of
        them is generating.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ImagesStop'}}}
      responses:
        '200': {description: stopped, content: {application/json: {schema: {$ref: '#/components/schemas/ImagesStopped'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/regenerate:
    post:
      tags: [catalog]
      operationId: catalogRegenerate
      summary: Regenerate only the chosen images with the feedback; old versions stay as earlier revisions
      description: |
        Each image gets a new revision (`generating`) of the same SKU and shot; the old one keeps its status (an
        approved one stays approved until the new one is approved). Enqueues `cmd.catalog.run` with scope
        `regenerate`. 404 when an id is unknown or not in this session, 409 when one is still generating.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RegenerateRequest'}}}
      responses:
        '202': {description: queued, content: {application/json: {schema: {$ref: '#/components/schemas/RunAccepted'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/images/{image_id}:
    patch:
      tags: [catalog]
      operationId: catalogReviewImage
      summary: Approve or reject one image
      description: 409 when the image is not `to_review`, `approved` or `rejected` (generating or failed).
      parameters: [{$ref: '#/components/parameters/ImageId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ImageReview'}}}
      responses:
        '200': {description: the image and its SKU, content: {application/json: {schema: {$ref: '#/components/schemas/Reviewed'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/images/{image_id}/pick:
    post:
      tags: [catalog]
      operationId: catalogPickImageTry
      summary: Keep another render try of an image as the image (the brand overrides the reviewer's best)
      description: |
        The try becomes the image: its url and review are that try's, it is `best` and `picked` (chosen by the brand) in
        `attempts`; the status stays as it is (an approved image stays approved: the brand chose this try). Any revision
        with tries. 409 while the image is generating or failed; 422 for an attempt the image does not have.
      parameters: [{$ref: '#/components/parameters/ImageId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ImagePick'}}}
      responses:
        '200': {description: the image and its SKU, content: {application/json: {schema: {$ref: '#/components/schemas/Reviewed'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/approve:
    post:
      tags: [catalog]
      operationId: catalogApproveMany
      summary: Approve every `to_review` image among the chosen images, SKUs or category
      description: Exactly one of `image_ids`, `sku_ids`, `category`. Approving nothing is not an error (`approved` 0).
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApproveRequest'}}}
      responses:
        '200': {description: what changed, content: {application/json: {schema: {$ref: '#/components/schemas/Approved'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/skus/{sku_id}:
    patch:
      tags: [catalog]
      operationId: catalogPatchSku
      summary: Override a SKU's product, model, background or poses (edit drawer, pose editor), or confirm its attributes
      description: |
        Brief fields sent replace the SKU's; `apply_to_category` applies the same fields to every SKU of its
        category that is not Approved. `category` moves the SKU (with `apply_to_category`: every SKU of its product)
        to another product: poses, prompt and review goals follow the new product, the code is kept, images already
        run stay; for a product without a model (`uses_model` false) the brief model becomes null. Applies to images
        run from now on (use `POST .../runs` scope `skus` for Save & rerun). 422 for an unknown category, model,
        background or pose id, a pose of another product, or a model for a product that does not use one.
      parameters: [{$ref: '#/components/parameters/SkuId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SkuPatch'}}}
      responses:
        '200': {description: the SKUs that changed, content: {application/json: {schema: {$ref: '#/components/schemas/SkuList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/requests:
    post:
      tags: [catalog]
      operationId: catalogTypedRequest
      summary: A typed request in Processing — interpreted (req.catalog.interpret) into one action, carried out, with a reply
      description: |
        Runs, approvals, pose changes, downloads and feedback go through the same rules as their own endpoints
        (credits quoted, 409 conditions become a `reply` with `action: reply` instead of an error). Text the
        interpreter cannot map is `not_understood` and never spends credits. 409 only when the session is not
        started; 503 (retryable) when agents_service does not answer in time.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TypedRequest'}}}
      responses:
        '200': {description: what was done, content: {application/json: {schema: {$ref: '#/components/schemas/TypedResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /v1/catalog/sessions/{session_id}/download:
    post:
      tags: [catalog]
      operationId: catalogDownload
      summary: Zip the approved images (`<SKU code>/<shot>.<ext>` + `catalog.csv`) and return a signed link
      description: The newest approved revision of each SKU × shot. Deleted after a day. 409 when nothing is approved.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {description: the zip, content: {application/json: {schema: {$ref: '#/components/schemas/Download'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ------------------------------------------------------------------ files
  /files/{path}:
    get:
      tags: [files]
      operationId: getFile
      summary: A signed file (the signature is the auth; no API key)
      description: |
        Only reachable through a `*_url` the API returned. Served with `Content-Security-Policy: sandbox` and
        `X-Content-Type-Options: nosniff`. Replaced by presigned object-store URLs in later phases.
      security: []
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}, description: storage-relative path (may contain slashes)}
        - {name: exp, in: query, required: false, schema: {type: integer}, description: 'expiry, unix seconds (missing = 403, not 422)'}
        - {name: sig, in: query, required: false, schema: {type: string}, description: 'HMAC signature of path and exp (missing = 403, not 422)'}
      responses:
        '200':
          description: the file
          headers:
            Content-Security-Policy: {schema: {type: string, const: sandbox}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
          content: {application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}}
        '403':
          $ref: '#/components/responses/Forbidden'
          description: bad or missing signature, expired link, a path that escapes the store, or no such file (never 404)
        '400':
          $ref: '#/components/responses/GatewayBadPath'

  # ------------------------------------------------------------------ auth_service (built: auth_service/api/*)
  # Kong routes /auth/* to auth_service; its plugin checks x-api-key on every route except the JWKS. Routes with
  # BearerJWT answer 401 for a missing/invalid/revoked access token; /auth/admin/* also 403 without the admin role.
  # Sign-up is closed for the beta: the admin creates every account (POST /auth/admin/users). auth_service keeps the
  # handler with its route commented out, so /auth/signup is a 404; uncomment both to reopen it.
  # /auth/signup:
  #   post:
  #     tags: [auth]
  #     x-status: built
  #     operationId: authSignup
  #     security: [{ApiKey: []}]
  #     requestBody:
  #       required: true
  #       content: {application/json: {schema: {$ref: '#/components/schemas/SignupRequest'}}}
  #     responses:
  #       '429': {$ref: '#/components/responses/GatewayRateLimited'}
  #       '201': {description: 'user (role user) and a new session', content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
  #       '401': {$ref: '#/components/responses/Unauthorized'}
  #       '409': {$ref: '#/components/responses/EmailTaken'}
  #       '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/signin:
    post:
      tags: [auth]
      x-status: built
      operationId: authSignin
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SigninRequest'}}}
      responses:
        '200': {description: a new session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/InvalidLogin'}
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
        '429': {$ref: '#/components/responses/SigninLimited'}
  /auth/refresh:
    post:
      tags: [auth]
      x-status: built
      operationId: authRefresh
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '429': {$ref: '#/components/responses/GatewayRateLimited'}
        '200': {description: 'rotated session (same family); the presented refresh token is now used', content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'unknown, expired, revoked or already-used refresh token (reuse revokes the whole family), or the user is disabled: "invalid or expired token"'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/signout:
    delete:
      tags: [auth]
      x-status: built
      operationId: authSignout
      security: [{ApiKey: [], BearerJWT: []}]
      responses:
        '204': {description: "the access token's session (refresh-token family) is revoked; evt.auth.revoked scope family, reason signout"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/password:
    put:
      tags: [auth]
      x-status: built
      operationId: authChangePassword
      security: [{ApiKey: [], BearerJWT: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChange'}}}
      responses:
        '204': {description: 'changed; every session of the user is revoked (evt.auth.revoked scope user, reason password_change)'}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'bad access token, or wrong current_password ("invalid email or password")'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/password/forgot:
    post:
      tags: [auth]
      x-status: deferred
      operationId: authForgotPassword
      description: deferred — not implemented by auth_service (needs an email sender); admins reset passwords instead.
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}
      responses:
        '204': {description: a reset email is sent if the address is known (same answer either way)}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/password/reset:
    post:
      tags: [auth]
      x-status: deferred
      operationId: authResetPassword
      description: deferred — not implemented by auth_service.
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [token, password], properties: {token: {type: string}, password: {type: string, minLength: 10}}}}}
      responses:
        '204': {description: reset}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /auth/.well-known/jwks.json:
    get:
      tags: [auth]
      x-status: built
      operationId: authJwks
      description: 'public key(s) for verifying access tokens; no x-api-key (the Kong plugin bypasses this path). Cache-Control: public, max-age=300.'
      security: []
      responses:
        '200': {description: public keys, content: {application/json: {schema: {$ref: '#/components/schemas/Jwks'}}}}
  /auth/me:
    get:
      tags: [auth]
      x-status: built
      operationId: authMe
      security: [{ApiKey: [], BearerJWT: []}]
      responses:
        '200': {description: the token's user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/admin/users:
    get:
      tags: [auth]
      x-status: built
      operationId: authAdminListUsers
      security: [{ApiKey: [], BearerJWT: []}]
      responses:
        '200': {description: 'all users, newest first (not paginated)', content: {application/json: {schema: {$ref: '#/components/schemas/UserList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
    post:
      tags: [auth]
      x-status: built
      operationId: authAdminCreateUser
      summary: Create an account (the only way in while sign-up is closed); the user signs in with this email and password
      security: [{ApiKey: [], BearerJWT: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserCreate'}}}
      responses:
        '201': {description: the new user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/EmailTaken'}
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/admin/users/{id}/disabled:
    put:
      tags: [auth]
      x-status: built
      operationId: authAdminSetDisabled
      security: [{ApiKey: [], BearerJWT: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DisabledRequest'}}}
      responses:
        '200': {description: 'the updated user; disabling revokes all their sessions (evt.auth.revoked scope user, reason disabled)', content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'the admin account: its roles, password and state come from ADMIN_EMAIL / ADMIN_PASSWORD in auth''s .env'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/admin/users/{id}/roles:
    put:
      tags: [auth]
      x-status: built
      operationId: authAdminSetRoles
      security: [{ApiKey: [], BearerJWT: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RolesRequest'}}}
      responses:
        '200': {description: 'the updated user; their sessions are revoked so new tokens carry the new roles (evt.auth.revoked scope user, reason admin)', content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'the admin account: its roles, password and state come from ADMIN_EMAIL / ADMIN_PASSWORD in auth''s .env'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/admin/users/{id}/password:
    put:
      tags: [auth]
      x-status: built
      operationId: authAdminSetPassword
      security: [{ApiKey: [], BearerJWT: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordRequest'}}}
      responses:
        '204': {description: 'set; all their sessions are revoked (evt.auth.revoked scope user, reason admin)'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'the admin account: its roles, password and state come from ADMIN_EMAIL / ADMIN_PASSWORD in auth''s .env'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/admin/apikeys:
    post:
      tags: [auth]
      x-status: built
      operationId: authAdminCreateApiKey
      description: 'issues a client API key (the client is created if new). The raw key is in this response only (Cache-Control: no-store); only its SHA-256 is stored.'
      security: [{ApiKey: [], BearerJWT: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyCreate'}}}
      responses:
        '201': {description: 'the key, shown once', content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyCreated'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
    get:
      tags: [auth]
      x-status: built
      operationId: authAdminListApiKeys
      security: [{ApiKey: [], BearerJWT: []}]
      responses:
        '200': {description: 'all keys incl. revoked ones, newest first (not paginated)', content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
  /auth/admin/apikeys/{id}:
    delete:
      tags: [auth]
      x-status: built
      operationId: authAdminRevokeApiKey
      security: [{ApiKey: [], BearerJWT: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}, description: API key id (UUID; malformed = 404)}]
      responses:
        '204': {description: revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404':
          $ref: '#/components/responses/NotFound'
          description: unknown or already revoked key

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: identifies the calling application (checked at the gateway on every request)
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "the user's RS256 access token from a Session (verify with /auth/.well-known/jwks.json)"

  parameters:
    SessionId: {name: session_id, in: path, required: true, schema: {type: string}, description: session UUID (malformed = 404)}
    QuestionId: {name: question_id, in: path, required: true, schema: {type: string}, description: question UUID (malformed = 404)}
    ImageId: {name: image_id, in: path, required: true, schema: {type: string}, description: image UUID (malformed = 404)}
    SkuId: {name: sku_id, in: path, required: true, schema: {type: string}, description: SKU UUID (malformed = 404)}
    RunId: {name: run_id, in: path, required: true, schema: {type: string}, description: run UUID (malformed = 404)}
    FavoriteKind: {name: kind, in: path, required: true, schema: {type: string, enum: [models, backgrounds, poses]}, description: 'unknown kind = 404'}
    LibraryItemId: {name: item_id, in: path, required: true, schema: {type: string}, description: a library id of that kind}
    UserId: {name: id, in: path, required: true, schema: {type: string}, description: user UUID (malformed = 404)}

  responses:
    Unauthorized: {description: 'missing or invalid x-api-key (Kong), or missing/invalid/expired/revoked bearer token', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: invalid or expired link, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: not found (also for another owner's object), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: the resource's state forbids this, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    LengthRequired: {description: a POST without Content-Length, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TooLarge: {description: request body or a file too large, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    BadRequest: {description: 'unparseable multipart body', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: 'auth or agents_service unreachable or too slow, or the registry not published yet; retryable', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InvalidLogin: {description: 'unknown email, wrong password or disabled user — one generic answer: "invalid email or password"', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SigninLimited: {description: 'too many failed sign-ins (auth_service: 5 per email or 50 per client IP in 15 min, {detail}) or too many requests (Kong rate limit: 20/min, 200/h per IP, {message})', content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Error'}, {$ref: '#/components/schemas/GatewayError'}]}}}}
    GatewayBadPath: {description: 'the gateway (Kong/nginx) refuses a path that climbs above the root (`..` segments) before the API sees it', content: {text/html: {schema: {type: string}}}}
    GatewayRateLimited: {description: 'Kong rate limit (20/min, 200/h per IP) — Kong answers with {message}', content: {application/json: {schema: {$ref: '#/components/schemas/GatewayError'}}}}
    EmailTaken: {description: '"email already registered"', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AdminRequired: {description: 'valid token without the admin role: "admin role required"', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AuthUnprocessable: {description: 'invalid input: "invalid JSON body", or the failed rule ("invalid email", "name must be 1-200 characters", "password must be at least 10 characters", "password is too common", "roles must not be empty", …)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unprocessable:
      description: invalid input
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

  schemas:
    # ---------------------------------------------------------- errors
    Error:
      type: object
      required: [detail]
      properties: {detail: {type: string}}
    GatewayError: {type: object, description: 'error body generated by Kong itself (rate limiting)', required: [message], properties: {message: {type: string}}}
    SignedUrl: {type: string, description: 'signed, time-limited link; opaque', examples: ['/files/u/7d1e.../catalog/0b5c.../images/1a2b....png?exp=1767225600&sig=ab12']}

    # ---------------------------------------------------------- catalog: shared
    FlowPosition:
      type: string
      enum: [raw, guidelines, processing, output, poses, models, backgrounds, details, summary, done]
      description: where the guided chat is (demo FLOW order); `done` = Processing opened
    Stage: {type: string, enum: [setup, ready], description: 'setup: Input; ready: Start processing done, runs allowed'}
    SkuStatus: {type: string, enum: [Not run, Queued, Running, To review, Approved, Redo], description: 'derived by catalog_service from the SKU''s runs and newest images; Redo = a newest image is rejected or failed'}
    ImageStatus: {type: string, enum: [generating, to_review, approved, rejected, failed]}
    RunScope: {type: string, enum: [sample, batch, all, skus, regenerate]}
    RunStatus: {type: string, enum: [queued, running, succeeded, failed]}
    LibraryId: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: 'a library id (category, pose, model, background) published by agents_service'}
    ChoiceId:
      description: a library model/background id, or the id (UUID) of one of this session's uploads
      type: string
      pattern: '^([a-z0-9][a-z0-9_-]{0,63}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
    Resolution: {type: string, pattern: '^[0-9]+K$', examples: [2K]}
    Ratio: {type: string, pattern: '^[0-9]+:[0-9]+$', examples: ['1:1']}
    PosesByCategory:
      type: object
      description: category id → pose ids, in order
      propertyNames: {$ref: '#/components/schemas/LibraryId'}
      additionalProperties: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/LibraryId'}}

    # ---------------------------------------------------------- catalog: session
    InputItem:
      type: object
      description: |
        One thing added to a step, as the chat shows it. `id` is chosen by the client for picks and by the server for
        uploads and links. Fields by step — raw: `option` folder|csv|drive|website, `upload_ids`, `url`,
        `image_count`; guidelines: doc|link, `upload_ids`, `url`; output: `resolution`, `ratio`; poses: pick|brief,
        `poses`, `briefs`, and for a brief `custom_poses` (shots the library lacks, their ids also in `poses`) and
        `pose_refs` (which shot each reference photo illustrates); models / backgrounds: `ids`, `randomize`, `text` (the brand's description of the model or
        background, trimmed, at most 500 characters; an item needs ids or a text, else 422); details: note|brief|brief-link, `text`,
        `upload_ids`, `url`. `reused`: brought back from memory.
      required: [id, option, label]
      additionalProperties: false
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        option: {type: string, pattern: '^[a-z][a-z-]{0,31}$'}
        label: {type: string, maxLength: 200}
        detail: {type: [string, 'null'], maxLength: 200}
        reused: {type: boolean, default: false}
        url: {type: string, format: uri, maxLength: 2048, description: a link the user gave (Drive, website, document)}
        text: {type: string, maxLength: 20000}
        upload_ids: {type: array, maxItems: 500, items: {type: string, format: uuid}}
        image_count: {type: [integer, 'null'], minimum: 0}
        ids: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ChoiceId'}}
        randomize: {type: boolean, default: false, description: spread the picked models/backgrounds across SKUs (needs 2 or more)}
        resolution: {$ref: '#/components/schemas/Resolution'}
        ratio: {$ref: '#/components/schemas/Ratio'}
        poses: {$ref: '#/components/schemas/PosesByCategory'}
        briefs:
          type: object
          description: category id → the brief or links written for it; Start puts it (links removed) on that product's SKUs as `shots_brief`
          propertyNames: {$ref: '#/components/schemas/LibraryId'}
          additionalProperties: {type: string, maxLength: 5000}
        custom_poses: {type: array, maxItems: 40, items: {$ref: '#/components/schemas/CustomPose'}, description: 'this item''s custom shots; a pose id in `poses` must be a library pose of that category or one of these (else 422)'}
        pose_refs:
          type: object
          description: 'reference photo (a pose_ref upload of the session, from upload_ids) → the pose id it illustrates (a pose of this item''s plan); 422 otherwise. Sent with that shot as a framing reference'
          propertyNames: {type: string, format: uuid}
          additionalProperties: {$ref: '#/components/schemas/LibraryId'}
          maxProperties: 20
    StepInput:
      type: object
      required: [items, skipped]
      additionalProperties: false
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/InputItem'}}
        skipped: {type: boolean}
    StepInputPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/InputItem'}}
        skipped: {type: boolean}
    Inputs:
      type: object
      required: [raw, guidelines, output, poses, models, backgrounds, details]
      additionalProperties: false
      properties:
        raw: {$ref: '#/components/schemas/StepInput'}
        guidelines: {$ref: '#/components/schemas/StepInput'}
        output: {$ref: '#/components/schemas/StepInput'}
        poses: {$ref: '#/components/schemas/StepInput'}
        models: {$ref: '#/components/schemas/StepInput'}
        backgrounds: {$ref: '#/components/schemas/StepInput'}
        details: {$ref: '#/components/schemas/StepInput'}
    ChatMessage:
      type: object
      description: one chat entry as the web client renders it; stored as sent (the server only needs `id` and `kind`)
      required: [id, kind]
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string, minLength: 1, maxLength: 32}
    Rules:
      type: object
      description: what processing read from the guidelines and details (agents_service); null until read
      required: [background, styling, mood, metal_references, worn_references, dimensions, notes]
      properties:
        background: {type: [string, 'null']}
        styling: {type: [string, 'null']}
        mood: {type: [string, 'null']}
        metal_references:
          type: array
          description: a reference image per metal finish
          items:
            type: object
            required: [finish, url]
            properties:
              finish: {type: string, examples: [white gold]}
              url: {$ref: '#/components/schemas/SignedUrl'}
        worn_references:
          type: array
          description: how-it's-worn drawings or photos
          items: {$ref: '#/components/schemas/SignedUrl'}
        dimensions: {type: [string, 'null'], description: dimension rules in mm, as written}
        notes: {type: array, items: {type: string}, description: other do's and don'ts}
    Processing:
      type: object
      description: the session's newest processing job
      required: [status, process_id, error]
      properties:
        status: {type: string, enum: [idle, queued, running, succeeded, failed], description: 'idle: never started'}
        process_id: {type: [string, 'null'], format: uuid}
        error: {type: [string, 'null'], description: 'shown with a retry (send the input again); inputs stay'}
    Upload:
      type: object
      description: a file stored for this session (raw image, document, model/background/pose reference photo)
      required: [id, kind, name, content_type, size, category, url, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [raw, guideline, brief, model, background, pose_ref]}
        name: {type: string}
        content_type: {type: string}
        size: {type: integer, minimum: 0}
        category: {type: [string, 'null'], description: pose_ref only — the category it is for}
        url: {$ref: '#/components/schemas/SignedUrl'}
        created_at: {type: string, format: date-time}
    CatalogSession:
      type: object
      required: [id, project_name, stage, flow_position, inputs, messages, rules, processing, uploads, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        project_name: {type: string, description: 'names the memory saved from this session ("for Diwali drop, you used …")'}
        stage: {$ref: '#/components/schemas/Stage'}
        flow_position: {$ref: '#/components/schemas/FlowPosition'}
        inputs: {$ref: '#/components/schemas/Inputs'}
        messages: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
        rules: {oneOf: [{$ref: '#/components/schemas/Rules'}, {type: 'null'}]}
        processing: {$ref: '#/components/schemas/Processing'}
        uploads: {type: array, items: {$ref: '#/components/schemas/Upload'}, description: oldest first}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SessionCreate:
      type: object
      additionalProperties: false
      properties:
        project_name: {type: string, minLength: 1, maxLength: 200, description: 'default "Untitled project"'}
    SessionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        project_name: {type: string, minLength: 1, maxLength: 200}
        flow_position: {$ref: '#/components/schemas/FlowPosition'}
        messages: {type: array, maxItems: 2000, items: {$ref: '#/components/schemas/ChatMessage'}, description: replaces the chat (at most 2 MiB as JSON)}
        inputs:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            raw: {$ref: '#/components/schemas/StepInputPatch'}
            guidelines: {$ref: '#/components/schemas/StepInputPatch'}
            output: {$ref: '#/components/schemas/StepInputPatch'}
            poses: {$ref: '#/components/schemas/StepInputPatch'}
            models: {$ref: '#/components/schemas/StepInputPatch'}
            backgrounds: {$ref: '#/components/schemas/StepInputPatch'}
            details: {$ref: '#/components/schemas/StepInputPatch'}
    SessionSummary:
      type: object
      required: [id, project_name, stage, sku_count, counts, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        project_name: {type: string}
        stage: {$ref: '#/components/schemas/Stage'}
        sku_count: {type: integer, minimum: 0}
        counts:
          type: object
          description: 'SKUs by derived status (running = Queued or Running; to_review = To review or Redo) and approved images'
          required: [skus, not_run, running, to_review, approved, images_approved]
          properties:
            skus: {type: integer, minimum: 0}
            not_run: {type: integer, minimum: 0}
            running: {type: integer, minimum: 0}
            to_review: {type: integer, minimum: 0}
            approved: {type: integer, minimum: 0}
            images_approved: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SessionList:
      type: object
      required: [sessions]
      properties: {sessions: {type: array, items: {$ref: '#/components/schemas/SessionSummary'}}}
    SessionDetail:
      type: object
      required: [session, skus, questions, runs, images]
      properties:
        session: {$ref: '#/components/schemas/CatalogSession'}
        skus: {type: array, items: {$ref: '#/components/schemas/Sku'}, description: by category order, then code}
        questions: {type: array, items: {$ref: '#/components/schemas/Question'}, description: 'every question, oldest first; answer null = open'}
        runs: {type: array, items: {$ref: '#/components/schemas/Run'}, description: newest first}
        images: {type: array, items: {$ref: '#/components/schemas/Image'}, description: 'every revision; the newest per (sku_id, shot) is the live one'}

    # ---------------------------------------------------------- catalog: memory, library
    MemoryEntry:
      type: object
      required: [step, items, project_name, updated_at]
      properties:
        step: {type: string, enum: [guidelines, output, poses, models, backgrounds, details]}
        items: {type: array, items: {$ref: '#/components/schemas/InputItem'}}
        project_name: {type: string}
        updated_at: {type: string, format: date-time}
    Memory:
      type: object
      required: [memory]
      properties: {memory: {type: array, items: {$ref: '#/components/schemas/MemoryEntry'}, description: at most one per step}}
    Category:
      type: object
      description: a product (Ring, Sofa, Tops …) inside a family
      required: [id, family, name, code_prefix, uses_model, subcategories, default_poses, default_model, default_background, pose_noun]
      properties:
        id: {$ref: '#/components/schemas/LibraryId'}
        family: {$ref: '#/components/schemas/LibraryId', description: 'a Library families[].id'}
        name: {type: string, examples: [Rings]}
        code_prefix: {type: string, pattern: '^[A-Z]{1,3}$', description: 'SKU codes are <prefix>-<nnn>, e.g. R-001'}
        uses_model: {type: boolean, description: 'false (furniture) = rendered without a model; its SKUs'' brief model stays null and the Models step does not apply'}
        subcategories:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {$ref: '#/components/schemas/LibraryId'}
              name: {type: string}
              about: {type: string, maxLength: 100, description: 'what the subcategory is, one plain line (the info tip that tells Kurtis from Kurtas); absent = none', examples: ['A shorter, casual tunic top, hip to knee length']}
              styling: {type: [string, 'null'], description: 'how it is styled or worn in the brief (garments'' Styling rule, jewellery''s Wear line); null = the product''s usual'}
        default_poses: {type: array, items: {$ref: '#/components/schemas/LibraryId'}, description: ORA default poses}
        default_model: {oneOf: [{$ref: '#/components/schemas/LibraryId'}, {type: 'null'}], description: null when uses_model is false}
        default_men_model: {oneOf: [{$ref: '#/components/schemas/LibraryId'}, {type: 'null'}], description: 'the built-in model men''s wear SKUs (attributes.wearer men) default to; absent or null = default_model'}
        wearer: {enum: [women, men, null], description: 'whose wear every SKU of this product is (men''s rings, rakhis: men), unless its own words say otherwise; a SKU moved here takes it. Absent or null = per SKU'}
        default_background: {$ref: '#/components/schemas/LibraryId'}
        max_attempts: {type: integer, minimum: 1, description: 'renders per image at most for this product; absent = the Library max_attempts. Its worst-case quote is credits × images × this'}
        default_resolution: {$ref: '#/components/schemas/Resolution', description: 'the resolution this product''s briefs default to when the output step has none; absent = defaults.resolution'}
        pose_noun: {$ref: '#/components/schemas/PoseNoun'}
    PoseNoun:
      type: object
      description: 'what the UI and chat call a pose for this product (furniture angle/angles, every other family shot/shots)'
      required: [singular, plural]
      properties:
        singular: {type: string, minLength: 1, maxLength: 32, examples: [angle]}
        plural: {type: string, minLength: 1, maxLength: 32, examples: [angles]}
    Family:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/LibraryId', examples: [jewellery]}
        name: {type: string, examples: [Jewellery]}
    Pose:
      type: object
      required: [id, category, name, example_url]
      properties:
        id: {$ref: '#/components/schemas/LibraryId'}
        category: {$ref: '#/components/schemas/LibraryId'}
        name: {type: string, examples: [Hand close-up]}
        example_url: {type: [string, 'null'], description: 'static web path of an example picture; null shows "No example yet"'}
        frame:
          type: object
          description: zoom into part of a shared example picture
          required: [zoom, origin]
          properties: {zoom: {type: number, minimum: 1}, origin: {type: string, examples: ['62% 38%']}}
    Model:
      type: object
      required: [id, name, image_url, category_tags]
      properties:
        id: {$ref: '#/components/schemas/LibraryId'}
        name: {type: string}
        image_url: {type: [string, 'null'], description: static web path of the head shot}
        full_body_url: {type: [string, 'null'], description: 'static web path of a full-body view (front); absent = none'}
        category_tags: {type: array, items: {type: string, pattern: '^[a-z0-9-]+$'}, description: 'e.g. no-necklace; checked against SKU categories'}
        note: {type: string}
        wearer: {enum: [women, men], description: 'whose wear the model shows: a SKU whose attributes.wearer is set gets only models of that wearer (picks and defaults); absent = any'}
    Background:
      type: object
      required: [id, name, swatch, image_url]
      properties:
        id: {$ref: '#/components/schemas/LibraryId'}
        name: {type: string}
        swatch: {type: [string, 'null'], description: 'a CSS colour or gradient'}
        image_url: {type: [string, 'null'], description: static web path of a preview}
        families: {type: array, items: {$ref: '#/components/schemas/LibraryId'}, description: the family ids it suits; absent = every family}
    ResolutionOption:
      type: object
      required: [id, label, credits_per_image]
      properties:
        id: {$ref: '#/components/schemas/Resolution'}
        label: {type: string}
        credits_per_image: {type: number, minimum: 0}
    RatioOption:
      type: object
      required: [id, label, use, w, h]
      properties:
        id: {$ref: '#/components/schemas/Ratio'}
        label: {type: string}
        use: {type: string, examples: [Marketplaces]}
        w: {type: integer, minimum: 1}
        h: {type: integer, minimum: 1}
    Favorites:
      type: object
      required: [models, backgrounds, poses]
      properties:
        models: {type: array, items: {$ref: '#/components/schemas/LibraryId'}}
        backgrounds: {type: array, items: {$ref: '#/components/schemas/LibraryId'}}
        poses: {type: array, items: {$ref: '#/components/schemas/LibraryId'}}
    Library:
      type: object
      required: [families, categories, poses, models, backgrounds, resolutions, ratios, defaults, favorites, max_attempts]
      properties:
        families: {type: array, items: {$ref: '#/components/schemas/Family'}, description: 'in run order: Jewellery → Furniture → Garments'}
        categories: {type: array, items: {$ref: '#/components/schemas/Category'}, description: 'products in run order: family order, then product order (Rings → Earrings → … → Sofas → …)'}
        poses: {type: array, items: {$ref: '#/components/schemas/Pose'}}
        models: {type: array, items: {$ref: '#/components/schemas/Model'}}
        backgrounds: {type: array, items: {$ref: '#/components/schemas/Background'}}
        resolutions: {type: array, items: {$ref: '#/components/schemas/ResolutionOption'}}
        ratios: {type: array, items: {$ref: '#/components/schemas/RatioOption'}}
        defaults:
          type: object
          required: [resolution, ratio]
          properties: {resolution: {$ref: '#/components/schemas/Resolution'}, ratio: {$ref: '#/components/schemas/Ratio'}}
        favorites: {$ref: '#/components/schemas/Favorites'}
        max_attempts: {type: integer, minimum: 1, description: 'renders per image at most (first try + regenerations after failed reviews): a quote is credits_per_image × images, the worst case that × max_attempts'}
    Metrics:
      type: object
      required: [products]
      properties:
        products: {type: array, items: {$ref: '#/components/schemas/ProductMetrics'}, description: one per product with finished images, by product id}
    ProductMetrics:
      type: object
      required: [product, images, first_pass_rate, avg_tries, approved, rejected, feedback_count, credits_per_approved]
      properties:
        product: {$ref: '#/components/schemas/LibraryId', description: 'a Library categories[].id'}
        images: {type: integer, minimum: 0, description: 'images that finished rendering (to_review, approved, rejected or failed), every revision'}
        first_pass_rate: {type: [number, 'null'], minimum: 0, maximum: 1, description: 'share of images whose first render passed review; null when none has the data'}
        avg_tries: {type: [number, 'null'], minimum: 0, description: 'renders per image that rendered (one that failed before any render is left out); null when none has the data'}
        approved: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0, description: images the brand rejected}
        feedback_count: {type: integer, minimum: 0, description: regenerations the brand asked for with feedback}
        credits_per_approved: {type: [number, 'null'], minimum: 0, description: 'credits per image × renders, summed over every image, over the approved count; null when nothing is approved'}
    Stats:
      type: object
      required: [sessions, skus, images_approved, credits_quoted]
      properties:
        sessions: {type: integer, minimum: 0}
        skus: {type: integer, minimum: 0}
        images_approved: {type: integer, minimum: 0}
        credits_quoted: {type: number, minimum: 0, description: sum of every run's credits_quoted (nothing is charged)}
    Job:
      type: object
      description: a processing job (cmd.catalog.process) or a run (cmd.catalog.run)
      required: [id, kind, session_id, project_name, scope, status, error, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [process, run]}
        session_id: {type: string, format: uuid}
        project_name: {type: string}
        scope: {oneOf: [{$ref: '#/components/schemas/RunScope'}, {type: 'null'}], description: null for a processing job}
        status: {$ref: '#/components/schemas/RunStatus'}
        error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time, description: the time of its last event, else created_at}
    JobUsage:
      type: object
      description: the job's model calls (its evt.catalog.usage events, all of them), by model
      required: [models, llm_calls, image_calls, input_tokens, output_tokens, cost_usd, credits]
      properties:
        models:
          type: array
          items:
            type: object
            required: [kind, model, calls, input_tokens, output_tokens, cache_read_tokens, cost_usd, credits, duration_ms]
            properties:
              kind: {type: string, enum: [llm, image]}
              model: {type: string}
              calls: {type: integer, minimum: 0}
              input_tokens: {type: integer, minimum: 0}
              output_tokens: {type: integer, minimum: 0}
              cache_read_tokens: {type: integer, minimum: 0}
              cost_usd: {type: [number, 'null'], minimum: 0, description: null when no call of it is priced}
              credits: {type: [number, 'null'], minimum: 0}
              duration_ms: {type: integer, minimum: 0, description: summed over its calls}
        llm_calls: {type: integer, minimum: 0}
        image_calls: {type: integer, minimum: 0}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        cost_usd: {type: [number, 'null'], minimum: 0, description: 'known LLM cost in USD; null when none is known'}
        credits: {type: [number, 'null'], minimum: 0, description: 'image credits (quote units, not charged); null with no image call'}
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}
    JobDetail:
      type: object
      required: [job, usage, events]
      properties:
        job: {$ref: '#/components/schemas/Job'}
        usage: {$ref: '#/components/schemas/JobUsage'}
        events: {type: array, items: {$ref: '#/components/schemas/SessionEvent'}, description: 'its events (work_id = the job), oldest first, at most 2000; mapped as the session''s event page maps them'}
    Estimate:
      type: object
      required: [images, resolution, credits_per_image, credits]
      properties:
        images: {type: integer}
        resolution: {$ref: '#/components/schemas/Resolution'}
        credits_per_image: {type: number}
        credits: {type: number}

    # ---------------------------------------------------------- catalog: inputs
    RawUpload:
      type: object
      required: [files]
      properties:
        files: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: binary}}
        kind: {type: string, enum: [folder, files, csv], default: files, description: 'csv: exactly one CSV/TSV/TXT file'}
        label: {type: string, maxLength: 200, description: 'the item label, e.g. the folder name'}
        families: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/LibraryId'}, description: '"What are we shooting?": family ids to sort these images into (repeat the part per id); absent or empty = let the agent decide. 422 for an unknown id'}
        paths: {type: array, maxItems: 500, items: {type: string, minLength: 1, maxLength: 512}, description: 'each file''s path inside the picked folder (webkitRelativePath, e.g. "Rings/R12/front.jpg"), one part per file in the same order as files; when an upload spans several sub-folders each sub-folder is one product. Optional; a count that differs from files, an absolute path or a ".." segment is 422'}
    RawLink:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [drive, website, csv]}
        url: {type: string, format: uri, maxLength: 2048, description: 'drive, website: an http(s) link ("That doesn''t look like a link." = 422)'}
        csv_text: {type: string, maxLength: 1048576, description: 'csv: the sheet as text'}
        families: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/LibraryId'}, description: as RawUpload families}
    RawAccepted:
      type: object
      required: [session, item, image_count, expected_skus, process_id]
      properties:
        session: {$ref: '#/components/schemas/CatalogSession'}
        item: {$ref: '#/components/schemas/InputItem'}
        image_count: {type: [integer, 'null'], description: 'files stored, or CSV rows with an image_url; null for links (known after fetching)'}
        expected_skus: {type: [integer, 'null'], description: distinct SKUs in the CSV; null otherwise}
        process_id: {type: string, format: uuid}
    GuidelineUpload:
      type: object
      required: [file]
      properties:
        file: {type: string, format: binary}
        target: {type: string, enum: [guidelines, details], default: guidelines}
    GuidelineLink:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: {type: string, format: uri, maxLength: 2048}
        target: {type: string, enum: [guidelines, details], default: guidelines}
    InputAdded:
      type: object
      required: [session, item]
      properties:
        session: {$ref: '#/components/schemas/CatalogSession'}
        item: {$ref: '#/components/schemas/InputItem'}
    PhotoUpload:
      type: object
      required: [file, kind]
      properties:
        file: {type: string, format: binary}
        kind: {type: string, enum: [model, background, pose_ref]}
        name: {type: string, maxLength: 200, description: 'shown in pickers; default the file name'}
        category: {type: string, description: 'pose_ref: the category id it is for'}
    PoseSuggestRequest:
      type: object
      required: [briefs]
      additionalProperties: false
      properties:
        briefs:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [category]
            additionalProperties: false
            properties:
              category: {$ref: '#/components/schemas/LibraryId'}
              text: {type: string, maxLength: 5000, description: a brief and/or links}
              upload_ids: {type: array, maxItems: 20, items: {type: string, format: uuid}, description: this session's pose_ref uploads}
              exact: {type: boolean, default: false, description: 'the text is the brand''s shot list ("Describe your shots"): poses are exactly the shots it asks for, in order (a bare count is filled with the category''s defaults), library poses where one matches closely, else custom shots'}
    CustomPose:
      type: object
      description: a session shot the brand's brief asked for that the pose library lacks; never the anchor; no example picture
      required: [id, category, name, prompt, on_model]
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^custom-[a-z0-9][a-z0-9-]{0,55}$', examples: [custom-ring-on-a-swing]}
        category: {$ref: '#/components/schemas/LibraryId'}
        name: {type: string, minLength: 1, maxLength: 60, examples: [On a swing]}
        prompt: {type: string, minLength: 1, maxLength: 500}
        on_model: {type: boolean}
    PoseSuggestion:
      type: object
      required: [poses, reply, custom_poses, refs]
      properties:
        poses: {$ref: '#/components/schemas/PosesByCategory', description: 'library pose ids, then the custom shots'' ids'}
        custom_poses: {type: array, items: {$ref: '#/components/schemas/CustomPose'}}
        refs:
          type: object
          description: upload id (from the request) → the pose id that reference photo illustrates
          additionalProperties: {$ref: '#/components/schemas/LibraryId'}
        reply: {type: string, examples: ['Got it — I''ll suggest poses from these.']}

    # ---------------------------------------------------------- catalog: SKUs, questions
    Brief:
      type: object
      description: what a SKU renders with; null fields are filled by Start processing, except model for a product whose uses_model is false (stays null) and a model or background given only as a description (model_description / background_description)
      required: [model, background, poses, resolution, ratio, pose_ratios, pose_notes]
      properties:
        model: {oneOf: [{$ref: '#/components/schemas/ChoiceId'}, {type: 'null'}]}
        background: {oneOf: [{$ref: '#/components/schemas/ChoiceId'}, {type: 'null'}]}
        poses: {type: array, items: {$ref: '#/components/schemas/LibraryId'}}
        resolution: {oneOf: [{$ref: '#/components/schemas/Resolution'}, {type: 'null'}]}
        ratio: {oneOf: [{$ref: '#/components/schemas/Ratio'}, {type: 'null'}], description: 'the default ratio of every pose without its own in pose_ratios'}
        pose_ratios: {$ref: '#/components/schemas/PoseRatios'}
        pose_notes: {$ref: '#/components/schemas/PoseNotes'}
        model_description: {type: [string, 'null'], maxLength: 500, description: 'the brand''s description of the model (the models step text, or set on the SKU); with model null it is the model (no reference photo), with a model it adds only what is not identity. Absent or null = none'}
        background_description: {type: [string, 'null'], maxLength: 500, description: 'the brand''s description of the background (the backgrounds step text, or set on the SKU); with background null it is the background (no reference image), with one it is added and wins where they differ. Absent or null = none'}
        custom_poses: {type: array, items: {$ref: '#/components/schemas/CustomPose'}, description: 'the definitions of the custom shots this SKU has used (copied at Start and SKU edits), so its shots still render after the poses step changes'}
        shots_brief: {type: [string, 'null'], maxLength: 1000, description: 'the poses step''s brief for this product (links removed, one line), set by Start; a library-only poses choice clears it. Absent or null = none'}
    PoseRatios:
      type: object
      description: 'pose id → that pose''s ratio (a Library ratios[].id), overriding the brief ratio; {} = none'
      propertyNames: {$ref: '#/components/schemas/LibraryId'}
      additionalProperties: {$ref: '#/components/schemas/Ratio'}
      maxProperties: 30
      examples: [{hand-closeup: '4:5'}]
    PoseNotes:
      type: object
      description: 'pose id → the brand''s free-text instruction for that pose (not blank), added after the library pose instruction in the render prompt; {} = none'
      propertyNames: {$ref: '#/components/schemas/LibraryId'}
      additionalProperties: {type: string, minLength: 1, maxLength: 500, pattern: '\S'}
      maxProperties: 30
      examples: [{hand-closeup: 'left hand, ring on the index finger'}]
    Attributes:
      type: object
      description: |
        what processing read from the raw images (drawer "details from pre-processing"). Common: description, source
        (+ setting); the rest by the product's family (fields of another family are absent) — jewellery: counts, motifs,
        finish, size_mm, material, kind; garments: pieces, fabric, colour, print, work, details, kind; furniture: material, colour,
        finish, dimensions_cm, style, kind
      required: [description, source]
      properties:
        counts: {type: object, additionalProperties: {type: integer, minimum: 0}, description: 'jewellery: e.g. {"stones": 4, "charms": 2}'}
        motifs: {type: array, items: {type: string}, examples: [[horse, star]]}
        finish: {type: [string, 'null'], description: 'jewellery: structure and finish note (density, texture, metal); furniture: surface finish'}
        size_mm: {type: [number, 'null']}
        material: {type: [string, 'null'], description: jewellery, furniture}
        pieces: {type: array, items: {type: string}, description: 'garments: the pieces in the set', examples: [[kurta, pant, dupatta]]}
        details: {type: array, items: {type: string}, description: 'garments: the key construction details the photos show (neckline or collar, sleeve and hem length, slits, closures, pockets), each checked by the details review goal', examples: [[mandarin collar, 4-button placket, three-quarter sleeves, side slits]]}
        kind:
          type: object
          required: [category, subcategory, label, sure]
          properties:
            category: {type: [string, 'null']}
            subcategory: {type: [string, 'null']}
            label: {type: string, maxLength: 80}
            sure: {type: boolean}
          description: 'garments, jewellery and furniture: what vision read the product as from its photos: subcategory (an id of a product of its family, null = none fits), category (its product, null with it), label (2–4 words, e.g. bomber jacket, diamond ring, sofa cum bed), sure. Kept so a later recheck asks the kind question again; never shown'
        fabric: {type: [string, 'null']}
        colour: {type: [string, 'null'], description: garments, furniture}
        print: {type: [string, 'null'], description: 'garments: print or pattern'}
        work: {type: [string, 'null'], description: 'garments: embroidery / embellishment'}
        dimensions_cm: {type: [string, 'null'], description: 'furniture', examples: [W 220 × D 90 × H 85]}
        style: {type: [string, 'null'], description: furniture}
        description: {type: [string, 'null']}
        source: {type: [string, 'null'], examples: [Dimension image + A+ text]}
        setting: {enum: [studio, lifestyle, null], description: how the raw photos were shot (optional)}
        sides: {type: object, additionalProperties: {enum: [front, back, side, hero, angle, flat, close-up, pair, hanging, model, mood, null]}, description: 'garments and jewellery (optional): raw photo key → the view it shows; null = unknown'}
        wearer: {enum: [women, men, null], description: 'garments and jewellery (optional): whose wear it is, from the product (men''s rings, rakhis), the words of its name, CSV category or file names, else vision on garments; null = unknown or unisex. A men''s SKU gets men''s models; set in the drawer with SkuPatch.wearer'}
    Sku:
      type: object
      required: [id, code, name, category, subcategory, group_key, group_label, variant_of, attributes, confirmed, brief, status, raw_urls, raw_views, updated_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Z]{1,3}-[0-9]{3,}$', examples: [R-001]}
        name: {type: string}
        category: {$ref: '#/components/schemas/LibraryId'}
        subcategory: {type: [string, 'null']}
        group_key: {type: [string, 'null'], description: logical batch inside the category (style, material, price band)}
        group_label: {type: [string, 'null'], examples: [Statement & solitaires]}
        variant_of: {type: [string, 'null'], format: uuid, description: the SKU this one is a colour variant of}
        attributes: {$ref: '#/components/schemas/Attributes'}
        confirmed: {type: boolean, description: the brand confirmed the attributes read (counts, motifs, finish; pieces; material …)}
        brief: {$ref: '#/components/schemas/Brief'}
        status: {$ref: '#/components/schemas/SkuStatus'}
        raw_urls: {type: array, items: {$ref: '#/components/schemas/SignedUrl'}, description: the raw photos grouped into this SKU}
        raw_views: {type: array, items: {type: [string, 'null']}, description: 'the view each raw photo shows, in raw_urls order (attributes.sides); null = untagged', examples: [[hero, side, model, null]]}
        updated_at: {type: string, format: date-time}
    SkuList:
      type: object
      required: [skus]
      properties: {skus: {type: array, items: {$ref: '#/components/schemas/Sku'}}}
    SkuPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        model: {$ref: '#/components/schemas/ChoiceId'}
        background: {$ref: '#/components/schemas/ChoiceId', description: 'a built-in background must suit the (target) product''s family (Library backgrounds[].families), else 422'}
        poses: {type: array, minItems: 1, maxItems: 30, items: {$ref: '#/components/schemas/LibraryId'}}
        pose_ratios: {$ref: '#/components/schemas/PoseRatios', description: 'replaces the brief''s map; a ratio not in the Library is a 422'}
        pose_notes: {$ref: '#/components/schemas/PoseNotes', description: 'replaces the brief''s map'}
        model_description: {type: [string, 'null'], maxLength: 500, description: 'the SKU''s own model description, trimmed (over the models step text); null or blank = none for this SKU'}
        background_description: {type: [string, 'null'], maxLength: 500, description: 'the SKU''s own background description, trimmed (over the backgrounds step text); null or blank = none for this SKU'}
        category: {$ref: '#/components/schemas/LibraryId', description: 'move the SKU to this product (a Library categories[].id); its poses become the session''s Poses-step choice for that product, else its defaults, unless poses is sent too; its group becomes the product, and a move to another family drops the old family''s attributes and unconfirms it'}
        subcategory: {type: [string, 'null'], pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: 'a subcategory id of the SKU''s (target, when category is sent) product (Library categories[].subcategories[].id), else 422; null clears it. A category move without it clears the subcategory. It is set on this SKU only, never with apply_to_category'}
        wearer: {enum: [women, men, null], description: 'sets the SKU''s attributes.wearer (null clears it); a built-in model of the other wearer on its brief becomes the product''s default for the new wearer. Set on this SKU only, never with apply_to_category'}
        confirmed: {type: boolean}
        apply_to_category: {type: boolean, default: false, description: 'apply the same fields to every SKU of the SKU''s (current) category that is not Approved'}
    Check: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'a check id from the registry catalogue (catalog_checks), e.g. guidelines_vs_images'}
    Question:
      type: object
      required: [id, check, text, options, blocking, answer, answered_at, sku_ids, created_at]
      properties:
        id: {type: string, format: uuid}
        check: {$ref: '#/components/schemas/Check'}
        text: {type: string}
        options: {type: array, minItems: 2, maxItems: 2, items: {type: string}, examples: [[Follow the brand guidelines, Keep them lifestyle]]}
        blocking: {type: boolean, description: Start processing is refused (409) while a blocking question is open}
        answer: {type: [integer, 'null'], enum: [0, 1, null], description: the chosen option index; null = open}
        answered_at: {type: [string, 'null'], format: date-time}
        sku_ids: {type: array, items: {type: string, format: uuid}, description: the SKUs it is about}
        created_at: {type: string, format: date-time}
    AnswerRequest:
      type: object
      required: [option]
      additionalProperties: false
      properties: {option: {type: integer, enum: [0, 1]}}
    Answered:
      type: object
      required: [question, skus]
      properties:
        question: {$ref: '#/components/schemas/Question'}
        skus: {type: array, items: {$ref: '#/components/schemas/Sku'}, description: the SKUs the answer changed (may be empty)}
    Started:
      type: object
      required: [session, skus, summary]
      properties:
        session: {$ref: '#/components/schemas/CatalogSession'}
        skus: {type: array, items: {$ref: '#/components/schemas/Sku'}}
        summary:
          type: object
          required: [total, by_category, sample_sku_id]
          properties:
            total: {type: integer}
            by_category:
              type: array
              items:
                type: object
                required: [category, count, first_code, last_code]
                properties:
                  category: {$ref: '#/components/schemas/LibraryId'}
                  count: {type: integer}
                  first_code: {type: string}
                  last_code: {type: string}
            sample_sku_id: {type: [string, 'null'], format: uuid, description: the SKU the first sample runs}

    # ---------------------------------------------------------- catalog: runs, images
    Review:
      type: object
      description: the vision reviewer's verdict on an image
      required: [passed, summary]
      properties:
        passed: {type: boolean}
        summary: {type: string}
        goals:
          type: array
          items:
            type: object
            required: [goal, passed]
            properties:
              goal: {type: string, enum: [count, motif, finish, placement, background, identity, pieces, colour, print, drape, details, shape, material, extras], description: "by family: jewellery count, motif, finish, placement, background, identity; garments pieces, colour, print, drape, details, background, identity; furniture shape, material, colour, background, extras"}
              passed: {type: boolean}
              note: {type: string}
    Image:
      type: object
      required: [id, sku_id, run_id, shot, revision, status, url, feedback, review, attempts, error, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        sku_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        shot: {$ref: '#/components/schemas/LibraryId'}
        revision: {type: integer, minimum: 1, description: 1 for the first render of a SKU × shot; +1 per regeneration}
        status: {$ref: '#/components/schemas/ImageStatus'}
        url: {oneOf: [{$ref: '#/components/schemas/SignedUrl'}, {type: 'null'}], description: null while generating or when failed}
        feedback: {type: [string, 'null'], description: the feedback this revision was regenerated with}
        review: {oneOf: [{$ref: '#/components/schemas/Review'}, {type: 'null'}]}
        attempts: {type: array, items: {$ref: '#/components/schemas/ImageAttempt'}, description: 'every render tried for this revision, in order (the best one is also url); empty while generating, when failed before a render, or for images rendered before tries were kept'}
        error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ImageAttempt:
      type: object
      description: one render try of an image
      required: [index, url, review, best]
      properties:
        index: {type: integer, minimum: 1, description: '1 = the first try'}
        url: {$ref: '#/components/schemas/SignedUrl'}
        review: {oneOf: [{$ref: '#/components/schemas/Review'}, {type: 'null'}], description: 'the reviewer''s verdict on this try; null when not reviewed'}
        best: {type: boolean, description: 'the try kept as the image (exactly one per image)'}
        picked: {type: boolean, description: 'the brand chose this try (POST /images/{image_id}/pick); absent or false = the reviewer''s pick'}
    Run:
      type: object
      required: [id, scope, category, group_key, sku_ids, image_ids, credits_quoted, feedback, status, error, created_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        scope: {$ref: '#/components/schemas/RunScope'}
        category: {type: [string, 'null']}
        group_key: {type: [string, 'null']}
        sku_ids: {type: array, items: {type: string, format: uuid}}
        image_ids: {type: array, items: {type: string, format: uuid}, description: 'the images this run renders (a stopped run: the ones it finished)'}
        credits_quoted: {type: number, minimum: 0, description: images × credits per image at the resolution; not charged}
        feedback: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/RunStatus'}
        error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    RunRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope: {type: string, enum: [sample, batch, all, skus]}
        category: {$ref: '#/components/schemas/LibraryId', description: 'sample and batch: required'}
        group_key: {type: string, maxLength: 64, description: 'batch: required'}
        sku_ids: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}, description: 'skus: required'}
        missing_only: {type: boolean, default: false, description: 'only the brief poses with no live image (after adding poses)'}
    RegenerateRequest:
      type: object
      required: [image_ids, feedback]
      additionalProperties: false
      properties:
        image_ids: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
        feedback: {type: string, minLength: 1, maxLength: 2000}
        ratio: {$ref: '#/components/schemas/Ratio', description: 'render the new revisions at this ratio (a Library ratios[].id, else 422); absent = each shot''s brief ratio'}
    RunAccepted:
      type: object
      required: [run, images, skus]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        images: {type: array, items: {$ref: '#/components/schemas/Image'}, description: the new generating images}
        skus: {type: array, items: {$ref: '#/components/schemas/Sku'}, description: the SKUs of the run, now Queued}
    RunStopped:
      type: object
      required: [run, skus, removed_image_ids]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        skus: {type: array, items: {$ref: '#/components/schemas/Sku'}, description: 'the SKUs of the run, as they are now'}
        removed_image_ids: {type: array, items: {type: string, format: uuid}, description: 'the run''s generating images, now deleted'}
    ImagesStop:
      type: object
      required: [image_ids]
      additionalProperties: false
      properties:
        image_ids: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
    ImagesStopped:
      type: object
      required: [skus, runs, removed_image_ids]
      properties:
        skus: {type: array, items: {$ref: '#/components/schemas/Sku'}, description: 'the stopped images'' SKUs, as they are now'}
        runs: {type: array, items: {$ref: '#/components/schemas/Run'}, description: 'the runs it changed (failed when stopped whole)'}
        removed_image_ids: {type: array, items: {type: string, format: uuid}, description: 'the images it stopped, now deleted'}
    ImagePick:
      type: object
      required: [attempt]
      additionalProperties: false
      properties: {attempt: {type: integer, minimum: 1, description: 'an attempts[].index of the image'}}
    ImageReview:
      type: object
      required: [status]
      additionalProperties: false
      properties: {status: {type: string, enum: [approved, rejected]}}
    Reviewed:
      type: object
      required: [image, sku]
      properties:
        image: {$ref: '#/components/schemas/Image'}
        sku: {$ref: '#/components/schemas/Sku'}
    ApproveRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        image_ids: {type: array, minItems: 1, maxItems: 1000, items: {type: string, format: uuid}}
        sku_ids: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
        category: {$ref: '#/components/schemas/LibraryId'}
    Approved:
      type: object
      required: [approved, images, skus]
      properties:
        approved: {type: integer, minimum: 0, description: images approved by this call}
        images: {type: array, items: {$ref: '#/components/schemas/Image'}}
        skus: {type: array, items: {$ref: '#/components/schemas/Sku'}}
    NextAction:
      type: object
      description: what a Next step button does — `run` is a `POST .../runs` body, `download` a `POST .../download`
      required: [type]
      properties:
        type: {type: string, enum: [run, download]}
        scope: {type: string, enum: [sample, batch, all]}
        category: {$ref: '#/components/schemas/LibraryId'}
        group_key: {type: string}
    NextOption:
      type: object
      required: [label, action, credits, worst_credits]
      properties:
        label: {type: string, examples: [Run sample · Rings]}
        action: {$ref: '#/components/schemas/NextAction'}
        credits: {type: [number, 'null'], description: quote for a run; null for download}
        worst_credits: {type: [number, 'null'], description: 'the worst case of `credits`: each image rendered its product''s max_attempts times; null for download'}
    NextStep:
      type: object
      required: [heading, state, line, options]
      properties:
        heading: {type: string, examples: [Next step · Rings]}
        state: {type: string, enum: [next, in_progress, review, done], description: 'in_progress: something generating; review: everything run, images waiting; done: all approved'}
        line: {type: string, description: 'starts with the images waiting for review, e.g. "R-001 is ready on the right — approve, reject or write feedback there."'}
        options: {type: array, maxItems: 2, items: {$ref: '#/components/schemas/NextOption'}, description: Option 1 then Option 2; never approvals}

    # ---------------------------------------------------------- catalog: typed requests, events, download
    TypedRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
        image_ids: {type: array, maxItems: 500, items: {type: string, format: uuid}, description: images selected as tags in the composer (feedback target)}
        confirm_credits:
          type: [number, 'null']
          minimum: 0
          description: |
            the credits of the quote the client showed (`update.quote.credits`). A request that would queue a run or a
            regeneration only queues it when this matches its quote; otherwise nothing changes and the answer carries
            `update.quote` instead of `update.run` (credits shown before every run and regenerate).
    TypedAction:
      type: string
      enum: [run, approve, add_pose, remove_pose, set_poses, open_pose_editor, download, feedback, reply, not_understood]
      description: |
        reply: understood, but nothing to do (the reply says why, e.g. "Nothing in Necklaces is waiting for
        approval."); not_understood: the "What I can do" guide, nothing spent; open_pose_editor: the client opens the
        editor with `update.pose_editor`.
    TypedResponse:
      type: object
      required: [action, reply, update]
      properties:
        action: {$ref: '#/components/schemas/TypedAction'}
        reply: {type: string}
        update:
          type: object
          description: the slices that changed (absent = unchanged)
          properties:
            run: {$ref: '#/components/schemas/Run'}
            images: {type: array, items: {$ref: '#/components/schemas/Image'}}
            skus: {type: array, items: {$ref: '#/components/schemas/Sku'}}
            download: {$ref: '#/components/schemas/Download'}
            pose_editor:
              type: object
              required: [category, poses]
              properties:
                category: {$ref: '#/components/schemas/LibraryId'}
                poses: {type: array, items: {$ref: '#/components/schemas/LibraryId'}, description: the current poses, ticked}
            quote:
              type: object
              description: 'not done yet: what the action would render and cost; send the request again with `confirm_credits` to go ahead'
              required: [images, credits, worst_credits]
              properties:
                images: {type: integer, minimum: 1}
                credits: {type: number, minimum: 0}
                worst_credits: {type: number, minimum: 0, description: 'every review fails: each image rendered its product''s max_attempts times'}
    EventType: {type: string, enum: [status, log, step, question, skus, image, run, usage]}
    SessionEvent:
      type: object
      description: |
        One stored `evt.catalog.<session_id>.<type>` message. `data` is that message's `data`
        (contracts/messages/evt.catalog.<type>.schema.json) except object keys, which catalog_service turns into signed
        `*_url` fields and ids: question → the `Question`, skus → `{skus: [Sku]}`, image → the `Image`, run → the
        `Run` plus `sku_id`/`line`; status, log, step, usage as published.
      required: [seq, type, work_id, ts, data]
      properties:
        seq: {type: integer, minimum: 1, description: per-session cursor}
        type: {$ref: '#/components/schemas/EventType'}
        work_id: {type: [string, 'null'], format: uuid, description: the process or run id that produced it}
        ts: {type: string, format: date-time}
        data: {type: object}
    EventPage:
      type: object
      required: [events, last_seq]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/SessionEvent'}}
        last_seq: {type: integer, minimum: 0, description: next `since` (unchanged when the page is empty)}
    Download:
      type: object
      required: [url, file_name, skus, images]
      properties:
        url: {$ref: '#/components/schemas/SignedUrl'}
        file_name: {type: string, examples: [catalog_approved.zip]}
        skus: {type: integer}
        images: {type: integer}

    # ---------------------------------------------------------- auth_service
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email: {type: string, format: email, maxLength: 254, description: 'trimmed and lower-cased; a plain address (no display name)'}
        password: {type: string, minLength: 10, maxLength: 256, description: 'common passwords are refused (422 "password is too common")'}
        name: {type: string, minLength: 1, maxLength: 200, description: trimmed; must not be blank}
    SigninRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, description: 'normalised like sign-up; a malformed one is just a failed sign-in (401)'}
        password: {type: string}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string, description: 'empty = 401'}}
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string}
        new_password: {type: string, minLength: 10, maxLength: 256, description: common passwords are refused}
    User:
      type: object
      required: [id, email, name, roles, disabled, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}, description: sorted; may be empty}
        disabled: {type: boolean}
        created_at: {type: string, format: date-time}
    UserList:
      type: object
      required: [users]
      properties: {users: {type: array, items: {$ref: '#/components/schemas/User'}}}
    Session:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: {type: string, description: 'RS256 JWT (kid in the header; claims iss, sub, email, roles, jti, fid = session family, iat, exp); ACCESS_TTL, default 15 min'}
        refresh_token: {type: string, description: 'opaque; REFRESH_TTL, default 30 days; single use, rotated by /auth/refresh'}
        user: {$ref: '#/components/schemas/User'}
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, use, alg, kid, n, e]
            properties:
              kty: {const: RSA}
              use: {const: sig}
              alg: {const: RS256}
              kid: {type: string}
              n: {type: string, description: base64url modulus}
              e: {type: string, description: base64url exponent}
    Role:
      type: string
      enum: [user, dev, admin]
      description: 'user: Catalog Agent; dev: also the dev Jobs view (web DEV_VIEWS); admin: user management, only the ADMIN_EMAIL account'
    GrantableRole:
      type: string
      enum: [user, dev]
      description: 'a role the admin can give; admin is not one (422): it belongs to the ADMIN_EMAIL account alone'
    UserCreate:
      type: object
      required: [email, password, roles]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254, description: 'trimmed and lower-cased; a plain address'}
        password: {type: string, minLength: 10, maxLength: 256, description: 'common passwords are refused (422 "password is too common")'}
        name: {type: string, maxLength: 200, description: 'trimmed; empty or missing = the part of the email before @'}
        roles: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GrantableRole'}}
    DisabledRequest:
      type: object
      required: [disabled]
      properties: {disabled: {type: boolean, description: 'true disables (and revokes all sessions), false re-enables; a missing field reads as false'}}
    RolesRequest:
      type: object
      required: [roles]
      properties: {roles: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GrantableRole'}, description: replaces the roles; duplicates are ignored}}
    PasswordRequest:
      type: object
      required: [password]
      properties: {password: {type: string, minLength: 10, maxLength: 256, description: common passwords are refused}}
    ApiKeyCreate:
      type: object
      required: [client]
      properties:
        client: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$', description: client name; created if new}
        scopes: {type: [array, 'null'], items: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$'}, description: 'default []'}
    ApiKey:
      type: object
      required: [id, client_id, client, prefix, scopes, created_at, revoked_at, last_used_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        client: {type: string}
        prefix: {type: string, description: 'first 12 characters of the key ("ora_" + 8), for recognising it'}
        scopes: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time, description: updated at most once a minute}
    ApiKeyCreated:
      allOf:
        - {$ref: '#/components/schemas/ApiKey'}
        - type: object
          required: [key]
          properties: {key: {type: string, pattern: '^ora_[A-Za-z0-9_-]{43}$', description: the raw key; returned only here}}
    ApiKeyList:
      type: object
      required: [api_keys]
      properties: {api_keys: {type: array, items: {$ref: '#/components/schemas/ApiKey'}}}
