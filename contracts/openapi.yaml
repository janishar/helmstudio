openapi: 3.1.0
info:
  title: helmstudio — public API
  version: 1.55.0
  description: |
    Public HTTP contract of helmstudio (the paths behind Kong): `/v1/studio/*` is served by studio_service,
    `/files/*` by files_service, `/auth/*` by auth_service. contract_tests/ checks them against this file. Design:
    docs/plan/13-services.md.

    Conventions:
    - Every `/v1` call needs the client's `x-api-key` (Kong) and the user's `Authorization: Bearer <access token>`.
    - Errors are `{"detail": string}` (`Error`), 422 included; Kong's own errors are `{message}` (`GatewayError`).
    - Ids are UUIDs unless named otherwise (workflow ids and host names are short strings from the registry). A
      malformed id in a path is treated as unknown: 404, never 422. Another user's id is a 404 too.
    - `url` fields are signed, time-limited links (`/files/{path}?exp=&sig=`). Clients treat them as opaque.
    - Every mutating call returns the updated resource.
    - Long work (a run) answers 202 and is followed through `GET /v1/studio/sessions/{session_id}/events`; a batch
      through `GET /v1/studio/batches/{batch_id}/events`.
    - Enum values in responses may grow in a minor version (a take `source` of `timeline`); clients
      show an unknown value as is.
    - Object keys of takes are never exposed: a take carries signed `url` / `thumb_url` only.
    - 409 means the resource's state forbids the call (a run already finished, a session with a run in progress).
    - `/auth/*` (tag `auth`) is served by auth_service and marked `x-status: built`. Its internal `GET /verify/apikey`
      (Kong plugin only) and the NATS request/reply `auth.validate.*` are documented in contracts/README.md, not here.
servers:
  - url: http://localhost:8300
security:
  - {ApiKey: [], BearerJWT: []}
tags:
  - {name: studio, description: 'studio_service: sessions, workflows, pipelines, the library (elements), LoRAs, runs, the queue, events, hosts, takes (the gallery), uploads, batches; from 1.16 models, model jobs, the hosts admin and import; from 1.17 timelines (sequences, shots, re-render, export) and media jobs; from 1.18 hosts with a discrete GPU and several GPU hosts (contracts/README.md, Hosts with a discrete GPU; Several hosts); from 1.19 media inputs (video and audio takes into a workflow), audio uploads, take actions ("Use in…" offers, a Timeline clip''s actions; contracts/README.md, Media inputs); from 1.21 the native runtime (a model run by a child process; contracts/README.md, the minimax-h3 family); from 1.22 video and audio takes in rows (MiniMax H3 references), rows that must stay empty while an input is wired (`not_with`), optional image nodes and offers only into placed inputs (contracts/README.md, Media inputs: rows of media); from 1.23 LoRA strengths 0..2 (looks saved before are clamped when read; contracts/README.md, Looks); from 1.24 the model component a node loads (NodeSchema.component); from 1.25 an inspector section''s help, the presets'' order (StudioLayout.preset_order) and a run''s planned peak before it is sent (POST /v1/studio/runs/plan); from 1.26 an inspector section''s choice tiles (LTX''s Recipe: two-stage or one-stage); from 1.28 a judge''s branch without `then` (Ask me) and a judge test on picked takes (POST /v1/studio/pipelines/{pipeline_id}/judge-tests); from 1.29 a V1 clip''s shot number (TimelineClip.number: "Shot 4"); from 1.30 voices: audio takes made by runs (the `Audio` port, `Workflow.media` audio), the `voice` param, saved voices in the library (designed voices and the packs'' starter voices; contracts/README.md, Voices); from 1.31 cloned voices (a 3–30 s clip of an audio take or a video''s sound, with consent), designed voices that keep a clip, Save as voice (`from_take` with `kind: voice`) and the zonos3 family (contracts/README.md, Voices: cloned voices); from 1.32 dialogue and Timeline audio: dialogue scripts (`script` text params expanded into `lines` rows whose items carry a voice), an element''s `voice_id`, cues on a dialogue''s take, audio takes on the audio tracks, New line (POST /v1/studio/timelines/{timeline_id}/lines), Make shot (a slot `exact` at an audio clip''s time), an export plan''s `sounds`, offers and pipeline binds into rows of one media field, `library.read` voices and the write node''s `form: script` (contracts/README.md, Dialogue and Timeline audio); from 1.44 the in-app assistant: chats, their events and memory, the admin''s assistant settings, search providers (kind `search`) and the Gallery''s `order` (contracts/README.md, Assistant); from 1.47 rules (refusals as data, ParamSchema.rules), option help (ParamSchema.option_help), a native node''s peak formula and sound limits (NodeSchema.peak_gb, sounds: the planned peak per run) and the Preset heading''s help (StudioLayout.preset_help); from 1.48 thumbnails: every list''s `thumb_url` is a small WebP of the image or the poster once made, `RunOutput.thumb_url` (contracts/README.md, Thumbnails); from 1.49 timeline edits by named ops (POST …/timelines/{timeline_id}/edits: a dry run, a diff, studio-made clip ids), the revision history and restore to any kept revision, the agent view (`view=agent`) and a stored frame at a sequence time (contracts/README.md, Timeline: edits by ops); from 1.50 the Timeline tools'' ops (roll, slip, slide, overwrite, split_all, remove_range, lift_range, an audio track''s ripple remove), linked sound clips (`TimelineClip.link`) and markers (`TimelineDoc.markers`, the marker ops; contracts/README.md, Timeline rules: tools, linked clips, markers); from 1.51 provider presets (GET /v1/studio/admin/provider-presets, a preset''s Fetch, a key file''s status, `Provider.compat` and `preset`; contracts/README.md, Model sources: presets); from 1.52 saving a provider key (PUT and DELETE /v1/studio/admin/provider-keys/{key_secret}, `ProviderKey.writable`; contracts/README.md, Model sources: Keys); from 1.53 thinking per model (`Provider.thinking`, `thinking_levels`, `ProviderPut.thinking`, `ProviderTest.thinking`, `ProviderPreset.thinking`, a model source''s `thinking`; contracts/README.md, Model sources: thinking); from 1.55 a provider''s fixed extra headers (`ProviderCompat.headers`: Anthropic''s anthropic-version; contracts/README.md, Model sources: compat)'}
  - {name: files, description: signed file downloads and uploads}
  - name: auth
    description: 'auth_service: users, sessions (JWT access + rotating refresh tokens), roles, client API keys'

paths:
  # ------------------------------------------------------------------ studio: sessions
  /v1/studio/sessions:
    get:
      tags: [studio]
      operationId: studioListSessions
      summary: The caller's sessions, newest first (at most 100, not paginated)
      description: 'From 1.43 `naming` says how new sessions get their title (contracts/README.md, Sessions: titles and naming), so Create can say so before a prompt leaves the machine.'
      responses:
        '200': {description: sessions, content: {application/json: {schema: {$ref: '#/components/schemas/SessionList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreateSession
      summary: A new, empty session
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionCreate'}}}
      responses:
        '201': {description: the session, content: {application/json: {schema: {$ref: '#/components/schemas/StudioSession'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/sessions/{session_id}:
    get:
      tags: [studio]
      operationId: studioGetSession
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {description: the session, content: {application/json: {schema: {$ref: '#/components/schemas/StudioSession'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      tags: [studio]
      operationId: studioRenameSession
      description: 'From 1.43 a rename makes the title the user''s (`title_source` user, `named_by` null): the namer never replaces it.'
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionPatch'}}}
      responses:
        '200': {description: the renamed session, content: {application/json: {schema: {$ref: '#/components/schemas/StudioSession'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteSession
      summary: Delete a session with its runs and events
      description: |
        409 while one of its runs is queued or running (cancel it first), or while a batch in it is queued, running or
        paused (stop it first). From 1.43 its hidden naming run (`purpose` name) does not count: the delete cancels it. Its takes stay in the gallery with `session_id` and `run_id` set to null (`made_with`
        is a snapshot); its finished batches stay with `session_id` and their rows' `run_id` set to null.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: workflows
  /v1/studio/workflows:
    get:
      tags: [studio]
      operationId: studioListWorkflows
      summary: The templates the runners publish in the registry, then the caller's own workflows
      description: |
        Templates (`source: template`) are read from the KV `registry` keys `<host>.<env>.workflows` and `.nodes`,
        whether or not a host with that env is live now (`GET /v1/studio/hosts` tells); the same id from several hosts
        is listed once; sorted by title. Then the caller's own workflows (`source: mine`, at most 200), newest
        `updated_at` first. `problems` is never in a list (only `GET /v1/studio/workflows/{workflow_id}`).
      parameters:
        - {name: source, in: query, required: false, schema: {$ref: '#/components/schemas/WorkflowSource'}, description: 'only templates or only the caller''s own; absent = both'}
        - {name: media, in: query, required: false, schema: {$ref: '#/components/schemas/WorkflowMedia'}, description: 'only workflows whose takes are images, videos or (1.30) audio (the Image / Video / Audio switch); absent = all three. Another value is 422'}
      responses:
        '200': {description: workflows, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreateWorkflow
      summary: Save a workflow of the caller's own, from a whole document or as a copy of another
      description: |
        Two forms (`WorkflowCreate`): a whole document (`title`, `family`, `env`, `nodes`, optional `studio`, optional
        `based_on`), or `{based_on, title?}` to copy a template or one of the caller's workflows (nodes, positions,
        studio, family, env; `title` absent = `<source title> copy`, cut to 80 characters). The new workflow's id is a
        UUID, `version` 1. The document is checked with the graph rules (contracts/README.md, Graph rules): any
        problem that blocks saving is 422 `WorkflowError` with every problem; problems that only block running
        (`unknown_kind`, `env_mismatch`, `required_input`, `no_output`) do not stop the save and are in the answer's
        `problems`. 404 when `based_on` is unknown or another user's. 409 when the caller already has 200 workflows
        (`You have 200 workflows; delete some first.`). 503 while studio's registry watches have not delivered yet.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowCreate'}}}
      responses:
        '201': {description: 'the workflow, with problems', content: {application/json: {schema: {$ref: '#/components/schemas/Workflow'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/WorkflowUnprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/workflows/validate:
    post:
      tags: [studio]
      operationId: studioValidateWorkflow
      summary: Check a workflow document with the graph rules without saving it
      description: |
        Runs every graph rule (contracts/README.md, Graph rules) against the live node palette (`GET /v1/studio/nodes`)
        and answers every problem, with `can_save` and `can_run`. A body that does not fit `WorkflowDoc` (the JSON
        schema: a node id that is not a slug, a missing `kind`, …) is a plain 422 `{detail}`; graph problems are
        never a 422 here. 503 while studio's registry watches have not delivered yet.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowDoc'}}}
      responses:
        '200': {description: the problems, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowValidation'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/workflows/{workflow_id}:
    get:
      tags: [studio]
      operationId: studioGetWorkflow
      description: |
        A template (a registry slug) or one of the caller's workflows (a UUID; another user's is 404), with
        `node_schemas` for every kind of its nodes found in the registry (live or not; a kind no runner publishes at
        all is left out) and `problems`: the graph rules against the live palette now (an offline env makes its
        kinds `unknown_kind`).
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      responses:
        '200': {description: the workflow, content: {application/json: {schema: {$ref: '#/components/schemas/Workflow'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [studio]
      operationId: studioReplaceWorkflow
      summary: Replace one of the caller's workflows with an edited document
      description: |
        Optimistic concurrency: `version` is the version the edit started from. When it is not the stored version,
        409 `workflow changed since you opened it (now version <n>)` and nothing changes; the client reloads and
        re-applies. On success `version` + 1 and `updated_at` now. Checked like POST: save-blocking problems are 422
        `WorkflowError`. Runs, batches and takes made before keep their snapshot (README, User workflows). 409 for a
        template id (`templates cannot be changed; save a copy`). 404 for another user's.
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowUpdate'}}}
      responses:
        '200': {description: 'the workflow, with problems', content: {application/json: {schema: {$ref: '#/components/schemas/Workflow'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/WorkflowUnprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      tags: [studio]
      operationId: studioRenameWorkflow
      summary: Rename one of the caller's workflows
      description: '`version` + 1 (an editor holding the old version gets 409 on its next PUT). 409 for a template id.'
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowPatch'}}}
      responses:
        '200': {description: the workflow, content: {application/json: {schema: {$ref: '#/components/schemas/Workflow'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteWorkflow
      summary: Delete one of the caller's workflows
      description: |
        409 while a run of it is `queued` or `running` (`a run of this workflow is unfinished; cancel it or wait`) or a
        batch of it is `queued`, `running` or `paused` (`a batch of this workflow is unfinished; stop it or wait`), and
        for a template id. Past runs, batches and takes keep their snapshots; reuse of their takes answers
        `workflow_status: deleted`. Deleting again is 404.
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/nodes:
    get:
      tags: [studio]
      operationId: studioListNodes
      summary: The node palette — every node kind a live runner publishes now, grouped by family
      description: |
        From the KV `registry` keys `<host>.<env>.nodes` of every host whose `hosts` key is fresh (30 s). A kind
        published by several live hosts or envs is listed once, with every env (`envs`) and the schema of the newest
        `published_at`. Groups: core kinds (`family: null`, title `Core`) first, then each family sorted by title (the
        model title from the family's live `models` entry, else the family id); kinds in a group in the order the
        newest publisher lists them. `env` keeps only kinds that env publishes. 503 while studio's registry watches
        have not delivered yet.
      parameters:
        - {name: env, in: query, required: false, schema: {type: string, pattern: '^[a-z0-9]{1,32}$'}, description: 'only kinds this env publishes (a workflow''s env); absent = all'}
      responses:
        '200': {description: the palette, content: {application/json: {schema: {$ref: '#/components/schemas/NodePalette'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: pipelines (API 1.7)
  /v1/studio/pipelines:
    get:
      tags: [studio]
      operationId: studioListPipelines
      summary: The caller's pipelines, newest `updated_at` first (at most 100, not paginated)
      description: 'Each with `workflow_titles` and `last_batch`; `problems` is never in a list (only `GET /v1/studio/pipelines/{pipeline_id}`).'
      responses:
        '200': {description: pipelines, content: {application/json: {schema: {$ref: '#/components/schemas/PipelineList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreatePipeline
      summary: Save a pipeline, from a whole document or as a copy of one of the caller's pipelines
      description: |
        Mirrors `POST /v1/studio/workflows`. Two forms (`PipelineCreate`): a whole document (optional `based_on`), or
        `{based_on, title?}` to copy one of the caller's pipelines ("Duplicate"; `title` absent = `<source title> copy`,
        cut to 80 characters). The new pipeline's id is a UUID, `version` 1. Checked with the pipeline rules
        (contracts/README.md, Pipeline rules) as the caller: any save-blocking problem is 422 `PipelineError` with every
        problem; run-blocking problems are saved and returned in `problems`. 404 when `based_on` is unknown or another
        user's. 409 when the caller already has 100 pipelines (`You have 100 pipelines; delete some first.`). 503 while
        studio's registry watches have not delivered yet.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PipelineCreate'}}}
      responses:
        '201': {description: 'the pipeline, with problems', content: {application/json: {schema: {$ref: '#/components/schemas/Pipeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/PipelineUnprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/pipelines/validate:
    post:
      tags: [studio]
      operationId: studioValidatePipeline
      summary: Check a pipeline document with the pipeline rules without saving it
      description: |
        Every pipeline rule (contracts/README.md, Pipeline rules), as the caller (the workflows it names are looked up
        among the templates and the caller's workflows, each checked with the graph rules against the live palette).
        A body that does not fit `PipelineDoc` is a plain 422 `{detail}`; pipeline problems are never a 422 here.
        503 while studio's registry watches have not delivered yet.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PipelineDoc'}}}
      responses:
        '200': {description: the problems, content: {application/json: {schema: {$ref: '#/components/schemas/PipelineValidation'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/pipelines/{pipeline_id}:
    get:
      tags: [studio]
      operationId: studioGetPipeline
      description: 'One of the caller''s pipelines (another user''s is 404) with `problems` against the workflows and the live palette now.'
      parameters: [{$ref: '#/components/parameters/PipelineId'}]
      responses:
        '200': {description: the pipeline, content: {application/json: {schema: {$ref: '#/components/schemas/Pipeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [studio]
      operationId: studioReplacePipeline
      summary: Replace one of the caller's pipelines with an edited document
      description: |
        Like `PUT /v1/studio/workflows/{workflow_id}`: `version` is the version the edit started from; stale = 409
        `pipeline changed since you opened it (now version <n>)` and nothing changes. On success `version` + 1 and
        `updated_at` now. Save-blocking problems are 422 `PipelineError`. Batches made before keep their snapshot.
      parameters: [{$ref: '#/components/parameters/PipelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PipelineUpdate'}}}
      responses:
        '200': {description: 'the pipeline, with problems', content: {application/json: {schema: {$ref: '#/components/schemas/Pipeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/PipelineUnprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      tags: [studio]
      operationId: studioRenamePipeline
      summary: Rename one of the caller's pipelines
      description: '`version` + 1 (an editor holding the old version gets 409 on its next PUT).'
      parameters: [{$ref: '#/components/parameters/PipelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PipelinePatch'}}}
      responses:
        '200': {description: the pipeline, content: {application/json: {schema: {$ref: '#/components/schemas/Pipeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeletePipeline
      summary: Delete one of the caller's pipelines
      description: |
        409 while a batch of it is `queued`, `running`, `waiting` or `paused` (`a batch of this pipeline is
        unfinished; stop it or wait`). Past batches and takes keep their snapshots. Deleting again is 404.
      parameters: [{$ref: '#/components/parameters/PipelineId'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/pipelines/{pipeline_id}/judge-tests:
    post:
      tags: [studio]
      operationId: studioCreateJudgeTest
      summary: Test a judge of the saved pipeline on takes the caller picks (the Judge panel's Test on takes)
      description: |
        From 1.28. One ask run of the judge as saved (criteria, keep, model, memory: the pipeline's memory now), on
        1 to 8 of the caller's image or video takes in the order given; nothing is stored in memory and no batch is
        made. The brief is the first take's prompt. Studio resolves the model as at Submit (a `server:` or `remote:`
        model, or none: 422), asks pipelines_service for the filled `judge` template (`pipelines.judge.test`
        `prompt`, 5 s: else 503) and makes an interactive run of the ask workflow in the first take's session (else
        the caller's newest session; none: 422). 202 with the test `queued` (or `failed` at once with no live
        host); follow it with GET /v1/studio/judge-tests/{test_id}. Another user's pipeline or take: 404; a node that
        is not a judge, a take that is not an image or video: 422; too many open runs: 409.
      parameters: [{$ref: '#/components/parameters/PipelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JudgeTestCreate'}}}
      responses:
        '202': {description: the test, content: {application/json: {schema: {$ref: '#/components/schemas/JudgeTest'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/studio/judge-tests/{test_id}:
    get:
      tags: [studio]
      operationId: studioGetJudgeTest
      summary: A judge test, with each take's verdict and reason once its run has answered
      description: |
        From 1.28. `status` follows the ask run. Once it succeeded, pipelines derives the verdict from the answer
        (`pipelines.judge.test` `verdict`, as a batch's judge: contracts/README.md, Judge verdict; 5 s: else 503) and
        studio keeps it; an answer that fails the checks is `failed` with that error (a test never re-asks).
      parameters:
        - {name: test_id, in: path, required: true, schema: {type: string}, description: 'judge test UUID (unknown, another user''s or malformed = 404)'}
      responses:
        '200': {description: the test, content: {application/json: {schema: {$ref: '#/components/schemas/JudgeTest'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: the library (elements; looks later)
  /v1/studio/library:
    get:
      tags: [studio]
      operationId: studioListLibrary
      summary: The caller's library items and the starter looks of the live hosts (not paginated); the `@` menu searches it with `q`, the visual picker asks with `workflow`
      description: |
        The caller's own items (at most 200) plus every starter look a live host publishes (contracts/README.md,
        Looks: starter looks). Filters combine with AND. `q` (trimmed, a leading `@` dropped, lower-cased; blank = no
        filter) matches an item whose `handle` starts with it or whose `name`, lower-cased, starts with it. `source`
        keeps one source; `family` keeps the items whose `family` is null or equal to it. Order: with `q`, the item
        whose handle equals it first, then by `handle` (code points; null handles last), then `name`; without `q`, own
        items newest `updated_at` first, then starter looks by `name` (code points), then `id`. `limit` cuts the list
        (the `@` menu asks for 8). Images of deleted takes are left out of every item (contracts/README.md, Elements).
        `workflow` (a template slug or one of the caller's workflow UUIDs; 422 `unknown workflow <id>`) filters nothing:
        it adds `fits` and `reason` to every item, against that workflow's graph and the caller's LoRAs now
        (contracts/README.md, Looks: fit); the picker greys the items that do not fit with the reason.

        From 1.30 the list also holds the caller's voices and every starter voice a live host publishes
        (contracts/README.md, Voices: starter voices), ordered as the starter looks (by `name`, then `id`, after the own
        items); `kind=voice` keeps only voices. With `workflow`, a voice's `fits` / `reason` is the voice fit
        (`this workflow takes no voice`, `this workflow cannot use a designed voice`, `this workflow cannot use a preset
        voice`, `this workflow cannot clone a voice`, `voice <name> is for <family>`), and in a workflow whose media is
        audio every look answers `looks do not apply to speech` and every element `mentions are not read aloud; use a
        dialogue script`.
      parameters:
        - {name: kind, in: query, required: false, schema: {$ref: '#/components/schemas/LibraryKind'}}
        - {name: group, in: query, required: false, schema: {$ref: '#/components/schemas/LibraryGroup'}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 80}, description: 'prefix of a handle or a name'}
        - {name: source, in: query, required: false, schema: {$ref: '#/components/schemas/LibrarySource'}}
        - {name: family, in: query, required: false, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}, description: 'items for this family: `family` null or equal'}
        - {name: workflow, in: query, required: false, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}, description: 'annotate every item with `fits` / `reason` for this workflow'}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        '200': {description: items, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryItemList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreateLibraryItem
      summary: Make an element from 1 to 4 of the caller's gallery images, a look (also "Save as look" on a take) or a voice (also "Save as voice")
      description: |
        Looks (`kind: look`, contracts/README.md, Looks: own looks): `group` film|camera|colour|lighting, no handle,
        0-4 images (checked as an element's), 0-4 `loras`, at least one of text, an image, a LoRA. 422 `group <g> is
        not a look group` (or `… is not an element group`), `a look has no handle`, `a look needs text, an image or a
        LoRA`, `loras: a look has at most 4 LoRAs`, `loras[2]: LoRA <name> is listed twice`, `loras: an element has
        no LoRAs`, `from_take makes looks and voices only`, `from_take: take <id> was not made by a run` (an upload); 404
        `loras[2].lora: LoRA <id> not found` (unknown, another user's, deleted, pending, rejected, or shared and
        listed by no live host), `from_take: take <id> not found` (unknown, another user's, deleted). `from_take`
        fills `text` (option `prompt`) and `loras` (option `loras`) when the body leaves them out, then every rule
        above applies. Looks count in the same 200 items as elements; handle uniqueness concerns elements only.

        `name` and `text` are trimmed. 422: `name must be 1-80 characters`, `handle must be a slug: a-z, 0-9, - and _,
        starting with a letter, ending with a letter or digit, at most 40 characters`, `text must be at most 2000
        characters` (code points), `name must not contain control characters`, `text must not contain control
        characters other than newlines and tabs`, `images: an element has 1 to 4 images`, `images[2]: take <id> is listed twice`,
        `images[2]: take <id> is not an image`, `images[2]: take <id> has no size` (items from 1). 404 `images[2]: take
        <id> not found` for a take that is unknown, another user's, deleted or a pending upload. 409 `handle @<handle>
        is already used` (unique per owner, over every kind), 409 `You have 200 library items; delete some first.`
        201 with `version` 1.

        Voices (from 1.30, `kind: voice`, contracts/README.md, Voices): only `group: designed` can be made (`name`,
        `voice {design, language?, style?}`); the item's `voice.source` is `designed`, `handle` null, `text` "",
        no images or LoRAs; voices count in the same 200 items. 422 `group <g> is not a voice group`, `preset voices
        come from packs`, `cloned voices are not available yet` (group cloned), `a voice has no handle`, `a voice has
        no text; describe it in voice.design`, `images: a voice has no images`, `loras: a voice has no LoRAs`,
        `voice: a designed voice needs voice.design`, `voice.design must be 1-2000 characters`, `voice.language: <tag>
        is not a BCP 47 language tag`, `voice.style must be at most 500 characters`, `voice.design must not contain
        control characters other than newlines and tabs`, `voice: only a voice has voice fields` (an element or look
        with `voice`).

        From 1.32 a character element may carry `voice_id` (contracts/README.md, Dialogue: elements carry a voice): one
        of the caller's voices or a starter voice a live host publishes, resolved as the caller. 422 `voice_id: only a
        character has a voice` (a location, prop, look or voice with a non-null `voice_id`); 404 `voice_id: voice <id>
        not found` (unknown, another user's, deleted, an element or look, or a starter voice no live host publishes).
        Its fit is not checked here (a dialogue's run checks it per line). PUT checks the same.

        From 1.31 (contracts/README.md, Voices: cloned voices) `group: cloned` makes a voice from a clip: `voice {clip:
        MediaRef, consent: true, language?, style?}`; a designed voice may carry a clip too (then it also needs
        `consent`). The clip is checked like a `media` param with `accepts: [audio]`, `trim`, `min_s` 3, `max_s` 30 (in /
        out snapped, missing in = 0, out = min(duration, 30)) and stored as the take id with the snapped in / out; the
        voice's `from_take_id` is that take. "Save as voice" = `from_take {take_id, in?, out?}` with `kind: voice`: the
        take (an audio take or a video with sound, an upload included) is the clip; with `group: designed` and no
        `voice.design` the design, language and style are copied from the first designed voice in the take's
        `made_with.voices`. 404 `voice.clip: take <id> not found` / `from_take: take <id> not found` (unknown, another
        user's, deleted, pending). 422 `cloned voices are not available yet` is gone; new: `voice: a cloned voice needs
        voice.clip`, `voice.design: a cloned voice has no design`, `voice.clip: give the clip or from_take, not both`,
        `voice.consent: tick "I have the right to use this voice"` (a clip without `consent: true`), `from_take: take
        <id> was not made with a designed voice` (group designed, no `voice.design`, none in `made_with.voices`), `from_take:
        voice <name> was deleted` (that designed voice is gone), `from_take: a look takes the whole take (no in or out)`,
        and the media texts under `voice.clip: ` or `from_take: ` (`take <id> has no sound`, `take <id> lasts <d> s;
        this input takes at least 3.0 s`, `in must be before out`, `out <x> is past the take's end <d>`, `the part lasts
        <d> s; this input takes at most 30.0 s`, `the part lasts <d> s; this input takes at least 3.0 s`).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LibraryItemCreate'}}}
      responses:
        '201': {description: the item, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryItem'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/library/{item_id}:
    get:
      tags: [studio]
      operationId: studioGetLibraryItem
      parameters: [{$ref: '#/components/parameters/LibraryItemId'}]
      responses:
        '200': {description: the item, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryItem'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [studio]
      operationId: studioReplaceLibraryItem
      summary: Replace an item's group, name, handle, text and images
      description: |
        Optimistic concurrency like workflows: `version` is the one the edit started from; stale = 409 `element changed
        since you opened it (now version <n>)` (a look: `look changed since you opened it (now version <n>)`), nothing
        changes. A look is checked like POST with `kind: look` (no `from_take`; `from_take_id` stays). From 1.31 a voice's
        clip may be changed (checked like POST; `from_take_id` follows it; a clip needs `consent` again). From 1.32 an
        element's `voice_id` is checked like POST (a stored one that is gone since may be sent back: it saves null). Checked like POST (the handle may stay its own). On
        success `version` + 1, `updated_at` now. Takes made before keep their resolved graph; their reuse answers this
        element `changed`. `kind` never changes. From 1.30 a designed voice is checked like POST with `kind: voice` (its
        `voice` required; stale = 409 `voice changed since you opened it (now version <n>)`); takes made before keep the
        voice they ran with (`made_with.voices` records the version).
      parameters: [{$ref: '#/components/parameters/LibraryItemId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LibraryItemUpdate'}}}
      responses:
        '200': {description: the item, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryItem'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteLibraryItem
      summary: Delete an item (always allowed)
      description: |
        Hard delete, never refused: past takes keep their resolved graph and `made_with.elements` / `made_with.looks`
        (from 1.32 a deleted voice leaves every element that named it reading `voice_id` null; its script lines then
        refuse `@<handle> has no voice`);
        their reuse answers this item `deleted`; a batch already submitted keeps its copy (contracts/README.md, Elements). A prompt that
        still mentions the handle is 422 at its next run. Deleting again is 404.
      parameters: [{$ref: '#/components/parameters/LibraryItemId'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/library/{family}/{look_id}:
    get:
      tags: [studio]
      operationId: studioGetStarterLook
      summary: A starter look or voice (id `<family>/<look_id>`, the same URL as `/library/` + the id)
      description: 'A starter look or (from 1.30) starter voice some live host publishes now (a family''s look and voice ids never clash); anything else is 404.'
      parameters: [{$ref: '#/components/parameters/LookFamily'}, {$ref: '#/components/parameters/StarterLookId'}]
      responses:
        '200': {description: the look, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryItem'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [studio]
      operationId: studioReplaceStarterLook
      summary: 'Always refused: starter looks are read-only'
      description: '409 `starter looks are read-only; save your own copy` for a starter look a live host publishes, from 1.30 `starter voices are read-only` for a starter voice; 404 otherwise. Nothing is read from the body.'
      parameters: [{$ref: '#/components/parameters/LookFamily'}, {$ref: '#/components/parameters/StarterLookId'}]
      responses:
        '200': {description: never answered, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryItem'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteStarterLook
      summary: 'Always refused: starter looks are read-only'
      description: '409 `starter looks are read-only; save your own copy` for a starter look a live host publishes, from 1.30 `starter voices are read-only` for a starter voice; 404 otherwise.'
      parameters: [{$ref: '#/components/parameters/LookFamily'}, {$ref: '#/components/parameters/StarterLookId'}]
      responses:
        '204': {description: never answered}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: LoRAs (contracts/README.md, LoRAs)
  /v1/studio/loras:
    get:
      tags: [studio]
      operationId: studioListLoras
      summary: The LoRAs the caller can use (shared ones of the live hosts, and the caller's own); not paginated
      description: |
        Shared LoRAs are the union of every live host's registry `<host>.<env>.loras` (one entry per id, `hosts` = the
        live hosts that list it, sorted; `family` = the first not `unknown` over those hosts); own LoRAs are the
        caller's rows in every `state` (owner-scoped; another user's never appear). Filters combine with AND:
        `source`, `family` (exact, `unknown` included), `q` (every whitespace-separated word occurs, case-insensitively,
        in `name`). Order: own first, newest `created_at` first; then shared by `name` (case-insensitive, code points),
        then `id`. `thumb_url` is the caller's oldest take whose `made_with.loras` has the id (never another user's).
        From 1.16 `usage` is the caller's quota use (every own LoRA, whatever the filters).
      parameters:
        - {name: source, in: query, required: false, schema: {$ref: '#/components/schemas/LoraSource'}}
        - {name: family, in: query, required: false, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}, description: 'only LoRAs detected for this family (`unknown`: those that fit none)'}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 80}, description: words of the name; blank = no filter}
      responses:
        '200': {description: LoRAs, content: {application/json: {schema: {$ref: '#/components/schemas/LoraList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreateLoraUpload
      summary: Start uploading an own LoRA; answers a signed files_service URL to PUT the file to
      description: |
        Stores the caller's LoRA `pending` (`name` = the file name without `.safetensors`, trimmed, cut to 80) and signs
        a single-use `PUT` link for `u/<caller>/loras/<lora_id>.safetensors` with `Content-Type:
        application/octet-stream`, valid 15 minutes (`PUT /files/{path}`, the take upload's pattern). 422 `only
        .safetensors files can be uploaded` (the name must end in `.safetensors`, any case; the bytes are checked at
        complete), `file is larger than 2 GB` (over 2147483648 bytes). 409 `You have 50 LoRAs; delete some first.`
        (every own LoRA counts, whatever its state) and 409 `Your LoRAs would use more than 20 GB; delete some first.`
        (`size_bytes` of the pending and ready ones, deleted ones included until the sweep removes their object a day
        later, plus this one, over 21474836480). A LoRA still `pending` an hour
        after it was created is deleted (with its object).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoraUploadCreate'}}}
      responses:
        '201': {description: the upload, content: {application/json: {schema: {$ref: '#/components/schemas/LoraUpload'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/loras/{lora_id}:
    get:
      tags: [studio]
      operationId: studioGetLora
      description: 'A shared LoRA a live host lists, or one of the caller''s own (any state); anything else is 404.'
      parameters: [{$ref: '#/components/parameters/LoraId'}]
      responses:
        '200': {description: the LoRA, content: {application/json: {schema: {$ref: '#/components/schemas/Lora'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      tags: [studio]
      operationId: studioRenameLora
      summary: Rename an own LoRA
      description: |
        `name` trimmed, then 1-80 characters without control characters (422 `name must be 1-80 characters`, `name must
        not contain control characters`). Takes made before keep the name they recorded. 409 `shared LoRAs are managed
        on their host` for a shared id.
      parameters: [{$ref: '#/components/parameters/LoraId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoraPatch'}}}
      responses:
        '200': {description: the LoRA, content: {application/json: {schema: {$ref: '#/components/schemas/Lora'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteLora
      summary: Delete an own LoRA (never refused)
      description: |
        The LoRA is gone at once (404 from then on, in no list, it frees its count and bytes); a sweep deletes the object
        a day later. Past takes keep `made_with.loras` (reuse answers it `deleted`). A run not yet released that names
        it fails at dispatch (`LoRA <name> was deleted`); a released one may still finish. A batch row whose run is made
        later fails `invalid` (`lora.rows[1].lora: LoRA <id> not found`). A workflow or preset that still names it gets
        the `lora_unknown` problem. 409 `shared LoRAs are managed on their host` for a shared id.
      parameters: [{$ref: '#/components/parameters/LoraId'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/loras/{lora_id}/complete:
    post:
      tags: [studio]
      operationId: studioCompleteLoraUpload
      summary: Check the uploaded file and index it
      description: |
        Studio never trusts the client: it HEADs the object (size = the declared `size_bytes`), reads the safetensors
        header with range GETs, then streams the whole object once to hash it (SHA-256; a 2 GB file takes seconds) and
        checks it (contracts/README.md, LoRA upload checks). Success: `state: ready` with `sha256`, `rank`, `key_style`,
        `family` (the first registry family by name the normaliser fits, else `unknown`) and `licence`. A failed check:
        422 with the reason, and the LoRA stays listed `rejected` with that `reason` (until deleted; the sweep removes
        its object): `size differs from the declared bytes`, `pickle checkpoints are not accepted; convert it to
        safetensors`, `not a safetensors file`, `safetensors header is larger than 8 MB`, `tensor <key> lies outside
        the file`, `tensor <key> has dtype <d>; LoRAs must be F32, F16 or BF16`, `no LoRA keys found (is it a full
        model?)`, `<key> is not a LoRA weight`, `<module>: lora_A and lora_B ranks differ`, `<module>: lora_B is
        missing`, `rank <r> is over 4096`, `more than 20000 tensors`, from 1.39 `an IC-LoRA (it needs a reference
        video), not a stack LoRA`. 409 `upload not received` while the object is
        not there yet (PUT it, then call again). Calling again after it ended answers the same (200 ready, or the same
        422). 404 for an id that is unknown, another user's or shared.
      parameters: [{$ref: '#/components/parameters/LoraId'}]
      responses:
        '200': {description: 'the LoRA, ready', content: {application/json: {schema: {$ref: '#/components/schemas/Lora'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: runs
  /v1/studio/sessions/{session_id}/runs:
    get:
      tags: [studio]
      operationId: studioListRuns
      summary: The session's runs, newest first (at most 100, not paginated)
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '200': {description: runs, content: {application/json: {schema: {$ref: '#/components/schemas/RunList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreateRun
      summary: Run a workflow in the session
      description: |
        Resolves the graph (node schema defaults, then the workflow's params, then `inputs`) and stores the run
        `queued` in lane `interactive`, attempt 1. The dispatcher (contracts/README.md, "The dispatcher") releases it
        later: it writes `cmd.run.execute` to the outbox for one host when that host is free and the run is next in
        the fair order. 422 for an unknown `workflow_id`, an input key that is not a param of the workflow's nodes, or a
        value of the wrong type, out of `min`/`max` or not in `enum` (the detail names the key, e.g.
        `echo.steps: must be between 1 and 200`). Image values (`ImageRef`, alone or in `rows` items) are 422 when the
        take is unknown, another user's, deleted or a pending upload (`encode.refs[2].image: take <id> not found`, items
        numbered from 1 as in `<image{n}>`), not an image (`… take <id> is not an image`), without a size (`… take <id>
        has no size`), or its object is missing; a
        rows value outside `min`/`max` (`encode.refs: at most 10 items`), an item field not in `item`, or an image param
        left null (`image.image: an image is required`) is 422 too. From 1.19 media and span values have their own texts
        (`source.source: take <id> is not a video`, `audio.source: take <id> has no sound`, `retake.span: a range is
        required`, … contracts/README.md, Media inputs) and a value outside a node's `only` is `model.variant: must be one
        of dev`. From 1.30 voice values (`VoiceRef`) are resolved as the caller (contracts/README.md, Voices): 422
        `speak.voice: a voice is required`, `speak.voice: voice <id> not found` (unknown, another user's, deleted, not a
        voice, or a starter voice no live host publishes), `speak.voice: this workflow cannot use a designed voice` (the
        voice fit's reason for that param), `speak.voice: voice <name> is for <family>`; from 1.31 a voice with a clip
        sends its clip, resolved like a media value even after its take was deleted (`speak.voice: the clip of voice
        <name> is gone` when its object is missing); in a workflow whose media is
        audio a mention in a prompt param is `prompt.text: mentions are not read aloud; use a dialogue script`. When no host is eligible (none live with the env and the workflow),
        the run is created already `failed` with error `no live host for env <env>` (still 202) and nothing is sent.
        From 1.18 a host is eligible only with the run's model variant present at its precision and room for its
        planned peak; the other failure texts are in contracts/README.md, Several hosts: eligibility. From 1.35 a
        body with `host` (Create's Run on) is eligible on that host only: when it cannot take the run now the answer
        is 422 with the eligibility text (`host gcp is offline`, `host mac does not have model <model> variant
        <variant> at <precision>`, …; contracts/README.md, Several hosts: a run set to one host) and nothing is stored.
        From 1.36 a node that is not bypassed and needs an optional add-on (its NodeSchema `addons`) is eligible only
        on a host where the add-on is present: set to a host without it, 422 `<node>: <title> not downloaded on host
        <host>`; otherwise the run fails `<node>: <title> not downloaded on any live host for env <env>`
        (contracts/README.md, Optional add-ons). From 1.41 so does an enum param's value that needs one (ParamSchema
        `addons`, swapped by `addons_with` while a named input is wired or rows param holds a row: MiniMax H3's
        `lora: turbo` needs Turbo LoRA, with a reference Turbo Ref LoRA), with the same texts.
        409 when the caller already has 100 runs queued or running (any session): `You have 100 runs queued or
        running; wait for some to finish.`

        A user workflow (`workflow_id` a UUID of the caller's; another user's is 422 `unknown workflow <id>`) runs as
        it is stored now: studio checks it with the graph rules against the live palette and any problem is 422
        `workflow cannot run: <first problem's message>`; the run keeps that version (`workflow_version`) and the
        resolved graph as its snapshot, which the dispatcher sends however the workflow changes later. `inputs` may
        also hold `<node>.bypass: true|false` for a bypassable node; an input naming a param that is wired from
        upstream is 422 (`sample.steps: wired from count.value; it cannot be set`).

        `@handle` mentions in the prompt params (contracts/README.md, Mentions) are expanded after every value is
        merged and checked, against the caller's elements now: 422 `prompt.text: unknown element @<handle>` (each
        distinct one, joined by `; `), `encode.refs: at most 10 images; <n> used, @<handle> +<k>, … do not fit`,
        `prompt.text: at most 4000 characters once elements are added (<n>)`. The resolved graph is what is checked
        for a host, stored as the run's snapshot, sent and recorded in the take; `Run.inputs` stays as requested.

        LoRA values (`LoraRef`, a Lora field of a `rows` item: the `<family>/lora-stack` node) are then resolved as the
        caller (contracts/README.md, LoRAs), items numbered from 1: 422 `lora.rows[2].lora: LoRA <id> not found` (unknown,
        another user's, deleted, pending or rejected, or a shared id no live host of the env lists: one message, nothing
        leaks), `lora.rows[2].lora: LoRA <name> does not fit qwen-image (it is for <family>)` (or `(its model is
        unknown)`), `lora.rows[2].lora: LoRA <name> is already in row 1`; strength and mode are checked by the run rules
        (`lora.rows[1].strength: must be between 0 and 2`), the row count by `max` (`lora.rows: at most 8 items`). A
        shared LoRA no live host of the env has at dispatch fails the run `no live host for env <env> has LoRA
        <name>`.

        `looks` (contracts/README.md, Looks) are applied in the same resolver as the mentions, after the values are
        merged and checked, and before the LoRA values are resolved, against the caller's looks and the live starter
        looks now; `Run.looks` keeps them as requested. 422 (items from 1, in request order, each distinct one; with
        unknown handles those come first): `looks[2]: unknown look <id>` (unknown, an element, another user's,
        deleted, or a starter look no live host publishes), `looks[2]: look <name> does not fit this workflow
        (<reason>)` (the fit reasons, e.g. `this workflow has no LoRA stack`, `LoRA <name> is on no live host`,
        `LoRA <name> is for <family>`), `encode.refs: at most 10 images; 9 used, @fox +1, look Noir +1 do not fit`,
        `lora.rows: at most 8 LoRAs; 7 used, look Noir +2 do not fit`, `prompt.text: at most 4000 characters once
        elements and looks are added (<n>)`.

        Video (from 1.12, contracts/README.md, Video): a `frames` param takes `"auto"` only when its schema declares
        `auto` (else `duration.frames: auto length is not offered`); an int with `values` / `values_by` takes only
        those (`sample2.steps: must be one of 3`); a rows param with an Image field and `min` ≥ 1 needs that many
        items at run (`keyframes.images: at least 1 items`); item fields left out take their defaults and the merged
        item is checked (`encode.beats[1].text: must be between 1 and 500 characters`); keyframe positions
        (`position: seconds`) are checked against the clip: `keyframes.images[2].seconds: frame 50 is past the
        clip's last frame 48`, `keyframes.images[2].seconds: frame 0 is already used by row 1`; a LoRA a model's
        lora block lists as `prefused` for its variant: `lora.rows[1].lora: LoRA <name> is already part of the
        distilled weights`; a bake-only stack's `mode: adapter` fails `enum` (`lora.rows[1].mode: must be one of
        bake`).

        From 1.22 (contracts/README.md, Media inputs: rows of media): an `optional` image node left null is dropped
        with its wires first; a rows value while a `not_with` input is wired is 422 `generate.refs: must stay empty
        while generate.first is wired`; a media field of a rows item is resolved like a media param, items from 1:
        `generate.videos[2].video: take <id> not found`, `… take <id> is not a video`, `generate.audios[1].audio: take
        <id> has no sound`, `… take <id> lasts 1.5 s; this input takes at least 2.0 s`, `… the part lasts 16.0 s; this
        input takes at most 15.0 s`, `… in must be before out`, `… out <x> is past the take's end <d>`; a missing media
        field `generate.videos[1].video: a take is required`; then the items together: `generate.videos: the takes
        last 16.5 s in all; at most 15.0 s`. The counts are the rows `max` (`generate.videos: at most 3 items`).

        From 1.32 (contracts/README.md, Dialogue: scripts) a `script` param is expanded into its node's `lines` after
        the rows of media and before the voices are resolved, against the caller's elements and voices now; 422, each
        line's first problem, line order, joined by `; `: `dialogue.script line 3: write @name: text or @name
        (style): text`, `… line 3: nothing to say`, `… line 3: at most 600 characters (612)`, `… line 3: the style is
        at most 200 characters (215)`, `… line 3: unknown element @jon`, `… line 3: @jon has no voice` (none, or one
        gone since), `… line 4: voice Kai does not fit this workflow (this workflow cannot use a designed voice)` (the
        voice fit of the lines' voice field, narrowed by `only`); then `dialogue.script: the script is empty` (no line,
        and no `lines` given), `dialogue.lines: at most 40 lines`, `dialogue.lines: give the script or the lines, not
        both`. Lines given directly (the Graph view, an agent) are resolved item by item like a voice param:
        `dialogue.lines[2].voice: a voice is required`, `… voice <id> not found`, `… this workflow cannot use a designed
        voice`, `… voice <name> is for <family>`.
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}
      responses:
        '202': {description: 'the run: queued, or failed at once', content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/runs/plan:
    post:
      tags: [studio]
      operationId: studioPlanRun
      summary: 'From 1.25: the planned peak of a run before it is sent (the Generate button''s "≈ 40 s · 21 GB")'
      description: |
        Resolves the body as POST /v1/studio/sessions/{session_id}/runs would (the same 422 texts, the same caller's
        elements, looks, LoRAs and takes), stores nothing and sends nothing, and answers the host the run would be
        eligible on (the first by name) and its planned peak there: the plan of its model variant at its precision
        and workflow (registry `models[].variants[].memory`, contracts/README.md "The hand-over") plus its LoRA
        files. `peak_gb` is null when the run has no plan (larger than the plan's `planned_at`: it is admitted at the
        whole host budget); both are null when no host is eligible (`reason` says why, as the run would fail). From
        1.35 a body with `host` plans the run on that host only (Generate's estimate follows Run on); `reason` is then
        the text POST …/runs answers with its 422 (contracts/README.md, Several hosts: a run set to one host).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}
      responses:
        '200': {description: the plan, content: {application/json: {schema: {$ref: '#/components/schemas/RunPlan'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/runs/{run_id}:
    get:
      tags: [studio]
      operationId: studioGetRun
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: the run, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteRun
      summary: Delete a finished run from its session
      description: |
        From 1.43 (contracts/README.md, Deleting runs). Soft: the run leaves `GET …/sessions/{id}/runs`, `GET` on it is
        404 and its events leave the session's replay; its takes stay in the gallery. Allowed when `failed`,
        `cancelled` or `succeeded`; 409 `stop the run first` while `queued` or `running`, 409 `a batch's run goes with
        its batch` for a run with a `batch_id`. 404 for an unknown, another user's, an already deleted or a hidden
        (`purpose` name) run.
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/runs/{run_id}/cancel:
    post:
      tags: [studio]
      operationId: studioCancelRun
      summary: Cancel a queued or running run
      description: |
        A run the dispatcher has not sent yet becomes `cancelled` at once (the answer shows it) and is never sent.
        Otherwise writes the run id as a key in the KV `cancels`; the runner checks it before it starts and at every
        step, and reports `cancelled` (outputs and their takes already stored are kept). The answer is then the run as
        it is now, usually still `queued` or `running`; follow the events for `cancelled`. Calling it again is
        harmless. 409 when the run already ended.
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '202': {description: cancel requested, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: the queue
  /v1/studio/queue:
    get:
      tags: [studio]
      operationId: studioGetQueue
      summary: The caller's queued and running runs across sessions, and per host how many runs of others wait
      description: |
        `runs`: the caller's own runs that are `queued` or `running`, every session: running first, then queued by
        host and `position`; from 1.43 a session's hidden naming run too (`purpose` name, the only place one is listed).
        `hosts`: one entry per host name in the KV `hosts` (its envs merged), with the number of
        other users' queued runs lined up for it, never whose or which (plan 17.3).
      responses:
        '200': {description: the queue, content: {application/json: {schema: {$ref: '#/components/schemas/Queue'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: events
  /v1/studio/sessions/{session_id}/events:
    get:
      tags: [studio]
      operationId: studioSessionEvents
      summary: Session events after a cursor — JSON polling, or server-sent events with `Accept text/event-stream`
      description: |
        Every event the projector (or studio itself: `queued`, a run failed or cancelled before it was sent) stored for
        the session, oldest first, each numbered by a per-session `seq`. JSON: the events with `seq > since` (at most
        500) and `last_seq`. SSE: replays `seq > since` (or `Last-Event-ID`, which wins), then streams new ones;
        `id:` = seq, `event:` = the event's `type`, `data:` = the `SessionEvent` JSON; `: keep-alive` comments every
        15 s. The stream does not end by itself. An `output` event whose output is gone (its take deleted, or the
        attempt that made it retried) is left out, so seqs may skip; `last_seq` still moves past it.
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {name: since, in: query, schema: {type: integer, minimum: 0, default: 0}, description: cursor — the last seq the client has}
        - {name: Last-Event-ID, in: header, required: false, schema: {type: string}, description: 'SSE resume: the last `id:` received (an integer)'}
      responses:
        '200':
          description: events
          content:
            application/json: {schema: {$ref: '#/components/schemas/EventPage'}}
            text/event-stream: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: hosts
  /v1/studio/hosts:
    get:
      tags: [studio]
      operationId: studioListHosts
      summary: The runner hosts and their state, redacted
      description: |
        One entry per key in the KV `hosts`. `offline` when the key is older than 30 s. A host running anyone's run is
        `busy`; which run and whose is never shown. From 1.13 each entry carries `host_memory`, the budget its host's
        envs share and what they hold together (the memory chip shows it for the host the run will use), and each
        resident component its `last_used` (contracts/README.md, The hand-over). From 1.16 every entry adds `machine`,
        `cached_gb` and each resident component's `pinned_why`; for an admin (and only then) every entry adds
        `admin` (the host's settings, the env's policy in effect, the current run, idle since, unload pending, the
        Hub token's presence), and a baked entry shows another user's LoRA with its `lora_id` and `strength` (`name`
        still null) so it can be named for Unload and Pin (contracts/README.md, Hosts admin).
      responses:
        '200': {description: hosts, content: {application/json: {schema: {$ref: '#/components/schemas/HostList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: takes (the gallery)
  /v1/studio/takes:
    get:
      tags: [studio]
      operationId: studioListTakes
      summary: The caller's gallery, newest first (or by `order`), filtered and paginated
      description: |
        Every take of the caller that is not deleted and (for an upload or an import) completed, newest first (`created_at`, then
        `id`). Filters combine with AND. `q`: every whitespace-separated word must occur, case-insensitively, in the
        title or the prompt (`made_with.prompt`), or from 1.27 in an element handle (`made_with.elements[].handle`; a
        leading `@` of the word is ignored there), the workflow title or id (`made_with.workflow_title`,
        `workflow_id`) or the model id (`made_with.model.id`, which names its family). A `session_id` or (from 1.27)
        `batch_id` that is unknown or another user's just matches nothing. A malformed filter value or cursor is 422.
        From 1.44 `order`: `newest` (the default), `oldest` (`created_at`, then `id`, ascending), `starred` (starred
        first, each part newest first), `name` (the title, case-insensitively, then newest first). A cursor belongs to
        its order: one from another order is 422.
      parameters:
        - {name: kind, in: query, required: false, schema: {$ref: '#/components/schemas/TakeKind'}}
        - {name: source, in: query, required: false, schema: {$ref: '#/components/schemas/TakeSource'}}
        - {name: starred, in: query, required: false, schema: {type: boolean}, description: 'true = only starred, false = only unstarred'}
        - {name: session_id, in: query, required: false, schema: {type: string, format: uuid}, description: only takes of this session}
        - {name: batch_id, in: query, required: false, schema: {type: string, format: uuid}, description: 'from 1.27: only takes of this batch (`Take.batch_id`, its collection)'}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}, description: 'text search over title, prompt and (from 1.27) element handles, workflow and model; blank = no filter'}
        - {name: order, in: query, required: false, schema: {type: string, enum: [newest, oldest, starred, name], default: newest}, description: 'from 1.44: the Gallery''s sort'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: a page of takes, content: {application/json: {schema: {$ref: '#/components/schemas/TakePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/takes/{take_id}:
    get:
      tags: [studio]
      operationId: studioGetTake
      description: 'The take with `children` (what was made from it; only here, not in lists).'
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      responses:
        '200': {description: the take, content: {application/json: {schema: {$ref: '#/components/schemas/Take'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      tags: [studio]
      operationId: studioUpdateTake
      summary: Rename or star a take
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TakePatch'}}}
      responses:
        '200': {description: the updated take, content: {application/json: {schema: {$ref: '#/components/schemas/Take'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteTake
      summary: Delete a take (soft)
      description: |
        The take leaves the gallery at once (GET is 404, it is in no list, its run's `outputs` drop it, takes made from
        it leave it out of `parents`); a sweep removes the object later, except (from 1.31) while one of the owner's
        voices keeps it as its clip: the voice still plays and runs, and deleting that voice frees it (contracts/README.md,
        Voices: cloned voices). Deleting again is 404. A run that already
        references it and has not read it yet may fail (`input image <take_id> is gone`; a video or audio take: `input
        take <take_id> is gone`). Never refused for an
        element that uses it: the image drops out of that element (contracts/README.md, Elements).
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/takes/{take_id}/reuse:
    post:
      tags: [studio]
      operationId: studioReuseTake
      summary: The settings that made a take, to pre-fill Create
      description: |
        `workflow_id` and `inputs` = `made_with.inputs` (every param, the seed the runner used instead of random), ready
        to post as a `RunRequest` or to load into the form; image values come back as recorded (`{take_id}`), so a
        reference deleted since makes that request 422. Nothing is created. 409 for an upload or an import (it has no settings).
        `workflow_status` compares the workflow now with the one that made the take: `current` (a template still
        published, or a user workflow at `made_with.workflow_version`), `changed` (a user workflow edited since: keys
        that are no longer a settable param of it are dropped from `inputs`, the rest kept), `deleted` (no longer
        published, or deleted: `inputs` as recorded; a run of it is 422).
        With elements: `inputs` = `made_with.inputs` with `made_with.typed` laid over it, so the prompt comes back as
        typed (with its mentions) and the reference rows without the element images; `elements_status` says, per
        element of `made_with.elements`, whether running it again would resolve the same (`current`), differently
        (`changed`: edited since) or not at all (`deleted`).
        With LoRAs: `inputs` hold them as recorded (`{lora_id}`); `loras_status` says, per `made_with.loras` entry,
        `current` (the caller can use it now), `missing` (shared: no live host lists it now; it may come back) or
        `deleted` (own: deleted since). Running a missing or deleted one is 422 (`… LoRA <id> not found`).
        With looks: `inputs` come back without what the looks added (the typed view), `looks` = the ids of
        `made_with.looks` (send them as RunRequest.looks), `looks_status` per look: `current`, `changed`, `deleted`
        (own) or `missing` (starter, no live host publishes it now).
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      responses:
        '200': {description: the settings, content: {application/json: {schema: {$ref: '#/components/schemas/TakeReuse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/takes/{take_id}/use:
    post:
      tags: [studio]
      operationId: studioUseTake
      summary: '"Use in…": inputs that put this take into a workflow''s image or media input, to pre-fill Create'
      description: |
        An image take: `inputs` with exactly one key: `param` (or, when absent, the workflow's only `image` param or
        `rows` param whose `item` has an `Image` field; from 1.22 among the inputs `GET …/uses` counts) set to this take: `{take_id}` for an `image` param, a one-item
        list `[{<field>: {take_id}}]` (the take as reference 1) for a rows param. From 1.19 a video or audio take: the
        workflow's only `media` param that accepts it (or `param`) set to `{take_id}` (with `trim`: `in` 0, `out` its
        duration), and every `span` param set to the whole take `{start: 0, end: duration}` (contracts/README.md, Media
        inputs: offers; a trim part is capped at `max_s`: `out` = min(duration, `max_s`); an Extend whose clip would
        pass 321 frames gets the largest `seconds` that fits). The client merges it over the form; nothing is created. 404 for a take that is unknown,
        another user's, deleted or a pending upload. 422 when the take does not fit the input (the run texts of Image
        inputs and Media inputs: `take <id> is not an image`, `take <id> has no size`, `take <id> is not a video`,
        `take <id> has no sound`, `take <id> is 450 × 256; this input needs sides on a 32 px grid`, `take <id> has 390
        frames; this input takes at most 321`; an Extend with no 8-frame step left under 321 frames: `take <id> has
        <n> frames; extending it would pass 321`), the workflow is unknown (`unknown workflow <id>`), it has no such
        param (`workflow <id> takes no image input`; a video or audio take: `workflow <id> takes no <kind> input`),
        several and no `param` (`workflow <id> has several image inputs; name one in param`), or `param` is not one of
        them. The client lists the workflows to offer with `GET /v1/studio/takes/{take_id}/uses`.
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TakeUse'}}}
      responses:
        '200': {description: the inputs, content: {application/json: {schema: {$ref: '#/components/schemas/TakeReuse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/takes/{take_id}/uses:
    get:
      tags: [studio]
      operationId: studioListTakeUses
      summary: '"Use in…" (from 1.19): the workflows this take can go into, each with its inputs pre-filled'
      description: |
        contracts/README.md, Media inputs: offers. The templates a live host could run now (published, model variant
        present, `ltx/distill`'s LoRA on the host) and the caller's own non-text workflows, in `GET /v1/studio/workflows`
        order, that have exactly one input this take fits (an image take: an `image` param or an Image rows param; a
        video or audio take: a `media` param whose `accepts`, `grid`, `max_s`, `min_s` and `max_frames` it passes), each with `inputs` as
        `POST …/use` answers them. From 1.22 an input counts only when the workflow's `studio` block places it (no
        block: every input), not on an `optional` node, and not a rows param excluded by a wired `not_with` input
        (MiniMax H3: an image goes to Image to video's first frame and References, not Text to video). From 1.32 a
        rows param with exactly one media field counts too, by the take's own kind only (a video into `videos`, an
        audio take into `audios`; a video's sound never into audio rows by offer), with the take as item 1 (`in` 0,
        `out` = min(duration, the field's `max_s`, the rows' `max_total_s`) on `trim`): an audio take offers MiniMax H3
        References, whose run still needs an image or video reference. Empty when none fits. 404 for a take that is unknown, another user's, deleted or a
        pending upload.
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      responses:
        '200': {description: the offers, content: {application/json: {schema: {$ref: '#/components/schemas/TakeUses'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/takes/{take_id}/pipeline:
    post:
      tags: [studio]
      operationId: studioSaveTakeAsPipeline
      summary: '"Save as pipeline": a new pipeline of the caller''s from the chain of runs that made this take'
      description: |
        Walks the take's lineage (contracts/README.md, Save as pipeline) and saves the pipeline it builds: inputs node
        `inputs` → `step_1` … `step_n` (oldest first) → output `output`; 201 with `problems` like POST
        `/v1/studio/pipelines`, `version` 1, `based_on` null. 404 for a take that is unknown, another user's or
        deleted. 409 at 100 pipelines. 422 with the reason when the lineage is not a chain it can save: `an upload has
        no lineage to save`, `take <id> was made from several runs' takes; a pipeline is a chain`, `take <id> in the
        lineage was deleted`, `workflow <id> no longer exists`, `the lineage is longer than 8 steps`, `take <id> mixes several sources in
        <param>`. Each step's `looks` = the ids of its take's `made_with.looks` (one gone since shows as an
        `unknown_look` problem).
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/TakePipeline'}}}
      responses:
        '201': {description: 'the pipeline, with problems', content: {application/json: {schema: {$ref: '#/components/schemas/Pipeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/takes/{take_id}/decisions:
    get:
      tags: [studio]
      operationId: studioListTakeDecisions
      summary: The judge decisions that weighed this take (the Explain drawer), newest first
      description: 'From 1.14: every decision whose judge had the take among its candidates (owner only: another user''s take is 404). Deleted batches'' decisions go with them.'
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      responses:
        '200': {description: the decisions, content: {application/json: {schema: {$ref: '#/components/schemas/DecisionList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/sessions/{session_id}/takes:
    get:
      tags: [studio]
      operationId: studioListSessionTakes
      summary: The session's takes, newest first (the Create filmstrip)
      description: Like `GET /v1/studio/takes?session_id=`, but 404 for an unknown session.
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: a page of takes, content: {application/json: {schema: {$ref: '#/components/schemas/TakePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: uploads
  /v1/studio/uploads:
    post:
      tags: [studio]
      operationId: studioCreateUpload
      summary: Start an upload; answers a signed files_service URL to PUT the bytes to
      description: |
        Stores a pending take (source `upload`, invisible until completed) and signs a single-use `PUT` link for the
        key `u/<caller>/uploads/<take_id>.<png|jpg|webp|wav|mp3|m4a>`, valid 15 minutes (`PUT /files/{path}`): `image/png`,
        `image/jpeg`, `image/webp` and, from 1.19, `audio/wav` and `audio/mpeg`, from 1.38 `audio/mp4` (an m4a; an
        audio take; `duration_s` required, at most 600 s), at most 50 MB (52428800 bytes). 422 for any other type or
        size ("only png, jpeg and webp images or wav, mp3 and m4a audio can be uploaded", "file is larger than 50 MB",
        "audio is longer than 600 s"). A pending upload not completed within an hour is discarded. From 1.38 the web
        optimises a file before this call (contracts/README.md, Optimised uploads): `bytes` is the file it uploads.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UploadCreate'}}}
      responses:
        '201': {description: the upload, content: {application/json: {schema: {$ref: '#/components/schemas/Upload'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/uploads/limits:
    get:
      tags: [studio]
      operationId: studioUploadLimits
      summary: The sizes the web optimises an upload to, derived from the registry (API 1.38)
      description: |
        Computed from every node schema any runner publishes (contracts/README.md, Optimised uploads), never a
        constant: the web reads it once per session and scales an image down only when its long side is over
        `image_max_side`.
      responses:
        '200': {description: the limits, content: {application/json: {schema: {$ref: '#/components/schemas/UploadLimits'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/studio/uploads/{take_id}/complete:
    post:
      tags: [studio]
      operationId: studioCompleteUpload
      summary: Check the uploaded object and make the take
      description: |
        Studio reads the object's size (HEAD) and its first 64 KB (range GET) from the object store: the size must be
        the declared `bytes`, the header must be a real image of the declared type, at most 16384 px a side and 50 MP;
        it records `width` and `height` upright (a JPEG whose EXIF orientation is 5-8 has them swapped, as browsers and
        the runner show it). From 1.48 a runner's thumbs media job makes its thumbnail within seconds (contracts/README.md,
        Thumbnails); until then `thumb_url` signs the original. 409 "upload not received" when the object is not there yet (PUT it, then call again). 422 when a check
        fails ("size differs from the declared bytes", "not a valid png image", "image is larger than 16384 px",
        "image is larger than 50 MP"; from 1.19 audio: the header must be RIFF/WAVE, or an ID3v2 tag or MPEG audio frame
        sync, from 1.38 an `ftyp` box whose major or a compatible brand is `M4A `, else "not a valid wav file" / "not
        a valid mp3 file" / "not a valid m4a file"; the take is `kind: audio`, `width` / `height` null,
        `audio.duration_s` as declared): the
        upload is discarded and its take_id is 404 from then on. Calling it again after success answers the same take.
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      responses:
        '200': {description: the take, content: {application/json: {schema: {$ref: '#/components/schemas/Take'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: batches (pipelines_service runs them)
  /v1/studio/batches:
    get:
      tags: [studio]
      operationId: studioListBatches
      summary: The caller's batches, newest first (`created_at`, then `id`), paginated
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: a page of batches, content: {application/json: {schema: {$ref: '#/components/schemas/BatchPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreateBatch
      summary: Run one workflow once per row of inputs, as one unattended job
      description: |
        Submit checks everything before anything runs (any failure is 422 and nothing is stored):
        - `workflow_id` is a known workflow (`unknown workflow <id>`).
        - Rows are built from `rows` (lines, table or grid, below), then each is repeated `seeds.count` times; the
          result has 1 to 500 rows (`a batch has 1 to 500 rows; this one has <n>`).
        - Each row's inputs = `inputs` (base), then the row's values, then its seed; checked with the same rules as
          `RunRequest.inputs`. The detail names the input row (a line, a table row or a grid combination, from 1,
          before seed repetition): `row 3: echo.steps: must be between 1 and 200`.
        - Mentions (contracts/README.md, Mentions) resolve in every row against the caller's elements now; the rows
          that cannot are all listed, in row order (at most 10, then `; and <n> more rows`), joined by `; `:
          `row 3: prompt.text: unknown element @wolf; row 7: encode.refs: at most 10 images; 9 used, @fox +2 do not fit`.
          A pipeline batch checks only unknown handles here, in every step's graph as each input row's run will
          resolve it (its row values, the step's `inputs` and preset, the step workflow's own params): `row 3:
          step_1: prompt.text: unknown element @wolf`; the rest is checked when each run is made (that row fails
          `invalid`).
          Studio keeps a copy of every element the batch mentions: its runs, Retry included, resolve against that
          copy, never against later edits or deletes.
        - Looks (contracts/README.md, Looks: batches): a row's looks are its `looks` cell (table column or grid axis
          `looks`; null = `looks`), else `looks`; they resolve with the mentions, the failing rows listed the same way
          (`row 2: looks[1]: unknown look <id>`). A pipeline batch takes its looks from its steps: `looks` or a
          `looks` column is 422 `looks: a pipeline batch takes its looks from its steps`; unknown or unfitting step
          looks are pipeline problems (`unknown_look`, `look_fit`: `pipeline cannot run: …`). Studio keeps a copy of
          every look a row or step uses, like the elements.
        - A live host has the workflow's env and publishes the workflow (`no live host for env <env>`).
        - The submit message fits NATS: the rows' inputs together at most 768 KB (`batch inputs are too large; use
          fewer or shorter rows`).
        409 when the caller already has 5 batches queued, running or paused (`You have 5 unfinished batches; wait for
        one to finish.`). The interactive cap of 100 open runs does not count batch-lane runs and does not stop a batch.
        404 for a `session_id` that is unknown or another user's.

        `workflow_id` may name one of the caller's workflows: it must pass the graph rules (else 422 `workflow cannot
        run: …`) and the snapshot is its version now (nodes with `bypass`, no positions, no `studio`).

        `pipeline_id` (instead of `workflow_id`) runs one of the caller's pipelines (contracts/README.md, Batches of a
        pipeline): unknown or another user's is 422 `unknown pipeline <id>`; any pipeline problem is 422 `pipeline
        cannot run: <first problem's message>`. The columns are the pipeline's inputs, addressed `<inputs node>.<name>`
        in `inputs`, `lines.param`, `table.columns` and `grid.axes[].param`; every input needs a value in each row
        (`row 3: inputs.prompt: a value is required`) except a Seed (drawn); `seeds` repeats rows over the pipeline's
        one Seed input. The snapshot is the pipeline document now plus every workflow it uses; a live host is needed
        for every step's env; the 768 KB limit counts the snapshot too.

        On success studio stores the batch (`queued`, `control: run`) with its snapshot (the workflow as published
        now: the batch never runs a later version), every row (`queued`, attempt 1, seeds drawn), a new session titled
        like the batch when `session_id` is absent, and the outbox row `cmd.pipeline.submit`, in one transaction, and
        answers 202. pipelines_service then runs row 1 alone; once row 1 has succeeded, failed or been cancelled,
        every other row is released into the dispatcher's batch lane (after interactive runs, round-robin between users).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BatchCreate'}}}
      responses:
        '202': {description: 'the batch, queued', content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}:
    get:
      tags: [studio]
      operationId: studioGetBatch
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      responses:
        '200': {description: the batch, content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/rows:
    get:
      tags: [studio]
      operationId: studioListBatchRows
      summary: The batch's rows by row number, paginated
      parameters:
        - {$ref: '#/components/parameters/BatchId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: a page of rows, content: {application/json: {schema: {$ref: '#/components/schemas/BatchRowPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/pause:
    post:
      tags: [studio]
      operationId: studioPauseBatch
      summary: Hold the batch's queued work; running runs finish
      description: |
        Sets `control: pause` and writes `cmd.pipeline.pause` in one transaction. From then on the dispatcher releases
        none of the batch's queued runs (they stay `queued`, held); runs already running finish and their rows
        complete. pipelines_service starts no new rows and confirms with `status: paused`. The answer is the batch as
        it is now; follow its events. 409 unless `status` is `queued` or `running` and `control` is `run`.
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      responses:
        '202': {description: pause requested, content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/resume:
    post:
      tags: [studio]
      operationId: studioResumeBatch
      summary: Continue a paused batch (paused by you, by three failures in a row, or by a restart of the engine)
      description: |
        Sets `control: run` and writes `cmd.pipeline.resume` in one transaction; held runs become eligible again.
        pipelines_service continues every unfinished row where it stopped (README, "Batches and the pipeline
        engine") and confirms with `status: running`. 409 unless `status` is `paused` or `control` is `pause`, and
        `control` is not `stop`.
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      responses:
        '202': {description: resume requested, content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/stop:
    post:
      tags: [studio]
      operationId: studioStopBatch
      summary: Cancel everything the batch has not finished (Cancel remaining)
      description: |
        In one transaction: `control: stop`, every queued run of the batch `cancelled` at once (never sent), every
        released one written to the KV `cancels` (the runner stops it; takes already stored are kept), and
        `cmd.pipeline.stop`. Runs pipelines asks for afterwards are created `cancelled`. pipelines_service marks rows
        that never started `cancelled` and ends with `status: stopped`. Finished rows and their takes stay. 409 when
        `status` is `done`, `failed` or `stopped`, or `control` is already `stop`.
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      responses:
        '202': {description: stop requested, content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/rows/{row}/retry:
    post:
      tags: [studio]
      operationId: studioRetryBatchRow
      summary: Run one failed row again, or any row from one step of its execution ("Retry row from here")
      description: |
        Sets the row `queued` with `attempt` + 1 (error, run and takes cleared from the row; the old run and its takes
        stay) and writes `cmd.pipeline.retry` in one transaction. The row gets a new run (its idempotency key carries
        the attempt). A `done` batch becomes `running` again until the row ends. 409 unless the row is `failed`, the
        batch's `status` is not `failed` or `stopped` and its `control` is not `stop`.

        With a body `{from_step}` (a pipeline batch): the row re-runs from that step of its current attempt's
        execution, reusing the state before it (contracts/README.md, Execution view). Allowed when the row is
        `failed`, `succeeded`, `cancelled` or `waiting` (a pending pick is dropped) and the batch is `queued`,
        `running`, `waiting` or `paused` with `control` not `stop`; else 409 (a `done` batch: `this batch has
        finished; its checkpoints are gone`). 422 when the step is not in the row's execution or has no state
        (`row <n> has no step <s>`). `from_step: 1` is the same as no body, for any of those row states.
      parameters:
        - {$ref: '#/components/parameters/BatchId'}
        - {$ref: '#/components/parameters/BatchRowN'}
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/BatchRowRetry'}}}
      responses:
        '202': {description: 'the row, queued again', content: {application/json: {schema: {$ref: '#/components/schemas/BatchRow'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/review:
    get:
      tags: [studio]
      operationId: studioGetBatchReview
      summary: Every row parked on a gate or a judge with its candidate takes, for the review grid
      description: 'Rows with status `waiting`, by row number (at most 500, not paginated); a workflow batch has none. From 1.14 a row parked on a judge (Suggest mode, or a judge that gave up) has `kind: judge`, the judge''s `suggested` pick (pre-selected) and each candidate''s `judge` verdict and reason.'
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      responses:
        '200': {description: the parked rows, content: {application/json: {schema: {$ref: '#/components/schemas/BatchReview'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/rows/{row}/pick:
    post:
      tags: [studio]
      operationId: studioPickBatchRow
      summary: Answer a gate for one parked row (pick 1..keep of its candidates, or reject them all)
      description: |
        In one transaction: records the pick on the row's gate cell (`picked` / `rejected`), sets the row `running`
        with `parked` null, and writes `cmd.pipeline.pick`; pipelines resumes the row's thread with it. Rows can be
        picked in any order. The same pick again for the same gate visit answers 202 with the row and sends nothing.
        409 when the row is not parked on `gate` (`row <n> is not waiting at <gate>`), a different pick for that
        visit was already sent, or the batch is `stopped`/`failed` or its `control` is `stop`. 422 when `take_ids`
        are not among the candidates, repeat one, or are more than the gate's `keep` (`pick 1 to <keep> of the
        candidates`).

        From 1.14 `gate` may name the judge the row is parked on (contracts/README.md, Agent nodes: Suggest). Studio
        derives `agreed` (the picked set equals the judge's suggestion; reject all with an empty suggestion: true),
        records it on the judge cell (`judged.agreed`) and the decision's takes, and sends it with the optional `note`
        in `cmd.pipeline.pick`; pipelines stores a pick with a note as a judge example in the pipeline's memory.
        `note` on a gate pick is 422 (`a note is kept for judge picks only`).
      parameters:
        - {$ref: '#/components/parameters/BatchId'}
        - {$ref: '#/components/parameters/BatchRowN'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BatchPick'}}}
      responses:
        '202': {description: 'the row, moving on', content: {application/json: {schema: {$ref: '#/components/schemas/BatchRow'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/rows/{row}/execution:
    get:
      tags: [studio]
      operationId: studioGetRowExecution
      summary: The execution view of one row (plan 16.8) — the step list and the graph as run
      description: |
        Built from the stored `evt.pipeline.step` events (contracts/README.md, Execution view); available for the
        batch's lifetime and after (only `has_state` turns false when its threads are deleted). 404 for a workflow
        batch or an `attempt` the row never had.
      parameters:
        - {$ref: '#/components/parameters/BatchId'}
        - {$ref: '#/components/parameters/BatchRowN'}
        - {name: attempt, in: query, required: false, schema: {type: integer, minimum: 1}, description: 'which attempt of the row; absent = the current one'}
      responses:
        '200': {description: the execution, content: {application/json: {schema: {$ref: '#/components/schemas/RowExecution'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/rows/{row}/execution/{step}/state:
    get:
      tags: [studio]
      operationId: studioGetRowStepState
      summary: The row's state at the checkpoint after one step (read-only), for its owner
      description: |
        Studio asks pipelines_service over NATS request/reply `pipelines.state.get` (owner, batch, row, the step's
        checkpoint id) and passes the state through. 404 when the step is unknown or has no checkpoint, or the
        batch's threads are gone (`this row's state is gone; the batch has finished`). 503 when pipelines does not
        answer within 5 s.
      parameters:
        - {$ref: '#/components/parameters/BatchId'}
        - {$ref: '#/components/parameters/BatchRowN'}
        - {name: step, in: path, required: true, schema: {type: string}, description: 'the step number in the execution, from 1 (unknown or malformed = 404)'}
        - {name: attempt, in: query, required: false, schema: {type: integer, minimum: 1}, description: 'absent = the current attempt'}
      responses:
        '200': {description: the state, content: {application/json: {schema: {$ref: '#/components/schemas/RowState'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/rows/{row}/decisions:
    get:
      tags: [studio]
      operationId: studioListRowDecisions
      summary: Every judge, write and decide decision of one row (plan 16.7), oldest first
      description: |
        From 1.14. Stored by studio from the `decision` of each `evt.pipeline.step` (contracts/README.md, Decisions).
        Thumbnails are signed links (`seen[].thumb_url`), never keys. 404 for a workflow batch, another user's batch
        or an `attempt` the row never had.
      parameters:
        - {$ref: '#/components/parameters/BatchId'}
        - {$ref: '#/components/parameters/BatchRowN'}
        - {name: attempt, in: query, required: false, schema: {type: integer, minimum: 1}, description: 'absent = every attempt of the row'}
      responses:
        '200': {description: the decisions, content: {application/json: {schema: {$ref: '#/components/schemas/DecisionList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/again:
    post:
      tags: [studio]
      operationId: studioRunBatchAgain
      summary: Run an ended batch again as a new batch, with the same decisions or deciding again
      description: |
        From 1.14 (plan 16.3, 16.7). Creates a new batch with the source batch's snapshot (pipeline and workflows as
        submitted), session, rows (inputs and seeds), elements and looks copies, and memory snapshot is taken anew;
        its title is `<source title> again` unless given. `decisions: same`: `cmd.pipeline.submit` carries
        `replay_from` = the source batch, so every judge, write and decide visit whose replay key matches a stored
        decision of the source reuses it without asking a model (same seeds make the same takes, so the keys match;
        a visit whose inputs differ asks again). `again`: every node asks. A batch of one workflow ignores
        `decisions`. 409 while the source is `queued`, `running`, `waiting` or `paused` (`batch <id> has not ended`),
        and at 5 unfinished batches (as Submit). 422 when a step's workflow or an ask workflow has no live host (as
        Submit).
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BatchAgain'}}}
      responses:
        '201': {description: the new batch, content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/memory:
    get:
      tags: [studio]
      operationId: studioListMemory
      summary: A pipeline's memory (judge examples and notes), newest first — the Memory panel
      description: |
        From 1.14 (plan 16.6). Studio checks the pipeline is the caller's (another user's: 404), then asks
        pipelines_service (`pipelines.memory` `list`, 5 s: else 503). Example takes are signed TakeRefs; deleted
        takes are left out.
      parameters:
        - {name: pipeline_id, in: query, required: true, schema: {type: string}, description: 'one of the caller''s pipelines (unknown or malformed = 404)'}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [judge_example, note]}}
      responses:
        '200': {description: the items, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreateMemoryNote
      summary: Add a note to a pipeline's memory (seen by its next batches)
      description: 'From 1.14. `text` is trimmed (blank: 422). 404 for a pipeline that is not the caller''s; 409 `memory is full (500 items); delete some first`.'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MemoryCreate'}}}
      responses:
        '201': {description: the note, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryItem'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/memory/{item_id}:
    delete:
      tags: [studio]
      operationId: studioDeleteMemoryItem
      summary: Delete one memory item (an example or a note); batches already started keep their snapshot
      parameters:
        - {name: item_id, in: path, required: true, schema: {type: string}, description: 'memory item UUID (unknown, another user''s or malformed = 404)'}
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/batches/{batch_id}/events:
    get:
      tags: [studio]
      operationId: studioBatchEvents
      summary: Batch events after a cursor — JSON polling, or server-sent events with `Accept text/event-stream`
      description: |
        Like the session events, numbered by a per-batch `seq`: JSON gives the events with `seq > since` (at most
        500) and `last_seq`; SSE replays `seq > since` (or `Last-Event-ID`, which wins), then streams, `id:` = seq,
        `event:` = `batch`, `row` or (from 1.15) `chat`, `data:` = the `BatchEvent` JSON, `: keep-alive` every 15 s. Studio appends a
        `row` event (the whole row) whenever a row changes and a `batch` event (the whole batch, counts included)
        whenever the batch's status, control or counts change. Step progress of a row's run is in the session's
        events (`session_id`).
      parameters:
        - {$ref: '#/components/parameters/BatchId'}
        - {name: since, in: query, schema: {type: integer, minimum: 0, default: 0}, description: cursor — the last seq the client has}
        - {name: Last-Event-ID, in: header, required: false, schema: {type: string}, description: 'SSE resume: the last `id:` received (an integer)'}
      responses:
        '200':
          description: events
          content:
            application/json: {schema: {$ref: '#/components/schemas/BatchEventPage'}}
            text/event-stream: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/studio/batches/{batch_id}/chat:
    get:
      tags: [studio]
      operationId: studioGetBatchChat
      summary: The batch's director chat (the newest 500 messages, oldest first), with the director's state
      description: |
        From 1.15 (plan 16.4 Chat). Every message of the chat (at most 500). New ones arrive on the batch's event
        stream as `chat` events (`GET …/events`); the director's state on `batch` events (`Batch.director`). 404 for a
        batch whose pipeline has no director, and for another user's batch.
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      responses:
        '200': {description: the chat, content: {application/json: {schema: {$ref: '#/components/schemas/ChatPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioPostBatchChat
      summary: Say something to the batch's director
      description: |
        From 1.15. Studio stores the message and writes `cmd.pipeline.chat` in one transaction, then answers 202 with
        it; the director wakes (the messages that arrive while it thinks are read on its next wake) and answers with a
        `chat` event. It never waits on runs: it answers, searches, reads and writes memory, adds rows and changes rows
        not yet started (each through Submit's checks; a rejected row gets a notice with the reason). 409 when the
        batch has ended or the director is `off` (`the director is off: <why>`), and when the chat holds 500 user messages
        (`this chat is full`; the director's replies and notices never count); 429 above 6 messages a minute per batch (`at most 6 messages a minute`); 422 for a
        blank text.
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChatPost'}}}
      responses:
        '202': {description: 'your message, stored', content: {application/json: {schema: {$ref: '#/components/schemas/ChatMessage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/model-sources:
    get:
      tags: [studio]
      operationId: studioListModelSources
      summary: The local servers and remote providers a pipeline may name (names and models only)
      description: 'From 1.15. Enabled providers, redacted for every user: no base_url, key_secret, host or limits. Remote ones only when the deployment has remote models on. Never a search provider (1.44).'
      responses:
        '200': {description: the sources, content: {application/json: {schema: {$ref: '#/components/schemas/ModelSourceList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/custom-nodes:
    get:
      tags: [studio]
      operationId: studioListCustomNodes
      summary: The custom nodes pipelines_service's packs registered (the editor's palette)
      description: 'From 1.15. From registry key `pipelines.engine.custom`; [] before pipelines published it.'
      responses:
        '200': {description: the custom nodes, content: {application/json: {schema: {$ref: '#/components/schemas/CustomNodeList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/providers:
    get:
      tags: [studio]
      operationId: studioAdminListProviders
      summary: Every model provider, as the admin sees it
      description: 'From 1.15. Admin role only (403 `admin role required`).'
      responses:
        '200': {description: the providers, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/providers/{name}:
    put:
      tags: [studio]
      operationId: studioAdminPutProvider
      summary: Create or replace a local server or a remote provider
      description: |
        From 1.15. Admin only (403). 201 when created, 200 when replaced; a change applies to batches submitted after
        it (a batch calls the provider as it was at Submit). 422 for a base_url that breaks the host rule
        (contracts/README.md, Model sources: hosts), a default_model not in models, a server without host or
        memory_gb, a remote without key_secret. 409 `remote models are off on this deployment` for kind remote while
        the deployment's switch is off, and `<name> is a <kind>; delete it first` to change a provider's kind. From
        1.53 `thinking` (plan 28): 422 `thinking: <model> is not one of models`, `thinking: <model> has no thinking
        setting` (no rule of its preset covers it, or it always thinks) and `thinking: <model> takes <levels>`.
      parameters: [{$ref: '#/components/parameters/ProviderName'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProviderPut'}}}
      responses:
        '200': {description: replaced, content: {application/json: {schema: {$ref: '#/components/schemas/Provider'}}}}
        '201': {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/Provider'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioAdminDeleteProvider
      summary: Delete a provider
      description: 'From 1.15. Admin only. 409 while a batch that names it is unfinished (`<name> is in use by an unfinished batch`).'
      parameters: [{$ref: '#/components/parameters/ProviderName'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/providers/{name}/test:
    post:
      tags: [studio]
      operationId: studioAdminTestProvider
      summary: Check that a provider answers (made by pipelines_service, the only service that calls providers)
      description: 'From 1.15. Admin only. Studio asks `pipelines.providers.test` (30 s, else 503); `?model=` adds one tiny chat completion. A failed test is 200 with ok false and `failure`.'
      parameters:
        - {$ref: '#/components/parameters/ProviderName'}
        - {name: model, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: the result, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderTest'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/provider-presets:
    get:
      tags: [studio]
      operationId: studioAdminListProviderPresets
      summary: The model provider presets the form is filled from (contracts/providers/presets.json)
      description: 'From 1.51. Admin only (403). The embedded file''s presets in its order, with the deployment''s remote switch (the form greys remote presets while it is off). A preset only fills the form: a saved provider never changes on its own.'
      responses:
        '200': {description: the presets, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderPresetList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}

  /v1/studio/admin/provider-presets/{id}/models:
    post:
      tags: [studio]
      operationId: studioAdminFetchPresetModels
      summary: A preset's Fetch — the models its provider lists (made by pipelines_service)
      description: |
        From 1.51. Admin only (403). Studio builds the provider from the preset file (its `kind`, `base_url` and
        `compat`; never a URL from the browser: a body with `base_url` is 422), `key_secret` from the body or the
        preset, `timeout_s` 15, and asks `pipelines.providers.test` without a model (30 s, else 503). The host rule and
        the remote switch apply as for Test: a remote preset while the switch is off is 200 with ok false and failure
        `off`. 404 for an unknown preset. A saved provider fetches through `POST /v1/studio/admin/providers/{name}/test`
        without `model`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$'}}
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/ProviderFetch'}}}
      responses:
        '200': {description: the result, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderTest'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/provider-keys/{key_secret}:
    get:
      tags: [studio]
      operationId: studioAdminGetProviderKey
      summary: Is a provider's key file there? (never the key)
      description: 'From 1.51. Admin only (403). Studio asks `pipelines.providers.key` (5 s, else 503); pipelines stats the file in its key folders and never opens it. `path` is the deploy-side text (`deploy/secrets/providers/<key_secret>`), never a container path. 404 for a malformed name. From 1.52 `writable`: whether this deployment lets the admin save keys here.'
      parameters:
        - {name: key_secret, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: the status, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderKey'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [studio]
      operationId: studioAdminSaveProviderKey
      summary: Save a provider's key — checked with the provider, then written to the key file (never read back)
      description: |
        From 1.52 (plan 27). Admin only (403). The body names one source, as Fetch does: `preset` (studio takes its
        `kind`, `base_url` and `compat` from the presets file) or `provider` (a saved provider's row); never a URL from
        the browser (a `base_url` is 422). Studio asks `pipelines.providers.key.write` (30 s, else 503): pipelines lists
        `GET <base_url>/models` with the key in memory (the host rule and the remote switch as for any call, 15 s), and
        `check` is `ok` (written), `refused` (401 or 403: nothing written), `unreachable` (anything else: nothing
        written; `detail` is our own short reason) or `skipped` (`force: true`: written without a call). The key is
        trimmed, then 1-1024 printable ASCII characters only (0x21-0x7E: no spaces, no `…`, curly quote, non-breaking or
        zero-width space), written into the first key folder only (temp file and rename, owner-only) and never returned
        or logged. 404 malformed name, unknown preset or provider; 422 a bad key (the detail names the rule, never the
        value; a character outside 0x21-0x7E is always `the key has a character keys never have (like … or a curly quote): copy it again from the provider`), both or neither source, an unknown field; 409 `keys are set in
        files on this deployment` (not writable) or a folder of that name.
      parameters:
        - {name: key_secret, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProviderKeySave'}}}
      responses:
        '200': {description: the check and the status after it, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderKeySaved'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioAdminRemoveProviderKey
      summary: Remove a provider's key file (the provider then shows Missing)
      description: 'From 1.52 (plan 27). Admin only (403). Studio asks `pipelines.providers.key.write` with `op: remove` (5 s, else 503); pipelines deletes the file of that name in its first key folder only (missing is fine). The answer is the status after it: `found` stays true when a later key folder still has a file of that name. 404 malformed name; 409 not writable.'
      parameters:
        - {name: key_secret, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: the status after removal, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderKey'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/session-names:
    get:
      tags: [studio]
      operationId: studioAdminGetSessionNames
      summary: How untitled sessions are named (Admin › AI agents)
      description: 'From 1.43. Admin only (403). contracts/README.md, Sessions: titles and naming.'
      responses:
        '200': {description: the setting, content: {application/json: {schema: {$ref: '#/components/schemas/SessionNames'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [studio]
      operationId: studioAdminPutSessionNames
      summary: Set how untitled sessions are named
      description: |
        From 1.43. Admin only (403). Applies to sessions named from then on. 422 `<provider> is not an enabled provider`,
        `<model> is not a model of <provider>`, `provider and model are only for remote`, `remote needs a provider`,
        `Qwen3.8 27B is not downloaded` (local with no live host that can run `llm-ask`); 409 `remote models are off on
        this deployment` for a provider of kind remote while the deployment's switch is off (a server, "on this
        network", needs no switch).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionNamesPut'}}}
      responses:
        '200': {description: the setting, content: {application/json: {schema: {$ref: '#/components/schemas/SessionNames'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: models and model jobs (API 1.16, contracts/README.md, Models and model jobs)
  # ------------------------------------------------------------------ studio: the assistant (from 1.44, plan 18 22)
  /v1/studio/assistant/threads:
    get:
      tags: [studio]
      operationId: studioListAssistantThreads
      summary: 'From 1.44: your assistant chats, newest first, and the assistant''s state for you'
      description: |
        At most 200 chats (`updated_at`, then `id`, newest first). `status` says whether the assistant is on, where its
        model runs (a remote provider: the drawer shows the notice first), whether web search is on, your caps and what
        you used today. When the admin has it off, `status.enabled` is false and the list is still served.
      responses:
        '200': {description: the chats, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThreadList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreateAssistantThread
      summary: 'From 1.44: New chat'
      description: |
        Creates an empty chat. Your previous chat (the newest with a message) gets its summary written
        (`cmd.assistant.turn` input `summarize`). 409 `the assistant is off` while the admin has it off.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThreadCreate'}}}
      responses:
        '201': {description: the chat, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThread'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/assistant/threads/{thread_id}:
    get:
      tags: [studio]
      operationId: studioGetAssistantThread
      summary: 'From 1.44: one chat with its newest 200 entries, oldest first'
      description: 'Another user''s chat is 404. New entries arrive on `GET …/events`.'
      parameters: [{$ref: '#/components/parameters/ThreadId'}]
      responses:
        '200': {description: the chat, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThreadDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteAssistantThread
      summary: 'From 1.44: delete a chat, its checkpoints and its summary'
      description: |
        Deletes the chat's rows and writes `cmd.assistant.delete` in one transaction (pipelines drops its checkpoints
        and the chat's summary; the other items it saved stay). A card waiting in it is cancelled.
      parameters: [{$ref: '#/components/parameters/ThreadId'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/assistant/threads/{thread_id}/messages:
    post:
      tags: [studio]
      operationId: studioPostAssistantMessage
      summary: 'From 1.44: a message, the actions'' results, a card''s answer, or Continue here'
      description: |
        `message` stores your message and writes `cmd.assistant.turn` in one transaction (202; the turn's steps arrive
        on `…/events`); a chat parked on actions of a tab that went away resumes first, each of them `did_not_run`
        (`the tab was closed`). `results` and `answer` resume the parked turn; they are accepted only from the tab that
        runs it (`client_id`, else 409 `this chat is working in another tab`) and only for the ids it waits on (409
        `nothing waits on <id>`). `continue` moves the chat to this tab (Continue here): its pending actions are sent
        to it, the other tab turns read-only; no command is written. 409 `the assistant is off`, and for a message while
        a turn is working (`wait for the answer, or Stop`); 429 above the admin's messages a minute (`at most <n>
        messages a minute`); 422 for a blank text or a screen summary over 16 000 characters. A daily cap is not a 4xx:
        the message is kept and the step's `error` says when it starts again.
      parameters: [{$ref: '#/components/parameters/ThreadId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantPost'}}}
      responses:
        '202': {description: accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantAccepted'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/assistant/threads/{thread_id}/events:
    get:
      tags: [studio]
      operationId: studioAssistantEvents
      summary: 'From 1.44: chat events after a cursor — JSON polling, or server-sent events with `Accept text/event-stream`'
      description: |
        Like the batch events, numbered by a per-chat `seq`: JSON gives the events with `seq > since` (at most 500) and
        `last_seq`; SSE replays `seq > since` (or `Last-Event-ID`, which wins), then streams, `id:` = seq, `event:` =
        `entry` (a stored entry: your message, the assistant's words, a line, a card) or `thread` (the chat's state and
        the tab that runs it), `data:` = the `AssistantEvent` JSON, `: keep-alive` every 15 s. A step that asks for
        actions sends them in the `thread` event's `pending`; only the drawer whose `client_id` matches runs them.
      parameters:
        - {$ref: '#/components/parameters/ThreadId'}
        - {name: since, in: query, schema: {type: integer, minimum: 0, default: 0}, description: cursor — the last seq the client has}
        - {name: Last-Event-ID, in: header, required: false, schema: {type: string}, description: 'SSE resume: the last `id:` received (an integer)'}
      responses:
        '200':
          description: events
          content:
            application/json: {schema: {$ref: '#/components/schemas/AssistantEventPage'}}
            text/event-stream: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/assistant/memory:
    get:
      tags: [studio]
      operationId: studioListAssistantMemory
      summary: 'From 1.44: what the assistant remembers about you, newest first — the Memory list'
      description: |
        Studio asks pipelines_service (`pipelines.assistant.memory` `list`, 5 s: else 503) in your namespace only.
        `kind`: preference (Likes), project (Projects), worked (Worked), summary (Chats). Each item names its chat
        (title, or null once the chat is deleted).
      parameters:
        - {name: kind, in: query, required: false, schema: {$ref: '#/components/schemas/AssistantMemoryKind'}}
      responses:
        '200': {description: the items, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMemoryList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioClearAssistantMemory
      summary: 'From 1.44: Clear all'
      responses:
        '204': {description: cleared}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/assistant/memory/{item_id}:
    patch:
      tags: [studio]
      operationId: studioEditAssistantMemoryItem
      summary: 'From 1.44: edit one item''s text'
      description: '`text` is trimmed (blank: 422). Another user''s item is 404.'
      parameters:
        - {name: item_id, in: path, required: true, schema: {type: string}, description: 'memory item UUID (unknown, another user''s or malformed = 404)'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMemoryPatch'}}}
      responses:
        '200': {description: the item, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMemoryItem'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteAssistantMemoryItem
      summary: 'From 1.44: delete one item (Delete, or Undo on a Remembered line)'
      parameters:
        - {name: item_id, in: path, required: true, schema: {type: string}, description: 'memory item UUID (unknown, another user''s or malformed = 404)'}
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/assistant:
    get:
      tags: [studio]
      operationId: studioAdminGetAssistant
      summary: 'From 1.44: the assistant''s settings (Admin › AI agents)'
      description: 'Admin only (403). Off, with no provider, until the admin sets it.'
      responses:
        '200': {description: the settings, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [studio]
      operationId: studioAdminPutAssistant
      summary: 'From 1.44: set the assistant on or off, its provider and model, web search and the caps'
      description: |
        Admin only (403). Applies from each chat's next input. 422 when `enabled` without a provider, for a provider
        that is not an enabled server or remote, a model not in its models, or a search provider that is not an
        enabled provider of kind search; 409 `remote models are off on this deployment` for a remote provider or web
        search while the deployment's switch is off.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantSettingsPut'}}}
      responses:
        '200': {description: the settings, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/models:
    get:
      tags: [studio]
      operationId: studioListModels
      summary: Every model and variant with its components, and its presence on every host (for everyone)
      description: |
        From 1.16. Built from the registry `<host>.<env>.models` keys of every host with a present `hosts` key (fresh or
        offline) and studio's model jobs; nothing in it is per user. `hosts`: those hosts by name, `live` = a fresh key.
        `models`: the union of their models by `title` then `id`; each variant's descriptive fields from the freshest
        live key that publishes it (else the freshest key); `hosts` of a variant: every host whose models key lists the
        model, by name (a host with no env for the model is not listed). A variant host's `state`: `downloading` while a
        download job of that (host, model, variant) is queued or running (`job`), else the key's `presence`. Not
        paginated.
      responses:
        '200': {description: the models, content: {application/json: {schema: {$ref: '#/components/schemas/ModelList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/models/{model}/download:
    post:
      tags: [studio]
      operationId: studioAdminDownloadModel
      summary: Queue a download of a variant's weights to one host (a model job)
      description: |
        From 1.16. Admin only (403). 202 with the new job, `queued`; 200 with the existing job when a download of the
        same (host, model, variant) is already queued or running (idempotent). The runner of the env whose models key
        lists the model on that host fetches the variant's `source` (and any shared component of its owner variant not
        already on the host with matching hashes) into `<models root>/<dir>/` as plain files (contracts/README.md,
        Model jobs). 404 for a model no host publishes. 422 `host <host> has no env for <model>`, `<model> has no
        variant <variant>`, `<title> <variant> has no download source`, `licence <id> must be accepted` (the variant's
        `source.must_accept` and `accept_licence` not true). 409 `<title> <variant> is already on <host>` (state
        present), `a delete of <title> on <host> is unfinished`; from 1.18 `models root on <host> is read-only` (its
        runner's hosts key reports `models_disk.writable: false`). From 1.36 a body with `addon` downloads that optional
        add-on instead (contracts/README.md, Optional add-ons): 422 `<model> has no add-on <addon>`, `give a variant or
        an add-on, not both`, `<title> <add-on title> has no download source`; 409 `<title> <add-on title> is already
        on <host>`.
      parameters: [{$ref: '#/components/parameters/ModelId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ModelDownload'}}}
      responses:
        '200': {description: 'the same download, already queued or running', content: {application/json: {schema: {$ref: '#/components/schemas/ModelJob'}}}}
        '202': {description: 'the job, queued', content: {application/json: {schema: {$ref: '#/components/schemas/ModelJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/models/{model}:
    delete:
      tags: [studio]
      operationId: studioAdminDeleteModel
      summary: Queue a delete of a model's files on one host (a model job)
      description: |
        From 1.16. Admin only (403). 202 with the job (its `keeps`: shared components left on disk because another
        variant on the host that is not deleted loads them); 200 with the existing job when the same delete is queued
        or running. `variant` absent = every variant of the model on the host. Refused, checked again by studio when
        it releases the job and by the runner before it removes anything (then the job fails `in_use`): 409 `<title>
        <variant> is not on <host>` (state missing), `<component> of <title> is loaded on <host>; unload it first` (a
        resident entry of any env of the host whose files the delete removes), `<title> is in use by a queued or
        running run on <host>` (a run not yet terminal whose model node names the model and whose host is the host, or
        that is not placed yet and the host is eligible for it), `a download of <title> on <host> is unfinished; cancel
        it first`, from 1.18 `models root on <host> is read-only`. 422 `host <host> has no env for <model>`, `<model>
        has no variant <variant>`, `host is required`. The
        runner deletes only inside `<models root>/<dir>/` (never through a symlink out of it). From 1.36 `addon`
        deletes only that optional add-on's files (a variant's delete keeps them): 409 `<title> <add-on title> is not on
        <host>`, `<addon> of <title> is loaded on <host>; unload it first`, and the in-use and unfinished-download texts
        above; 422 `<model> has no add-on <addon>`, `give a variant or an add-on, not both`.
      parameters:
        - {$ref: '#/components/parameters/ModelId'}
        - {name: host, in: query, required: true, schema: {type: string, pattern: '^[a-z0-9]{1,32}$'}}
        - {name: variant, in: query, required: false, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}}
        - {name: addon, in: query, required: false, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}, description: 'from 1.36: an optional add-on of the model (Model.addons[].component) instead of a variant'}
      responses:
        '200': {description: 'the same delete, already queued or running', content: {application/json: {schema: {$ref: '#/components/schemas/ModelJob'}}}}
        '202': {description: 'the job, queued', content: {application/json: {schema: {$ref: '#/components/schemas/ModelJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/loras/{lora_id}:
    delete:
      tags: [studio]
      operationId: studioAdminDeleteSharedLora
      summary: Queue a delete of a shared LoRA's file on one host (a model job)
      description: |
        From 1.16. Admin only (403). 202 with the job (kind `lora_delete`, sent to the first env by name whose loras key
        on that host lists the id); 200 with the existing job when the same delete is queued or running. Every file of
        that host's index with this SHA-256 is removed; the other envs of the host drop it at their next rescan (at
        most 60 s). 404 for an id the host does not list (an own LoRA's UUID included: users delete their own with
        `DELETE /v1/studio/loras/{lora_id}`). 409 `LoRA <name> is part of <title> (pre-fused); delete the model
        instead`, `LoRA <name> is baked into a loaded component on <host>; unload it first`, `LoRA <name> is in use by
        a queued or running run on <host>`.
      parameters:
        - {$ref: '#/components/parameters/LoraId'}
        - {name: host, in: query, required: true, schema: {type: string, pattern: '^[a-z0-9]{1,32}$'}}
      responses:
        '200': {description: 'the same delete, already queued or running', content: {application/json: {schema: {$ref: '#/components/schemas/ModelJob'}}}}
        '202': {description: 'the job, queued', content: {application/json: {schema: {$ref: '#/components/schemas/ModelJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/model-jobs:
    get:
      tags: [studio]
      operationId: studioAdminListModelJobs
      summary: Model jobs, newest first (at most 200)
      description: 'From 1.16. Admin only (403). `active`: true = only queued and running ones. Every admin sees every job.'
      parameters:
        - {name: host, in: query, required: false, schema: {type: string, pattern: '^[a-z0-9]{1,32}$'}}
        - {name: active, in: query, required: false, schema: {type: boolean}}
      responses:
        '200': {description: the jobs, content: {application/json: {schema: {$ref: '#/components/schemas/ModelJobList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/model-jobs/{job_id}:
    get:
      tags: [studio]
      operationId: studioAdminGetModelJob
      description: 'From 1.16. Admin only (403). The UI polls it (every 2 s while active) for progress.'
      parameters: [{$ref: '#/components/parameters/ModelJobId'}]
      responses:
        '200': {description: the job, content: {application/json: {schema: {$ref: '#/components/schemas/ModelJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/model-jobs/{job_id}/cancel:
    post:
      tags: [studio]
      operationId: studioAdminCancelModelJob
      summary: Cancel a queued job, or a running download
      description: |
        From 1.16. Admin only (403). Queued: `cancelled` at once, never sent. A running download: studio writes KV
        `cancels` key `<job_id>`; the runner stops within 2 s, keeps the partial files (the variant shows `partial`; a
        new download resumes them) and reports `cancelled`; if the env's hosts key is gone or older than 60 s, studio
        marks it `cancelled` itself and purges the command from `cmd.model.<host>.<env>`. 409 `a running delete cannot
        be cancelled`, `job already ended`. Answers the job as it is now.
      parameters: [{$ref: '#/components/parameters/ModelJobId'}]
      responses:
        '200': {description: the job, content: {application/json: {schema: {$ref: '#/components/schemas/ModelJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: hosts admin (API 1.16, contracts/README.md, Hosts admin)
  /v1/studio/admin/hosts/{host}/unload:
    post:
      tags: [studio]
      operationId: studioAdminUnload
      summary: Unload components, cached handles, or everything on a host (pins included)
      description: |
        From 1.16. Admin only (403). Studio sends `req.runner.unload` with `by: admin` to each env concerned: `all` =
        every env of the host, no `components` (everything: pinned components, adapters, cached handles); `entries` =
        one request per env with that env's entries (pinned ones too; an entry not resident is skipped); `cached_env` =
        that env, `cached_only`. An env whose key is idle is asked at once; a busy one after its run ends ("a running
        run finishes first"): until every request of this call is answered, or 60 s after the host went idle, the
        dispatcher releases nothing to the host. Pins stay set. The result shows in `GET /v1/studio/hosts`. 404 for a
        host with no present hosts key. 422 `env <env> is not on host <host>`.
      parameters: [{$ref: '#/components/parameters/HostName'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HostUnload'}}}
      responses:
        '202': {description: 'asked (or waiting for the run)', content: {application/json: {schema: {$ref: '#/components/schemas/HostUnloadAccepted'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/hosts/{host}/settings:
    put:
      tags: [studio]
      operationId: studioAdminPutHostSettings
      summary: Set what stays loaded after a run, the idle timeout and the memory reserve, for every env of a host
      description: |
        From 1.16. Admin only (403). Stored in studio (the truth), `version` + 1, written to KV `host_settings` key
        `<host>`; each runner of the host applies it at once when idle, else after its run, without a restart, and
        reports it in its hosts key (`policy.settings_version`; `HostSettings.applied`). A first PUT creates the row
        with no pins. 404 for a host with no present hosts key. 422 `reserve_gb leaves no memory on <host>` (reserve_gb
        ≥ the smallest memory the host's keys cut their budget from: `device.memory_total_gb` (VRAM) for a key whose
        `device.kind` is cuda, else `machine.ram_gb`).
      parameters: [{$ref: '#/components/parameters/HostName'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HostSettingsPut'}}}
      responses:
        '200': {description: the settings, content: {application/json: {schema: {$ref: '#/components/schemas/HostSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/hosts/{host}/pins:
    put:
      tags: [studio]
      operationId: studioAdminPutHostPins
      summary: Replace the host's pinned components
      description: |
        From 1.16. Admin only (403). Replaces the pins (duplicates collapsed), `version` + 1, published like the
        settings. A first PUT creates the row with the other settings copied from the freshest key's `policy`. A pin
        keeps its entry loaded (keep_pinned, the idle unload) and is a hand-over victim only as the last resort (after
        every unpinned one, when the run would not fit otherwise: a pin never fails or holds a run; `Run.unloads_pinned`
        says so first); an admin unload still unloads it. An unloaded pin stays set. A pin need not be resident now. 404 for a host with no
        present hosts key. 422 `env <env> is not on host <host>`, `<model> is not published by <host>.<env>`.
      parameters: [{$ref: '#/components/parameters/HostName'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HostPins'}}}
      responses:
        '200': {description: the settings, content: {application/json: {schema: {$ref: '#/components/schemas/HostSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: import (API 1.16, contracts/README.md, Import)
  /v1/studio/admin/imports/takes:
    post:
      tags: [studio]
      operationId: studioAdminCreateImportTake
      summary: Create (or find) one imported take for a user, with signed PUT links for its files
      description: |
        From 1.16, used by `helm import`. Admin only (403). Idempotent on (`owner_id`, `key`): a new key stores a
        pending take (`source: import`, owner `owner_id`) and answers 201 with single-use 24-hour `PUT` links for
        `u/<owner_id>/imports/<take_id>.<png|jpg|webp|mp4>` (and, for a video, `…/<take_id>.poster.<png|jpg|webp>`),
        exactly as uploads sign them; a key already pending answers 200 with fresh links; a key already complete
        answers 200 `state: ready` without links and changes nothing but adding `parents` edges not stored yet. Every
        `parents` key is stored as an edge and shows once both takes are complete, in either order. A pending import
        not completed in 24 hours is deleted. 422 for a body that breaks the schema, `legacy is larger than 64 KB`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ImportTakeCreate'}}}
      responses:
        '200': {description: 'the key was seen: still pending (fresh links), or ready', content: {application/json: {schema: {$ref: '#/components/schemas/ImportTake'}}}}
        '201': {description: 'created, pending', content: {application/json: {schema: {$ref: '#/components/schemas/ImportTake'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/admin/imports/takes/{take_id}/complete:
    post:
      tags: [studio]
      operationId: studioAdminCompleteImportTake
      summary: Check an imported take's uploaded files and show it in its owner's gallery
      description: |
        From 1.16. Admin only (403). As `POST /v1/studio/uploads/{take_id}/complete`: HEAD each object (its size =
        the declared bytes) and read its first 64 KB: an image's header gives width and height (must equal the declared
        ones); a video must start with an MP4 `ftyp` box; its poster is checked as an image. 422 `size differs from the
        declared bytes`, `not a png, jpeg or webp image`, `not an MP4 file`, `width and height differ from the file`
        (a failed check deletes the pending take and its objects, so a later run of the import creates it again). 409
        `upload not received` while an object is missing. Complete again: the same 200. 404 for an id that is not a pending or
        ready import.
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      responses:
        '200': {description: 'the take, as its owner sees it', content: {application/json: {schema: {$ref: '#/components/schemas/Take'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ studio: timelines (API 1.17, M5b; contracts/README.md, Timeline)
  /v1/studio/timelines:
    get:
      tags: [studio]
      operationId: studioListTimelines
      summary: The caller's sequences, newest `updated_at` first (at most 100, not paginated)
      responses:
        '200': {description: the sequences, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [studio]
      operationId: studioCreateTimeline
      summary: New sequence, optionally with its first clips (target defaults from the first clip)
      description: |
        Creates the sequence (revision 1) and its own session (`session_id`: New shot and Re-render runs go there). Missing
        `target` fields come from the first take of `take_ids` (contracts/README.md, Timeline: sequences), else
        1280 × 720, 24 fps, 48000 Hz. `take_ids` are added as `POST …/clips` adds them. 409 at 100 sequences (`You have
        100 sequences; delete some first.`). 422 `take_ids[2]: take <id> not found` (unknown, another user's, deleted
        or a pending upload), `name must be 1-80 characters`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineCreate'}}}
      responses:
        '201': {description: the sequence, content: {application/json: {schema: {$ref: '#/components/schemas/Timeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}:
    get:
      tags: [studio]
      operationId: studioGetTimeline
      description: 'The sequence at its current revision, normalized, with `takes` (every take it names, signed), offline clips marked and each pending shot''s status. From 1.49 `view=agent` answers the agent view instead (`TimelineAgentView`: every clip flat, times in seconds and frames, no signed links; contracts/README.md, Timeline: edits by ops).'
      parameters:
        - {$ref: '#/components/parameters/TimelineId'}
        - {name: view, in: query, required: false, schema: {type: string, enum: [agent]}, description: 'from 1.49: `agent` = TimelineAgentView'}
      responses:
        '200': {description: the sequence, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Timeline'}, {$ref: '#/components/schemas/TimelineAgentView'}]}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [studio]
      operationId: studioUpdateTimeline
      summary: 'An edit: the whole document at the revision it was made on'
      description: |
        Every edit is a whole-document write (contracts/README.md, Timeline: edits): `target` and `tracks` as the
        editor computed them (the shared edit functions), with the `revision` they were made on. Studio normalizes it
        (Timeline rules) and stores it as revision + 1; the answer is the normalized sequence. 409 when `revision` is
        not the current one: `timeline changed since you opened it (now revision <n>)` (re-read, then re-apply the
        edit). 422 `TimelineError` when a rule fails (`problems`, the first in `detail`), or `{detail}` for a body that
        does not fit the schema.
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineUpdate'}}}
      responses:
        '200': {description: the sequence, content: {application/json: {schema: {$ref: '#/components/schemas/Timeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/TimelineUnprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      tags: [studio]
      operationId: studioPatchTimeline
      summary: 'Rename, or set the defaults for new shots (no revision; not undone)'
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelinePatch'}}}
      responses:
        '200': {description: the sequence, content: {application/json: {schema: {$ref: '#/components/schemas/Timeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [studio]
      operationId: studioDeleteTimeline
      summary: Delete a sequence (soft)
      description: 'Gone from every answer at once; its unfinished exports are cancelled; its runs and batches go on and their takes stay in the gallery. An export take keeps naming it (`Take.export`).'
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      responses:
        '204': {description: deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/clips:
    post:
      tags: [studio]
      operationId: studioAddTimelineClips
      summary: '"Add to timeline": append takes in order (no revision needed)'
      description: |
        Applies the `add` edit to the current revision (so a gallery action never holds a revision) and stores revision
        + 1. V1 (default): a video take whole (`in` 0, `out` its length), an image take held 3 s. An audio track
        (`track: A2`…): a video take's sound or (from 1.32) an audio take, whole, at the track's end. 422 `take_ids[2]: take <id> not found`,
        `take_ids[1]: take <id> has no sound` (on an audio track), `take_ids[1]: an image cannot go on an audio track`, (1.32, replacing 1.19's
        `… an audio take cannot go on the timeline yet`) `take_ids[1]: an audio take goes on an audio track` (on V1),
        `unknown track A4`, or a rule (`TimelineError`, e.g. `too_many_clips`).
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineAddClips'}}}
      responses:
        '200': {description: the sequence, content: {application/json: {schema: {$ref: '#/components/schemas/Timeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/TimelineUnprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/clips/{clip_id}/actions:
    get:
      tags: [studio]
      operationId: studioListClipActions
      summary: 'A clip''s take actions (from 1.19, plan 15.3): Extend, Retake…, with inputs pre-filled from the clip; from 1.32 an audio clip''s Make shot'
      description: |
        contracts/README.md, Timeline: take actions. The clip's take's offers (`…/takes/{take_id}/uses`) restricted to
        templates of the family of the workflow that made the take (an upload, import or export: every family), with
        `start` / `end` (the selection in sequence seconds; absent = the clip's extent; clamped to the clip) mapped to
        the take's own time (t − `at` + `in`), snapped to the take's frames, for every `span` param and a `trim` media
        param's in / out. `ltx-extend` only at an end of the take: `extend.direction` `after` when the range ends at
        the take's end (within one frame), else `before` when it starts at 0, else not offered. Run one with
        `POST …/shots` (`slot {clip}` = replace; insert: `slot {after: <clip>}`, an extend before `slot {at: <clip's
        at>}`). Empty for an empty slot, an offline
        clip or a take nothing fits. 404 unknown sequence; 422 `unknown clip <id>`, `start must be before end`.

        From 1.32 an audio-track clip (contracts/README.md, Timeline: Make shot) answers its take's offers of **every**
        family into one `media` param (not rows) of a workflow whose media is video (Audio to video: `ltx-audio-to-video`,
        `echo-a2v`), with the range = the selection or the clip's in..out (an audio take snapped to whole ms, a video's
        sound to its frames; the offer caps the part at the param's `max_s`, 13.375 s) and `slot {at: <the clip's
        at>, length: <out − in>, exact: true}`: run it with `POST …/shots` and that slot. 422 `clip <id> is not on V1`
        is gone (A1 is V1's own sound, not a track: it has no clips of its own).
      parameters:
        - {$ref: '#/components/parameters/TimelineId'}
        - {name: clip_id, in: path, required: true, schema: {type: string}, description: 'a slot id: V1, or (1.32) an audio track''s clip'}
        - {name: start, in: query, required: false, schema: {type: number, minimum: 0}, description: 'the selection''s start, sequence seconds'}
        - {name: end, in: query, required: false, schema: {type: number, exclusiveMinimum: 0}, description: 'the selection''s end, sequence seconds'}
      responses:
        '200': {description: the actions, content: {application/json: {schema: {$ref: '#/components/schemas/ClipActions'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/undo:
    post:
      tags: [studio]
      operationId: studioUndoTimeline
      summary: Undo the latest edit (written forward as a new revision)
      description: 'contracts/README.md, Timeline: revisions. 409 when `revision` is not the current one, or `nothing to undo` (the revision to restore is older than the 100 kept, or there is none).'
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineRevision'}}}
      responses:
        '200': {description: the sequence, content: {application/json: {schema: {$ref: '#/components/schemas/Timeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/redo:
    post:
      tags: [studio]
      operationId: studioRedoTimeline
      summary: Redo the latest undo (written forward as a new revision)
      description: '409 when `revision` is not the current one, or `nothing to redo` (any edit after an undo clears redo).'
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineRevision'}}}
      responses:
        '200': {description: the sequence, content: {application/json: {schema: {$ref: '#/components/schemas/Timeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/edits:
    post:
      tags: [studio]
      operationId: studioEditTimeline
      summary: 'From 1.49: named edit ops applied in order, all or nothing (or tried: dry_run)'
      description: |
        contracts/README.md, Timeline: edits by ops. Applies `ops` (at most 200) in order with the timeline rules
        (`t_apply`: edit, then normalize) to the current document, which must be `base_revision`, and stores the
        result as one revision (one undo undoes the call). `dry_run: true` answers the same and stores nothing
        (`revision` = `base_revision`). An op that makes clips and leaves out their ids gets ids from studio
        (answered in `diff.added`). `X-Helm-Client` (`web`, `helm`, `mcp`, `assistant`) labels the revision's `via`.
        409 `timeline changed since you opened it (now revision <n>)` when `base_revision` is not the current one (a
        dry run too; nothing is re-applied: re-read and re-plan). 422 `TimelineEditError` when an op cannot apply
        (`op_index`, `code`: an edit error such as `split_edge`, `unknown_clip`, `take_not_found`, or the first
        problem's code with every problem of the document after that op) or `{detail}` for a body that does not fit
        (`fill` is studio's; `too_many_ops` past 200). Nothing is stored on any error.
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineEdits'}}}
      responses:
        '200': {description: the result, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineEditResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/TimelineEditUnprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/revisions:
    get:
      tags: [studio]
      operationId: studioListTimelineRevisions
      summary: 'From 1.49: the kept revisions (the last 100), newest first'
      parameters:
        - {$ref: '#/components/parameters/TimelineId'}
        - {name: before, in: query, required: false, schema: {type: integer, minimum: 1}, description: 'only revisions below this one (paging)'}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: the history, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineRevisionList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/revisions/{revision}:
    get:
      tags: [studio]
      operationId: studioGetTimelineRevision
      summary: 'From 1.49: one kept revision''s document, as stored'
      description: '404 when the revision is not kept (pruned, or never made).'
      parameters:
        - {$ref: '#/components/parameters/TimelineId'}
        - {name: revision, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: the revision, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineRevisionDoc'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/restore:
    post:
      tags: [studio]
      operationId: studioRestoreTimeline
      summary: 'From 1.49: write a kept revision''s document forward as a new revision'
      description: 'contracts/README.md, Timeline: edits by ops. Undo to any kept point: the document of `to`, reconciled as undo is, stored as revision + 1 (`undo_to` = the current, `redo_to` = null); history is never rewritten. 409 when `revision` is not the current one; 422 `revision <n> is not kept`.'
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineRestore'}}}
      responses:
        '200': {description: the sequence, content: {application/json: {schema: {$ref: '#/components/schemas/Timeline'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/TimelineUnprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/frame:
    post:
      tags: [studio]
      operationId: studioTimelineFrame
      summary: 'From 1.49: what V1 shows at a sequence time, as a stored image (for an agent to look)'
      description: 'contracts/README.md, Timeline: edits by ops (`frame_at_time`). An empty slot or past the end: `empty`. An image take: its image. A video take: the nearest stored frame (its first frame = a run''s poster, or the stored last frame), with the source time wanted and the one shown. No dissolve or sound is composited, and nothing is made: no take, no job. 404 unknown sequence.'
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineFrameRequest'}}}
      responses:
        '200': {description: the frame, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineFrame'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/shots:
    post:
      tags: [studio]
      operationId: studioCreateTimelineShot
      summary: 'New shot: a run whose take fills a slot'
      description: |
        contracts/README.md, Timeline: New shot. `run` is checked and created exactly as `POST
        /v1/studio/sessions/{session_id}/runs` (same 422 texts, same 409 at 100 runs) in the sequence's session; the
        slot gets `shot {run_id}` (an inserted slot first: the `insert` edit; from 1.19 `slot {after}`: the `insert`
        edit at that clip's end cut) as revision + 1, applied to the current revision. The run's first take fills the
        slot (the `fill` edit, by studio; a take with `source_map` is placed by it: contracts/README.md, Timeline: take
        actions). 409 `clip <id> already has a shot running` (`slot {clip}`); 422 `unknown clip <id>`, `clip <id> is
        not on V1`, `length is required to insert a slot`. From 1.32 `slot {at, length, exact: true}` (Make shot) is
        the `place` edit instead of `insert`: the slot starts at exactly frames(at) on V1 (past V1's end after an empty
        gap; inside an empty slot by splitting it; inside a take's clip at the nearest cut, as `insert`); `run` is the
        action's Audio to video run (contracts/README.md, Timeline: Make shot).
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineShotCreate'}}}
      responses:
        '202': {description: 'the sequence with the placeholder, and the run (queued, or failed at once)', content: {application/json: {schema: {$ref: '#/components/schemas/TimelineShot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/lines:
    post:
      tags: [studio]
      operationId: studioCreateTimelineLine
      summary: 'New line (from 1.32): a voice run whose take fills a slot on an audio track'
      description: |
        contracts/README.md, Timeline: New line. The audio-track twin of New shot. `run` is checked and created exactly
        as `POST /v1/studio/sessions/{session_id}/runs` (same 422 texts, scripts and voices included; same 409 at 100
        runs) in the sequence's session, and its workflow's media must be audio (422 `New line needs a workflow whose
        media is audio`). `slot {track, at, length}` puts a placeholder `{take_id: null, at, hold: length, shot
        {run_id}}` on that audio track at `at` (the playhead, snapped to a frame); `slot {clip}` redoes an audio
        clip (its take is replaced when the run succeeds; "Generate from this clip"). Revision + 1, applied to the
        current revision. The run's first take fills it (the `fill` edit on an audio track: the whole take at the
        slot's `at`, cut at the next clip on the track or the sequence's end); a failed run keeps the placeholder
        (`status: failed`, `error`), a cancelled one removes it. 409 `clip <id> already has a line running` (`slot
        {clip}`); 422 `unknown clip <id>`, `unknown track A4`, `clip <id> is not on an audio track`, `New line needs an
        audio track` (track V1), or a rule (`TimelineError`: `overlap` with a clip already there, `too_many_clips`).
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineLineCreate'}}}
      responses:
        '202': {description: 'the sequence with the placeholder, and the run (queued, or failed at once)', content: {application/json: {schema: {$ref: '#/components/schemas/TimelineShot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/TimelineUnprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/rerender:
    post:
      tags: [studio]
      operationId: studioRerenderTimeline
      summary: 'Re-render the sequence or a selection with a preset: one pipeline batch, a step per clip'
      description: |
        contracts/README.md, Timeline: re-render. 409 stale `revision`, a selected clip with a shot running, or the
        batch limit (`You have 5 unfinished batches; …`). 422 `clip <id> is an empty slot`, `clip <id> is offline`,
        `clip <id>: its take was not made by a workflow`, `clip <id>: workflow <wid> has no preset <p>`, `clip <id>:
        workflow <wid> no longer exists`, `at most 22 clips per re-render`, `clips <a> and <b> start from each other`,
        `unknown clip <id>`. From 1.32 `clips` may name audio-track clips made by a workflow (a line): each is a step,
        and a V1 clip made from such a clip's take (Make shot) re-renders after it, on its new take
        (contracts/README.md, Timeline: Make shot).
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineRerender'}}}
      responses:
        '202': {description: 'the sequence with every selected clip''s shot, and the batch', content: {application/json: {schema: {$ref: '#/components/schemas/TimelineRerenderAnswer'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/export/plan:
    post:
      tags: [studio]
      operationId: studioPlanTimelineExport
      summary: The export plan, shown before exporting (nothing is created)
      description: 'contracts/README.md, Timeline: export. `revision` absent = the current one; one that is not kept (older than the last 100) is 404.'
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineExportCreate'}}}
      responses:
        '200': {description: the plan, content: {application/json: {schema: {$ref: '#/components/schemas/ExportPlan'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/export:
    post:
      tags: [studio]
      operationId: studioExportTimeline
      summary: Export the sequence to an MP4 take (a queued media job)
      description: |
        Plans the stated revision (it must be the current one: 409 stale), builds the ffmpeg arguments and sends
        `cmd.media.job` (kind `export`) to the chosen runner env (contracts/README.md, Timeline: export). 409 when the
        plan is `blocked` (the first reason's text: `clip <id> is offline`, `the sequence is empty`, `no live host
        can export (ffmpeg)`), `an export of this sequence is already running`, or `revision`. 422 `host <h> cannot
        export` for a named host with no media env.
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TimelineExportCreate'}}}
      responses:
        '202': {description: 'the job, queued', content: {application/json: {schema: {$ref: '#/components/schemas/MediaJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/timelines/{timeline_id}/exports:
    get:
      tags: [studio]
      operationId: studioListTimelineExports
      summary: The sequence's exports, newest first (at most 20)
      parameters: [{$ref: '#/components/parameters/TimelineId'}]
      responses:
        '200': {description: the jobs, content: {application/json: {schema: {$ref: '#/components/schemas/MediaJobList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/media-jobs/{job_id}:
    get:
      tags: [studio]
      operationId: studioGetMediaJob
      description: 'An export or frame job of the caller (another user''s is 404). The UI polls it every second while it is queued or running.'
      parameters: [{$ref: '#/components/parameters/MediaJobId'}]
      responses:
        '200': {description: the job, content: {application/json: {schema: {$ref: '#/components/schemas/MediaJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/media-jobs/{job_id}/cancel:
    post:
      tags: [studio]
      operationId: studioCancelMediaJob
      summary: Cancel a queued or running export or frame job
      description: 'Studio writes KV `cancels` key `<job_id>`; the runner stops ffmpeg (SIGTERM, 10 s, SIGKILL), removes its temp files and reports `cancelled`. If the env''s hosts key is gone or older than 60 s, studio marks it `cancelled` itself. 409 `job already ended`. Answers the job as it is now.'
      parameters: [{$ref: '#/components/parameters/MediaJobId'}]
      responses:
        '200': {description: the job, content: {application/json: {schema: {$ref: '#/components/schemas/MediaJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/studio/takes/{take_id}/frame:
    post:
      tags: [studio]
      operationId: studioTakeFrame
      summary: An image take of a video take's first or last frame (for keyframes)
      description: |
        contracts/README.md, Timeline: frames. Idempotent per (take, `at`): a frame take made before and not deleted is
        answered again. 200 with the take when studio can make it at once (a server-side copy of the poster, or of the
        stored last frame); 202 with a media job (kind `frame`) for a video take made before API 1.17 that has no
        stored last frame (asking again while it runs answers the same job). 404 unknown take; 422 `take <id> is not a
        video`; 409 `no live host can export (ffmpeg)` when a job is needed and no env can run it.
      parameters: [{$ref: '#/components/parameters/TakeId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TakeFrameRequest'}}}
      responses:
        '200': {description: the frame take, content: {application/json: {schema: {$ref: '#/components/schemas/TakeFrame'}}}}
        '202': {description: the job that makes it, content: {application/json: {schema: {$ref: '#/components/schemas/TakeFrame'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ------------------------------------------------------------------ files
  /files/{path}:
    get:
      tags: [files]
      operationId: filesGetFile
      summary: A signed file (the signature is the auth; no API key)
      description: |
        Only reachable through a `url` the API returned. Served with `Content-Security-Policy: sandbox` and
        `X-Content-Type-Options: nosniff`, the object's stored `Content-Type` (`image/png`, `video/mp4`, …), its
        `Content-Length` and `ETag`, and `Accept-Ranges: bytes`. A `Range: bytes=<a>-<b>` / `<a>-` / `-<n>` header (one
        range; a multi-range header is answered as if absent, 200) gets 206 with `Content-Range: bytes <a>-<b>/<size>`
        and just those bytes, streamed from the object store's own range read, so a `<video>` can seek; a range that
        starts past the end is 416 with `Content-Range: bytes */<size>`. `HEAD` answers the same headers without a body.
        Kong passes `Range` through and buffers nothing.
      security: []
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}, description: storage-relative path (may contain slashes)}
        - {name: exp, in: query, required: false, schema: {type: integer}, description: 'expiry, unix seconds (missing = 403, not 422)'}
        - {name: sig, in: query, required: false, schema: {type: string}, description: 'HMAC signature of path and exp (missing = 403, not 422)'}
        - {name: Range, in: header, required: false, schema: {type: string, pattern: '^bytes=', examples: ['bytes=0-1048575']}, description: 'one byte range (RFC 9110); absent = the whole file'}
      responses:
        '200':
          description: the file
          headers:
            Content-Security-Policy: {schema: {type: string, const: sandbox}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
            Accept-Ranges: {schema: {type: string, const: bytes}}
          content: {application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}}
        '206':
          description: the requested range of the file
          headers:
            Content-Range: {schema: {type: string, examples: ['bytes 0-1048575/4129070']}}
            Content-Security-Policy: {schema: {type: string, const: sandbox}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
            Accept-Ranges: {schema: {type: string, const: bytes}}
          content: {application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}}
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: bad or missing signature, expired link, a path that escapes the store, or no such file (never 404)
        '400':
          $ref: '#/components/responses/GatewayBadPath'
    head:
      tags: [files]
      operationId: filesHeadFile
      summary: The headers `GET` would answer for a signed file, without a body
      security: []
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}, description: storage-relative path (may contain slashes)}
        - {name: exp, in: query, required: false, schema: {type: integer}, description: 'expiry, unix seconds (missing = 403, not 422)'}
        - {name: sig, in: query, required: false, schema: {type: string}, description: 'HMAC signature of path and exp (missing = 403, not 422)'}
        - {name: Range, in: header, required: false, schema: {type: string, pattern: '^bytes=', examples: ['bytes=0-1048575']}, description: 'one byte range (RFC 9110); absent = the whole file'}
      responses:
        '200':
          description: the file's headers
          headers:
            Content-Security-Policy: {schema: {type: string, const: sandbox}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
            Accept-Ranges: {schema: {type: string, const: bytes}}
        '206':
          description: the headers of the requested range
          headers:
            Content-Range: {schema: {type: string, examples: ['bytes 0-1048575/4129070']}}
            Accept-Ranges: {schema: {type: string, const: bytes}}
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: bad or missing signature, expired link, a path that escapes the store, or no such file (never 404)
        '400':
          $ref: '#/components/responses/GatewayBadPath'
    put:
      tags: [files]
      operationId: filesPutFile
      summary: Upload the bytes of a signed upload link (the signature is the auth; no API key)
      description: |
        Only reachable through an `upload_url` from `POST /v1/studio/uploads` (images and audio, at most 50 MB) or `POST
        /v1/studio/loras` (`u/<owner>/loras/<lora_id>.safetensors`, `application/octet-stream`, at most 2 GiB). The signature is the lower-case hex
        HMAC-SHA256 (the `/files` secret) of `"PUT\n" + path + "\n" + exp + "\n" + bytes + "\n" + ct`; a GET link
        (`path + "\n" + exp`) never verifies as a PUT. The request must carry `Content-Type` equal to `ct` and
        `Content-Length` equal to `bytes` (no chunked body); the body is streamed to the object store under `path`
        with that content type. Single use: an existing object is never overwritten (409).
      security: []
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}, description: 'the object key, u/<owner>/uploads/<take_id>.<ext>'}
        - {name: exp, in: query, required: false, schema: {type: integer}, description: 'expiry, unix seconds (missing = 403)'}
        - {name: bytes, in: query, required: false, schema: {type: integer}, description: 'the exact body size (missing = 403)'}
        - {name: ct, in: query, required: false, schema: {type: string}, description: 'the content type, URL-encoded (missing = 403)'}
        - {name: sig, in: query, required: false, schema: {type: string}, description: 'HMAC signature (missing = 403)'}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}}
      responses:
        '204': {description: stored}
        '403':
          $ref: '#/components/responses/Forbidden'
          description: bad or missing signature, expired link, or a path outside `u/` or with `..`
        '409':
          $ref: '#/components/responses/Conflict'
          description: '"already uploaded": the object exists'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '415':
          $ref: '#/components/responses/WrongContentType'
        '400':
          $ref: '#/components/responses/GatewayBadPath'


  # ------------------------------------------------------------------ auth_service
  # Kong routes /auth/* to auth_service; its plugin checks x-api-key on every route except the JWKS. Routes with
  # BearerJWT answer 401 for a missing/invalid/revoked access token; /auth/admin/* also 403 without the admin role.
  # There is no public sign-up: the root admin creates every account (POST /auth/admin/users).
  /auth/signin:
    post:
      tags: [auth]
      x-status: built
      operationId: authSignin
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SigninRequest'}}}
      responses:
        '200': {description: a new session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/InvalidLogin'}
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
        '429': {$ref: '#/components/responses/SigninLimited'}
  /auth/refresh:
    post:
      tags: [auth]
      x-status: built
      operationId: authRefresh
      security: [{ApiKey: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '429': {$ref: '#/components/responses/GatewayRateLimited'}
        '200': {description: 'rotated session (same family); the presented refresh token is now used', content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'unknown, expired, revoked or already-used refresh token (reuse revokes the whole family), or the user is disabled: "invalid or expired token"'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/signout:
    delete:
      tags: [auth]
      x-status: built
      operationId: authSignout
      security: [{ApiKey: [], BearerJWT: []}]
      responses:
        '204': {description: "the access token's session (refresh-token family) is revoked; evt.auth.revoked scope family, reason signout"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/password:
    put:
      tags: [auth]
      x-status: built
      operationId: authChangePassword
      security: [{ApiKey: [], BearerJWT: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChange'}}}
      responses:
        '204': {description: 'changed; every session of the user is revoked (evt.auth.revoked scope user, reason password_change)'}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'bad access token, or wrong current_password ("current password is incorrect"); the 5th wrong one within 15 minutes also revokes the session (evt.auth.revoked scope family, reason password_guess)'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/.well-known/jwks.json:
    get:
      tags: [auth]
      x-status: built
      operationId: authJwks
      description: 'public key(s) for verifying access tokens; no x-api-key (the Kong plugin bypasses this path). Cache-Control: public, max-age=300.'
      security: []
      responses:
        '200': {description: public keys, content: {application/json: {schema: {$ref: '#/components/schemas/Jwks'}}}}
  /auth/me:
    get:
      tags: [auth]
      x-status: built
      operationId: authMe
      security: [{ApiKey: [], BearerJWT: []}]
      responses:
        '200': {description: the token's user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/admin/users:
    get:
      tags: [auth]
      x-status: built
      operationId: authAdminListUsers
      security: [{ApiKey: [], BearerJWT: []}]
      responses:
        '200': {description: 'all users, newest first (not paginated)', content: {application/json: {schema: {$ref: '#/components/schemas/UserList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
    post:
      tags: [auth]
      x-status: built
      operationId: authAdminCreateUser
      summary: Create an account (the only way in while sign-up is closed); the user signs in with this email and password
      security: [{ApiKey: [], BearerJWT: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserCreate'}}}
      responses:
        '201': {description: the new user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/EmailTaken'}
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/admin/users/{id}/disabled:
    put:
      tags: [auth]
      x-status: built
      operationId: authAdminSetDisabled
      security: [{ApiKey: [], BearerJWT: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DisabledRequest'}}}
      responses:
        '200': {description: 'the updated user; disabling revokes all their sessions (evt.auth.revoked scope user, reason disabled)', content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'the admin account: its roles, password and state come from ADMIN_EMAIL / ADMIN_PASSWORD in auth''s .env'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/admin/users/{id}/roles:
    put:
      tags: [auth]
      x-status: built
      operationId: authAdminSetRoles
      security: [{ApiKey: [], BearerJWT: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RolesRequest'}}}
      responses:
        '200': {description: 'the updated user; their sessions are revoked so new tokens carry the new roles (evt.auth.revoked scope user, reason admin)', content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'the admin account: its roles, password and state come from ADMIN_EMAIL / ADMIN_PASSWORD in auth''s .env'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/admin/users/{id}/password:
    put:
      tags: [auth]
      x-status: built
      operationId: authAdminSetPassword
      security: [{ApiKey: [], BearerJWT: []}]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordRequest'}}}
      responses:
        '204': {description: 'set; all their sessions are revoked (evt.auth.revoked scope user, reason admin)'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'the admin account: its roles, password and state come from ADMIN_EMAIL / ADMIN_PASSWORD in auth''s .env'
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
  /auth/admin/apikeys:
    post:
      tags: [auth]
      x-status: built
      operationId: authAdminCreateApiKey
      description: 'issues a client API key (the client is created if new). The raw key is in this response only (Cache-Control: no-store); only its SHA-256 is stored.'
      security: [{ApiKey: [], BearerJWT: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyCreate'}}}
      responses:
        '201': {description: 'the key, shown once', content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyCreated'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '422': {$ref: '#/components/responses/AuthUnprocessable'}
    get:
      tags: [auth]
      x-status: built
      operationId: authAdminListApiKeys
      security: [{ApiKey: [], BearerJWT: []}]
      responses:
        '200': {description: 'all keys incl. revoked ones, newest first (not paginated)', content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
  /auth/admin/apikeys/{id}:
    delete:
      tags: [auth]
      x-status: built
      operationId: authAdminRevokeApiKey
      security: [{ApiKey: [], BearerJWT: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}, description: API key id (UUID; malformed = 404)}]
      responses:
        '204': {description: revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404':
          $ref: '#/components/responses/NotFound'
          description: unknown or already revoked key

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: identifies the calling application (checked at the gateway on every request)
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "the user's RS256 access token from a Session (verify with /auth/.well-known/jwks.json)"

  parameters:
    SessionId: {name: session_id, in: path, required: true, schema: {type: string}, description: session UUID (malformed = 404)}
    RunId: {name: run_id, in: path, required: true, schema: {type: string}, description: run UUID (malformed = 404)}
    WorkflowId: {name: workflow_id, in: path, required: true, schema: {type: string}, description: workflow id (unknown or malformed = 404)}
    UserId: {name: id, in: path, required: true, schema: {type: string}, description: user UUID (malformed = 404)}
    BatchId: {name: batch_id, in: path, required: true, schema: {type: string}, description: batch UUID (malformed = 404)}
    TakeId: {name: take_id, in: path, required: true, schema: {type: string}, description: take UUID (malformed = 404)}
    PipelineId: {name: pipeline_id, in: path, required: true, schema: {type: string}, description: pipeline UUID (malformed = 404)}
    LoraId: {name: lora_id, in: path, required: true, schema: {type: string}, description: 'a shared LoRA''s SHA-256 (64 hex) or an own LoRA''s UUID (malformed = 404)'}
    ModelId: {name: model, in: path, required: true, schema: {type: string}, description: 'a model id of the registry (`qwen-image-2.1`; unknown or malformed = 404)'}
    ModelJobId: {name: job_id, in: path, required: true, schema: {type: string}, description: model job UUID (malformed = 404)}
    HostName: {name: host, in: path, required: true, schema: {type: string}, description: 'a host name of the KV hosts (`mac`; unknown or malformed = 404)'}
    LibraryItemId: {name: item_id, in: path, required: true, schema: {type: string}, description: library item UUID (malformed = 404)}
    LookFamily: {name: family, in: path, required: true, schema: {type: string}, description: 'a starter look''s or (1.30) voice''s family (the part of its id before `/`; malformed = 404)'}
    StarterLookId: {name: look_id, in: path, required: true, schema: {type: string}, description: 'the pack''s look or (1.30) voice id (the part after `/`; malformed = 404)'}
    BatchRowN: {name: row, in: path, required: true, schema: {type: string}, description: 'row number, from 1 (unknown or malformed = 404)'}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string}, description: '`next_cursor` of the previous page; opaque (malformed = 422)'}
    ProviderName: {name: name, in: path, required: true, schema: {type: string}, description: 'a provider''s name (unknown = 404 on DELETE and test; malformed = 404)'}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 60}}
    TimelineId: {name: timeline_id, in: path, required: true, schema: {type: string}, description: sequence UUID (malformed = 404)}
    MediaJobId: {name: job_id, in: path, required: true, schema: {type: string}, description: media job UUID (malformed = 404)}
    ThreadId: {name: thread_id, in: path, required: true, schema: {type: string}, description: 'from 1.44: an assistant chat''s UUID (another user''s or malformed = 404)'}

  responses:
    Unauthorized: {description: 'missing or invalid x-api-key (Kong), or missing/invalid/expired/revoked bearer token', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: invalid or expired link, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: not found (also for another owner's object), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: the resource's state forbids this, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: 'auth_service, NATS or the database unreachable or too slow; retryable', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InvalidLogin: {description: 'unknown email, wrong password or disabled user — one generic answer: "invalid email or password"', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SigninLimited: {description: 'too many failed sign-ins (auth_service: 5 per email or 50 per client IP in 15 min, {detail}) or too many requests (Kong rate limit: 20/min, 200/h per IP, {message})', content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Error'}, {$ref: '#/components/schemas/GatewayError'}]}}}}
    GatewayBadPath: {description: 'the gateway (Kong/nginx) refuses a path that climbs above the root (`..` segments) before the API sees it', content: {text/html: {schema: {type: string}}}}
    GatewayRateLimited: {description: 'Kong rate limit (20/min, 200/h per IP) — Kong answers with {message}', content: {application/json: {schema: {$ref: '#/components/schemas/GatewayError'}}}}
    EmailTaken: {description: '"email already registered"', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AdminRequired: {description: 'valid token without the admin role: "admin role required"', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AuthUnprocessable: {description: 'invalid input: "invalid JSON body", or the failed rule ("invalid email", "name must be 1-200 characters", "password must be at least 10 characters", "password is too common", "roles must not be empty", …)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TooManyRequests: {description: 'a per-resource rate limit (from 1.15: chat messages)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    RangeNotSatisfiable: {description: 'the range starts past the end of the file (`Content-Range: bytes */<size>`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    LengthRequired: {description: '"Content-Length must be the signed bytes": missing, chunked, or another size', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    WrongContentType: {description: '"Content-Type must be the signed type"', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unprocessable:
      description: invalid input
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    WorkflowUnprocessable:
      description: 'the body does not fit the schema (`{detail}` only), or the graph has problems that block saving (`problems`: every problem, save- and run-blocking)'
      content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowError'}}}
    PipelineUnprocessable:
      description: 'the body does not fit the schema (`{detail}` only), or the pipeline has problems that block saving (`problems`: every problem)'
      content: {application/json: {schema: {$ref: '#/components/schemas/PipelineError'}}}
    TimelineUnprocessable:
      description: 'the body does not fit the schema (`{detail}` only), or the document breaks a timeline rule (`problems`: every problem)'
      content: {application/json: {schema: {$ref: '#/components/schemas/TimelineError'}}}
    TimelineEditUnprocessable:
      description: 'the body does not fit the schema (`{detail}` only), or an op cannot apply (`op_index`, `code`, `problems`)'
      content: {application/json: {schema: {$ref: '#/components/schemas/TimelineEditError'}}}

  schemas:
    # ---------------------------------------------------------- errors
    Error:
      type: object
      required: [detail]
      properties: {detail: {type: string}}
    GatewayError: {type: object, description: 'error body generated by Kong itself (rate limiting)', required: [message], properties: {message: {type: string}}}
    SignedUrl: {type: string, description: 'signed, time-limited link; opaque', examples: ['/files/u/7d1e.../runs/3c9a.../0.png?exp=1767225600&sig=ab12']}

    # ---------------------------------------------------------- studio: sessions
    StudioSession:
      type: object
      required: [id, title, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200}
        title_source: {$ref: '#/components/schemas/TitleSource'}
        named_by: {type: [string, 'null'], maxLength: 60, description: 'from 1.43: the model that wrote the title (`Qwen3.8`, `DeepSeek`) while `title_source` is model; null otherwise'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time, description: 'last rename or run'}
    TitleSource:
      type: string
      enum: [default, prompt, user, model]
      description: 'from 1.43, who wrote the title: default ("Untitled"), prompt (Generate''s slice of the prompt, `from_prompt`), user (typed or renamed), model (the namer). The namer replaces only default and prompt, once per session'
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions: {type: array, items: {$ref: '#/components/schemas/StudioSession'}}
        naming:
          type: object
          required: [mode, named_by, remote]
          additionalProperties: false
          description: 'from 1.43: how an untitled session is named after its first run succeeds (the admin''s setting, redacted)'
          properties:
            mode: {type: string, enum: ['off', local, remote]}
            named_by: {type: [string, 'null'], maxLength: 60, description: 'local: Qwen3.8; remote: the provider''s title; null when off'}
            remote: {type: boolean, description: 'the prompt leaves this machine (a provider of kind remote)'}
    SessionCreate:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, maxLength: 200, description: 'trimmed; empty or missing = "Untitled"'}
        from_prompt: {type: boolean, description: 'from 1.43: the title is a slice of the prompt Generate is about to send (`title_source` prompt, so the namer may replace it); default false (user)'}
    SessionPatch:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200, description: 'trimmed; blank = 422'}

    # ---------------------------------------------------------- studio: workflows
    # The registry shapes (contracts/registry.schema.json nodeSchema, workflow), served as published.
    PortType:
      type: string
      enum: [Text, Image, Int, Float, Seed, Canvas, Model, Conditioning, Latent, Video, Duration, Media, Audio]
      description: |
        An input accepts an output of the same type; an input of type `Media` (the output node's `media`; never an
        output) also accepts `Image`, `Video` and, from 1.30, `Audio` (contracts/README.md, Graph rules: fits). `Video`
        is an MP4 that may carry an audio track; `Audio` (1.30) is speech, a WAV (PCM 16-bit, mono, the model's own
        rate); `Duration` is `{frames, fps}`. Model, Conditioning and Latent are family-scoped handles:
        they wire nodes of one family inside one workflow and never cross a process (`Latent` of ltx carries video and
        audio latents together).
    Port:
      type: object
      required: [name, type]
      properties:
        name: {type: string}
        type: {$ref: '#/components/schemas/PortType'}
        optional: {type: boolean, description: 'inputs only: true = may be left unwired (the feature is off); absent = required'}
    ScalarValue: {type: [string, number, boolean, 'null'], description: 'null only for a seed (random) or an image, media, span or (1.30) voice param left empty'}
    ImageRef:
      type: object
      description: |
        An Image value: a take of the caller, by id. The only way a client names an image; never an object key or URL.
        Studio checks it when it creates the run (contracts/README.md, "Image inputs").
      required: [take_id]
      additionalProperties: false
      properties:
        take_id: {type: string, format: uuid}
    LoraRef:
      type: object
      description: |
        A Lora value (a rows item field of ref kind `Lora`): a LoRA the caller can use, by id; never a path, key or URL.
        Studio checks it when it creates the run (contracts/README.md, "LoRAs").
      required: [lora_id]
      additionalProperties: false
      properties:
        lora_id: {type: string, pattern: '^([0-9a-f]{64}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'}
    MediaRef:
      type: object
      description: |
        A Media value (API 1.19; a `media` param): a video or audio take of the caller, by id. `in` / `out` (seconds of
        the take's own time; studio snaps them: a video's frames, audio to the millisecond) only on a param with `trim`:
        the part it reads (absent: 0 / the take's end). Never an object key or URL (contracts/README.md, Media inputs).
      required: [take_id]
      additionalProperties: false
      properties:
        take_id: {type: string, format: uuid}
        in: {type: number, minimum: 0, maximum: 86400}
        out: {type: number, exclusiveMinimum: 0, maximum: 86400}
    VoiceRef:
      type: object
      description: |
        A voice value (API 1.30; a `voice` param): a saved voice the caller can use, by id: one of the caller's own
        (a UUID) or a starter voice (`<family>/<pack voice id>`). Never a key, a URL or the voice's fields; studio
        resolves it when it creates the run (contracts/README.md, Voices).
      required: [voice_id]
      additionalProperties: false
      properties:
        voice_id: {type: string, pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$'}
    SpanValue:
      type: object
      description: 'A `span` param''s value (API 1.19): a time range on the workflow''s one video media source, in that take''s own seconds (Retake: the stretch to regenerate)'
      required: [start, end]
      additionalProperties: false
      properties:
        start: {type: number, minimum: 0, maximum: 86400}
        end: {type: number, exclusiveMinimum: 0, maximum: 86400}
    RowItem:
      type: object
      description: 'one item of a rows value: field (the param''s `item`) → value; from 1.22 a media field''s value is a MediaRef; from 1.32 a voice field''s (a dialogue line''s speaker) a VoiceRef'
      additionalProperties: {anyOf: [{$ref: '#/components/schemas/ScalarValue'}, {$ref: '#/components/schemas/ImageRef'}, {$ref: '#/components/schemas/MediaRef'}, {$ref: '#/components/schemas/LoraRef'}, {$ref: '#/components/schemas/VoiceRef'}]}
    ParamValue:
      description: 'a scalar; an `image` param: ImageRef or null; a `rows` param: an ordered list of items; from 1.19 a `media` param: MediaRef or null, a `span` param: SpanValue or null; from 1.30 a `voice` param: VoiceRef or null'
      anyOf:
        - {$ref: '#/components/schemas/ScalarValue'}
        - {$ref: '#/components/schemas/ImageRef'}
        - {$ref: '#/components/schemas/MediaRef'}
        - {$ref: '#/components/schemas/SpanValue'}
        - {$ref: '#/components/schemas/VoiceRef'}
        - {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RowItem'}}
    ParamSchema:
      type: object
      description: |
        One form field. `int`/`float`/`seed`: `min`/`max` bound the value, `step` is the increment; `string`/`text`
        (multi-line): `min`/`max` bound the length; `enum`: one of `enum`; `bool`: a switch. `seed`: an int where null
        or -1 means random: the runner picks one and reports it (`Run.resolved.seed`, `RunOutput.seed`). `when`: a
        visibility expression over the graph (`model.variant != 'turbo'`), carried through, not evaluated yet.
        `image`: one take (`ImageRef`), default null; a run needs one. `rows` (the rows editor): an ordered list of
        `RowItem`, default `[]`; `min`/`max` bound the count, `item` names each item's fields (a ref kind, `Image` or
        `Lora`, required in every item, or a param schema), `mention` is how the prompt refers to item n from 1 (`<image{n}>`: the
        rows editor labels item n with it; the prompt is sent as typed). `frames`: a frame count on the family's frame
        grid, `min + k × step` up to `max` (LTX: 9 + 8k up to 321); `fps` names the same node's frame-rate param; the
        UI renders it as the Duration slider (one notch per `step`, labelled `<frames> frames · <frames / fps> s`); a
        value off the grid is 422 (`<node>.<param>: <v> is not on the frame grid <min> + <step>k up to <max>`). The size
        picker (aspect + megapixels) is drawn for a node whose output is `Canvas` from its `width` and `height` int
        params: `step` is the grid, `min` / `max` the bounds. From 1.12: a `frames` param may declare `auto` (the model
        predicts the length; the value `"auto"`, the Duration slider's Auto length switch; contracts/README.md, Video);
        an `int` may declare `values` (the only allowed values: a choice, one value a read-only readout) and
        `values_by` (the allowed values per value of an enum param of the same node: LTX `steps` per `role`; from 1.39 on
        an enum too, and per value of another node's param: LTX extend's `direction` per `model.variant`); a
        float item field may declare `position: seconds` (a keyframe's time on the clip). From 1.19 (contracts/README.md,
        Media inputs): `media`: one video or audio take (`MediaRef`, default null; a run needs one) of the kinds in
        `accepts`; with `trim` the value may carry `in` / `out` (the UI draws the take's poster or waveform with a trim
        control and its duration); `grid` (a video's sides must be multiples of it), `max_s` (the longest it reads) and
        `max_frames` (the most frames of a video it reads) bound it. `span`: a time range `{start, end}` (`SpanValue`, default null; a run needs one) on the workflow's one
        `media` param that accepts video; the UI draws it as a range control over that take's poster and duration.
        From 1.22 (contracts/README.md, Media inputs: rows of media): a `rows` item field may be a `media` param (each
        item one video or audio take, `MediaRef`, required in every item; the rows editor draws the take's poster or a
        sound tile with its trim control); `min_s` (media) is the shortest it reads; `max_total_s` (rows with one media
        field) the most seconds the items read together; `not_with` (rows) names optional inputs of the node: while one
        is wired the rows stay empty (mentions add none, "Use in…" skips them).
        From 1.30 (contracts/README.md, Voices): `voice`: one saved voice (`VoiceRef`, default null; a run needs one) of
        the sources in `accepts` (`preset`: a starter voice of the node's family; `clip`: a voice with a clip, cloned or designed, from 1.31;
        `design`: a voice described in words); the UI draws the voice picker. It takes no wire; from 1.32 it may be a
        rows item field (a dialogue's `lines`: each line's speaker, required in every item).
        From 1.32 (contracts/README.md, Dialogue and Timeline audio): a `text` param may declare `script: true`: a
        dialogue script (`@handle: text` or `@handle (style): text` per line, an empty line a longer pause) that studio
        expands at create time into the same node's rows param `lines` (items `{voice, text, style, pause_s}`, each
        voice the element's `voice_id`); the composer draws it as the script editor with each line's speaker.
      required: [name, type, default]
      properties:
        name: {type: string}
        type: {type: string, enum: [int, float, bool, string, text, enum, seed, image, rows, frames, media, span, voice]}
        script: {type: boolean, const: true, description: 'from 1.32, text only: a dialogue script expanded into the node''s `lines` (contracts/README.md, Dialogue: scripts)'}
        accepts: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {type: string, enum: [video, audio, preset, clip, design]}, description: 'media only: the take kinds it takes (video, audio); video: a video take; audio: an audio take, or a video take''s sound. From 1.30, voice only: the voice sources it takes (preset, clip, design)'}
        trim: {type: boolean, description: 'media only: true = the value may carry in / out (the part read); absent = the whole take'}
        grid: {type: integer, description: 'media only: a video take''s width and height must be multiples of it'}
        max_s: {type: number, description: 'media only: the longest it reads in seconds (the take, or out - in with trim)'}
        max_frames: {type: integer, minimum: 1, description: 'media only: the most frames of a video take it reads (its frames at any fps; LTX 321)'}
        min_s: {type: number, description: 'from 1.22, media only: the shortest it reads in seconds (`take <id> lasts <d> s; this input takes at least <min_s> s`; with trim also `the part lasts <d> s; …`)'}
        max_total_s: {type: number, description: 'from 1.22, rows with one media field only: the most seconds the items read together (`<node>.<param>: the takes last <d> s in all; at most <max_total_s> s`)'}
        not_with: {type: array, items: {type: string}, description: 'from 1.22, rows only: optional inputs of the same node; while one is wired the rows must stay empty (`<node>.<param>: must stay empty while <node>.<input> is wired`)'}
        addons: {type: object, additionalProperties: {type: array, items: {type: string}}, description: 'from 1.41, enum only: value → the optional add-ons (Model.addons[].component of the node''s family) a run needs while the param holds that value (MiniMax H3''s `lora`: `turbo` → [turbo]); the run check counts them as the node''s `addons` on its resolved value (never while the node is bypassed) and the form greys that option, and every preset that sets it, with `<title> not downloaded` (contracts/README.md, Optional add-ons). Absent = none'}
        addons_with: {type: object, additionalProperties: {type: object, additionalProperties: {type: array, items: {type: string}}}, description: 'from 1.41, with `addons`: `<name>` (an optional input of the node, or one of its rows params) → {value → add-ons}: while that input is wired or that rows param holds a row its list replaces the value''s `addons` list, several names'' lists together (MiniMax H3: any reference runs Ref2VA, so `turbo` then needs `turbo_ref`)'}
        optional: {type: boolean, description: 'from 1.37, a rows item''s media field only: it may be left empty (null or absent; MiniMax H3''s `soundtrack`); `max_total_s` and Use in… go by the item''s one required media field'}
        rules:
          type: array
          maxItems: 8
          description: 'from 1.47 (contracts/README.md, Param rules): refusals as data. Each `when` is an expression (the `when` grammar plus `<`, `<=`, `>`, `>=`, `+`, `-`, `*`, `/`, `len(<rows>)` and `gcd(a, b)`; a bare name is a param of the same node, or in a rows item field''s rule a field of the same item; `<a>.<b>` is param `b` of the node wired into this node''s input `a`, else of node `a`); while it holds the run is 422 `<node>: <error>` (an item field''s: `<node>.<param>[<i>].<field>: <error>`, items from 1), each `{<expression>}` in `error` replaced by its value. A reference that resolves to nothing makes the rule not hold. Studio checks them after the other checks, in param order (POST …/runs and /runs/plan); the form shows each under its param and blocks Generate'
          items:
            type: object
            required: [when, error]
            additionalProperties: false
            properties:
              when: {type: string, minLength: 1, maxLength: 300}
              error: {type: string, minLength: 1, maxLength: 200}
        option_help:
          type: object
          maxProperties: 32
          additionalProperties: {type: string, minLength: 1, maxLength: 80}
          description: 'from 1.47, enum or int with `values`: value (as text) → its line under the value in the param''s menu (MiniMax H3''s LoRA: `none` → `the model as it is`); absent = none'
        fps: {type: string, description: 'frames only: the name of the same node''s int or float param holding frames per second'}
        auto:
          type: object
          required: [min_s, max_s]
          description: 'frames only: present = the value `"auto"` is allowed (the model predicts the length, clamped to min_s..max_s seconds and to min..max frames); absent = it is 422 (`<node>.<param>: auto length is not offered`)'
          properties: {min_s: {type: number}, max_s: {type: number}}
        values: {type: array, items: {type: integer}, description: 'int only: the only allowed values, ascending (`<node>.<param>: must be one of 3, 8`)'}
        values_by:
          type: object
          required: [param, values]
          description: 'int with values (from 1.39 an enum too): the allowed values per value of an enum param `param`, the same node''s or, from 1.39, another node''s in the `when` reference form `<node>.<param>` (`model.variant`, the graph''s merged value; a graph without that node, or a value not listed, allows all of `values` / `enum`). The message names the subset (`sample2.steps: must be one of 3`, `extend.direction: must be one of after`). The UI shows a value outside the subset faded with its reason, `<value> needs <first value of the named param that allows it>` (`Before needs Dev`); a take offer whose pre-fill it refuses also sets the named param to that value (contracts/README.md, Video: Distilled actions)'
          properties:
            param: {type: string, pattern: '^([a-z][a-z0-9_]{0,63}\.)?[a-z][a-z0-9_]{0,63}$'}
            values: {type: object, additionalProperties: {type: array, items: {type: [integer, string]}}}
            note: {type: string, description: 'from 1.40, a cross-node values_by only: the line under the named param''s choice while this refuses one of its options (LTX extend: `Dev: the only model that extends before. About 10× slower.`); absent = each refusal (`Extend before needs Dev`)'}
        label: {type: string, description: absent = the name}
        default: {$ref: '#/components/schemas/ParamValue'}
        min: {type: number}
        max: {type: number}
        step: {type: number, exclusiveMinimum: 0}
        enum: {type: array, items: {type: string}}
        help: {type: string}
        when: {type: string, description: visibility expression; absent = always shown}
        item:
          type: object
          description: 'rows only: field → a ref kind (`Image`: an image take, from 1.14 `Media`: an image or video take (an ask node''s `media`), `Lora`: a LoRA; required in every item) or a param schema without name (from 1.22 a `media` param: required in every item unless, from 1.37, `optional`; from 1.32 a `voice` param: required in every item)'
          additionalProperties: {anyOf: [{type: string, const: Image}, {type: string, const: Media}, {type: string, const: Lora}, {type: object, description: 'a ParamSchema without name (registry.schema.json itemParam); a float may add `position: seconds` (a time on the clip)'}]}
        mention: {type: string, description: 'rows only: the prompt''s name for item n, with `{n}` from 1', examples: ['<image{n}>']}
    NodeSchema:
      type: object
      required: [kind, title, family, params, inputs, outputs]
      properties:
        kind: {type: string, examples: [echo/echo]}
        title: {type: string}
        family: {type: [string, 'null'], description: null for a core node (prompt, output)}
        component: {type: string, minLength: 1, maxLength: 40, description: 'from 1.24: the model component the node loads, in words (transformer, text encoder, vae); the Graph inspector reads "<family> · runs on <runtime> · uses the <component>". Absent = it loads none'}
        help: {type: string}
        addons: {type: array, items: {type: string}, description: 'from 1.36: the optional add-ons the node loads (a `component` of its family''s Model.addons); while one is not present the form greys the node''s controls (`<title> not downloaded`) and a run with the node not bypassed is refused on such a host (contracts/README.md, Optional add-ons). Absent = none'}
        phases:
          type: array
          description: 'from 1.36: the ordered phases of a node that runs one engine end to end (MiniMax H3: Encode, Sample, Decode audio, Decode video); its progress carries `phase_id` (contracts/README.md, Phases). Absent = none'
          items: {type: object, required: [id, label], properties: {id: {type: string}, label: {type: string}}}
        peak_gb: {type: string, minLength: 1, maxLength: 400, description: 'from 1.47: the stage''s peak_gb formula (model.yaml), published for a stage that loads no component (a native child process, whose memory plan is the formula alone): studio evaluates it per run over the node''s params, `len(<rows>)`, `mp` and `frames` (contracts/README.md, Memory per run). Absent = none'}
        sounds:
          type: object
          required: [max_s, max_inputs]
          additionalProperties: false
          description: 'from 1.47: the node''s limits on the sound its references carry together (MiniMax H3: 15 s, 3 inputs): audio rows, and video rows whose `sound` keeps the take''s sound or replaces it with a `soundtrack`; the composer counts them (`3.0 s of 15.0 s sound · 1 of 3 sound inputs`). Absent = none'
          properties:
            max_s: {type: number, exclusiveMinimum: 0}
            max_inputs: {type: integer, minimum: 1}
        params: {type: array, items: {$ref: '#/components/schemas/ParamSchema'}, description: in form order}
        inputs: {type: array, items: {$ref: '#/components/schemas/Port'}}
        outputs: {type: array, items: {$ref: '#/components/schemas/Port'}}
    GraphNode:
      type: object
      required: [kind]
      properties:
        kind: {type: string}
        params: {type: object, additionalProperties: {$ref: '#/components/schemas/ParamValue'}, description: 'overrides of the node schema defaults'}
        in: {type: object, additionalProperties: {type: string, pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'}, description: 'input port (or a wired value param) → `<node id>.<output>`'}
        bypass: {type: boolean, description: 'switched off: passes its inputs through (README, Graph rules); absent = false'}
        optional: {type: boolean, description: 'from 1.22, a core `image` node only: may be left empty; studio then drops it and its wires before the run (its wires must all go to optional inputs, else the problem `not_optional`). The form marks its image field optional (MiniMax H3 Image to video: Last frame)'}
        position: {$ref: '#/components/schemas/NodePosition'}
        only: {$ref: '#/components/schemas/ParamOnly'}
    ParamOnly:
      type: object
      description: 'from 1.19: enum param → the values this workflow allows (a subset of its `enum` holding the node''s value); the form offers only those, another value is 422 `<node>.<param>: must be one of <values>` (LTX dev templates pin `model.variant` to dev). From 1.32 also a rows param with one voice field (a dialogue''s `lines`) → the voice sources its lines take. From 1.30 also a voice param → the voice sources this workflow takes (a subset of its `accepts`; the workflow holds null): the voice fit reads the narrowed set, a voice outside it is 422 `<node>.<param>: this workflow cannot use a designed voice` (or `a preset voice`, `clone a voice`; contracts/README.md, Media inputs: only)'
      propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}
      additionalProperties: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
    NodePosition:
      type: object
      description: 'the card''s top-left in the Graph view, canvas pixels; absent = laid out by the client (elkjs, "Tidy layout")'
      required: [x, y]
      additionalProperties: false
      properties:
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
    WorkflowSource:
      type: string
      enum: [template, mine]
      description: 'template: published by a runner in the registry (read-only, id a slug); mine: the caller''s own (id a UUID)'
    Workflow:
      type: object
      description: |
        A runnable graph. A form is derived from it: for every node in `nodes`, the params of
        `node_schemas[node.kind]`, each addressed as `<node id>.<param name>` in `RunRequest.inputs`, its starting value
        `node.params[name]` else the schema `default`. With `studio`, the Studio shows exactly the paths it places
        (README, User workflows); without, the form is derived as above.
      required: [id, title, family, env, nodes, node_schemas, source]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', examples: [echo, 6f1c2a4e-0b7d-4c8e-9a51-3d2e1f0a9b88]}
        title: {type: string}
        action: {type: string, description: 'from 1.19, templates only (registry `action`): the take action''s label when it is offered for a take ("Use in…", a clip''s actions): Animate, Edit, Extend, Retake a section; absent = the title'}
        family: {type: string}
        env: {type: string, description: the runner env that executes it}
        media: {type: string, enum: [image, video, audio, text], description: 'always sent from API 1.11: a template''s as published (registry `media`, absent = image), a user workflow''s computed from its graph (contracts/README.md, Video); audio (API 1.30) when an output is wired from an Audio output (contracts/README.md, Voices); text (API 1.14) only for an ask workflow, served read-only by GET /v1/studio/workflows/{workflow_id}, never listed'}
        nodes: {type: object, additionalProperties: {$ref: '#/components/schemas/GraphNode'}, description: node id → node}
        node_schemas: {type: object, additionalProperties: {$ref: '#/components/schemas/NodeSchema'}, description: 'kind → schema, for every kind in nodes the registry has (a kind no runner publishes is left out)'}
        source: {$ref: '#/components/schemas/WorkflowSource'}
        studio: {$ref: '#/components/schemas/StudioLayout'}
        based_on: {type: [string, 'null'], description: 'mine only: the template or workflow it was copied or saved from (it may be gone since); null when made from nothing'}
        version: {type: integer, minimum: 1, description: 'mine only: 1 on create, +1 on every PUT and PATCH; send it back in WorkflowUpdate'}
        created_at: {type: string, format: date-time, description: mine only}
        updated_at: {type: string, format: date-time, description: mine only}
        problems: {type: array, items: {$ref: '#/components/schemas/Problem'}, description: 'only from GET /v1/studio/workflows/{workflow_id}, POST and PUT: the graph rules against the live palette now; empty = it can run'}
        keyframes: {oneOf: [{$ref: '#/components/schemas/WorkflowKeyframes'}, {type: 'null'}], description: 'from 1.17, always sent (computed, contracts/README.md Timeline: New shot options): the rows New shot binds a first (and with `last`, a last) frame into; null = the workflow takes none, so neither option is offered'}
    WorkflowMedia:
      type: string
      enum: [image, video, audio]
      description: 'what a workflow''s takes are; video when an `output` node''s `media` is wired from a `Video` output, from 1.30 audio when from an `Audio` output, else image'
    WorkflowList:
      type: object
      required: [workflows]
      properties: {workflows: {type: array, items: {$ref: '#/components/schemas/Workflow'}}}
    StudioPath:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63}$'
      description: '`<node id>.<param>`, or `<node id>.bypass` for a bypassable node (a switch)'
      examples: [sample.steps, enhance.bypass]
    StudioTile:
      type: string
      enum: [elements, 'look:film', 'look:camera', 'look:colour', 'look:lighting']
      description: 'a composer tile in `studio.quick` (plan 04-workflows.md section 7): `elements` opens the visual picker on elements (it inserts an `@` mention), `look:<group>` on that look group (it adds looks to the run''s `looks`). Not a path: never `studio_unknown_path`; twice = `studio_duplicate`'
    StudioLayout:
      type: object
      additionalProperties: false
      description: |
        Which params the Studio (Create) shows and where (plan 04-workflows.md section 7). Present = exactly the placed
        paths show; every other param keeps its graph value and is edited in Graph view only. Absent = the derived
        form (every param, as `Workflow` says). A path is placed at most once over composer, quick and inspector.
      properties:
        composer: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/StudioPath'}, description: 'in the composer box, in order (the prompt, the references)'}
        quick:
          type: array
          maxItems: 12
          items: {anyOf: [{$ref: '#/components/schemas/StudioPath'}, {$ref: '#/components/schemas/StudioTile'}]}
          description: 'chips on the composer, in order: params, and library tiles (`elements`, `look:<group>`) that open the visual picker (contracts/README.md, Looks: composer tiles)'
        inspector:
          type: array
          maxItems: 12
          description: the inspector's sections, in order
          items:
            type: object
            required: [title, items]
            additionalProperties: false
            properties:
              title: {type: string, minLength: 1, maxLength: 40, examples: [Quality]}
              items: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/StudioPath'}}
              help: {type: string, minLength: 1, maxLength: 300, description: 'from 1.25: the section''s (i) text in Create; absent = no (i)'}
              choices:
                type: array
                maxItems: 4
                description: 'from 1.26: tiles that lead the section, each a named pick among sets of values (contracts/README.md, User workflows: Studio block). A set is checked as a preset (`preset_invalid`); the tile shows the option whose set holds'
                items:
                  type: object
                  required: [label, options]
                  additionalProperties: false
                  properties:
                    label: {type: string, minLength: 1, maxLength: 40, examples: [Recipe]}
                    help: {type: string, minLength: 1, maxLength: 300, description: 'the tile''s hover text'}
                    options:
                      type: array
                      minItems: 2
                      maxItems: 8
                      items:
                        type: object
                        required: [name, set]
                        additionalProperties: false
                        properties:
                          name: {type: string, minLength: 1, maxLength: 40, examples: [One-stage]}
                          help: {type: string, minLength: 1, maxLength: 300, description: 'from 1.39: the option''s line under its name in the tile''s menu (LTX''s Recipe: Detail)'}
                          set:
                            type: object
                            minProperties: 1
                            maxProperties: 32
                            propertyNames: {$ref: '#/components/schemas/StudioPath'}
                            additionalProperties: {$ref: '#/components/schemas/ParamValue'}
                  examples: [{label: Recipe, options: [{name: Two-stage, set: {upscale.bypass: false, sample2.bypass: false}}, {name: One-stage, set: {upscale.bypass: true, sample2.bypass: true}}]}]
        keyframes:
          type: object
          required: [first]
          additionalProperties: false
          description: 'from 1.37: the image params a Timeline New shot binds a first and a last frame into, for a workflow whose frames are image params, not keyframe rows (MiniMax H3 Image to video); `Workflow.keyframes` takes this shape (contracts/README.md, Timeline: New shot options). Not a placement'
          properties:
            first: {$ref: '#/components/schemas/StudioPath'}
            last: {type: [string, 'null'], pattern: '^[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63}$'}
          examples: [{first: first.image, last: last.image}]
        labels:
          type: object
          maxProperties: 64
          propertyNames: {$ref: '#/components/schemas/StudioPath'}
          additionalProperties: {type: string, minLength: 1, maxLength: 60}
          description: 'a field''s title in the Studio when it should differ from the param''s label'
        presets:
          type: object
          maxProperties: 8
          propertyNames: {minLength: 1, maxLength: 40}
          additionalProperties:
            type: object
            minProperties: 1
            maxProperties: 32
            propertyNames: {$ref: '#/components/schemas/StudioPath'}
            additionalProperties: {$ref: '#/components/schemas/ParamValue'}
          description: 'named sets of values over this workflow''s paths (Draft, Final); choosing one sets them in the form'
          examples: [{Draft: {model.variant: turbo, model.precision: int8}}]
        preset_help:
          type: array
          maxItems: 4
          description: 'from 1.47: the Preset heading''s (i) text: the first item whose `when` (the `when` grammar over the workflow''s paths) holds, or that has none; absent = no (i)'
          items:
            type: object
            required: [text]
            additionalProperties: false
            properties:
              text: {type: string, minLength: 1, maxLength: 300}
              when: {type: string, minLength: 1, maxLength: 200}
        preset_order:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 40}
          description: 'from 1.25: every name of `presets` once, in the order Create shows them (an object''s key order is not kept); absent = by name. Else 422 `studio.preset_order: every preset once`'
          examples: [[Fast, Quality, Low memory]]
    WorkflowDoc:
      type: object
      required: [title, family, env, nodes]
      description: |
        A workflow as the editor saves or validates it. Node ids are stable slugs: once made they never change (README,
        Graph rules). At most 64 nodes and 256 KB (checked as problems, not by the schema). Other top-level keys are
        ignored by validate (so a WorkflowUpdate body validates as is); WorkflowCreate and WorkflowUpdate are closed.
      properties:
        title: {type: string, minLength: 1, maxLength: 80, description: 'trimmed; blank = 422'}
        family: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: 'the model family every `<family>/…` kind of it belongs to'}
        env: {type: string, pattern: '^[a-z0-9]{1,32}$', description: 'the one runner env that runs every node'}
        nodes:
          type: object
          minProperties: 1
          propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}
          additionalProperties: {$ref: '#/components/schemas/EditorNode'}
        studio: {$ref: '#/components/schemas/StudioLayout'}
    EditorNode:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}(/[a-z][a-z0-9_-]{0,63})?$'}
        params:
          type: object
          propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}
          additionalProperties: {$ref: '#/components/schemas/ParamValue'}
          description: 'param → value; left out = the schema default. A workflow holds no take: image params null, rows without Image items'
        in:
          type: object
          propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}
          additionalProperties: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63}$'}
          description: 'input port, or wired value param → `<node id>.<output>`; one wire per key (connecting again replaces it)'
        bypass: {type: boolean}
        optional: {type: boolean, description: 'from 1.22: see GraphNode.optional'}
        position: {$ref: '#/components/schemas/NodePosition'}
        only: {$ref: '#/components/schemas/ParamOnly'}
    WorkflowCreate:
      description: 'a whole document (based_on optional: "Save as" from an open workflow), or `{based_on, title?}` to copy one'
      oneOf:
        - allOf:
            - {$ref: '#/components/schemas/WorkflowDoc'}
          type: object
          properties:
            based_on: {type: string, minLength: 1, maxLength: 64, description: 'the template or workflow id it was made from; must exist and be readable by the caller (404)'}
          unevaluatedProperties: false
        - type: object
          required: [based_on]
          additionalProperties: false
          properties:
            based_on: {type: string, minLength: 1, maxLength: 64}
            title: {type: string, minLength: 1, maxLength: 80, description: 'absent = `<source title> copy`'}
    WorkflowUpdate:
      allOf:
        - {$ref: '#/components/schemas/WorkflowDoc'}
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: 'the version the edit started from (409 when stale)'}
      unevaluatedProperties: false
    WorkflowPatch:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 80, description: 'trimmed; blank = 422'}
    ProblemCode:
      type: string
      enum: [too_many_nodes, too_large, too_many_outputs, too_many_seeds, wrong_family, unknown_kind, env_mismatch, unknown_param, param_invalid, unknown_input, unknown_source, type_mismatch, not_bypassable, required_input, cycle, no_output, studio_unknown_path, studio_duplicate, preset_invalid, lora_duplicate, lora_unknown, lora_family, not_optional]
      description: 'meaning and which ones block saving: contracts/README.md, Graph rules. May grow in a minor version; an unknown code blocks running'
    Problem:
      type: object
      required: [code, message, blocks]
      additionalProperties: false
      description: 'one broken graph rule; `node` / `port` / `param` say where, for the editor to mark (absent = the whole workflow)'
      properties:
        code: {$ref: '#/components/schemas/ProblemCode'}
        message: {type: string, minLength: 1, description: 'human text, e.g. `sample.cond: expects Conditioning, got Text from prompt.text`; not stable'}
        blocks: {type: string, enum: [save, run], description: 'save: the document cannot be saved (and cannot run); run: it can be saved, not run'}
        node: {type: string, description: 'the node id (for a Studio path, the path''s node, which may not exist)'}
        port: {type: string, description: 'the `in` key: an input port or a wired value param'}
        param: {type: string, description: 'a param name (for a Studio path or preset, the path''s param; may be `bypass`)'}
    WorkflowValidation:
      type: object
      required: [problems, can_save, can_run]
      additionalProperties: false
      properties:
        problems: {type: array, items: {$ref: '#/components/schemas/Problem'}, description: 'sorted by node (whole-workflow ones first), then code, port, param'}
        can_save: {type: boolean, description: no problem blocks saving}
        can_run: {type: boolean, description: no problem at all}
    WorkflowError:
      type: object
      required: [detail]
      properties:
        detail: {type: string, description: '`workflow has <n> problems: <first message>` for graph problems'}
        problems: {type: array, items: {$ref: '#/components/schemas/Problem'}, description: 'every problem; absent for a schema error'}
    PaletteNode:
      allOf:
        - {$ref: '#/components/schemas/NodeSchema'}
        - type: object
          required: [envs]
          properties:
            envs: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: '^[a-z0-9]{1,32}$'}, description: 'every env a live host publishes it in (sorted); a workflow may use it when its env is one of them'}
    NodePalette:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [family, title, nodes]
            properties:
              family: {type: [string, 'null'], description: null for the core kinds}
              title: {type: string, examples: [Core, Qwen Image 2.1]}
              nodes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PaletteNode'}}

    # ---------------------------------------------------------- studio: pipelines (API 1.7; README, Pipeline rules)
    PipelineInputType:
      type: string
      enum: [Text, Image, Int, Float, Seed]
      description: 'a pipeline input''s type: Text fills a string/text param, Int an int, Float a float, Seed a seed, Image an image param (or a rows param with one Image field, as a one-item list)'
    PipelineInput:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'unique in the node; a batch column is `<inputs node id>.<name>`; a step binds it as `$<name>`'}
        type: {$ref: '#/components/schemas/PipelineInputType'}
        label: {type: string, minLength: 1, maxLength: 60, description: absent = the name}
    PipelineSource:
      type: string
      pattern: '^(\$[a-z][a-z0-9_]{0,63}|[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63})$'
      description: '`$<input>` (a pipeline input), `<step>.takes` (that step''s takes from its latest visit), `<gate>.picked` / `<judge>.picked` (its latest pick); from 1.14 the text sources `<judge>.reasons` (its latest reasons, one line per take) and `<memory>.notes` (a memory read node''s notes), for write, decide and memory write `from` only; from 1.15 `<producer>.item` (a fanned-out step''s binds: this branch''s item) and `<custom>.<field>` (a custom node''s output field). Which source is allowed where: contracts/README.md, Pipeline rules (bind_source)'
      examples: [$prompt, still.takes, review.picked]
    PipelineInputsNode:
      type: object
      required: [kind, inputs]
      additionalProperties: false
      properties:
        kind: {type: string, const: inputs}
        title: {$ref: '#/components/schemas/PipelineNodeTitle'}
        inputs: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/PipelineInput'}, description: 'the batch''s columns, in order'}
        position: {$ref: '#/components/schemas/NodePosition'}
    PipelineStepNode:
      type: object
      required: [kind, workflow]
      additionalProperties: false
      properties:
        kind: {type: string, const: step}
        title: {$ref: '#/components/schemas/PipelineNodeTitle'}
        workflow: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: 'a template slug or one of the caller''s workflow UUIDs'}
        seeds: {type: integer, minimum: 1, maximum: 8, default: 1, description: 'runs per visit, with consecutive seeds in the workflow''s seed param (README, Pipeline rules: seeds)'}
        preset: {type: string, minLength: 1, maxLength: 40, description: 'a preset of the workflow''s `studio.presets`, applied first'}
        inputs: {$ref: '#/components/schemas/RunInputs', description: 'fixed values (`<node>.<param>`, as RunRequest.inputs), after the preset; never a take'}
        bind:
          type: object
          maxProperties: 16
          propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63}$'}
          additionalProperties: {$ref: '#/components/schemas/PipelineSource'}
          description: 'workflow param `<node>.<param>` ← a source, applied last'
          examples: [{prompt.text: $prompt, encode.refs: review.picked}]
        looks: {$ref: '#/components/schemas/LookIds', description: 'the looks every run of this step is made with (as RunRequest.looks); missing = []'}
        each: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}\.items$', description: 'from 1.15: fan out: one branch per item of this agent''s or write''s list (`<producer>.items`), at most its `list.max`; binds read the branch''s item as `<producer>.item`. Later nodes read `<step>.takes` as every branch''s takes, branch order then seed order', examples: [director.items]}
        position: {$ref: '#/components/schemas/NodePosition'}
    PipelineGateNode:
      type: object
      required: [kind, takes]
      additionalProperties: false
      properties:
        kind: {type: string, const: gate}
        title: {$ref: '#/components/schemas/PipelineNodeTitle'}
        takes: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'the step whose latest takes are the candidates'}
        keep: {type: integer, minimum: 1, maximum: 8, default: 1, description: 'a pick is 1 to keep of the candidates'}
        position: {$ref: '#/components/schemas/NodePosition'}
    PipelineOutputNode:
      type: object
      required: [kind, from, collection]
      additionalProperties: false
      properties:
        kind: {type: string, const: output}
        title: {$ref: '#/components/schemas/PipelineNodeTitle'}
        from: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}\.(takes|picked)$', description: 'the takes the row ends with', examples: [edit.takes]}
        collection: {type: string, minLength: 1, maxLength: 80, description: 'names the collection (Batch.collection)'}
        position: {$ref: '#/components/schemas/NodePosition'}
    PipelineCriteria:
      type: object
      additionalProperties: false
      description: 'a judge''s checklist (from 1.14): a take passes when every `must` line holds; `nice` lines only order the takes that pass. 1 to 12 lines in all, none twice (judge_criteria). Missing list = []'
      properties:
        must: {type: array, maxItems: 12, items: {type: string, minLength: 1, maxLength: 200}, examples: [[No extra or missing limbs, No text or watermarks]]}
        nice: {type: array, maxItems: 12, items: {type: string, minLength: 1, maxLength: 200}, examples: [[Subject is sharp]]}
    PipelineModel:
      type: string
      pattern: '^(auto|[a-z0-9][a-z0-9_-]{0,63}|server:[a-z][a-z0-9-]{0,31}(/[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})?|remote:[a-z][a-z0-9-]{0,31}/[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$'
      default: auto
      description: '`auto` (resolved at Submit: contracts/README.md, Agent nodes: model) or an ask workflow (`media: text`) the caller can run: `qwen-image-ask` (Qwen Image''s own text encoder, no extra load after a Qwen step), `llm-ask` (Qwen3.8 27B); from 1.15 `server:<name>` or `server:<name>/<model>` (a local server the admin set up; absent model = its default) and `remote:<provider>/<model>` (a remote provider: needs the pipeline''s `remote` switch). A judge needs a local model (it sends thumbnails; server and remote models get text only)'
      examples: [auto, llm-ask, 'server:ollama/qwen2.5:7b', 'remote:openai/gpt-4.1-mini']
    PipelineTextSources: {type: array, minItems: 1, maxItems: 4, items: {$ref: '#/components/schemas/PipelineSource'}, description: 'text sources, in order: `$<Text input>`, `<judge>.reasons`, `<memory>.notes`'}
    PipelineJudgeNode:
      type: object
      required: [kind, takes, criteria]
      additionalProperties: false
      description: 'from 1.14 (plan 16.2): a vision-language model checks a step''s takes against the checklist, keeps the best `keep` and gives reasons; its pass / fail edges are a branch like a gate''s'
      properties:
        kind: {type: string, const: judge}
        title: {$ref: '#/components/schemas/PipelineNodeTitle'}
        takes: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'the step whose latest takes it judges'}
        criteria: {$ref: '#/components/schemas/PipelineCriteria'}
        keep: {type: integer, minimum: 1, maximum: 8, default: 1, description: 'keep the best K of the takes (at most the step''s seeds)'}
        mode: {type: string, enum: [suggest, auto], default: suggest, description: 'suggest: the row parks like a gate with the judge''s pick pre-selected (a fail with loops left retries without parking); auto: it picks alone'}
        model: {$ref: '#/components/schemas/PipelineModel'}
        memory: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'a memory read node before it: the user''s past picks at this judge (judge examples) and notes go into its prompt; absent = no memory ("Memory: Off")'}
        position: {$ref: '#/components/schemas/NodePosition'}
    PipelineWriteNode:
      type: object
      required: [kind, from]
      additionalProperties: false
      description: 'from 1.14: writes text from its sources (a rewritten prompt from a judge''s reasons) into a Text input for the rest of the row; mentions in the answer are expanded by studio like any prompt'
      properties:
        kind: {type: string, const: write}
        title: {$ref: '#/components/schemas/PipelineNodeTitle'}
        from: {$ref: '#/components/schemas/PipelineTextSources'}
        to: {type: string, pattern: '^\$[a-z][a-z0-9_]{0,63}$', description: 'the Text input it overwrites (`$prompt`): later binds of it read the new text. Required without `list`, absent with it (write_target)'}
        list: {$ref: '#/components/schemas/PipelineListSpec'}
        instruction: {type: string, minLength: 1, maxLength: 1000, default: 'Fix what the reviewer found; keep everything else.'}
        form: {type: string, enum: [text, script], default: text, description: 'from 1.32: script = the answer is a dialogue script (`@handle (style): text` lines, template write-script/v1) for a `$<input>` bound to a `script` param; not with `list` (write_target; contracts/README.md, Dialogue: agents)'}
        model: {$ref: '#/components/schemas/PipelineModel'}
        position: {$ref: '#/components/schemas/NodePosition'}
    PipelineDecideNode:
      type: object
      required: [kind, question, from, routes]
      additionalProperties: false
      description: 'from 1.14: routes the row along one of its declared routes from a structured answer (its routes edge maps each label to a node)'
      properties:
        kind: {type: string, const: decide}
        title: {$ref: '#/components/schemas/PipelineNodeTitle'}
        question: {type: string, minLength: 1, maxLength: 1000}
        from: {$ref: '#/components/schemas/PipelineTextSources'}
        routes:
          type: object
          minProperties: 2
          maxProperties: 6
          propertyNames: {pattern: '^[a-z][a-z0-9_]{0,31}$'}
          additionalProperties: {type: string, minLength: 1, maxLength: 200}
          description: 'route label → what it means (the model reads it)'
          examples: [{retry: the takes miss the brief, accept: good enough to animate}]
        model: {$ref: '#/components/schemas/PipelineModel'}
        position: {$ref: '#/components/schemas/NodePosition'}
    PipelineMemoryNode:
      description: 'from 1.14 (plan 16.6): read the batch''s memory snapshot (taken when the batch starts), or write a note for the next batches'
      oneOf:
        - type: object
          required: [kind, op]
          additionalProperties: false
          properties:
            kind: {type: string, const: memory}
            title: {$ref: '#/components/schemas/PipelineNodeTitle'}
            op: {type: string, const: read}
            key: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$', description: 'only notes with this key; absent = every note'}
            limit: {type: integer, minimum: 1, maximum: 16, default: 8, description: 'at most this many examples and this many notes, newest first'}
            position: {$ref: '#/components/schemas/NodePosition'}
        - type: object
          required: [kind, op, key, from]
          additionalProperties: false
          properties:
            kind: {type: string, const: memory}
            title: {$ref: '#/components/schemas/PipelineNodeTitle'}
            op: {type: string, const: write}
            key: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
            from: {$ref: '#/components/schemas/PipelineTextSources'}
            position: {$ref: '#/components/schemas/NodePosition'}
    PipelineListSpec:
      type: object
      required: [max]
      additionalProperties: false
      description: 'from 1.15: the node answers a list of texts (a shot list), 1 to `max` items, read only by a step''s `each` (`<node>.items`; each branch binds `<node>.item`). Its mentions follow the write rule'
      properties:
        max: {type: integer, minimum: 1, maximum: 24, description: 'the fan-out''s declared maximum: Submit''s worst case uses it'}
    PipelineAgentCaps:
      type: object
      additionalProperties: false
      description: 'from 1.15: hard caps per visit (the director''s chat: per wake). Reaching one ends the visit: an item failure (`<node>: stopped at <n> turns`), counted in the worst case'
      properties:
        max_turns: {type: integer, minimum: 1, maximum: 16, default: 6, description: 'model calls (each a queue item, or a remote request)'}
        max_tool_calls: {type: integer, minimum: 0, maximum: 32, default: 12}
        max_tokens: {type: integer, minimum: 1000, maximum: 200000, default: 16000, description: 'prompt + answer tokens over the visit''s turns'}
    PipelineAgentNode:
      type: object
      required: [kind, instruction]
      additionalProperties: false
      description: 'from 1.15 (plan 16.2): an LLM agent with tools, a loop of model turns (contracts/README.md, Agents). It ends a visit with no tool call (one plain edge), with `route` (a routes edge, like a decide''s), and with `set_items` before that when it has a `list`. `director: true` also gives the batch a chat with it'
      properties:
        kind: {type: string, const: agent}
        title: {$ref: '#/components/schemas/PipelineNodeTitle'}
        instruction: {type: string, minLength: 1, maxLength: 4000, description: 'what it is for (`Turn the script into a shot list, one prompt per shot, using the @elements in it.`)'}
        from: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/PipelineSource'}, description: 'text sources it reads, as a write''s; missing = []'}
        tools:
          type: array
          maxItems: 6
          uniqueItems: true
          items: {type: string, enum: [gallery.search, memory.read, memory.write, library.read, rows.add, rows.edit]}
          description: 'from the fixed set (contracts/README.md, Agents: tools); rows.edit only with director (agent_tools); missing = []'
        routes:
          type: object
          minProperties: 2
          maxProperties: 6
          propertyNames: {pattern: '^[a-z][a-z0-9_]{0,31}$'}
          additionalProperties: {type: string, minLength: 1, maxLength: 200}
          description: 'route label → meaning; present: its only edge is a routes edge with these labels (decide_routes)'
        list: {$ref: '#/components/schemas/PipelineListSpec'}
        caps: {$ref: '#/components/schemas/PipelineAgentCaps'}
        model: {$ref: '#/components/schemas/PipelineModel'}
        director: {type: boolean, default: false, description: 'the pipeline''s director (at most one: director_count): its batches get a chat'}
        wake_on_rows: {type: string, enum: [all, failed, none], default: all, description: 'director only: which row ends wake it (a message always does)'}
        max_wakes: {type: integer, minimum: 1, maximum: 500, default: 100, description: 'director only: wakes per batch; then its chat is off'}
        position: {$ref: '#/components/schemas/NodePosition'}
    PipelineCustomNode:
      type: object
      required: [kind, node]
      additionalProperties: false
      description: 'from 1.15 (plan 16.5): a pack''s registered runnable, run in pipelines_service (orchestration only). Fields as GET /v1/studio/custom-nodes lists them; its output fields are sources `<id>.<field>`. One plain edge'
      properties:
        kind: {type: string, const: custom}
        title: {$ref: '#/components/schemas/PipelineNodeTitle'}
        node: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}/[a-z][a-z0-9-]{0,31}$', description: 'the registered name', examples: [text/prefix]}
        inputs: {type: object, maxProperties: 16, propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}, description: 'fixed input field values (JSON); missing = {}'}
        bind: {type: object, maxProperties: 16, propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}, additionalProperties: {$ref: '#/components/schemas/PipelineSource'}, description: 'input field ← a source (a string field: a text source or Text input; a take-id list field: a takes source); missing = {}'}
        position: {$ref: '#/components/schemas/NodePosition'}
    PipelineRemote:
      type: object
      additionalProperties: false
      description: 'from 1.15: calls that leave the machine. Off by default (absent = off); a `remote:` model or a network custom node needs `enabled` and its provider in `providers` (remote_not_enabled), and the deployment''s remote switch (remote_off). The caps are per batch, over every row and the director''s chat; a call past one fails its row (`remote cap reached`)'
      properties:
        enabled: {type: boolean, default: false}
        providers: {type: array, maxItems: 8, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$'}, description: 'remote providers this pipeline may call; missing = []'}
        max_calls: {type: integer, minimum: 1, maximum: 10000, default: 200}
        max_tokens: {type: integer, minimum: 1000, maximum: 10000000, default: 400000}
    PipelineEgress:
      type: object
      required: [node, where, provider, model, fields, thumbnails, per_row, chat]
      additionalProperties: false
      description: 'from 1.15: one node whose calls leave this process for a model server: exactly what is sent (Submit shows it). `fields`: the parts of the prompt, by name: `instruction`, `question`, `routes`, each `from` source, `items`, `tool:<tool>` (tool results go back to the model), `chat` (the director''s chat), `input:<field>` (a custom node''s); thumbnails are never sent to a server or remote model in 1.15'
      properties:
        node: {type: string}
        where: {type: string, enum: [server, remote, network], description: 'server: a local server (its calls are queue items); remote: a remote provider; network: a custom node that calls the network'}
        provider: {type: [string, 'null']}
        model: {type: [string, 'null']}
        fields: {type: array, maxItems: 32, items: {type: string}}
        thumbnails: {type: integer, const: 0}
        per_row: {type: object, required: [calls, tokens], properties: {calls: {type: integer, minimum: 0}, tokens: {type: integer, minimum: 0}}, description: 'the worst case per row (a re-ask included)'}
        chat: {oneOf: [{type: object, required: [calls, tokens], properties: {calls: {type: integer, minimum: 0}, tokens: {type: integer, minimum: 0}}}, {type: 'null'}], description: 'the director: its chat''s worst case per batch (max_wakes × max_turns × 2 calls, max_wakes × max_tokens); null otherwise'}
    PipelineReserved:
      type: object
      required: [provider, host, memory_gb]
      additionalProperties: false
      description: 'from 1.15: a local server the pipeline uses, and the memory the host reserves for it (always, while the provider is enabled)'
      properties:
        provider: {type: string}
        host: {type: string}
        memory_gb: {type: number, minimum: 0.5}
    PipelineNodeTitle: {type: string, minLength: 1, maxLength: 60, description: 'the card''s title; absent = derived by the client'}
    PipelineNode:
      oneOf:
        - {$ref: '#/components/schemas/PipelineInputsNode'}
        - {$ref: '#/components/schemas/PipelineStepNode'}
        - {$ref: '#/components/schemas/PipelineGateNode'}
        - {$ref: '#/components/schemas/PipelineOutputNode'}
        - {$ref: '#/components/schemas/PipelineJudgeNode'}
        - {$ref: '#/components/schemas/PipelineWriteNode'}
        - {$ref: '#/components/schemas/PipelineDecideNode'}
        - {$ref: '#/components/schemas/PipelineMemoryNode'}
        - {$ref: '#/components/schemas/PipelineAgentNode'}
        - {$ref: '#/components/schemas/PipelineCustomNode'}
      discriminator:
        propertyName: kind
        mapping:
          inputs: '#/components/schemas/PipelineInputsNode'
          step: '#/components/schemas/PipelineStepNode'
          gate: '#/components/schemas/PipelineGateNode'
          output: '#/components/schemas/PipelineOutputNode'
          judge: '#/components/schemas/PipelineJudgeNode'
          write: '#/components/schemas/PipelineWriteNode'
          decide: '#/components/schemas/PipelineDecideNode'
          memory: '#/components/schemas/PipelineMemoryNode'
          agent: '#/components/schemas/PipelineAgentNode'
          custom: '#/components/schemas/PipelineCustomNode'
    PipelineBranch:
      type: object
      required: [pass, fail, max]
      additionalProperties: false
      description: 'a gate''s or (1.14) a judge''s branch: pass = a pick was made (a judge: its verdict pass, or the user''s pick); fail = every candidate rejected (a judge: verdict fail), taken at most `max` times per row (a judge''s retry target: its step again, or a write that rewrites the prompt); on the next reject the row goes to `then`'
      properties:
        pass: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        fail: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        max: {type: integer, minimum: 1, maximum: 10, description: 'the loop cap'}
        then: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'required for a gate (edge_invalid). From 1.28 a judge may leave it out: "Then: Ask me": at the cap the row parks for a pick with nothing suggested (Auto too); a reject there fails the row'}
    PipelineEdge:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: from}
        - oneOf:
            - {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'to (plain edge)'}
            - {$ref: '#/components/schemas/PipelineBranch'}
            - {$ref: '#/components/schemas/PipelineRoutes'}
      examples: [[still, review], [review, {pass: edit, fail: still, max: 2, then: out}], [check, {routes: {retry: still, accept: clip}, max: 2, then: accept}]]
    PipelineRoutes:
      type: object
      required: [routes, max, then]
      additionalProperties: false
      description: 'from 1.14, a decide''s only edge (from 1.15 also an agent''s with `routes`): route label → node (the same labels as the node''s `routes`). Every route but `then` counts against `max` per row; once taken `max` times, `then` is taken whatever the answer'
      properties:
        routes:
          type: object
          minProperties: 2
          maxProperties: 6
          propertyNames: {pattern: '^[a-z][a-z0-9_]{0,31}$'}
          additionalProperties: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        max: {type: integer, minimum: 1, maximum: 10}
        then: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', description: 'one of the labels'}
    PipelineDoc:
      type: object
      required: [title, nodes, edges]
      description: |
        A pipeline as the editor saves or validates it (plan 16.2: inputs, step, gate and output; from 1.14 judge,
        write, decide and memory; from 1.15 agent and custom, fan-out (`each`), model sources and `remote`).
        Node ids are stable slugs. At most 24 nodes and 64 KB (problems, not the schema). Other top-level keys are
        ignored by validate; PipelineCreate and PipelineUpdate are closed.
      properties:
        title: {type: string, minLength: 1, maxLength: 80, description: 'trimmed; blank = 422'}
        nodes:
          type: object
          minProperties: 1
          propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}
          additionalProperties: {$ref: '#/components/schemas/PipelineNode'}
        edges: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/PipelineEdge'}}
        remote: {$ref: '#/components/schemas/PipelineRemote'}
    Pipeline:
      allOf:
        - {$ref: '#/components/schemas/PipelineDoc'}
      type: object
      required: [id, based_on, version, created_at, updated_at, workflow_titles, last_batch]
      properties:
        id: {type: string, format: uuid}
        based_on: {type: [string, 'null'], description: 'the pipeline it was copied or saved from (it may be gone since); null otherwise'}
        version: {type: integer, minimum: 1, description: '1 on create, +1 on every PUT and PATCH'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        workflow_titles: {type: object, additionalProperties: {type: string}, description: 'every step''s workflow id → its title now (an unknown one left out), for the cards'}
        last_batch: {oneOf: [{$ref: '#/components/schemas/Batch'}, {type: 'null'}], description: 'the newest batch of it; null when it never ran'}
        problems: {type: array, items: {$ref: '#/components/schemas/PipelineProblem'}, description: 'only from GET /v1/studio/pipelines/{pipeline_id}, POST and PUT; empty = it can run'}
        bounds: {$ref: '#/components/schemas/PipelineBounds', description: 'from 1.14, with problems when nothing blocks saving'}
        egress: {type: array, items: {$ref: '#/components/schemas/PipelineEgress'}, description: 'from 1.15, with bounds'}
        reserved: {type: array, items: {$ref: '#/components/schemas/PipelineReserved'}, description: 'from 1.15, with bounds'}
    PipelineList:
      type: object
      required: [pipelines]
      properties: {pipelines: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Pipeline'}}}
    PipelineCreate:
      description: 'a whole document (based_on optional), or `{based_on, title?}` to copy one of the caller''s pipelines'
      oneOf:
        - allOf:
            - {$ref: '#/components/schemas/PipelineDoc'}
          type: object
          properties:
            based_on: {type: string, format: uuid, description: 'the pipeline it was made from; must be the caller''s (404)'}
          unevaluatedProperties: false
        - type: object
          required: [based_on]
          additionalProperties: false
          properties:
            based_on: {type: string, format: uuid}
            title: {type: string, minLength: 1, maxLength: 80, description: 'absent = `<source title> copy`'}
    PipelineUpdate:
      allOf:
        - {$ref: '#/components/schemas/PipelineDoc'}
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: 'the version the edit started from (409 when stale)'}
      unevaluatedProperties: false
    PipelinePatch:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 80, description: 'trimmed; blank = 422'}
    PipelineProblemCode:
      type: string
      enum: [too_many_nodes, too_large, inputs_node, duplicate_input, unknown_node, edge_invalid, branch_not_gate, uncapped_cycle, too_many_runs, unreachable, dead_end, no_output, gate_takes, gate_keep, bind_source, unknown_workflow, workflow_cannot_run, unknown_preset, step_input_invalid, bind_unknown, bind_type, unbound_input, step_seeds, unknown_look, look_fit, too_many_calls, judge_criteria, decide_routes, write_target, unknown_model, agent_tools, director_count, fanout_source, fanout_takes, model_media, remote_not_enabled, remote_off, unknown_custom, custom_input]
      description: 'meaning and which block saving: contracts/README.md, Pipeline rules. May grow in a minor version; an unknown code blocks running'
    PipelineProblem:
      type: object
      required: [code, message, blocks]
      additionalProperties: false
      description: 'one broken pipeline rule, the same shape as Problem: `node` the pipeline node, `port` a bind key (`<node>.<param>` of the step''s workflow) or `from` for an output, `param` an input name or a step input key'
      properties:
        code: {$ref: '#/components/schemas/PipelineProblemCode'}
        message: {type: string, minLength: 1, description: human text; not stable}
        blocks: {type: string, enum: [save, run]}
        node: {type: string}
        port: {type: string}
        param: {type: string}
    PipelineValidation:
      type: object
      required: [problems, can_save, can_run]
      additionalProperties: false
      properties:
        problems: {type: array, items: {$ref: '#/components/schemas/PipelineProblem'}, description: 'sorted by node (whole-pipeline ones first), then code, port, param'}
        can_save: {type: boolean}
        can_run: {type: boolean}
        bounds: {$ref: '#/components/schemas/PipelineBounds'}
        models: {type: object, additionalProperties: {type: string}, description: 'from 1.14: judge, write and decide node id → the ask workflow its model resolves to now (auto included); a node without one is left out. From 1.15 also agent nodes, and a server or remote model as `server:<name>/<model>` (default model filled) or `remote:<provider>/<model>`'}
        egress: {type: array, items: {$ref: '#/components/schemas/PipelineEgress'}, description: 'from 1.15: what leaves the machine, per node whose model is a server or remote one (or a custom node that calls the network), by node id; sent with bounds; [] = nothing leaves'}
        reserved: {type: array, items: {$ref: '#/components/schemas/PipelineReserved'}, description: 'from 1.15: the memory reserved for the local servers it uses'}
    PipelineBounds:
      type: object
      required: [runs, llm_calls]
      additionalProperties: false
      description: 'from 1.14: the worst case per row (contracts/README.md, Pipeline rules: worst case), sent when nothing blocks saving. Submit multiplies by the rows for its estimate. The 1.15 fields are always sent from 1.15'
      properties:
        runs: {type: integer, minimum: 0, maximum: 64, description: 'generation runs: Σ over steps of seeds × branches × visits (branches: a fanned-out step''s list max, else 1)'}
        llm_calls: {type: integer, minimum: 0, maximum: 32, description: 'judge, write and decide visits (each one ask run, at most 2 tries; a re-ask after a failed check is a second run); from 1.15 plus agent visits × max_turns'}
        tool_calls: {type: integer, minimum: 0, description: 'from 1.15: agent visits × max_tool_calls'}
        remote_calls: {type: integer, minimum: 0, description: 'from 1.15: requests to remote providers (a re-ask included), per row; the director''s chat is per batch (egress)'}
        remote_tokens: {type: integer, minimum: 0, description: 'from 1.15: their token bound per row'}
        chat:
          type: object
          required: [calls, tokens, tool_calls]
          additionalProperties: false
          description: 'from 1.15, with a director only, whatever its model source: its chat''s worst case per batch (not per row): calls max_wakes × max_turns × 2 (a re-ask included; local models: queue items), tokens max_wakes × max_tokens, tool_calls max_wakes × max_tool_calls'
          properties:
            calls: {type: integer, minimum: 0}
            tokens: {type: integer, minimum: 0}
            tool_calls: {type: integer, minimum: 0}
        added_rows: {type: integer, minimum: 1, maximum: 100, description: 'from 1.15, when an agent declares rows.add: the most rows agents may add to a batch (100), each with the per-row worst case'}
    PipelineError:
      type: object
      required: [detail]
      properties:
        detail: {type: string, description: '`pipeline has <n> problems: <first message>` for pipeline problems'}
        problems: {type: array, items: {$ref: '#/components/schemas/PipelineProblem'}, description: 'every problem; absent for a schema error'}
    TakePipeline:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 80, description: 'absent = `<take title> pipeline`, cut to 80 characters'}

    # ---------------------------------------------------------- studio: runs
    RunStatus: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
    RunInputs:
      type: object
      description: '`<node id>.<param name>` → value; only the params to change'
      propertyNames: {pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'}
      additionalProperties: {$ref: '#/components/schemas/ParamValue'}
      examples: [{prompt.text: a red fox, echo.steps: 20}]
    RunRequest:
      type: object
      required: [workflow_id]
      additionalProperties: false
      properties:
        workflow_id: {type: string}
        inputs: {$ref: '#/components/schemas/RunInputs', description: 'missing = {}'}
        looks: {$ref: '#/components/schemas/LookIds', description: 'the chosen looks, every group together, in the order the composer''s tiles list them (tile order, then pick order); missing = []. Resolved with the mentions (contracts/README.md, Looks)'}
        host: {type: string, pattern: '^[a-z0-9]{1,32}$', description: 'from 1.35 (Create''s Run on): run it on this host only, attempt 2 included; absent = automatic (contracts/README.md, Several hosts: a run set to one host). A host that cannot take it now is a 422 at create (the plan answers it as `reason`)'}
    RunPlan:
      type: object
      required: [host, peak_gb, reason]
      additionalProperties: false
      description: 'from 1.25: POST /v1/studio/runs/plan'
      properties:
        host: {type: [string, 'null'], description: 'the host the run would be eligible on, the first by name (from 1.35 with RunRequest.host: that host); null = none'}
        peak_gb: {type: [number, 'null'], minimum: 0, description: 'its planned peak there in GB (the plan''s peak_gb + its LoRA files; from 1.47 a plan with no components is the run''s own: its nodes'' `peak_gb` formulas over its settings, contracts/README.md Memory per run); null = no plan (the whole host budget) or no host'}
        reason: {type: [string, 'null'], description: 'why no host is eligible (the text the run would fail with, `no live host for env mlx`); null when one is'}
    LookId:
      type: string
      pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$'
      description: 'a look: one of the caller''s own (a UUID) or a starter look `<family>/<pack look id>` (stable across hosts)'
      examples: [qwen-image/window-light]
    LookIds:
      type: array
      maxItems: 8
      items: {$ref: '#/components/schemas/LookId'}
      description: 'look ids, in order; a repeated id counts once (its first place)'
    RunProgress:
      type: object
      required: [node, step, of]
      properties:
        node: {type: string, description: the node id that is stepping}
        step: {type: integer, minimum: 1}
        of: {type: integer, minimum: 1}
        phase: {type: string, description: 'what the node is doing (loading transformer, sampling, decoding); absent from M0 runners'}
        phase_id: {type: string, description: 'from 1.36: the id of one of the node''s NodeSchema `phases` it is in; only from a node with phases (contracts/README.md, Phases)'}
        eta_s: {type: number, minimum: 0, description: estimated seconds until the run finishes}
    RunOutput:
      type: object
      required: [index, key, kind, url, width, height]
      allOf:
        - {if: {properties: {kind: {const: video}}, required: [kind]}, then: {required: [video]}}
        - {if: {properties: {kind: {const: audio}}, required: [kind]}, then: {required: [audio], properties: {width: {type: 'null'}, height: {type: 'null'}}}}
      properties:
        index: {type: integer, minimum: 0}
        key: {type: string, description: 'object key, u/<owner_id>/runs/<run_id>/<attempt>/<index>.<ext>'}
        kind: {type: string, enum: [image, video, audio], description: 'audio from 1.30 (a WAV; width and height null)'}
        url: {$ref: '#/components/schemas/SignedUrl', description: 'the image, or the MP4 of a video (served with Range)'}
        width: {type: [integer, 'null']}
        height: {type: [integer, 'null']}
        video: {$ref: '#/components/schemas/VideoInfo', description: 'kind video only (absent for an image)'}
        audio: {$ref: '#/components/schemas/AudioInfo', description: 'from 1.30, kind audio only: its length and sample rate'}
        seed: {type: integer, minimum: 0, description: 'the seed it was made with; absent when the workflow has none'}
        take_id: {type: string, format: uuid, description: 'the take this output became (every output is a take); absent only on events stored before API 1.2'}
        thumb_url: {$ref: '#/components/schemas/SignedUrl', description: 'from 1.48: its take''s thumb_url (Take.thumb_url); absent without a take (or once it is deleted): use `url`'}
    RunLane:
      type: string
      enum: [interactive, batch]
      description: 'interactive (Create, POST …/runs) is dispatched before batch (runs pipelines_service asks for, one per batch row and step)'
    Run:
      type: object
      required: [id, session_id, workflow_id, inputs, status, progress, error, outputs, host, lane, attempt, created_at, started_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        workflow_id: {type: string}
        inputs: {$ref: '#/components/schemas/RunInputs', description: as requested}
        status: {$ref: '#/components/schemas/RunStatus'}
        progress: {oneOf: [{$ref: '#/components/schemas/RunProgress'}, {type: 'null'}], description: 'the last progress event; null before the first'}
        error: {type: [string, 'null'], description: 'set when failed'}
        outputs: {type: array, items: {$ref: '#/components/schemas/RunOutput'}, description: 'by index; outputs whose take was deleted are left out'}
        host: {type: [string, 'null'], description: 'the host it was sent to (its current attempt''s); while queued, the host it is lined up for (the one the dispatcher would choose now, may change); null when none was eligible'}
        lost_host: {type: [string, 'null'], description: 'from 1.18: the host attempt 1 was sent to, when that host stopped responding and the run was queued again (attempt 2 goes to another eligible host when there is one: contracts/README.md, Several hosts: host loss); absent or null otherwise'}
        lane: {$ref: '#/components/schemas/RunLane'}
        attempt: {type: integer, minimum: 1, maximum: 2, description: '1; 2 after its runner was lost once and it was queued again'}
        position: {type: integer, minimum: 1, description: 'only while queued: 1 + the number of queued runs (anyone''s) the dispatcher would release on `host` before it, recomputed on every read; absent otherwise'}
        resolved: {$ref: '#/components/schemas/Resolved'}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time, description: 'the runner reported running'}
        finished_at: {type: [string, 'null'], format: date-time}
        batch_id: {type: [string, 'null'], format: uuid, description: 'the batch it runs a row of (lane batch); absent or null for a Create run'}
        batch_row: {type: [integer, 'null'], minimum: 1, description: 'the batch row number; with batch_id'}
        workflow_version: {type: [integer, 'null'], minimum: 1, description: 'a user workflow: the version it ran (its graph is the run''s snapshot); absent or null for a template'}
        looks: {$ref: '#/components/schemas/LookIds', description: 'the looks it was asked with (RunRequest.looks; a batch run: its row''s or step''s), as requested; absent or empty = none'}
        answer: {$ref: '#/components/schemas/RunAnswer'}
        purpose: {type: [string, 'null'], enum: [name, null], description: 'from 1.43: name = the hidden run that names its session (local namer, lane batch); only `GET /v1/studio/queue` lists one. Absent or null otherwise'}
        unloads_pinned:
          type: array
          minItems: 1
          description: 'from 1.16, only while queued (computed on every read, like `position`): the pinned components the host memory admission would unload, as its last-resort victims, if the run were admitted on `host` now (contracts/README.md, Hosts admin: Generate says so first); they are loaded again, and pinned again, when next used. Absent when none'
          items:
            type: object
            required: [env, component, model, variant, precision, gb]
            additionalProperties: false
            properties:
              env: {type: string}
              component: {type: string}
              model: {type: string}
              variant: {type: string}
              precision: {type: string}
              gb: {type: number, minimum: 0, description: 'its resident size: what reloading it costs'}
    RunAnswer:
      type: object
      required: [text, tokens_in, tokens_out, seconds]
      description: 'from 1.14, a run of a text (ask) workflow (lane batch: a judge, write or decide call): its answer, stored on the run, never a take (`outputs` stays empty). Sent once it succeeded, and when it failed on the schema'
      properties:
        text: {type: string, maxLength: 32768, description: 'the last try'}
        tokens_in: {type: integer, minimum: 0}
        tokens_out: {type: integer, minimum: 0}
        seconds: {type: number, minimum: 0}
    Resolved:
      type: object
      description: 'values the runner chose (a random seed, an auto length), sent with succeeded; absent until then and from M0 runners'
      properties:
        seed: {type: integer, minimum: 0}
        params:
          type: object
          additionalProperties: {type: integer, minimum: 1}
          description: 'from 1.12: `<node>.<param>` → the value the runner chose for a param set to `"auto"` (`duration.frames`: the predicted length); absent when none'
          examples: [{duration.frames: 89}]
        texts:
          type: object
          maxProperties: 4
          additionalProperties: {type: string, minLength: 1, maxLength: 16384}
          description: 'from 1.20: `<node>.<output>` → a Text output the runner made that the user did not write (an enhancer''s prompt); absent when none'
          examples: [{enhance.text: 'A ginger cat asleep on a green velvet sofa, soft window light'}]
    RunList:
      type: object
      required: [runs]
      properties: {runs: {type: array, items: {$ref: '#/components/schemas/Run'}}}

    # ---------------------------------------------------------- studio: the queue
    Queue:
      type: object
      required: [runs, hosts]
      properties:
        runs: {type: array, items: {$ref: '#/components/schemas/Run'}, description: 'the caller''s queued and running runs, every session: running first, then queued by host and position'}
        hosts: {type: array, items: {$ref: '#/components/schemas/QueueHost'}}
    QueueHost:
      type: object
      required: [host, state, others_queued]
      properties:
        host: {type: string}
        state: {type: string, enum: [idle, busy, offline], description: 'busy while anyone''s run is running on it (which and whose is never shown)'}
        others_queued: {type: integer, minimum: 0, description: other users' queued runs lined up for this host; a count only}

    # ---------------------------------------------------------- studio: events
    SessionEvent:
      description: |
        One stored event of the session. `status`: the run's new status (`queued` and studio-decided ones included);
        `progress`: a step; `output`: an output stored, its key turned into a signed `url`. After a terminal status,
        `GET /v1/studio/runs/{run_id}` has the whole run.
      oneOf:
        - {$ref: '#/components/schemas/StatusEvent'}
        - {$ref: '#/components/schemas/ProgressEvent'}
        - {$ref: '#/components/schemas/OutputEvent'}
        - {$ref: '#/components/schemas/TitleEvent'}
      discriminator:
        propertyName: type
        mapping:
          status: '#/components/schemas/StatusEvent'
          progress: '#/components/schemas/ProgressEvent'
          output: '#/components/schemas/OutputEvent'
          session: '#/components/schemas/TitleEvent'
    StatusEvent:
      type: object
      required: [seq, type, run_id, ts, data]
      properties:
        seq: {type: integer, minimum: 1, description: per-session cursor}
        type: {type: string, const: status}
        run_id: {type: string, format: uuid}
        ts: {type: string, format: date-time}
        data:
          type: object
          required: [status, error, host]
          properties:
            status: {$ref: '#/components/schemas/RunStatus'}
            error: {type: [string, 'null']}
            host: {type: [string, 'null']}
            resolved: {$ref: '#/components/schemas/Resolved'}
            attempt: {type: integer, minimum: 1, maximum: 2, description: 'the attempt this status belongs to; a `queued` with attempt 2 means the run is retried after its runner was lost; absent = 1'}
    ProgressEvent:
      type: object
      required: [seq, type, run_id, ts, data]
      properties:
        seq: {type: integer, minimum: 1}
        type: {type: string, const: progress}
        run_id: {type: string, format: uuid}
        ts: {type: string, format: date-time}
        data: {$ref: '#/components/schemas/RunProgress'}
    OutputEvent:
      type: object
      required: [seq, type, run_id, ts, data]
      properties:
        seq: {type: integer, minimum: 1}
        type: {type: string, const: output}
        run_id: {type: string, format: uuid}
        ts: {type: string, format: date-time}
        data: {$ref: '#/components/schemas/RunOutput'}
    TitleEvent:
      type: object
      required: [seq, type, run_id, ts, data]
      description: 'from 1.43: the namer gave the session its title; `run_id` is the run whose prompt it was named from'
      properties:
        seq: {type: integer, minimum: 1}
        type: {type: string, const: session}
        run_id: {type: string, format: uuid}
        ts: {type: string, format: date-time}
        data:
          type: object
          required: [title, title_source, named_by]
          properties:
            title: {type: string, minLength: 1, maxLength: 200}
            title_source: {$ref: '#/components/schemas/TitleSource'}
            named_by: {type: [string, 'null'], maxLength: 60}
    EventPage:
      type: object
      required: [events, last_seq]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/SessionEvent'}}
        last_seq: {type: integer, minimum: 0, description: next `since` (unchanged when the page is empty)}

    # ---------------------------------------------------------- studio: hosts
    Host:
      type: object
      required: [host, env, state, updated_at]
      properties:
        host: {type: string}
        env: {type: string}
        state: {type: string, enum: [idle, busy, offline]}
        updated_at: {type: string, format: date-time, description: the runner's last refresh}
        memory:
          type: object
          required: [budget_gb, used_gb]
          properties: {budget_gb: {type: number}, used_gb: {type: number}}
        host_memory:
          type: object
          required: [budget_gb, used_gb]
          description: 'from 1.13: the same on every entry of one host. `budget_gb` = the smallest `memory.budget_gb` among the host''s keys (fresh or offline) that report one; `used_gb` = the sum over those keys of the larger of Σ `gb` of its resident components and its measured `memory.used_gb` (what the dispatcher''s admission counts), both rounded to 0.1. Absent when no key of the host reports memory'
          properties:
            budget_gb: {type: number, minimum: 0}
            used_gb: {type: number, minimum: 0}
            kind: {type: string, enum: [unified, vram, ram], description: 'from 1.18: what the numbers measure, from the host''s keys'' `device.kind`: unified (mps: Apple silicon''s shared memory), vram (cuda: the GPU''s memory), ram (cpu). The memory chip and the Hosts board show `used of budget GB` the same for every kind; absent from older runners = unified'}
        device:
          type: object
          required: [kind, name, memory_total_gb]
          description: 'from 1.18, when the runner reports it: its hosts key''s `device` (registry.schema.json); the Hosts board''s settings line is `<name> · <memory_total_gb> GB`'
          properties:
            kind: {type: string, enum: [cuda, mps, cpu]}
            name: {type: string, examples: [NVIDIA L4, Apple M3 Max]}
            memory_total_gb: {type: number, minimum: 0, description: 'VRAM (cuda), unified RAM (mps), RAM (cpu)'}
            memory_used_gb: {type: number, minimum: 0, description: 'cuda: the whole device''s used memory, every process'}
            capability: {type: string, examples: ['8.9']}
            driver: {type: string, examples: [580.95.05]}
            runtime: {type: string, examples: [torch 2.15.0 · CUDA 13.2]}
        host_ram:
          type: object
          required: [budget_gb, used_gb]
          description: 'from 1.18, cuda hosts only: the host-RAM limit (RAM − RUNNER_RAM_RESERVE_GB) and the process''s resident set; load staging and CPU-side components count here, not in `memory` / `host_memory`'
          properties: {budget_gb: {type: number, minimum: 0}, used_gb: {type: number, minimum: 0}}
        resident:
          type: array
          description: model components loaded now; no run or owner
          items:
            type: object
            required: [component, model, variant, precision, gb, pinned]
            properties:
              component: {type: string}
              model: {type: string}
              variant: {type: string}
              precision: {type: string, enum: [bf16, fp16, int8, int4, fp8, fp32], description: 'fp8 from 1.33 (NVIDIA hosts: a community pre-quantized variant). fp32 from 1.20: a component kept at its stored float32 (the MiniMax H3 Image VAE)'}
              compute: {type: string, enum: [float32, float16], description: 'from 1.39: the load option the model node''s `compute` set (LTX on MLX: the transformer at float16 is its own entry); absent = float32'}
              gb: {type: number}
              pinned: {type: boolean}
              last_used: {type: string, format: date-time, description: 'from 1.13: when the runner last used it; absent from older runners'}
              pinned_why: {type: string, enum: [in_use, pin], description: 'from 1.16, with pinned true: in_use = the running run uses it; pin = a pin of the host'}
              device: {type: string, enum: [cpu], description: 'from 1.18, cuda hosts: held in host RAM (CPU offload), counted in `host_ram`, not in `memory`; absent = on the device'}
              loras:
                type: array
                description: 'a component with LoRAs baked in is its own entry: those LoRAs in order; absent or empty = the plain component. Another user''s own LoRA shows only its size (`lora_id`, `name`, `strength` null)'
                items:
                  type: object
                  required: [lora_id, name, strength, bytes]
                  properties:
                    lora_id: {type: [string, 'null']}
                    name: {type: [string, 'null']}
                    strength: {type: [number, 'null']}
                    bytes: {type: integer, minimum: 1}
        cached_gb:
          type: number
          minimum: 0
          description: 'from 1.16: what the env holds beyond its resident components (cached handles: cached node results, the device cache, the runtime): max(0, memory.used_gb − Σ gb), rounded to 0.1; absent without memory. The board''s `Cached handles`'
        machine:
          type: object
          required: [os, accel, packaging, ram_gb]
          description: 'from 1.16, when the runner reports it: `macos · metal · native` is the board''s `Apple Silicon · Metal · native`'
          properties:
            os: {type: string, enum: [macos, linux]}
            accel: {type: string, enum: [metal, cuda, cpu]}
            packaging: {type: string, enum: [native, container]}
            ram_gb: {type: number, minimum: 0}
        admin: {$ref: '#/components/schemas/HostAdmin'}
    HostAdmin:
      type: object
      required: [settings, policy, run, idle_since, unload_pending, hub_token]
      description: 'from 1.16, admins only: what the Hosts screen needs beyond the redacted view'
      properties:
        settings:
          oneOf: [{$ref: '#/components/schemas/HostSettings'}, {type: 'null'}]
          description: 'the host''s settings (the same on every entry of the host); null until an admin sets them (the runners use their env defaults, `policy`)'
        policy:
          oneOf:
            - type: object
              required: [after_run, idle_unload_min, reserve_gb, settings_version]
              properties:
                after_run: {$ref: '#/components/schemas/AfterRun'}
                idle_unload_min: {type: integer, minimum: 0}
                reserve_gb: {type: number, minimum: 0}
                settings_version: {type: [integer, 'null'], minimum: 1}
            - type: 'null'
          description: 'what this env''s runner applies now (its hosts key''s `policy`); null from a runner that does not report it'
        run:
          oneOf:
            - type: object
              required: [run_id, owner_id, lane, node, step, of, phase, eta_s]
              properties:
                run_id: {type: string, format: uuid}
                owner_id: {type: string, format: uuid, description: 'the run''s owner; the web shows their name from GET /auth/admin/users'}
                lane: {$ref: '#/components/schemas/RunLane'}
                node: {type: [string, 'null'], description: 'from its latest progress event; null before the first'}
                step: {type: [integer, 'null'], minimum: 1}
                of: {type: [integer, 'null'], minimum: 1}
                phase: {type: [string, 'null']}
                eta_s: {type: [number, 'null'], minimum: 0}
            - type: 'null'
          description: 'busy: the run released to this env that holds the host (studio''s own table); null otherwise'
        idle_since: {type: [string, 'null'], format: date-time, description: 'the end of the last run released to the host (any env); null while busy or never'}
        unload_pending: {type: boolean, description: 'an admin unload waits for this env''s run to end'}
        hub_token: {type: boolean, description: 'the runner reports a Hub token file (never the token)'}
    HostList:
      type: object
      required: [hosts]
      properties: {hosts: {type: array, items: {$ref: '#/components/schemas/Host'}}}

    # ---------------------------------------------------------- studio: takes (the gallery) and uploads
    TakeKind: {type: string, enum: [image, video, audio]}
    TakeSource:
      type: string
      enum: [create, upload, pipeline, import, export, frame]
      description: 'create: an output of a Create run; upload: a file the user uploaded; pipeline: an output of a batch run (every batch runs on the pipeline engine, plan 9.1); import (from 1.16): an item of the old helmstudio gallery, brought in by `helm import` (`legacy`); export (from 1.17): a sequence''s export (`export`); frame (from 1.17): a video take''s first or last frame (`frame_of`)'
    Take:
      type: object
      description: |
        One item of the caller's gallery: a run output or an upload, pointing at an immutable object (its key is never
        shown). `title` starts as the first line of the prompt (at most 80 characters; the workflow title when the
        prompt is empty) for a run output, the file name without its extension for an upload.
      required: [id, kind, source, title, url, thumb_url, content_type, width, height, bytes, created_at, starred, session_id, run_id, made_with, parents]
      allOf:
        - {if: {properties: {kind: {const: video}}, required: [kind]}, then: {required: [video]}}
        - {if: {properties: {kind: {const: audio}}, required: [kind]}, then: {required: [audio]}}
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/TakeKind'}
        source: {$ref: '#/components/schemas/TakeSource'}
        title: {type: string, maxLength: 200}
        url: {$ref: '#/components/schemas/SignedUrl', description: 'the file: an image, or a video''s MP4 (GET /files serves Range requests)'}
        thumb_url: {$ref: '#/components/schemas/SignedUrl', description: 'a small preview; an image: in 1.2 the original itself; a video: its poster (frame 0); from 1.19 an audio take (an upload, from 1.30 a run''s WAV too): the file itself (the gallery draws a sound tile by `kind`); from 1.48 an image or video: a WebP of the image or the poster, short side 512 px (never upscaled), long side at most 1024, and until it is made (or when it would save nothing) the original image or the poster as before (contracts/README.md, Thumbnails)'}
        content_type: {type: string, examples: [image/png, video/mp4]}
        width: {type: [integer, 'null'], minimum: 1, description: null for audio}
        height: {type: [integer, 'null'], minimum: 1}
        bytes: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        starred: {type: boolean}
        session_id: {type: [string, 'null'], format: uuid, description: 'the session it was made in; null for an upload or after the session was deleted'}
        run_id: {type: [string, 'null'], format: uuid, description: 'the run that made it; null for an upload or after its session was deleted'}
        made_with: {oneOf: [{$ref: '#/components/schemas/MadeWith'}, {type: 'null'}], description: null for an upload or an import}
        legacy: {$ref: '#/components/schemas/LegacyInfo', description: 'from 1.16, source import only (absent otherwise): the old settings, read-only'}
        frame_of: {$ref: '#/components/schemas/TakeFrameOf', description: 'from 1.17, source frame only: which video take and frame it is (its `parents` = that take)'}
        export: {$ref: '#/components/schemas/TakeExport', description: 'from 1.17, source export only: the sequence and revision it is (`made_with` null; `parents` = its clips'' takes)'}
        parents: {type: array, items: {type: string, format: uuid}, description: 'lineage: the takes it was made from, in input order (every image and, from 1.19, media value of `made_with.inputs`, each once); deleted ones left out; empty for a take made from no take'}
        children:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/TakeRef'}
          description: 'only in `GET /v1/studio/takes/{take_id}`: the takes made from this one ("Used in"), newest first, at most 50, deleted ones left out'
        batch_id: {type: [string, 'null'], format: uuid, description: 'with source pipeline: the batch that made it (its collection); absent or null otherwise'}
        video: {$ref: '#/components/schemas/VideoInfo', description: 'kind video only (absent for an image): length, frame rate, audio and the poster'}
        audio: {$ref: '#/components/schemas/AudioInfo', description: 'from 1.19, kind audio only: its length (from 1.30 a run''s audio take also its sample rate)'}
        source_map: {$ref: '#/components/schemas/SourceMap', description: 'from 1.19, a video made from a media take (retake, extend, audio to video; absent otherwise): how its time lines up with that take'}
        decisions:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/TakeDecision'}
          description: 'from 1.14, only in `GET /v1/studio/takes/{take_id}`: the judge decisions that weighed it, newest first (full records: GET …/takes/{take_id}/decisions)'
    TakeDecision:
      type: object
      required: [decision_id, batch_id, row, node, outcome, first_failed]
      properties:
        decision_id: {type: string}
        batch_id: {type: string, format: uuid}
        row: {type: integer, minimum: 1, maximum: 500}
        node: {type: string, description: the judge node id}
        outcome: {type: string, enum: [picked, passed, failed], description: 'picked: kept (by the judge, or the user''s pick); passed: every must held but it was not kept; failed: a must failed'}
        first_failed: {type: [string, 'null'], description: 'its first false must; null when it passed'}
    VideoInfo:
      type: object
      description: |
        A video take's or output's metadata, from the runner's `evt.run.output` `video`. `url` / `thumb_url` of the take
        stay the MP4 and the poster's thumbnail; `poster_url` is the full-size poster (frame 0, the video's size; in
        1.11 the same object as the thumbnail; from 1.48 the thumbnail is a small WebP of it: a player's `poster` is
        `poster_url`).
      required: [duration_s, fps, frames, has_audio, poster_url]
      properties:
        duration_s: {type: number, exclusiveMinimum: 0, description: 'frames / fps', examples: [2.0416666666666665]}
        fps: {type: number, exclusiveMinimum: 0, examples: [24]}
        frames: {type: integer, minimum: 1, examples: [49]}
        has_audio: {type: boolean, description: 'the MP4 has an audio track (LTX: AAC 48 kHz stereo)'}
        poster_url: {$ref: '#/components/schemas/SignedUrl'}
    AudioInfo:
      type: object
      required: [duration_s]
      properties:
        duration_s: {type: number, exclusiveMinimum: 0, maximum: 600, description: 'an upload: as the client declared it (contracts/README.md, Media inputs: audio uploads); from 1.30 a run''s audio take: from evt.run.output `audio` (samples / rate)'}
        sample_rate: {type: integer, minimum: 8000, maximum: 96000, description: 'from 1.30: the WAV''s rate (Hz), from evt.run.output `audio`; absent for an upload (studio does not decode it)'}
        cues: {type: array, minItems: 1, maxItems: 40, items: {$ref: '#/components/schemas/AudioCue'}, description: 'from 1.32, a dialogue''s take only (from evt.run.output `audio.cues`): one per line, in order; the stage draws them as line markers, the Timeline as ticks on the clip (sequence time = clip `at` + cue − clip `in`)'}
    AudioCue:
      type: object
      description: 'from 1.32: one dialogue line in its take (defs `cue`): line from 1, [start_s, end_s) in the take''s own seconds, the speaker''s voice id (a deleted voice''s id stays), the text as spoken'
      required: [line, start_s, end_s, voice_id, text]
      additionalProperties: false
      properties:
        line: {type: integer, minimum: 1, maximum: 40}
        start_s: {type: number, minimum: 0, maximum: 600}
        end_s: {type: number, exclusiveMinimum: 0, maximum: 600}
        voice_id: {type: string, pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$'}
        text: {type: string, maxLength: 600}
    SourceMap:
      type: object
      description: 'from 1.19 (evt.run.output `source_map`): output time t = source time t + `offset_s`; the generated part is [`new_in_s`, `new_out_s`) of the output. A Timeline fill places the result by it (contracts/README.md, Timeline: take actions)'
      required: [take_id, offset_s, new_in_s, new_out_s]
      properties:
        take_id: {type: string, format: uuid, description: 'the media take it was made from (it may be deleted since)'}
        offset_s: {type: number}
        new_in_s: {type: number, minimum: 0}
        new_out_s: {type: number, exclusiveMinimum: 0}
    MadeWith:
      type: object
      description: 'a snapshot taken when the take was stored: it survives the run and the session'
      required: [workflow_id, workflow_title, inputs, prompt, seed, model]
      properties:
        workflow_id: {type: string}
        workflow_title: {type: string, description: 'as it was when the run was created (a later rename or delete does not change it)'}
        workflow_version: {type: [integer, 'null'], minimum: 1, description: 'a user workflow: the version that made it; absent or null for a template'}
        inputs: {$ref: '#/components/schemas/RunInputs', description: 'every param of every node (`<node id>.<param>`), resolved, with the seed the runner used in place of null / -1; image values as `{take_id}` (the references, in order), never keys'}
        prompt: {type: [string, 'null'], description: 'the text of the workflow''s `prompt` node as typed (with its `@` mentions; `typed` has it too when it had any); null without one'}
        seed: {type: [integer, 'null'], minimum: 0, description: the seed it was made with; null without one}
        elements:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/MadeWithElement'}
          description: 'the elements its prompt mentioned, first mention first, as they were when the run was made; absent or empty = none'
        loras:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/MadeWithLora'}
          description: 'every LoRA of every lora-stack node that ran, node id order then row order, as resolved when the run was made; absent or empty = none'
        looks:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/MadeWithLook'}
          description: 'the looks it was made with, in request order (repeats once), as they were when the run was made; absent or empty = none'
        voices:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/MadeWithVoice'}
          description: 'from 1.30: the voices its voice params named, node id then param order, each once, as they were when the run was made; absent or empty = none (contracts/README.md, Voices)'
        typed:
          $ref: '#/components/schemas/RunInputs'
          description: |
            for each param the mention and look expansion changed (prompt params, the reference rows, the look stack's
            rows, a pinned canvas) or the runner resolved (a frames param set to `"auto"`, from 1.12), its value
            before it: the prompt as typed, the rows without the element and look images, the stack without the look
            LoRAs, `"auto"`. `inputs` holds the resolved values (what ran: the predicted frames).
            Absent or empty = nothing was expanded.
        pipeline:
          description: 'a take made by a step of a pipeline batch (source pipeline): which pipeline, node and loop attempt; absent or null otherwise'
          oneOf:
            - $ref: '#/components/schemas/MadeWithPipeline'
            - {type: 'null'}
        host: {type: [string, 'null'], description: 'from 1.18: the host that ran it (the run''s host at the attempt that stored it); absent or null for takes made before 1.18'}
        model:
          description: 'from the workflow''s `<family>/model` node; null without one (echo)'
          oneOf:
            - type: object
              required: [id, variant, precision]
              properties:
                id: {type: [string, 'null'], description: 'the model id of the registry models key for the family; null when unknown'}
                variant: {type: [string, 'null'], examples: [base]}
                precision: {type: [string, 'null'], examples: [int8]}
            - {type: 'null'}
    MadeWithPipeline:
      type: object
      required: [id, title, version, node, attempt, row]
      properties:
        id: {type: string, format: uuid, description: 'the pipeline (it may be deleted since); from 1.17, a sequence''s Re-render: the timeline (the snapshot''s id; Batch.timeline_id)'}
        title: {type: string, description: 'as in the batch''s snapshot'}
        version: {type: integer, minimum: 1, description: 'a Re-render: the revision it was made from'}
        node: {type: string, description: 'the step node id that made it (a Re-render: clip_<clip id>)'}
        attempt: {type: integer, minimum: 1, description: 'the step''s visit in that row (1 + times a loop brought the row back to it)'}
        row: {type: integer, minimum: 1, maximum: 500, description: 'the batch row'}
    TakePage:
      type: object
      required: [takes, next_cursor]
      properties:
        takes: {type: array, items: {$ref: '#/components/schemas/Take'}}
        next_cursor: {type: [string, 'null'], description: 'pass as `cursor` for the next page; null on the last page'}
    TakePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 200, description: 'trimmed; blank = 422'}
        starred: {type: boolean}
    TakeRef:
      type: object
      required: [id, kind, title, thumb_url]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/TakeKind'}
        title: {type: string, maxLength: 200}
        thumb_url: {$ref: '#/components/schemas/SignedUrl', description: 'from 1.48 the take''s thumbnail (Take.thumb_url)'}
    TakeUse:
      type: object
      required: [workflow_id]
      additionalProperties: false
      properties:
        workflow_id: {type: string}
        param: {type: string, pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', description: 'which image (or, from 1.19, media) input (`<node id>.<param>`); absent = the only one', examples: [encode.refs]}
    TakeOffer:
      type: object
      description: 'one "Use in…" entry (from 1.19): label it `<action> · <title>`, or the title when `action` is absent'
      required: [workflow_id, title, family, media, param, inputs]
      properties:
        workflow_id: {type: string}
        title: {type: string}
        action: {type: string, description: 'the template''s `action` (Animate, Edit, Extend, Retake a section, Audio to video); absent for a user workflow or a template without one'}
        family: {type: string}
        media: {$ref: '#/components/schemas/WorkflowMedia'}
        param: {type: string, description: 'the input that holds the take (`<node id>.<param>`)', examples: [source.source]}
        inputs: {$ref: '#/components/schemas/RunInputs', description: 'as POST …/use answers (a clip action: the clip''s range); merge over the form'}
        slot: {$ref: '#/components/schemas/TimelineSlot', description: 'from 1.32, an audio clip''s action only (Make shot): the slot to send with `POST …/shots`, `{at, length, exact: true}`'}
    TakeUses:
      type: object
      required: [uses]
      properties: {uses: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TakeOffer'}}}
    ClipActions:
      type: object
      required: [actions]
      properties: {actions: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TakeOffer'}}}
    TakeReuse:
      type: object
      required: [workflow_id, inputs]
      properties:
        workflow_id: {type: string}
        inputs: {$ref: '#/components/schemas/RunInputs'}
        workflow_status: {type: string, enum: [current, changed, deleted], description: 'reuse only (not use): how the workflow now compares with the one that made the take (studioReuseTake)'}
        elements_status:
          type: array
          items: {$ref: '#/components/schemas/ElementStatus'}
          description: 'reuse only: one per `made_with.elements` entry, same order; absent or empty when the take mentioned none'
        loras_status:
          type: array
          items: {$ref: '#/components/schemas/LoraStatus'}
          description: 'reuse only: one per `made_with.loras` entry, same order; absent or empty without LoRAs'
        looks: {$ref: '#/components/schemas/LookIds', description: 'reuse only: the ids of `made_with.looks`, in order, as recorded (send them back as RunRequest.looks); absent or empty without looks'}
        looks_status:
          type: array
          items: {$ref: '#/components/schemas/LookStatus'}
          description: 'reuse only: one per `made_with.looks` entry, same order; absent or empty without looks'
    MadeWithLook:
      type: object
      required: [id, source, name, version]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/LookId'}
        source: {$ref: '#/components/schemas/LibrarySource'}
        name: {type: string, description: 'as it was when the run was made'}
        version: {type: integer, minimum: 1, description: 'the version that was applied (a starter look: the pack''s `version`)'}
    MadeWithVoice:
      type: object
      required: [id, name, version, source]
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$', description: 'the library item (an own voice may be deleted since; a starter voice `<family>/<id>`)'}
        name: {type: string, description: 'as it was when the run was made'}
        version: {type: integer, minimum: 1, description: 'the version that ran (a starter voice: the pack''s `version`)'}
        source: {$ref: '#/components/schemas/VoiceSource'}
    LookStatus:
      type: object
      required: [id, status]
      properties:
        id: {$ref: '#/components/schemas/LookId'}
        status: {type: string, enum: [current, changed, deleted, missing], description: 'current: the same version is there now; changed: another version now (edited since, or a pack that bumped it); deleted: an own look deleted since; missing: a starter look no live host publishes now (it may come back). Running a deleted or missing one is 422 `looks[<i>]: unknown look <id>`'}
    MadeWithLora:
      type: object
      required: [node, id, source, name, strength, mode, sha256]
      additionalProperties: false
      properties:
        node: {type: string, description: 'the lora-stack node id'}
        id: {type: string, description: 'the LoRA (an own one may be deleted since)'}
        source: {$ref: '#/components/schemas/LoraSource'}
        name: {type: string, description: 'as it was when the run was made'}
        strength: {type: number}
        mode: {type: string, enum: [adapter, bake]}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 'the file''s content hash: what exactly ran'}
    LoraStatus:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string, enum: [current, missing, deleted], description: 'current: the caller can use it now; missing: shared, no live host lists it now; deleted: own, deleted since'}
    MadeWithElement:
      type: object
      required: [id, handle, name, version]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, description: 'the library item (it may be deleted since)'}
        handle: {type: string, description: 'as mentioned'}
        name: {type: string}
        version: {type: integer, minimum: 1, description: 'the version that was expanded'}
    ElementStatus:
      type: object
      required: [id, handle, status, current_handle]
      properties:
        id: {type: string, format: uuid}
        handle: {type: string, description: 'as recorded (the prompt that comes back mentions this one)'}
        status: {type: string, enum: [current, changed, deleted], description: 'current: same version now; changed: edited since (another version); deleted'}
        current_handle: {type: [string, 'null'], description: 'its handle now (differs from `handle` after a rename: the returned prompt then no longer names it); null when deleted'}

    # ---------------------------------------------------------- studio: the library (contracts/README.md, Elements)
    LibraryKind:
      type: string
      enum: [element, look, voice]
      description: 'element (character, location, prop; used with `@handle`); look (film, camera, colour, lighting; chosen from the visual picker, sent as RunRequest.looks); from 1.30 voice (preset, cloned, designed; chosen in the voice picker, sent as a voice param''s VoiceRef). Clients show an unknown kind as is'
    LibraryGroup:
      type: string
      enum: [character, location, prop, film, camera, colour, lighting, preset, cloned, designed]
      description: 'an element''s group (character, location, prop), a look''s (film, camera, colour, lighting) or, from 1.30, a voice''s (preset: a pack''s starter voice; cloned: from a clip, from 1.31; designed: from a description, from 1.31 maybe with a clip)'
    LibrarySource:
      type: string
      enum: [mine, starter]
      description: 'mine: the caller''s own (id a UUID, editable); starter: a look or (1.30) a voice shipped by a pack and published by a runner (id `<family>/<pack id>`, read-only, everyone sees it)'
    LibraryNeed:
      type: string
      enum: [text, images, lora]
      description: 'what an item brings to a run: text (non-empty `text`: every family with a prompt), images (reference rows), lora (a LoRA stack)'
    VoiceSource:
      type: string
      enum: [preset, cloned, designed]
      description: 'from 1.30: where a saved voice comes from (= its group): preset (a pack''s speaker, a starter voice), cloned (a clip of a take; from 1.31), designed (a description in words; from 1.31 it may also keep a clip)'
    VoiceInfo:
      type: object
      required: [source]
      additionalProperties: false
      description: 'from 1.30, a voice''s own fields (contracts/README.md, Voices). preset: `family`, `speaker`, `language` (and `style`) from the pack; designed: `design`, optional `language` and `style` from the caller; from 1.31 cloned: `clip` and `consent`, optional `language` and `style`; a designed voice may also have `clip` and `consent`'
      properties:
        source: {$ref: '#/components/schemas/VoiceSource'}
        family: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: 'preset only: the family whose voice params take it'}
        speaker: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$', description: 'preset only: the model''s speaker id (ryan, uncle_fu)'}
        design: {type: string, minLength: 1, maxLength: 2000, description: 'designed only: the voice in words ("male, 17, tenor, nervous")'}
        language: {type: string, pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8}){0,3}$', description: 'a BCP 47 tag (en, en-US, zh, pt-BR); absent = none (the node''s own language param decides)'}
        style: {type: string, minLength: 1, maxLength: 500, description: 'how it speaks, in words; absent = none'}
        clip: {$ref: '#/components/schemas/VoiceClip', description: 'from 1.31, cloned (required) or designed (optional): the part of a take it clones'}
        consent: {const: true, description: 'from 1.31, with `clip` (required then): the owner ticked "I have the right to use this voice"'}
      allOf:
        - if: {properties: {source: {const: preset}}, required: [source]}
          then: {required: [family, speaker, language], not: {anyOf: [{required: [design]}, {required: [clip]}, {required: [consent]}]}}
          else: {not: {anyOf: [{required: [family]}, {required: [speaker]}]}}
        - if: {properties: {source: {const: designed}}, required: [source]}
          then: {required: [design]}
        - if: {properties: {source: {const: cloned}}, required: [source]}
          then: {required: [clip], not: {required: [design]}}
        - if: {required: [clip]}
          then: {required: [consent]}
          else: {not: {required: [consent]}}
    VoiceClip:
      type: object
      required: [take_id, in, out]
      additionalProperties: false
      description: |
        From 1.31: a voice's clip as stored (contracts/README.md, Voices: cloned voices): one of the owner's takes (an
        audio take, or a video take's sound) and the part in..out, snapped and 3-30 s long. The take is kept while the
        voice exists: deleted from the gallery it is hidden everywhere else, but its object is not swept, so the voice
        keeps playing and running.
      properties:
        take_id: {type: string, format: uuid}
        in: {type: number, minimum: 0, maximum: 86400}
        out: {type: number, exclusiveMinimum: 0, maximum: 86400}
    VoiceDesign:
      type: object
      additionalProperties: false
      description: 'from 1.30: a voice''s fields as the caller writes them (POST and PUT of a `kind: voice`); trimmed. Designed: `design` (required unless Save as voice copies it), from 1.31 optional `clip` and `consent`; cloned (1.31): `clip` (or `from_take`) and `consent`, no `design`'
      properties:
        design: {type: string, maxLength: 4000, description: 'trimmed; must then be 1-2000 characters; a designed voice only'}
        clip: {$ref: '#/components/schemas/MediaRef', description: 'from 1.31: the part of a take to clone (checked as a media param with trim, accepts audio, 3-30 s); not with `from_take`'}
        consent: {type: boolean, description: 'from 1.31, required true with a clip: the owner has the right to use this voice'}
        language: {type: [string, 'null'], maxLength: 35, description: 'a BCP 47 tag; null or absent = none'}
        style: {type: string, maxLength: 1000, description: 'trimmed; must then be at most 500 characters; "" or absent = none'}
    LibraryImage:
      type: object
      required: [take_id, url, thumb_url, width, height]
      properties:
        take_id: {type: string, format: uuid}
        url: {$ref: '#/components/schemas/SignedUrl'}
        thumb_url: {$ref: '#/components/schemas/SignedUrl', description: 'from 1.48 the take''s thumbnail (Take.thumb_url)'}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    LookLora:
      type: object
      required: [lora, name, strength]
      additionalProperties: false
      description: 'one LoRA of a look, appended to the look stack at `strength` when the look is applied (contracts/README.md, Looks)'
      properties:
        lora: {oneOf: [{$ref: '#/components/schemas/LoraRef'}, {type: 'null'}], description: 'the LoRA; null only for a starter look whose file no live host has (the look then does not fit anything)'}
        name: {type: string, minLength: 1, maxLength: 80, description: 'own look: the LoRA''s name now (as recorded when it is gone); starter look: the file name without .safetensors'}
        strength: {type: number, minimum: 0, maximum: 2}
    LibraryItem:
      type: object
      description: |
        A library item (plan 10-elements-and-looks.md section 14): one record shape for elements and looks.
        `images` are takes of the owner's gallery in order; one whose take was deleted is left out, so a stored item
        may show 0 images. Fields added in API 1.10 (`source`, `family`, `loras`, `needs`, `from_take_id`) are always
        sent from 1.10 on; `fits` / `reason` only when the list was asked with `workflow`.
      required: [id, kind, group, name, handle, text, images, thumb_url, version, created_at, updated_at]
      properties:
        id: {type: string, pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$', description: 'own: a UUID; starter look: `<family>/<pack look id>`'}
        kind: {$ref: '#/components/schemas/LibraryKind'}
        group: {$ref: '#/components/schemas/LibraryGroup'}
        name: {type: string, minLength: 1, maxLength: 80}
        handle: {type: [string, 'null'], pattern: '^[a-z](?:[a-z0-9_-]{0,38}[a-z0-9])?$', description: 'what `@` mentions; always set for an element, always null for a look'}
        text: {type: string, maxLength: 2000, description: 'an element: appended where it is mentioned; a look: appended to the prompt when chosen; empty = none'}
        images: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/LibraryImage'}, description: 'an element 1-4 when saved, a look 0-4; a starter look none (its picture is only `thumb_url`)'}
        thumb_url: {oneOf: [{$ref: '#/components/schemas/SignedUrl'}, {type: 'null'}], description: 'the first image''s thumb_url (from 1.48 its take''s thumbnail); else (a look) the thumb of the take it was saved from (`from_take_id`), or a starter look''s pack image; from 1.30 a voice: a starter voice''s preview clip (a WAV: the picker draws a sound tile); from 1.31 a voice with a clip: its take''s file (also after the take was deleted; the picker plays `voice.clip` in..out); else null'}
        version: {type: integer, minimum: 1, description: '1 on create, +1 on every PUT; send it back in LibraryItemUpdate. A starter look or voice: the pack''s `version`'}
        created_at: {type: string, format: date-time, description: 'a starter look: the oldest `published_at` of the live hosts publishing it'}
        updated_at: {type: string, format: date-time, description: 'a starter look: = created_at'}
        source: {$ref: '#/components/schemas/LibrarySource'}
        family: {type: [string, 'null'], pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: 'a starter look: its pack''s family (where it comes from; whether it fits is `fits`); own items: null (any family)'}
        loras: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/LookLora'}, description: 'a look''s LoRAs in order; always empty for an element'}
        needs: {type: array, uniqueItems: true, maxItems: 3, items: {$ref: '#/components/schemas/LibraryNeed'}, description: 'computed, in the order text, images, lora: non-empty text, at least one image, at least one LoRA'}
        from_take_id: {type: [string, 'null'], format: uuid, description: 'a look made with "Save as look": the take; from 1.31 a voice with a clip: the clip''s take (null once that take is deleted, though `voice.clip` keeps it; null for every other item)'}
        fits: {type: boolean, description: 'only with `GET /library?workflow=`: whether the item can be applied to that workflow now (contracts/README.md, Looks: fit)'}
        reason: {type: [string, 'null'], description: 'with `fits`: why not (`this workflow has no LoRA stack`, a voice: `voice Ryan is for qwen3-tts`); null when it fits'}
        voice: {$ref: '#/components/schemas/VoiceInfo', description: 'from 1.30, kind voice only (required then, absent otherwise)'}
        voice_id: {type: [string, 'null'], pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$', description: 'from 1.32, an element only (always sent for one, absent otherwise): the voice its @handle speaks in a dialogue script, one of the caller''s voices or a starter voice; null = none (always null for a location or prop, and on read once that voice is deleted or no live host publishes it)'}
      allOf:
        - if: {properties: {kind: {const: element}}, required: [kind]}
          then: {properties: {group: {enum: [character, location, prop]}, handle: {type: string}}}
          else: {not: {required: [voice_id]}}
        - if: {properties: {kind: {const: look}}, required: [kind]}
          then: {properties: {group: {enum: [film, camera, colour, lighting]}, handle: {type: 'null'}}}
        - if: {properties: {kind: {const: voice}}, required: [kind]}
          then: {required: [voice], properties: {group: {enum: [preset, cloned, designed]}, handle: {type: 'null'}, text: {const: ''}, images: {maxItems: 0}, loras: {maxItems: 0}, needs: {maxItems: 0}}}
          else: {not: {required: [voice]}}
    LibraryItemList:
      type: object
      required: [items]
      properties: {items: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/LibraryItem'}}}
    LibraryImageRef:
      type: object
      required: [take_id]
      additionalProperties: false
      properties:
        take_id: {type: string, format: uuid}
    LookLoraRef:
      type: object
      required: [lora, strength]
      additionalProperties: false
      properties:
        lora: {$ref: '#/components/schemas/LoraRef'}
        strength: {type: number, minimum: 0, maximum: 2, description: 'the strength the look applies it at (from 1.23 0..2)'}
    LibraryFromTake:
      type: object
      required: [take_id]
      additionalProperties: false
      description: '"Save as look": fill the fields the body leaves out from a take the caller made with a run (contracts/README.md, Looks: Save as look); from 1.31 "Save as voice" (`kind: voice`): the take, an audio take or a video with sound, is the voice''s clip (contracts/README.md, Voices: cloned voices)'
      properties:
        take_id: {type: string, format: uuid}
        in: {type: number, minimum: 0, maximum: 86400, description: 'from 1.31, a voice only: the clip''s start (snapped; default 0)'}
        out: {type: number, exclusiveMinimum: 0, maximum: 86400, description: 'from 1.31, a voice only: the clip''s end (snapped; default min(duration, 30))'}
        prompt: {type: boolean, default: true, description: 'when `text` is absent: copy the take''s `made_with.prompt` as typed with `@@` turned into `@` (trimmed, cut to 2000 code points)'}
        loras: {type: boolean, default: true, description: 'when `loras` is absent: copy the take''s `made_with.loras` the caller can use now, `{lora, strength}`, first per id, at most 4'}
    LibraryItemCreate:
      type: object
      required: [kind, group, name]
      additionalProperties: false
      description: 'an element needs `handle` and 1-4 `images`; a look has no `handle`, 0-4 images, 0-4 `loras`, and needs text, an image or a LoRA; from 1.30 a voice (group designed only) has no handle, text, images or LoRAs and needs `voice`; from 1.31 also group cloned, and `from_take` makes a voice of a take''s part (Save as voice)'
      properties:
        kind: {$ref: '#/components/schemas/LibraryKind'}
        group: {$ref: '#/components/schemas/LibraryGroup'}
        name: {type: string, maxLength: 200, description: 'trimmed; must then be 1-80 characters'}
        handle: {type: [string, 'null'], maxLength: 200, description: 'an element: a slug (LibraryItem.handle), unique per owner; the client proposes one from the name. A look: absent or null'}
        text: {type: string, maxLength: 4000, description: 'trimmed; must then be at most 2000 characters; missing = "" (a look with from_take: copied)'}
        images: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/LibraryImageRef'}, description: 'takes of the caller, images, distinct, in order (the first is the thumbnail): an element 1-4, a look 0-4; missing = []'}
        loras: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/LookLoraRef'}, description: 'a look only: 0-4 LoRAs the caller can use now, distinct; missing = [] (with from_take: copied)'}
        from_take: {$ref: '#/components/schemas/LibraryFromTake'}
        voice: {$ref: '#/components/schemas/VoiceDesign', description: 'from 1.30, a voice only (required then): its description, language and style; from 1.31 its clip and consent'}
        voice_id: {type: [string, 'null'], maxLength: 130, description: 'from 1.32, an element of group character only: its voice (`{voice_id}` of VoiceRef: an own voice''s UUID or a starter voice''s `<family>/<id>`); missing or null = none'}
      allOf:
        - if: {properties: {kind: {const: element}}, required: [kind]}
          then: {required: [handle, images], properties: {group: {enum: [character, location, prop]}, handle: {type: string}, loras: {maxItems: 0}}, not: {required: [from_take]}}
        - if: {properties: {kind: {const: look}}, required: [kind]}
          then: {properties: {group: {enum: [film, camera, colour, lighting]}, handle: {type: 'null'}}}
    LibraryItemUpdate:
      type: object
      required: [group, name, text, images, version]
      additionalProperties: false
      description: 'every field (checked like LibraryItemCreate for the item''s kind); an element also needs `handle`'
      properties:
        group: {$ref: '#/components/schemas/LibraryGroup'}
        name: {type: string, maxLength: 200}
        handle: {type: [string, 'null'], maxLength: 200}
        text: {type: string, maxLength: 4000}
        images: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/LibraryImageRef'}}
        loras: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/LookLoraRef'}, description: 'a look only; missing = []'}
        voice: {$ref: '#/components/schemas/VoiceDesign', description: 'from 1.30, a designed voice only (required then); from 1.31 any own voice (a cloned one: its clip and consent)'}
        voice_id: {type: [string, 'null'], maxLength: 130, description: 'from 1.32, a character element only; missing or null = none (PUT replaces it)'}
        version: {type: integer, minimum: 1, description: 'the version the edit started from (409 when stale)'}
    UploadCreate:
      type: object
      required: [filename, content_type, bytes]
      additionalProperties: false
      if: {properties: {content_type: {enum: [audio/wav, audio/mpeg, audio/mp4]}}, required: [content_type]}
      then: {required: [duration_s]}
      else: {not: {required: [duration_s]}}
      properties:
        filename: {type: string, minLength: 1, maxLength: 255, description: 'the file''s name; only its base name (without extension) is kept, as the title'}
        content_type: {type: string, enum: [image/png, image/jpeg, image/webp, audio/wav, audio/mpeg, audio/mp4], description: 'from 1.19 also WAV and MP3 (an audio take), from 1.38 m4a (AAC in MP4)'}
        bytes: {type: integer, minimum: 1, maximum: 52428800}
        duration_s: {type: number, exclusiveMinimum: 0, maximum: 600, description: 'audio only (required): its length as the browser decoded it; studio records it, the runner reads the file itself'}
    UploadLimits:
      type: object
      description: 'API 1.38 (contracts/README.md, Optimised uploads): what the web optimises an upload to'
      required: [image_max_side]
      additionalProperties: false
      properties:
        image_max_side: {type: integer, minimum: 1, maximum: 16384, description: 'the largest `max` of a `width` or `height` param on any node schema with a `Canvas` output (8192 with MiniMax H3 Image, 4096 with Qwen Image alone); 16384 (the upload cap) when no runner publishes one'}
    Upload:
      type: object
      required: [take_id, upload_url, content_type, bytes, expires_at]
      properties:
        take_id: {type: string, format: uuid, description: 'pass to /v1/studio/uploads/{take_id}/complete; becomes the take''s id'}
        upload_url: {type: string, description: 'signed single-use link: PUT the bytes here with exactly this Content-Type and Content-Length', examples: ['/files/u/7d1e.../uploads/9b2f....png?exp=1767225600&bytes=48213&ct=image%2Fpng&sig=ab12']}
        content_type: {type: string}
        bytes: {type: integer}
        expires_at: {type: string, format: date-time}

    # ---------------------------------------------------------- studio: LoRAs (contracts/README.md, LoRAs)
    LoraSource:
      type: string
      enum: [shared, mine]
      description: 'shared: a file on the GPU hosts (registry `<host>.<env>.loras`), usable by everyone; mine: the caller''s own upload'
    LoraState:
      type: string
      enum: [pending, ready, rejected]
      description: 'own LoRAs: pending (created, not completed), ready (checked and indexed), rejected (a check failed: `reason`); shared ones are always ready'
    LoraKeyStyle:
      type: string
      enum: [peft, kohya, comfyui]
      description: 'how the file names its tensors (detected, never configured; contracts/README.md, LoRA normaliser)'
    Lora:
      type: object
      description: |
        A LoRA in the library. Shared and own LoRAs have one shape; `hosts` is set only for shared ones, `reason` only
        for a rejected one. `rank`, `key_style`, `sha256` are null until an own LoRA is ready.
      required: [id, source, name, family, rank, size_bytes, key_style, licence, sha256, hosts, state, reason, thumb_url, created_at]
      properties:
        id: {type: string, pattern: '^([0-9a-f]{64}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$', description: 'shared: the file''s SHA-256; mine: a UUID'}
        source: {$ref: '#/components/schemas/LoraSource'}
        name: {type: string, minLength: 1, maxLength: 80}
        family: {type: string, description: 'the model family it fits (`qwen-image`), or `unknown` (it fits no family published now, or not checked yet)', examples: [qwen-image, unknown]}
        rank: {type: [integer, 'null'], minimum: 1, maximum: 4096, description: the largest A/B rank}
        size_bytes: {type: integer, minimum: 1}
        key_style: {oneOf: [{$ref: '#/components/schemas/LoraKeyStyle'}, {type: 'null'}]}
        licence: {type: [string, 'null'], maxLength: 200, description: 'from the file''s metadata (`modelspec.license`, else `license`); null when it names none'}
        sha256: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        hosts: {type: array, items: {type: string, pattern: '^[a-z0-9]{1,32}$'}, description: 'shared: the live hosts that have it (sorted); mine: [] (any host fetches it on first use)'}
        state: {$ref: '#/components/schemas/LoraState'}
        reason: {type: [string, 'null'], description: 'rejected: why (the complete call''s 422 detail); null otherwise'}
        thumb_url: {oneOf: [{$ref: '#/components/schemas/SignedUrl'}, {type: 'null'}], description: 'the thumbnail (Take.thumb_url, from 1.48) of the caller''s oldest take made with it; null when none'}
        created_at: {type: string, format: date-time, description: 'mine: the upload''s creation; shared: the file''s mtime (the oldest over its hosts)'}
        prefused: {type: string, minLength: 1, description: 'from 1.16, shared only: the title of a model a host publishes with this LoRA pre-fused into its weights (its file cannot be deleted: delete the model instead); absent otherwise'}
    LoraList:
      type: object
      required: [loras]
      properties:
        loras: {type: array, items: {$ref: '#/components/schemas/Lora'}}
        usage: {$ref: '#/components/schemas/LoraUsage'}
    LoraUsage:
      type: object
      required: [count, bytes, max_count, max_bytes]
      description: 'from 1.16: the caller''s own LoRAs against the quota, counted as the upload''s 409s count them (every state; pending and ready bytes plus deleted ones until the sweep), whatever the filters'
      properties:
        count: {type: integer, minimum: 0}
        bytes: {type: integer, minimum: 0}
        max_count: {type: integer, const: 50}
        max_bytes: {type: integer, const: 21474836480}
    LoraPatch:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 200, description: 'trimmed; must then be 1-80 characters'}
    LoraUploadCreate:
      type: object
      required: [filename, bytes]
      additionalProperties: false
      properties:
        filename: {type: string, minLength: 1, maxLength: 255, description: 'must end in .safetensors; the name without it becomes the LoRA''s name'}
        bytes: {type: integer, minimum: 1, maximum: 2147483648}
    LoraUpload:
      type: object
      required: [lora, upload_url, content_type, bytes, expires_at]
      properties:
        lora: {$ref: '#/components/schemas/Lora', description: 'state pending; pass its id to /v1/studio/loras/{lora_id}/complete'}
        upload_url: {type: string, description: 'signed single-use link: PUT the file here with exactly this Content-Type and Content-Length', examples: ['/files/u/7d1e.../loras/2c4e....safetensors?exp=1767225600&bytes=18874368&ct=application%2Foctet-stream&sig=ab12']}
        content_type: {type: string, const: application/octet-stream}
        bytes: {type: integer}
        expires_at: {type: string, format: date-time}

    # ---------------------------------------------------------- studio: batches
    BatchStatus:
      type: string
      enum: [queued, running, waiting, paused, done, failed, stopped]
      description: |
        queued: stored, the engine has not started it; running; waiting (API 1.7, computed by studio): the engine
        reports running but every row that has not ended is `waiting` on a gate (pick to continue); paused (`reason` says why: by you, three rows in a
        row failed with one error, or the engine restarted: press Resume); done: every row ended (some may have
        failed); failed: the engine could not run it at all (`reason`); stopped: by Stop. Set by pipelines_service
        events, except `queued`.
    BatchControl:
      type: string
      enum: [run, pause, stop]
      description: 'what the owner asked for last (Pause, Resume, Stop); `status` follows once the engine confirms. While `pause` or `paused`, the dispatcher holds the batch''s queued runs'
    BatchCounts:
      type: object
      required: [total, queued, running, succeeded, failed, cancelled]
      description: rows by `BatchRow.status`; queued, running, waiting, succeeded, failed and cancelled add up to total
      properties:
        total: {type: integer, minimum: 1, maximum: 500}
        queued: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        waiting: {type: integer, minimum: 0, description: 'rows parked on a gate ("waiting for a pick"); always sent from API 1.7, absent = 0'}
        succeeded: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        cancelled: {type: integer, minimum: 0}
    Batch:
      type: object
      required: [id, title, workflow_id, workflow_title, session_id, status, control, reason, counts, created_at, started_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200}
        workflow_id: {type: string}
        workflow_title: {type: string, description: the title in the batch's snapshot}
        session_id: {type: [string, 'null'], format: uuid, description: 'the session its runs are in; null after that session was deleted'}
        status: {$ref: '#/components/schemas/BatchStatus'}
        control: {$ref: '#/components/schemas/BatchControl'}
        reason: {type: [string, 'null'], description: 'why it is paused or failed; null otherwise'}
        counts: {$ref: '#/components/schemas/BatchCounts'}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time, description: 'the engine first reported running'}
        finished_at: {type: [string, 'null'], format: date-time, description: 'done, failed or stopped'}
        pipeline_id: {type: [string, 'null'], format: uuid, description: 'a batch of a pipeline: the pipeline (it may be deleted since); absent or null for a batch of one workflow, whose `workflow_*` then describe it. For a pipeline batch `workflow_id` / `workflow_title` are its first step''s'}
        pipeline_title: {type: [string, 'null'], description: 'with pipeline_id: the title in the batch''s snapshot'}
        pipeline_version: {type: [integer, 'null'], minimum: 1, description: 'with pipeline_id: the version it was submitted with'}
        collection: {type: [string, 'null'], description: 'with pipeline_id: the collection its output node names (the first output, by node id)'}
        bounds: {$ref: '#/components/schemas/PipelineBounds', description: 'from 1.14, a pipeline batch: its worst case per row at Submit'}
        models: {type: object, additionalProperties: {type: string}, description: 'from 1.14, a pipeline batch: judge, write and decide node id → the ask workflow it runs (resolved at Submit, in the snapshot)'}
        memory: {oneOf: [{$ref: '#/components/schemas/BatchMemory'}, {type: 'null'}], description: 'from 1.14, a pipeline batch: the memory snapshot it reads; null until pipelines took it'}
        again_of: {type: [string, 'null'], format: uuid, description: 'from 1.14: made by "Run again" of this batch'}
        same_decisions: {type: boolean, description: 'from 1.14, with again_of: it reuses that batch''s decisions'}
        egress: {type: array, items: {$ref: '#/components/schemas/PipelineEgress'}, description: 'from 1.15, a pipeline batch: what leaves the machine, as at Submit'}
        reserved: {type: array, items: {$ref: '#/components/schemas/PipelineReserved'}, description: 'from 1.15, a pipeline batch: local servers'' reserved memory'}
        director: {oneOf: [{$ref: '#/components/schemas/BatchDirector'}, {type: 'null'}], description: 'from 1.15: the batch''s director chat; null when its pipeline has no director'}
        remote: {oneOf: [{$ref: '#/components/schemas/BatchRemote'}, {type: 'null'}], description: 'from 1.15: remote calls so far against the caps; null when the pipeline''s remote is off'}
        timeline_id: {type: [string, 'null'], format: uuid, description: 'from 1.17: a sequence''s Re-render (`pipeline_id` null, `pipeline_title` "Re-render · <name>", `pipeline_version` = the revision); absent or null otherwise'}
    BatchDirector:
      type: object
      required: [node, state, wakes, max_wakes]
      properties:
        node: {type: string, description: the director agent node}
        state: {type: string, enum: [idle, waiting, thinking, 'off'], description: 'idle: asleep until a message or a row ends; waiting: its turn''s call is queued or held (Pause); thinking: a call or its tools run; off: the batch ended or max_wakes reached (POST …/chat is 409)'}
        wakes: {type: integer, minimum: 0}
        max_wakes: {type: integer, minimum: 1, maximum: 500}
    BatchRemote:
      type: object
      required: [calls, tokens, network_failures, max_calls, max_tokens]
      properties:
        calls: {type: integer, minimum: 0, description: requests sent (re-asks included; network retries not)}
        tokens: {type: integer, minimum: 0, description: tokens the providers reported}
        network_failures: {type: integer, minimum: 0, description: 'transport failures (retried); counted apart from answers and verdicts'}
        max_calls: {type: integer, minimum: 1}
        max_tokens: {type: integer, minimum: 1}
    BatchMemory:
      type: object
      required: [examples, notes, taken_at]
      properties:
        examples: {type: integer, minimum: 0}
        notes: {type: integer, minimum: 0}
        taken_at: {type: string, format: date-time}
    BatchAgain:
      type: object
      required: [decisions]
      additionalProperties: false
      properties:
        decisions: {type: string, enum: [same, again], description: 'same: reuse the source''s stored decisions where the inputs match; again: ask the models again'}
        title: {type: string, minLength: 1, maxLength: 200, description: 'absent = `<source title> again`'}
    BatchRowStatus:
      type: string
      enum: [queued, running, waiting, succeeded, failed, cancelled]
      description: 'a run''s statuses plus waiting: parked on a gate for a pick (pipeline batches only)'
    BatchRow:
      type: object
      required: [row, attempt, inputs, status, run_id, take_ids, thumb_url, error, started_at, finished_at]
      properties:
        row: {type: integer, minimum: 1, maximum: 500}
        attempt: {type: integer, minimum: 1, description: '1; +1 on every Retry'}
        inputs: {$ref: '#/components/schemas/RunInputs', description: 'what the row runs with: the base inputs, then its own values, then its seed (a pipeline batch: `<inputs node>.<input>` keys)'}
        looks: {$ref: '#/components/schemas/LookIds', description: 'a batch of one workflow: the row''s looks (its cell, else BatchCreate.looks); absent or empty = none'}
        status: {$ref: '#/components/schemas/BatchRowStatus', description: 'queued until its run starts (also while the run waits in the queue or is held), running while it runs, waiting while parked on a gate, then the row''s end'}
        run_id: {type: [string, 'null'], format: uuid, description: 'the current attempt''s run (a pipeline row: its latest run); null before it has one'}
        take_ids: {type: array, items: {type: string, format: uuid}, description: 'the current attempt''s takes (deleted ones left out); a pipeline row: the takes its output received, once it succeeded'}
        thumb_url: {oneOf: [{$ref: '#/components/schemas/SignedUrl'}, {type: 'null'}], description: 'the first take''s thumbnail (Take.thumb_url); null without one'}
        error: {type: [string, 'null'], description: 'set when failed'}
        started_at: {type: [string, 'null'], format: date-time, description: 'its run reported running'}
        finished_at: {type: [string, 'null'], format: date-time}
        node: {type: [string, 'null'], description: 'pipeline batches: the node the row is at now (parked on, or running); null when ended or not started'}
        parked: {oneOf: [{$ref: '#/components/schemas/BatchRowParked'}, {type: 'null'}], description: 'pipeline batches: set while status is waiting'}
        cells: {type: array, maxItems: 24, items: {$ref: '#/components/schemas/BatchCell'}, description: 'pipeline batches: the run table''s cells, one per node the row reached, in the order first reached; absent for a batch of one workflow'}
    BatchRowParked:
      type: object
      required: [gate, visit, keep, candidates]
      properties:
        gate: {type: string, description: 'the gate node id (from 1.14: or the judge''s)'}
        kind: {type: string, enum: [gate, judge], description: 'from 1.14; absent = gate'}
        suggested: {type: array, maxItems: 8, items: {type: string, format: uuid}, description: 'a judge: its pick, pre-selected ([] when no take passed)'}
        decision_id: {type: string, description: 'a judge: the decision shown (GET …/rows/{row}/decisions)'}
        visit: {type: integer, minimum: 1, description: 'which visit of the gate (1 + times its loop went round)'}
        keep: {type: integer, minimum: 1, maximum: 8, description: 'pick 1 to keep of the candidates'}
        candidates: {type: array, minItems: 1, maxItems: 8, items: {type: string, format: uuid}, description: 'the takes to pick from (the gate''s step''s latest takes)'}
    CellStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, waiting, picked, rejected]
      description: 'a step attempt: its runs'' state (queued while none of them has started); a gate attempt: waiting, picked or rejected; an output: succeeded. From 1.14 a judge: queued / running (its ask run), then picked, waiting (Suggest), rejected (verdict fail or all rejected) or failed (the call failed); write, decide: queued / running, then succeeded or failed; memory: succeeded'
    BatchCell:
      type: object
      required: [node, kind, attempts]
      properties:
        node: {type: string, description: the pipeline node id}
        kind: {type: string, enum: [step, gate, output, judge, write, decide, memory, agent, custom], description: 'judge, write, decide, memory from 1.14; agent, custom from 1.15'}
        attempts: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/BatchCellAttempt'}, description: 'one per visit (loop attempts stacked), oldest first'}
        loop:
          description: 'from 1.14, a judge with a branch or a decide: its capped loop for the cell''s "retried <turns> of <max>", "gave up → <then>"'
          type: object
          required: [turns, max, then, gave_up]
          properties:
            turns: {type: integer, minimum: 0, maximum: 10}
            max: {type: integer, minimum: 1, maximum: 10}
            then: {type: [string, 'null'], description: 'the node the cap sends the row to'}
            gave_up: {type: boolean}
    BatchCellAttempt:
      type: object
      required: [visit, status, run_ids, take_ids, seeds, seconds, error, thumb_url]
      properties:
        visit: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/CellStatus'}
        run_ids: {type: array, maxItems: 8, items: {type: string, format: uuid}, description: 'a step: its runs, by seed index'}
        take_ids: {type: array, maxItems: 8, items: {type: string, format: uuid}, description: 'a step: its takes; a gate: the picked ones; an output: what it received'}
        candidates: {type: array, maxItems: 8, items: {type: string, format: uuid}, description: 'a gate: the takes it offered'}
        seeds: {type: array, maxItems: 8, items: {type: integer, minimum: 0}, description: 'a step: the seed of each run, by seed index'}
        seconds: {type: [number, 'null'], minimum: 0, description: 'a step: the runs'' time on their hosts, summed (started to finished); null until one finished'}
        error: {type: [string, 'null']}
        thumb_url: {oneOf: [{$ref: '#/components/schemas/SignedUrl'}, {type: 'null'}], description: 'the first of take_ids (else candidates)'}
        decision_id: {type: string, description: 'from 1.14, judge, write, decide: the visit''s decision'}
        judged: {$ref: '#/components/schemas/CellJudged'}
        route: {type: object, required: [label, to], properties: {label: {type: string}, to: {type: string}}, description: 'from 1.14, a decide (from 1.15 an agent with routes): the route taken'}
        branch: {type: integer, minimum: 0, maximum: 23, description: 'from 1.15, a fanned-out step: one attempt per (visit, branch); branch = the item index'}
        agent:
          description: 'from 1.15, an agent attempt (`4 turns · 6 tools · 14 shots`)'
          type: object
          required: [turns, tool_calls, tokens, items, route]
          properties:
            turns: {type: integer, minimum: 0}
            tool_calls: {type: integer, minimum: 0}
            tokens: {type: integer, minimum: 0}
            items: {type: integer, minimum: 0, maximum: 24, description: 'its list''s length (0 without one)'}
            route: {type: [string, 'null']}
    CellJudged:
      type: object
      required: [verdict, picked, of, keep, first_failed, suggested, agreed, takes]
      description: 'from 1.14, a judge attempt (the run table''s judged cell: "picked 1 of 4", the first failed criterion; the attempts side by side with each take''s reason)'
      properties:
        verdict: {type: string, enum: [pass, fail]}
        picked: {type: integer, minimum: 0, maximum: 8}
        of: {type: integer, minimum: 1, maximum: 8}
        keep: {type: integer, minimum: 1, maximum: 8}
        first_failed: {type: [string, 'null'], description: 'the best take''s first false must; null when it passed'}
        suggested: {type: array, maxItems: 8, items: {type: string, format: uuid}}
        agreed: {type: [boolean, 'null'], description: 'Suggest: the user''s pick equalled the suggestion; null before a pick and in Auto'}
        takes:
          type: array
          maxItems: 8
          items:
            type: object
            required: [take_id, passes, first_failed, reason]
            properties:
              take_id: {type: string, format: uuid}
              passes: {type: boolean}
              first_failed: {type: [string, 'null']}
              reason: {type: string, maxLength: 300}
              checks: {type: array, maxItems: 12, items: {type: boolean}, description: 'every criterion''s answer, musts then nices (additive in 1.14: "all checks pass" only when every one is true; absent in rows recorded before)'}
    BatchPage:
      type: object
      required: [batches, next_cursor]
      properties:
        batches: {type: array, items: {$ref: '#/components/schemas/Batch'}}
        next_cursor: {type: [string, 'null'], description: 'pass as `cursor` for the next page; null on the last page'}
    BatchRowPage:
      type: object
      required: [rows, next_cursor]
      properties:
        rows: {type: array, items: {$ref: '#/components/schemas/BatchRow'}}
        next_cursor: {type: [string, 'null']}
    BatchLines:
      type: object
      required: [param, values]
      additionalProperties: false
      description: 'pasted lines: one row per value, set as `param` (a string, text or enum param; or an image param, or a rows param whose item has one Image field and no other required field: then each value is a take id and becomes `{take_id}`, or the one-item list `[{<field>: {take_id}}]`; else 422); clients drop blank lines. Gallery multi-select "Use in…" makes its batch this way'
      properties:
        param: {type: string, pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$', examples: [prompt.text]}
        values: {type: array, minItems: 1, maxItems: 500, items: {type: string}}
    BatchTable:
      type: object
      required: [columns, rows]
      additionalProperties: false
      description: 'a CSV parsed by the client or the CLI: each cell typed by its param (clients convert CSV text with node_schemas); a null cell leaves that input unset for the row (a seed: random)'
      properties:
        columns: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: '^([a-z][a-z0-9_]*\.[a-z][a-z0-9_]*|looks)$'}, description: 'param paths; `looks` (a batch of one workflow only) is the row''s looks: a cell is a list of look ids (null = BatchCreate.looks)'}
        rows: {type: array, minItems: 1, maxItems: 500, items: {type: array, items: {anyOf: [{$ref: '#/components/schemas/ParamValue'}, {$ref: '#/components/schemas/LookIds'}]}}, description: 'each as long as columns (else 422)'}
    BatchGrid:
      type: object
      required: [axes]
      additionalProperties: false
      description: 'rows = the cartesian product of the axes, the first axis varying slowest'
      properties:
        axes:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [param, values]
            additionalProperties: false
            properties:
              param: {type: string, pattern: '^([a-z][a-z0-9_]*\.[a-z][a-z0-9_]*|looks)$', description: 'a param path, or `looks` (a batch of one workflow only: each value a list of look ids, the row''s looks)'}
              values: {type: array, minItems: 1, maxItems: 500, items: {anyOf: [{$ref: '#/components/schemas/ParamValue'}, {$ref: '#/components/schemas/LookIds'}]}}
    BatchSeeds:
      type: object
      required: [count]
      additionalProperties: false
      description: |
        Repeat each row `count` times with consecutive seeds `start`, `start`+1, … in the workflow's one `seed`-type
        param (422 when it has none or several); these replace any value of it from `inputs` or the rows. Repeats sit
        next to each other (input row 1's repeats are rows 1..count).
      properties:
        count: {type: integer, minimum: 1, maximum: 8}
        start: {type: integer, minimum: 0, maximum: 9007199254740991, description: 'absent = drawn at random at Submit and stored'}
    BatchCreate:
      type: object
      required: [rows]
      additionalProperties: false
      description: 'exactly one of workflow_id (a batch of one workflow) or pipeline_id (a batch of a saved pipeline)'
      oneOf:
        - {required: [workflow_id]}
        - {required: [pipeline_id]}
      properties:
        workflow_id: {type: string}
        pipeline_id: {type: string, format: uuid, description: 'one of the caller''s pipelines; its inputs are the columns'}
        session_id: {type: string, format: uuid, description: 'absent = a new session titled like the batch'}
        title: {type: string, maxLength: 200, description: 'trimmed; empty or missing = "<workflow or pipeline title> × <row count>"'}
        inputs: {$ref: '#/components/schemas/RunInputs', description: 'base inputs for every row; missing = {}'}
        rows:
          description: exactly one of lines, table, grid
          oneOf:
            - {type: object, required: [lines], additionalProperties: false, properties: {lines: {$ref: '#/components/schemas/BatchLines'}}}
            - {type: object, required: [table], additionalProperties: false, properties: {table: {$ref: '#/components/schemas/BatchTable'}}}
            - {type: object, required: [grid], additionalProperties: false, properties: {grid: {$ref: '#/components/schemas/BatchGrid'}}}
        seeds: {$ref: '#/components/schemas/BatchSeeds'}
        looks: {$ref: '#/components/schemas/LookIds', description: 'a batch of one workflow: the looks of every row whose own `looks` cell (table column or grid axis `looks`) is absent or null; missing = []. A pipeline batch takes its looks from its steps (422 here)'}
    BatchEvent:
      description: 'one stored event of the batch: the whole batch, or one whole row'
      oneOf:
        - {$ref: '#/components/schemas/BatchStatusEvent'}
        - {$ref: '#/components/schemas/BatchRowEvent'}
        - {$ref: '#/components/schemas/BatchChatEvent'}
      discriminator:
        propertyName: type
        mapping:
          batch: '#/components/schemas/BatchStatusEvent'
          row: '#/components/schemas/BatchRowEvent'
          chat: '#/components/schemas/BatchChatEvent'
    BatchStatusEvent:
      type: object
      required: [seq, type, ts, data]
      properties:
        seq: {type: integer, minimum: 1, description: per-batch cursor}
        type: {type: string, const: batch}
        ts: {type: string, format: date-time}
        data: {$ref: '#/components/schemas/Batch'}
    BatchRowEvent:
      type: object
      required: [seq, type, ts, data]
      properties:
        seq: {type: integer, minimum: 1}
        type: {type: string, const: row}
        ts: {type: string, format: date-time}
        data: {$ref: '#/components/schemas/BatchRow'}
    BatchChatEvent:
      type: object
      required: [seq, type, ts, data]
      description: 'from 1.15: one new chat message (the user''s, the director''s or a notice); the director''s state rides on `batch` events (Batch.director)'
      properties:
        seq: {type: integer, minimum: 1}
        type: {type: string, const: chat}
        ts: {type: string, format: date-time}
        data: {$ref: '#/components/schemas/ChatMessage'}
    ChatMessage:
      type: object
      required: [id, role, text, at, wake, tool_calls, rows]
      description: 'from 1.15: one message of a batch''s director chat'
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, director, notice], description: 'notice: the director''s system line (a row it added or changed was rejected, with the reason; a cap ended its wake)'}
        text: {type: string, maxLength: 4000}
        at: {type: string, format: date-time}
        wake: {type: [integer, 'null'], minimum: 1, description: 'director and notice: the wake it came from; null for the user''s'}
        tool_calls: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/ToolCall'}, description: 'director: the wake''s tool calls'}
        rows: {type: array, maxItems: 64, items: {type: integer, minimum: 1, maximum: 500}, description: 'rows it added or changed in that wake'}
    ChatPage:
      type: object
      required: [batch_id, director, messages]
      properties:
        batch_id: {type: string, format: uuid}
        director: {$ref: '#/components/schemas/BatchDirector'}
        messages: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/ChatMessage'}, description: 'the newest 500, oldest first'}
    ChatPost:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 2000, description: 'trimmed; blank = 422'}
    BatchEventPage:
      type: object
      required: [events, last_seq]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/BatchEvent'}}
        last_seq: {type: integer, minimum: 0, description: next `since` (unchanged when the page is empty)}

    BatchRowRetry:
      type: object
      required: [from_step]
      additionalProperties: false
      properties:
        from_step: {type: integer, minimum: 1, maximum: 2000, description: 'a step number of the row''s current attempt (RowExecution.steps[].step)'}
    BatchPick:
      description: 'pick 1 to keep of the candidates, or reject them all'
      oneOf:
        - type: object
          required: [gate, take_ids]
          additionalProperties: false
          properties:
            gate: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
            take_ids: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string, format: uuid}}
            note: {$ref: '#/components/schemas/PickNote'}
        - type: object
          required: [gate, reject]
          additionalProperties: false
          properties:
            gate: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
            reject: {type: boolean, const: true}
            note: {$ref: '#/components/schemas/PickNote'}
    PickNote: {type: string, minLength: 1, maxLength: 2000, description: 'from 1.14, a judge pick only: why (kept as a judge example in the pipeline''s memory: how the judge learns your taste)'}
    ReviewCandidate:
      type: object
      required: [take_id, kind, url, thumb_url, width, height, seed]
      if: {properties: {kind: {const: video}}, required: [kind]}
      then: {required: [video]}
      properties:
        take_id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/TakeKind'}
        url: {$ref: '#/components/schemas/SignedUrl', description: 'the file: an image, or a video''s MP4'}
        thumb_url: {$ref: '#/components/schemas/SignedUrl', description: 'an image itself, a video''s poster; from 1.48 the take''s thumbnail (Take.thumb_url)'}
        video: {$ref: '#/components/schemas/VideoInfo', description: 'kind video only (absent for an image)'}
        width: {type: [integer, 'null']}
        height: {type: [integer, 'null']}
        seed: {type: [integer, 'null'], minimum: 0}
        judge:
          description: 'from 1.14, a row parked on a judge: this take''s verdict'
          type: object
          required: [passes, rank, checks, reason]
          properties:
            passes: {type: boolean}
            rank: {type: integer, minimum: 1, maximum: 8, description: 'its place in the judge''s order (1 = best)'}
            checks: {type: array, maxItems: 24, items: {$ref: '#/components/schemas/JudgeCheck'}}
            reason: {type: string, maxLength: 300}
    JudgeCheck:
      type: object
      required: [criterion, level, pass]
      properties:
        criterion: {type: string}
        level: {type: string, enum: [must, nice]}
        pass: {type: boolean}
    BatchReviewItem:
      type: object
      required: [row, attempt, inputs, gate, gate_title, visit, keep, on_reject, rejects_left, candidates]
      properties:
        row: {type: integer, minimum: 1, maximum: 500}
        attempt: {type: integer, minimum: 1}
        inputs: {$ref: '#/components/schemas/RunInputs'}
        gate: {type: string}
        gate_title: {type: [string, 'null'], description: 'the gate node''s title; null without one'}
        visit: {type: integer, minimum: 1}
        keep: {type: integer, minimum: 1, maximum: 8}
        on_reject: {type: string, enum: [retry, then, fail], description: 'what rejecting all does now: retry (the fail edge, loops left), then (cap reached: the branch''s then), fail (a plain edge: the row fails, `rejected at <gate>`)'}
        rejects_left: {type: integer, minimum: 0, description: 'fail-edge turns left before then (0 for a plain edge)'}
        candidates: {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/ReviewCandidate'}}
        kind: {type: string, enum: [gate, judge], description: 'from 1.14; absent = gate'}
        suggested: {type: array, maxItems: 8, items: {type: string, format: uuid}, description: 'a judge: pre-selected'}
        verdict: {type: string, enum: [pass, fail], description: 'a judge: its verdict (fail = it gave up: nothing passed)'}
        model: {type: string, description: 'a judge: the ask workflow''s title ("Ask Qwen Image (Qwen3-VL 8B)")'}
        decision_id: {type: string}
    BatchReview:
      type: object
      required: [batch_id, items]
      properties:
        batch_id: {type: string, format: uuid}
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/BatchReviewItem'}, description: 'every waiting row, by row number'}
    ExecutionPart:
      type: string
      enum: [inputs, submit, wait, gate, route, output, verdict, apply, memory, tools, custom]
      description: 'which graph node of the pipeline node ran: inputs (load the row), submit / wait (a step''s or, from 1.14, a judge''s, write''s or decide''s two halves: its runs), gate (parked for a pick: a gate, or a judge in Suggest), route (the pick or the verdict applied, the edge chosen; a decide''s route), output (the row ends); from 1.14 verdict (a judge''s answer checked and its decision derived), apply (a write''s text set), memory (a memory node read or wrote); from 1.15 an agent''s submit / wait / tools per turn (tools: that turn''s tool calls ran) and route (the visit ended), a custom node''s custom'
    ExecutionEdge:
      type: object
      required: [to, via]
      properties:
        to: {type: string}
        via: {type: string, enum: [next, pass, fail, then], description: 'next: a plain edge'}
    ExecutionStep:
      type: object
      required: [step, node, part, visit, what, changed, status, edge, loops, run_ids, take_ids, error, at, has_state]
      properties:
        step: {type: integer, minimum: 1, description: 'graph step number in the row''s attempt, from 1'}
        node: {type: string}
        part: {$ref: '#/components/schemas/ExecutionPart'}
        visit: {type: integer, minimum: 1}
        what: {type: string, description: 'what happened, in plain words (`Run queued for Qwen Image`, `Parked, then resumed with 4 takes`)'}
        changed: {type: array, items: {type: string}, description: 'the state that changed (`takes.still = 4`, `loops.review = 1`)'}
        status: {type: string, enum: [finished, resumed, current], description: 'finished; resumed after waiting (a run, a pick); current = where the row is now'}
        edge: {oneOf: [{$ref: '#/components/schemas/ExecutionEdge'}, {type: 'null'}], description: 'the edge it took when it left the node'}
        loops: {type: object, additionalProperties: {type: integer, minimum: 0}, description: 'gate (from 1.14: judge, decide) id → times its capped edge was taken, after this step'}
        run_ids: {type: array, items: {type: string, format: uuid}}
        take_ids: {type: array, items: {type: string, format: uuid}}
        error: {type: [string, 'null']}
        at: {type: string, format: date-time}
        has_state: {type: boolean, description: 'its checkpoint can be read (GET …/execution/{step}/state) and retried from'}
        decision: {$ref: '#/components/schemas/Decision', description: 'from 1.14, on the step that derived it (a judge''s verdict, a write''s apply, a decide''s route): the step details'}
        memory:
          description: 'from 1.14: memory items read from the batch''s snapshot and written for the next batches'
          type: object
          required: [read, wrote]
          properties:
            read: {type: array, items: {type: string, format: uuid}}
            wrote: {type: array, items: {type: string, format: uuid}}
        branch: {type: integer, minimum: 0, maximum: 23, description: 'from 1.15, a fanned-out step''s parts'}
        turn: {type: integer, minimum: 1, maximum: 16, description: 'from 1.15, an agent''s submit / wait / tools'}
        tool_calls: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/ToolCall'}, description: 'from 1.15, an agent''s tools part: its messages'' tool calls with results'}
    ToolCall:
      type: object
      required: [id, tool, args, result, error]
      description: 'from 1.15: one tool call an agent made, as run (messages tools.schema.json toolCall)'
      properties:
        id: {type: string}
        tool: {type: string, enum: [gallery_search, memory_read, memory_write, library_read, rows_add, rows_edit, route, set_items]}
        args: {type: object}
        result: {type: [object, 'null']}
        error: {type: [string, 'null']}
    Decision:
      type: object
      required: [id, batch_id, row, node, kind, visit, attempt, replayed, replayed_from, run_ids, workflow, model, template, prompt, seen, answers, tokens_in, tokens_out, seconds, memory_read, error, at]
      description: |
        From 1.14 (plan 16.7): one judge, write or decide visit, as pipelines recorded it (messages defs `decision`),
        with thumbnails as signed links. `judge` / `write` / `decide` hold the result for its kind (absent when
        `error` came first). The execution view's step details: a judge's checks with pass or fail, the thumbnails
        it saw, the model, what it read from memory; a write's text before and after; a decide's route.
      properties:
        id: {type: string, description: '<batch_id>:<row>:<attempt>:<node>:<visit>'}
        batch_id: {type: string, format: uuid}
        row: {type: integer, minimum: 1, maximum: 500}
        node: {type: string}
        kind: {type: string, enum: [judge, write, decide, agent], description: 'agent from 1.15'}
        visit: {type: integer, minimum: 1}
        attempt: {type: integer, minimum: 1}
        source:
          description: 'from 1.15: where the model ran (absent = local, an ask workflow)'
          type: object
          required: [kind]
          properties:
            kind: {type: string, enum: [local, server, remote]}
            workflow: {type: string}
            provider: {type: string}
            model: {type: string}
            host: {type: string}
        replayable: {type: boolean, description: 'from 1.15: false for a remote decision: Run again with the same decisions asks it again'}
        network_failures: {type: integer, minimum: 0, description: 'from 1.15, remote: transport failures retried in the visit (never verdicts)'}
        replayed: {type: boolean, description: 'reused a stored decision (Resume, Retry, Run again: same decisions); no model was asked'}
        replayed_from: {type: [string, 'null']}
        run_ids: {type: array, maxItems: 64, items: {type: string, format: uuid}, description: 'the ask runs (an agent: one per turn and re-ask; a remote call: none)'}
        workflow: {type: string, description: 'the ask workflow (from 1.15 `server-ask` for a local server, `remote` for a remote provider)'}
        workflow_title: {type: string, description: '"Ask Qwen Image (Qwen3-VL 8B)": what the panel shows as Model'}
        model:
          oneOf:
            - {type: object, required: [id, variant, precision], properties: {id: {type: [string, 'null']}, variant: {type: [string, 'null']}, precision: {type: [string, 'null']}}}
            - {type: 'null'}
        template: {type: string, examples: [judge/v1]}
        prompt: {type: string, maxLength: 32768}
        seen:
          type: array
          maxItems: 24
          items:
            type: object
            required: [take_id, frame, sha256, width, height, thumb_url]
            properties:
              take_id: {type: string, format: uuid}
              frame: {type: [integer, 'null'], minimum: 0}
              sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
              width: {type: integer}
              height: {type: integer}
              thumb_url: {$ref: '#/components/schemas/SignedUrl', description: 'the derived thumbnail the model saw'}
        answers: {type: array, maxItems: 64, items: {type: object, required: [text, error], properties: {text: {type: string, maxLength: 32768}, error: {type: [string, 'null']}}}}
        tokens_in: {type: integer, minimum: 0}
        tokens_out: {type: integer, minimum: 0}
        seconds: {type: number, minimum: 0}
        memory_read: {type: array, maxItems: 32, items: {type: string, format: uuid}}
        error: {type: [string, 'null']}
        at: {type: string, format: date-time}
        judge:
          type: object
          required: [criteria, keep, mode, takes, picked, verdict, first_failed]
          properties:
            criteria: {$ref: '#/components/schemas/PipelineCriteria'}
            keep: {type: integer, minimum: 1, maximum: 8}
            mode: {type: string, enum: [suggest, auto]}
            takes:
              type: array
              maxItems: 8
              items:
                type: object
                required: [take_id, checks, reason, passes, rank]
                properties:
                  take_id: {type: string, format: uuid}
                  checks: {type: array, maxItems: 24, items: {$ref: '#/components/schemas/JudgeCheck'}}
                  reason: {type: string, maxLength: 300}
                  passes: {type: boolean}
                  rank: {type: integer, minimum: 1, maximum: 8}
                  thumb_url: {oneOf: [{$ref: '#/components/schemas/SignedUrl'}, {type: 'null'}], description: 'the take''s own thumbnail; null once deleted'}
            picked: {type: array, maxItems: 8, items: {type: string, format: uuid}}
            verdict: {type: string, enum: [pass, fail]}
            first_failed: {type: [string, 'null']}
            agreed: {type: [boolean, 'null'], description: 'Suggest: the user''s pick equalled it; null before a pick and in Auto'}
            user_pick: {type: [array, 'null'], maxItems: 8, items: {type: string, format: uuid}, description: 'Suggest: what the user picked ([] = rejected all); null before a pick'}
        write:
          type: object
          required: [to, before, after, note]
          properties:
            to: {type: string, examples: [$prompt]}
            before: {type: string}
            after: {type: string}
            note: {type: string}
        decide:
          type: object
          required: [route, to, reason, forced]
          properties:
            route: {type: string}
            to: {type: string}
            reason: {type: string}
            forced: {type: boolean}
        agent:
          description: 'from 1.15, an agent visit: its messages and tool calls per turn, and how it ended'
          type: object
          required: [turns, route, items, say, stopped, tool_calls, tokens]
          properties:
            turns:
              type: array
              maxItems: 16
              items:
                type: object
                required: [turn, say, calls, tokens_in, tokens_out]
                properties:
                  turn: {type: integer, minimum: 1}
                  say: {type: string, maxLength: 4000}
                  calls: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/ToolCall'}}
                  tokens_in: {type: integer, minimum: 0}
                  tokens_out: {type: integer, minimum: 0}
            route: {type: [string, 'null']}
            to: {type: [string, 'null']}
            forced: {type: boolean}
            items: {type: array, maxItems: 24, items: {type: string}}
            say: {type: string, maxLength: 4000}
            stopped: {type: [string, 'null'], enum: [turns, tool_calls, tokens, remote_cap, null]}
            tool_calls: {type: integer, minimum: 0}
            tokens: {type: integer, minimum: 0}
    DecisionList:
      type: object
      required: [decisions]
      properties:
        decisions: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/Decision'}}
    MemoryItem:
      type: object
      required: [id, kind, pipeline_id, key, text, kept, rejected, agreed, source, created_at, updated_at]
      description: 'from 1.14: one item of a pipeline''s memory (plan 16.6): a judge example (a pick with a note at a judge) or a note (a memory write node''s, or typed here). `source` says where it came from'
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [judge_example, note]}
        pipeline_id: {type: string, format: uuid}
        key: {type: [string, 'null'], description: 'a note''s key; an example''s: its judge node id'}
        text: {type: string, maxLength: 2000}
        kept: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/TakeRef'}, description: 'an example: the takes picked (deleted ones left out)'}
        rejected: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/TakeRef'}}
        agreed: {type: [boolean, 'null']}
        source:
          type: object
          required: [kind, batch_id, row, node, visit]
          properties:
            kind: {type: string, enum: [pick, node, user]}
            batch_id: {type: [string, 'null'], format: uuid}
            row: {type: [integer, 'null'], minimum: 1, maximum: 500}
            node: {type: [string, 'null']}
            visit: {type: [integer, 'null'], minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MemoryList:
      type: object
      required: [pipeline_id, items, counts]
      properties:
        pipeline_id: {type: string, format: uuid}
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/MemoryItem'}}
        truncated: {type: boolean, description: 'From 1.14: older items were left out to keep pipelines'' reply under NATS max_payload (delete some to see them)'}
        counts: {type: object, required: [judge_example, note], properties: {judge_example: {type: integer, minimum: 0}, note: {type: integer, minimum: 0}}}
    JudgeTestCreate:
      type: object
      required: [node, take_ids]
      additionalProperties: false
      properties:
        node: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'a judge node of the saved pipeline'}
        take_ids: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string, format: uuid}, description: 'the caller''s image or video takes, in the order the judge sees them'}
    JudgeTest:
      type: object
      required: [id, pipeline_id, node, take_ids, status, run_id, verdict, first_failed, takes, error, created_at]
      properties:
        id: {type: string, format: uuid}
        pipeline_id: {type: string, format: uuid}
        node: {type: string}
        take_ids: {type: array, items: {type: string, format: uuid}}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled], description: 'the ask run''s; `failed` too when its answer fails the checks'}
        run_id: {type: [string, 'null'], format: uuid, description: 'the ask run (null once it is gone)'}
        verdict: {type: [string, 'null'], enum: [pass, fail, null], description: 'pass when at least `keep` takes pass every must; null until it succeeded'}
        first_failed: {type: [string, 'null'], description: 'the first must the best take fails'}
        takes:
          type: array
          maxItems: 8
          description: 'each take''s verdict, in the order given; [] until it succeeded'
          items:
            type: object
            required: [take_id, passes, rank, picked, reason, checks]
            properties:
              take_id: {type: string, format: uuid}
              passes: {type: boolean, description: every must holds}
              rank: {type: integer, minimum: 1, maximum: 8, description: '1 = best'}
              picked: {type: boolean, description: 'among the best `keep` that pass (what a batch would keep)'}
              reason: {type: string, maxLength: 300}
              checks: {type: array, items: {$ref: '#/components/schemas/JudgeCheck'}}
        error: {type: [string, 'null'], maxLength: 2000}
        created_at: {type: string, format: date-time}
    MemoryCreate:
      type: object
      required: [pipeline_id, text]
      additionalProperties: false
      properties:
        pipeline_id: {type: string, format: uuid}
        text: {type: string, minLength: 1, maxLength: 2000}
        key: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
    RowExecution:
      type: object
      required: [batch_id, row, attempt, attempts, status, current, pipeline, steps, nodes, edges, loops, retried_from]
      properties:
        batch_id: {type: string, format: uuid}
        row: {type: integer, minimum: 1, maximum: 500}
        attempt: {type: integer, minimum: 1, description: the attempt shown}
        attempts: {type: integer, minimum: 1, description: the row's current attempt}
        status: {$ref: '#/components/schemas/BatchRowStatus'}
        current: {type: [string, 'null'], description: 'the node the row is at now (highlighted); null when ended'}
        pipeline: {$ref: '#/components/schemas/PipelineDoc', description: 'the batch''s snapshot of the pipeline, to draw the graph'}
        steps: {type: array, maxItems: 2000, items: {$ref: '#/components/schemas/ExecutionStep'}, description: 'in order; a retried-from-step attempt starts with the earlier attempt''s steps it reused'}
        nodes: {type: object, additionalProperties: {type: object, required: [visits, status], properties: {visits: {type: integer, minimum: 1}, status: {$ref: '#/components/schemas/CellStatus'}}}, description: 'every node the row passed: visits and its last attempt''s status'}
        edges: {type: array, items: {type: object, required: [from, to, via, count], properties: {from: {type: string}, to: {type: string}, via: {type: string, enum: [next, pass, fail, then]}, count: {type: integer, minimum: 1}}}, description: 'the edges taken, with how many times'}
        loops: {type: object, additionalProperties: {type: integer, minimum: 0}, description: 'gate id → times its loop went round'}
        retried_from: {oneOf: [{type: object, required: [attempt, step], properties: {attempt: {type: integer, minimum: 1}, step: {type: integer, minimum: 1}}}, {type: 'null'}], description: 'this attempt re-ran the earlier attempt from that step'}
    RowState:
      type: object
      required: [row, attempt, step, node, state]
      properties:
        row: {type: integer, minimum: 1, maximum: 500}
        attempt: {type: integer, minimum: 1}
        step: {type: integer, minimum: 1}
        node: {type: string}
        state: {type: object, description: 'the thread''s state after the step, read-only plain JSON (row inputs, run and take ids, picks, loop counters; never media)'}

    # ---------------------------------------------------------- studio: model providers, custom nodes (1.15)
    ProviderKind: {type: string, enum: [server, remote, search], description: 'server: a local server you run (loopback or private address, or the Docker host: what host.docker.internal resolves to); remote: outside the machine (https; only when the deployment has remote models on); from 1.44 search: a web search provider for the assistant (https, `api` brave, `key_secret`; only with remote models on; never a model source)'}
    Provider:
      type: object
      required: [name, kind, api, base_url, models, default_model, enabled, timeout_s, created_at, updated_at]
      description: 'from 1.15: one model provider as the admin sees it. A remote provider''s key is never in the API: `key_secret` names a file under pipelines_service''s secrets directory'
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$'}
        kind: {$ref: '#/components/schemas/ProviderKind'}
        api: {type: string, enum: [openai, brave], description: 'openai: OpenAI-compatible /v1/chat/completions (ChatOpenAI(base_url=…)); from 1.44 brave: the Brave Search API (kind search only)'}
        title: {type: string, maxLength: 60, description: 'what users see (`Ollama on the Mac`); absent = name'}
        base_url: {type: string, maxLength: 300, examples: ['http://host.docker.internal:11434/v1', 'https://api.example.com/v1']}
        models: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'}, description: 'the models pipelines may name'}
        default_model: {type: string, description: 'one of models (`server:<name>` without a model)'}
        enabled: {type: boolean}
        timeout_s: {type: integer, minimum: 5, maximum: 600}
        host: {type: string, description: 'server: the GPU host whose memory it shares'}
        memory_gb: {type: number, minimum: 0.5, maximum: 1024, description: 'server: declared; the host reserves it while enabled'}
        key_secret: {type: string, description: 'remote: the secret file''s name; from 1.51 a server may have one too'}
        max_in_flight: {type: integer, minimum: 1, maximum: 8, description: 'remote: calls in flight at once (default 2)'}
        compat: {$ref: '#/components/schemas/ProviderCompat'}
        preset: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$', description: 'from 1.51: the preset it was filled from; from 1.53 it also names the thinking rules (contracts/providers/presets.json)'}
        thinking: {$ref: '#/components/schemas/ProviderThinking'}
        thinking_levels:
          type: object
          maxProperties: 16
          additionalProperties: {$ref: '#/components/schemas/ThinkingInfo'}
          description: 'from 1.53 (read only): what each saved model offers, for the models its preset''s rules cover (absent: no control). The form and the AI agents tab need no copy of the rules'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProviderPut:
      type: object
      required: [kind, base_url, models]
      additionalProperties: false
      description: 'create or replace a provider. server: http(s) base_url whose host is a loopback or private address, or what host.docker.internal resolves to there, or a name that resolves only to such (checked again at every call); `host` and `memory_gb` required. remote: https base_url, `key_secret` required, refused (409) unless the deployment has remote models on. From 1.44 search: like remote, with `api` brave and `models` [web]'
      properties:
        kind: {$ref: '#/components/schemas/ProviderKind'}
        api: {type: string, enum: [openai, brave], description: 'from 1.44: absent = openai; kind search needs brave, the others openai (422)'}
        title: {type: string, minLength: 1, maxLength: 60}
        base_url: {type: string, minLength: 8, maxLength: 300, pattern: '^https?://[^\s/?#@]+(/[^\s?#]*)?$'}
        models: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'}}
        default_model: {type: string, description: 'absent = the first of models'}
        enabled: {type: boolean, default: true}
        timeout_s: {type: integer, minimum: 5, maximum: 600, default: 120}
        host: {type: string, pattern: '^[a-z0-9]{1,32}$'}
        memory_gb: {type: number, minimum: 0.5, maximum: 1024}
        key_secret: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$', examples: [provider-openai], description: 'remote and search: required; from 1.51 a server may name one too (optional: llama-server --api-key)'}
        max_in_flight: {type: integer, minimum: 1, maximum: 8, default: 2}
        compat: {$ref: '#/components/schemas/ProviderCompat'}
        preset: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$', description: 'from 1.51: the preset the form was filled from; from 1.53 its thinking rules check `thinking` (an unknown preset has none)'}
        thinking: {$ref: '#/components/schemas/ProviderThinking'}
    ProviderThinking:
      type: object
      maxProperties: 16
      propertyNames: {pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'}
      additionalProperties: {$ref: '#/components/schemas/ThinkingLevel'}
      description: 'from 1.53 (plan 28): a thinking level per model. Each key is one of `models`, each level one its rule allows (else 422 naming the model; a model no rule covers is 422 too). Absent or {} = nothing sent: the provider''s own default. Studio resolves it into the batch snapshot (messages defs providerThinking)'
    ThinkingLevel: {type: string, enum: ['off', 'on', low, medium, high], description: 'from 1.53: off + on, or some of off, low, medium, high (our high is the provider''s high, never max)'}
    ThinkingInfo:
      type: object
      required: [levels]
      additionalProperties: false
      description: 'from 1.53: what one model offers: its levels (empty when it always thinks), `always` (thinks and cannot be set), `default` (what the provider uses when nothing is sent)'
      properties:
        levels: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/ThinkingLevel'}}
        always: {type: boolean}
        default: {$ref: '#/components/schemas/ThinkingLevel'}
    ThinkingRule:
      type: object
      required: [match]
      additionalProperties: false
      description: 'from 1.53: one rule of a preset (providers/presets.schema.json thinkingRule): `match` a regular expression on the model id; `levels` each level''s body fragment (messages defs thinkingFragment); or `always`'
      properties:
        match: {type: string, minLength: 1, maxLength: 120}
        levels:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              reasoning_effort: {type: string}
              thinking: {type: object}
              reasoning: {type: object}
              reasoning_format: {type: string, enum: [parsed, hidden]}
        default: {$ref: '#/components/schemas/ThinkingLevel'}
        always: {type: boolean, const: true}
    ProviderList:
      type: object
      required: [remote_enabled, providers]
      properties:
        remote_enabled: {type: boolean, description: 'the deployment''s remote switch (REMOTE_MODELS, off by default)'}
        providers: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/Provider'}}
    ProviderTest:
      type: object
      required: [ok, models, error, failure, seconds]
      properties:
        ok: {type: boolean}
        models: {type: array, maxItems: 1000, items: {type: string, maxLength: 128}, description: 'what its /models listed (from 1.51 the first 1000)'}
        answer: {type: [string, 'null'], description: 'with ?model=: its answer to a tiny prompt'}
        error: {type: [string, 'null']}
        failure: {type: [string, 'null'], enum: [network, answer, refused, 'off', null], description: 'network: unreachable, TLS, timeout, 5xx, 429; answer: a 4xx (401: the key) or not OpenAI-shaped; refused: the host rule; off: remote models are off'}
        seconds: {type: number, minimum: 0}
        thinking:
          type: object
          maxProperties: 1000
          additionalProperties: {$ref: '#/components/schemas/ThinkingInfo'}
          description: 'from 1.53: what each listed model offers (only the models a rule covers): from the preset''s rules, or for a preset whose thinking is "models" (OpenRouter) from the provider''s /models answer (its reasoning supported_efforts and mandatory)'
    ProviderCompat:
      type: object
      additionalProperties: false
      description: 'from 1.51: what a provider''s OpenAI layer refuses of what pipelines sends (messages defs providerCompat; from a preset, Anthropic''s). temperature false: none sent; strict_schema true: json_schema with strict true, never retried as json_object; from 1.55 headers: fixed extra headers on every call. Absent = the usual calls'
      properties:
        temperature: {type: boolean}
        strict_schema: {type: boolean}
        headers:
          type: object
          minProperties: 1
          maxProperties: 4
          description: 'from 1.55: fixed extra headers sent on every call to the provider (chat, Test, Fetch, the key check); only allow-listed safe names (never authorization, x-api-key, cookie, host): anthropic-version (Anthropic''s preset: 2023-06-01)'
          propertyNames: {enum: [anthropic-version]}
          additionalProperties: {type: string, pattern: '^[\x21-\x7e][\x20-\x7e]{0,99}$'}
    ProviderPreset:
      type: object
      required: [id, title, kind, base_url, models, docs, note]
      additionalProperties: false
      description: 'from 1.51: one item of contracts/providers/presets.json (its schema: providers/presets.schema.json). A remote preset names `key_secret` (its id), a server preset none and no models (Fetch fills them)'
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$', description: 'the provider name it fills'}
        title: {type: string, minLength: 1, maxLength: 60}
        kind: {type: string, enum: [server, remote]}
        base_url: {type: string, minLength: 8, maxLength: 300, pattern: '^https?://[^\s/?#@]+(/[^\s?#]*)?$'}
        models: {type: array, maxItems: 16, uniqueItems: true, items: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'}}
        key_secret: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$'}
        compat: {$ref: '#/components/schemas/ProviderCompat'}
        thinking:
          description: 'from 1.53: the thinking rules (the first whose match fits a model id gives its levels), or "models": the levels come from the provider''s /models (OpenRouter)'
          oneOf:
            - {type: string, const: models}
            - {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/ThinkingRule'}}
        docs: {type: string, pattern: '^https://', maxLength: 300}
        note: {type: string, minLength: 1, maxLength: 120}
    ProviderPresetList:
      type: object
      required: [remote_enabled, presets]
      additionalProperties: false
      properties:
        remote_enabled: {type: boolean, description: 'the deployment''s remote switch (remote presets are greyed while off)'}
        presets: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ProviderPreset'}}
    ProviderFetch:
      type: object
      additionalProperties: false
      description: 'from 1.51: a preset''s Fetch. Only the key file''s name: the URL always comes from the preset (a `base_url` here is 422)'
      properties:
        key_secret: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$', description: 'absent = the preset''s'}
    ProviderKey:
      type: object
      required: [key_secret, path, found, writable]
      additionalProperties: false
      description: 'from 1.51: a key file''s status (never the key)'
      properties:
        key_secret: {type: string}
        path: {type: string, examples: [deploy/secrets/providers/deepseek], description: 'where the admin puts it, as the deployment sees it'}
        found: {type: boolean, description: 'a regular file that is not empty'}
        writable: {type: boolean, description: 'from 1.52: the deployment lets the admin save keys here (pipelines'' first key folder is a writable directory); false: keys are set in files only'}
    ProviderKeySave:
      type: object
      required: [key]
      additionalProperties: false
      description: 'from 1.52 (plan 27): a key to check and save. Exactly one source: `preset` or `provider` (never a URL)'
      properties:
        key: {type: string, minLength: 1, maxLength: 1024, pattern: '^\s*[!-~]+\s*$', writeOnly: true, description: 'the key; trimmed, then 1-1024 printable ASCII characters only (0x21-0x7E, no spaces; anything else is 422 with a fixed text, never the key or the character). Never returned, logged or stored outside the key file'}
        preset: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$', description: 'check with this preset''s URL'}
        provider: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$', description: 'check with this saved provider''s URL'}
        force: {type: boolean, default: false, description: 'Save anyway: write without a check (check skipped)'}
      oneOf:
        - {required: [preset], not: {required: [provider]}}
        - {required: [provider], not: {required: [preset]}}
    ProviderKeySaved:
      type: object
      required: [key_secret, path, found, saved, check]
      additionalProperties: false
      description: 'from 1.52: the check''s verdict and the key file''s status after it (never the key)'
      properties:
        key_secret: {type: string}
        path: {type: string, examples: [deploy/secrets/providers/deepseek]}
        found: {type: boolean}
        saved: {type: boolean, description: 'written: true for check ok and skipped'}
        check: {enum: [ok, refused, unreachable, skipped], description: 'ok: /models answered; refused: 401 or 403; unreachable: anything else (network, timeout, 429, 5xx, another 4xx, the host rule, remote models off); skipped: force'}
        detail: {type: string, maxLength: 300, description: 'refused or unreachable: our own short text, never the provider''s'}
    SessionNames:
      type: object
      required: [mode, provider, model, local_available, remote_enabled, updated_at]
      description: 'from 1.43: how an untitled session is named (contracts/README.md, Sessions: titles and naming). Default off'
      properties:
        mode: {type: string, enum: ['off', local, remote], description: 'off; local: the llm pack (Qwen3.8 27B) on the local GPU queue, nothing leaves the machine; remote: a provider of Admin › Model providers, kind remote (sends the prompt out) or server (on this network)'}
        provider: {type: [string, 'null'], description: 'remote: the provider''s name; null otherwise'}
        model: {type: [string, 'null'], description: 'remote: one of its models; null otherwise'}
        local_available: {type: boolean, description: 'a live host can run llm-ask now (else Local is greyed: "Qwen3.8 27B not downloaded")'}
        remote_enabled: {type: boolean, description: 'the deployment''s remote switch'}
        updated_at: {type: [string, 'null'], format: date-time, description: 'null until first set'}
    SessionNamesPut:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: {type: string, enum: ['off', local, remote]}
        provider: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$', description: 'remote only, required there'}
        model: {type: string, maxLength: 128, description: 'remote only; absent = the provider''s default_model'}
    ModelSourceList:
      type: object
      required: [remote_enabled, sources]
      description: 'from 1.15: what a user may name as a model (the editor''s "Runs on"): enabled providers, redacted to names and models'
      properties:
        remote_enabled: {type: boolean}
        sources:
          type: array
          items:
            type: object
            required: [name, kind, title, models, default_model]
            additionalProperties: false
            properties:
              name: {type: string}
              kind: {type: string, enum: [server, remote], description: 'never search (1.44)'}
              title: {type: string}
              models: {type: array, items: {type: string}}
              default_model: {type: string}
              thinking: {type: object, additionalProperties: {$ref: '#/components/schemas/ThinkingLevel'}, description: 'from 1.53: the level set per model (absent: none set), shown where a model is picked'}
    # ---------------------------------------------------------- studio: the assistant (from 1.44; plan 18 22; the twins
    # of messages/assistant.schema.json are marked, check.py runs their fixtures against both)
    AssistantCallId: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[1-9][0-9]{0,5}:([0-9]|[12][0-9])$', description: '<thread_id>:<turn>:<n>'}
    AssistantClientId: {type: string, pattern: '^[A-Za-z0-9_-]{8,64}$', description: 'one drawer (a browser tab)'}
    AssistantScreen:
      type: object
      required: [route, ids, roles, as_of, hidden, actions, fields]
      additionalProperties: false
      description: 'twin of assistant.schema.json screen: the screen summary, built by the screen from values it already works out, sent with each message, fenced as data (at most 16 000 characters of JSON)'
      properties:
        route: {type: string, pattern: '^/[^\s]{0,199}$'}
        ids: {type: object, maxProperties: 16, propertyNames: {pattern: '^[a-z][a-z_]{0,31}$'}, additionalProperties: {type: string, maxLength: 80}}
        roles: {type: array, maxItems: 8, items: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}}
        as_of: {type: string, format: date-time}
        hidden: {type: boolean}
        actions: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, pattern: '^[a-z][A-Za-z0-9]{0,47}$'}, description: 'the screen actions registered now (tools/actions.json)'}
        fields: {type: object}
    AssistantAction:
      type: object
      required: [id, name, args]
      additionalProperties: false
      description: 'twin of assistant.schema.json action: one screen action for the tab to run'
      properties:
        id: {$ref: '#/components/schemas/AssistantCallId'}
        name: {type: string, pattern: '^[a-z][A-Za-z0-9]{0,47}$'}
        args: {type: object}
    AssistantLineText:
      type: object
      required: [text, undo]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 300}
        undo: {type: boolean}
    AssistantActionResult:
      type: object
      required: [id, status, line]
      additionalProperties: false
      description: 'twin of assistant.schema.json result: what one action did in the tab'
      properties:
        id: {$ref: '#/components/schemas/AssistantCallId'}
        status: {type: string, enum: [done, failed, did_not_run, cancelled, still_running]}
        line: {$ref: '#/components/schemas/AssistantLineText'}
        result: {type: object}
        error: {type: string, maxLength: 500}
    AssistantLine:
      type: object
      required: [id, status, text, undo]
      additionalProperties: false
      description: 'twin of assistant.schema.json line: one action line'
      properties:
        id: {$ref: '#/components/schemas/AssistantCallId'}
        status: {type: string, enum: [running, waiting, done, undone, did_not_run, failed, cancelled]}
        text: {type: string, minLength: 1, maxLength: 300}
        undo: {type: boolean}
        memory_id: {type: string, format: uuid}
        sources:
          type: array
          maxItems: 5
          items:
            type: object
            required: [title, url]
            additionalProperties: false
            properties: {title: {type: string, maxLength: 200}, url: {type: string, maxLength: 500}}
    AssistantCard:
      type: object
      required: [id, kind, title, rows, tags, state]
      additionalProperties: false
      description: 'twin of assistant.schema.json card: a card the server asks (look_at, web_search, forget); Yes or Not now is a message of kind answer'
      properties:
        id: {$ref: '#/components/schemas/AssistantCallId'}
        kind: {type: string, enum: [look, web_search, delete]}
        title: {type: string, minLength: 1, maxLength: 120}
        rows:
          type: array
          maxItems: 8
          items:
            type: object
            required: [label, value]
            additionalProperties: false
            properties: {label: {type: string, maxLength: 40}, value: {type: string, maxLength: 300}}
        note: {type: string, maxLength: 300}
        tags: {type: array, minItems: 1, maxItems: 3, items: {type: string, maxLength: 40}}
        take_ids: {type: array, maxItems: 8, items: {type: string, format: uuid}}
        state: {type: string, enum: [waiting, 'yes', not_now, cancelled]}
    AssistantCaps:
      type: object
      required: [model_calls, tool_calls, memory_writes]
      additionalProperties: false
      description: 'twin of assistant.schema.json caps: used by the current message'
      properties:
        model_calls: {type: integer, minimum: 0, maximum: 12}
        tool_calls: {type: integer, minimum: 0, maximum: 30}
        memory_writes: {type: integer, minimum: 0, maximum: 4}
    AssistantError:
      type: object
      required: [code, text]
      additionalProperties: false
      description: 'twin of assistant.schema.json error: why a turn ended early'
      properties:
        code: {type: string, enum: [cap_message, cap_day, cap_tokens, cap_look_at, answer, provider, 'off', internal]}
        text: {type: string, minLength: 1, maxLength: 500}
        resets_at: {type: string, format: date-time}
    AssistantLimits:
      type: object
      required: [model_calls_per_day, tokens_per_day, look_at_per_hour, messages_per_minute]
      additionalProperties: false
      description: 'twin of assistant.schema.json limits: the caps per user'
      properties:
        model_calls_per_day: {type: integer, minimum: 1, maximum: 100000, default: 200}
        tokens_per_day: {type: integer, minimum: 1000, maximum: 100000000, default: 2000000}
        look_at_per_hour: {type: integer, minimum: 0, maximum: 1000, default: 20}
        messages_per_minute: {type: integer, minimum: 1, maximum: 60, default: 6}
    AssistantStatus:
      type: object
      required: [enabled, provider, web_search, limits, thinks]
      additionalProperties: false
      description: 'what every user may know: on or off (the dock item is hidden when off), where the model runs, web search, the caps, whether the model thinks'
      properties:
        enabled: {type: boolean}
        provider:
          oneOf:
            - type: object
              required: [title, remote]
              additionalProperties: false
              properties:
                title: {type: string, description: '`DeepSeek`'}
                remote: {type: boolean, description: 'true: your messages leave this machine (the notice shows first)'}
            - {type: 'null'}
        web_search: {type: [string, 'null'], description: 'the search provider''s title when web search is on'}
        limits: {$ref: '#/components/schemas/AssistantLimits'}
        thinks: {type: boolean, description: 'API 1.54 (plan 29): the model thinks (its resolved thinking level is not off, or it always thinks); the drawer shows `Thinking… N s` while a model call runs. False when off or no provider'}
    AssistantPending:
      type: object
      required: [turn, actions, cards]
      additionalProperties: false
      description: 'what the parked turn waits on: actions for the tab `client_id` to run, cards (ids of card entries) to answer'
      properties:
        turn: {type: integer, minimum: 1}
        actions: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/AssistantAction'}}
        cards: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/AssistantCallId'}}
    AssistantThread:
      type: object
      required: [id, title, state, client_id, pending, caps, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, maxLength: 120, description: 'from the first message; `New chat` before'}
        state: {type: string, enum: [idle, working, waiting], description: 'working: the agent is thinking; waiting: parked on actions, cards or a run'}
        client_id: {oneOf: [{$ref: '#/components/schemas/AssistantClientId'}, {type: 'null'}], description: 'the tab that runs its actions; other tabs show it read-only with Continue here'}
        pending: {oneOf: [{$ref: '#/components/schemas/AssistantPending'}, {type: 'null'}]}
        caps: {$ref: '#/components/schemas/AssistantCaps'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AssistantThreadList:
      type: object
      required: [status, threads]
      properties:
        status: {$ref: '#/components/schemas/AssistantStatus'}
        threads: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AssistantThread'}}
    AssistantThreadCreate:
      type: object
      required: [client_id]
      additionalProperties: false
      properties:
        client_id: {$ref: '#/components/schemas/AssistantClientId'}
    AssistantEntry:
      type: object
      required: [id, turn, kind, at]
      description: 'one stored entry of a chat: your message, the assistant''s words, an action line, a card, a notice (the remote provider''s, an error)'
      properties:
        id: {type: string, format: uuid}
        turn: {type: integer, minimum: 1}
        kind: {type: string, enum: [user, assistant, line, card, notice]}
        at: {type: string, format: date-time}
        text: {type: string, maxLength: 4000, description: 'user, assistant, notice: shown as text, never HTML'}
        line: {$ref: '#/components/schemas/AssistantLine'}
        card: {$ref: '#/components/schemas/AssistantCard'}
        error: {$ref: '#/components/schemas/AssistantError'}
      allOf:
        - {if: {properties: {kind: {enum: [user, assistant]}}}, then: {required: [text]}}
        - {if: {properties: {kind: {const: line}}}, then: {required: [line]}}
        - {if: {properties: {kind: {const: card}}}, then: {required: [card]}}
    AssistantThreadDetail:
      allOf:
        - {$ref: '#/components/schemas/AssistantThread'}
        - type: object
          required: [entries]
          properties:
            entries: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AssistantEntry'}, description: 'the newest 200, oldest first'}
    AssistantPost:
      oneOf:
        - type: object
          required: [kind, client_id, text, screen]
          additionalProperties: false
          properties:
            kind: {const: message}
            client_id: {$ref: '#/components/schemas/AssistantClientId'}
            text: {type: string, minLength: 1, maxLength: 4000, description: 'trimmed; blank = 422'}
            screen: {$ref: '#/components/schemas/AssistantScreen'}
        - type: object
          required: [kind, client_id, turn, results]
          additionalProperties: false
          properties:
            kind: {const: results}
            client_id: {$ref: '#/components/schemas/AssistantClientId'}
            turn: {type: integer, minimum: 1}
            results: {type: array, minItems: 1, maxItems: 30, items: {$ref: '#/components/schemas/AssistantActionResult'}}
            screen: {$ref: '#/components/schemas/AssistantScreen', description: 'the screen as the actions left it (after a navigate, the new screen)'}
        - type: object
          required: [kind, client_id, card_id, answer]
          additionalProperties: false
          properties:
            kind: {const: answer}
            client_id: {$ref: '#/components/schemas/AssistantClientId'}
            card_id: {$ref: '#/components/schemas/AssistantCallId'}
            answer: {type: string, enum: ['yes', not_now]}
        - type: object
          required: [kind, client_id]
          additionalProperties: false
          properties:
            kind: {const: continue}
            client_id: {$ref: '#/components/schemas/AssistantClientId'}
    AssistantAccepted:
      type: object
      required: [thread, entry]
      properties:
        thread: {$ref: '#/components/schemas/AssistantThread'}
        entry: {oneOf: [{$ref: '#/components/schemas/AssistantEntry'}, {type: 'null'}], description: 'message: your stored message; otherwise null'}
    AssistantEvent:
      type: object
      required: [seq, type]
      properties:
        seq: {type: integer, minimum: 1}
        type: {type: string, enum: [entry, thread]}
        entry: {$ref: '#/components/schemas/AssistantEntry', description: 'type entry: a new or changed entry (same id replaces: a line going from running to done, a card answered)'}
        thread: {$ref: '#/components/schemas/AssistantThread', description: 'type thread: the chat''s state, tab and pending'}
      allOf:
        - {if: {properties: {type: {const: entry}}}, then: {required: [entry]}}
        - {if: {properties: {type: {const: thread}}}, then: {required: [thread]}}
    AssistantEventPage:
      type: object
      required: [events, last_seq]
      properties:
        events: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/AssistantEvent'}}
        last_seq: {type: integer, minimum: 0, description: next `since` (unchanged when the page is empty)}
    AssistantMemoryKind: {type: string, enum: [preference, project, worked, summary], description: 'the Memory list''s Likes, Projects, Worked, Chats'}
    AssistantMemoryItem:
      type: object
      required: [id, kind, text, thread, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/AssistantMemoryKind'}
        text: {type: string, minLength: 1, maxLength: 600}
        thread:
          description: 'the chat that saved it; null once it is deleted'
          oneOf:
            - type: object
              required: [id, title]
              properties: {id: {type: string, format: uuid}, title: {type: string, maxLength: 120}}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AssistantMemoryList:
      type: object
      required: [items, counts]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AssistantMemoryItem'}}
        counts:
          type: object
          required: [preference, project, worked, summary]
          properties:
            preference: {type: integer, minimum: 0}
            project: {type: integer, minimum: 0}
            worked: {type: integer, minimum: 0}
            summary: {type: integer, minimum: 0}
    AssistantMemoryPatch:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 500, description: 'trimmed; blank = 422'}
    AssistantSettings:
      type: object
      required: [enabled, provider, model, web_search, search_provider, limits, remote_enabled, updated_at]
      description: 'the admin''s assistant settings (Admin › AI agents)'
      properties:
        enabled: {type: boolean}
        provider: {type: [string, 'null'], description: 'a server or remote provider''s name'}
        model: {type: [string, 'null'], description: 'one of its models; null = its default_model'}
        web_search: {type: boolean, description: 'web search''s own egress switch (off by default)'}
        search_provider: {type: [string, 'null'], description: 'a provider of kind search'}
        limits: {$ref: '#/components/schemas/AssistantLimits'}
        remote_enabled: {type: boolean, description: 'the deployment''s switch (REMOTE_MODELS): a remote provider and web search need it'}
        updated_at: {type: [string, 'null'], format: date-time, description: 'null before the first PUT'}
    AssistantSettingsPut:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        provider: {type: [string, 'null'], pattern: '^[a-z][a-z0-9-]{0,31}$'}
        model: {type: [string, 'null'], pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'}
        web_search: {type: boolean, default: false}
        search_provider: {type: [string, 'null'], pattern: '^[a-z][a-z0-9-]{0,31}$'}
        limits: {$ref: '#/components/schemas/AssistantLimits', description: 'absent = unchanged'}
    CustomNode:
      type: object
      required: [name, title, help, input, output, network, version]
      description: 'from 1.15: a custom node a pack registered (registry key pipelines.engine.custom)'
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}/[a-z][a-z0-9-]{0,31}$'}
        title: {type: string}
        help: {type: string}
        input: {type: object, description: 'JSON schema of its input (an object; its properties are the fields)'}
        output: {type: object, description: 'JSON schema of its output'}
        network: {type: boolean, description: 'calls the network: needs the pipeline''s remote switch'}
        version: {type: string}
    CustomNodeList:
      type: object
      required: [nodes]
      properties:
        nodes: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/CustomNode'}}

    # ---------------------------------------------------------- studio: models and model jobs (1.16)
    Precision: {type: string, enum: [bf16, fp16, int8, int4, fp8, fp32], description: 'fp8 from 1.33: a community pre-quantized variant on NVIDIA hosts (stored float8 e4m3, a scale per row). fp32 from 1.20, components only: kept at its stored float32 (the MiniMax H3 Image VAE)'}
    ModelList:
      type: object
      required: [hosts, licences, models]
      properties:
        hosts: {type: array, items: {$ref: '#/components/schemas/ModelHost'}}
        licences: {type: array, items: {$ref: '#/components/schemas/Licence'}, description: 'every licence a listed variant names, each once (the text shown before a download)'}
        models: {type: array, items: {$ref: '#/components/schemas/Model'}}
    ModelHost:
      type: object
      required: [host, live, envs, models_root, free_bytes, total_bytes]
      properties:
        host: {type: string, pattern: '^[a-z0-9]{1,32}$'}
        live: {type: boolean, description: 'some hosts key of it is fresh (30 s); an offline host shows what it last published'}
        envs: {type: array, items: {type: string}, description: 'its envs with a present hosts key, by name'}
        models_root: {type: [string, 'null'], description: 'the models root (`~/GenAI/models`), from the freshest key''s `models_disk`; null when no key reports it'}
        free_bytes: {type: [integer, 'null'], minimum: 0, description: 'free space on the models root''s volume, from the same key'}
        total_bytes: {type: [integer, 'null'], minimum: 0}
        hub_token: {type: boolean, description: 'admins only: a Hub token file is present on the host (needed for a gated source); never the token'}
    Licence:
      type: object
      required: [id, title, url, text]
      properties:
        id: {type: string, examples: [apache-2.0]}
        title: {type: string}
        url: {type: [string, 'null']}
        text: {type: string, description: 'the full text; its UTF-8 SHA-256 is what a download''s job records as accepted'}
    Model:
      type: object
      required: [id, family, title, media, runtimes, variants, addons]
      properties:
        id: {type: string, examples: [qwen-image-2.1]}
        family: {type: string, examples: [qwen-image]}
        title: {type: string, examples: [Qwen Image 2.1]}
        media: {type: array, items: {type: string, enum: [image, video, audio]}, description: 'the board''s `image`, `video + audio`'}
        runtimes: {type: array, items: {type: object, required: [runtime, env], properties: {runtime: {type: string}, env: {type: string}, devices: {type: array, items: {type: string, enum: [cuda, mps, cpu]}, description: 'from 1.18: the devices it runs on (model.yaml `runtimes.<r>.devices`); absent = every device of that runtime'}}}, description: 'every runtime the pack has; only mlx or native (from 1.21: a pack whose stage runs a child process, the MiniMax H3 video model) = runs on Apple silicon only (the board''s `Mac only`)'}
        variants: {type: array, items: {$ref: '#/components/schemas/ModelVariant'}}
        addons: {type: array, items: {$ref: '#/components/schemas/ModelAddon'}, description: 'from 1.36: its optional add-ons (contracts/README.md, Optional add-ons), the freshest key''s order; empty for most models'}
    ModelAddon:
      type: object
      required: [component, title, dir, licence, gated, download_bytes, hosts]
      description: 'from 1.36: a part a few controls need, downloaded and deleted on its own (the Models screen''s "Optional add-ons"); every variant works without it. Descriptive fields from the freshest live key that publishes it, as a variant''s'
      properties:
        component: {type: string, examples: [enhancer], description: 'what a NodeSchema''s `addons` names; a model job''s `addon`'}
        title: {type: string, examples: [Enhancer]}
        short: {type: string, examples: [Enhancer], description: 'from 1.40: the name in the greyed controls'' and Run on''s `<short> not downloaded` (registry add-on `short`; Qwen Image''s Text enhancer and Edit enhancer are both `Enhancer`). Absent = `title`'}
        tag: {type: string, examples: [PE-T2I], description: 'from 1.40: the Models screen''s mono line beside the title (registry add-on `tag`). Absent = the component id'}
        refs: {type: boolean, description: 'from 1.40: the task whose runs need it (registry add-on `refs`, contracts/README.md Optional add-ons): true = only a run with references (an edit), false = only one without (text to image). Absent = both'}
        help: {type: string}
        dir: {type: [string, 'null'], description: 'its folder under each host''s models root'}
        variants: {type: array, items: {type: string}, description: 'from 1.40: the variants whose runs need it (the hosts'' models entries, contracts/README.md Optional add-ons); a run on another variant does not, and the form greys those variants'' rows instead of a control when the node always runs (Dev without the distilled LoRA). Absent = every variant'}
        licence:
          oneOf:
            - type: object
              required: [id, must_accept]
              properties: {id: {type: string}, must_accept: {type: boolean}}
            - type: 'null'
          description: 'its source''s licence; null = no download source'
        gated: {type: boolean}
        download_bytes: {type: [integer, 'null'], minimum: 1}
        hosts: {type: array, items: {$ref: '#/components/schemas/ModelVariantHost'}, description: 'every host whose models key lists the model with this add-on, by name: its state as a variant''s (`downloading` while its download job is open)'}
    ModelVariant:
      type: object
      required: [id, title, precisions, dir, licence, gated, download_bytes, components, hosts]
      properties:
        id: {type: string, examples: [turbo]}
        title: {type: string, examples: [Turbo]}
        help: {type: string, description: 'from 1.39: its line under the title in the model chip''s menu (registry variant `help`, from the freshest key publishing it; LTX''s Distilled `8 steps, about 10× faster`); absent = none'}
        precisions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Precision'}, description: 'what it loads at (one only: whatever the model node asks, studio''s RunsAt). With its components'' `stored` (from 1.34) a precision other than the stored dtype is made at load (`bf16 · int8 at load`) and a stored quantized dtype loads as it is (`fp8 · stored quantized`); without, first = as stored and the rest load-time quantizations'}
        devices: {type: array, items: {type: string, enum: [cuda, mps, cpu]}, description: 'from 1.34: the only devices it runs on (registry variant `devices`, from the freshest key publishing it; the board''s per-variant `NVIDIA only`); absent = every device of the model''s runtimes'}
        dir: {type: [string, 'null'], description: 'its folder under each host''s models root'}
        licence:
          oneOf:
            - type: object
              required: [id, must_accept]
              properties: {id: {type: string}, must_accept: {type: boolean}}
            - type: 'null'
          description: 'its source''s licence (an id of `licences`); null = no download source'
        gated: {type: boolean, description: 'the source needs a Hub token on the host'}
        download_bytes: {type: [integer, 'null'], minimum: 1, description: 'the expected size of its own files (source.bytes); null when unknown'}
        components:
          type: array
          items:
            type: object
            required: [component, from_variant, precisions, bytes]
            properties:
              component: {type: string, examples: [text_encoder]}
              from_variant: {type: string, description: 'the variant whose folder holds it: itself, or the owner of a shared component (the board''s `shared with Base`)'}
              precisions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Precision'}}
              stored: {type: string, enum: [bf16, fp16, fp32, fp8, int8], description: 'from 1.34: the dtype most of its weight bytes have on disk (registry component `stored`), from the freshest key that reports it; absent when no host does (its files on no disk, or a format that does not say: GGUF, packed 4-bit)'}
              bytes: {type: [integer, 'null'], minimum: 0, description: 'on disk, from the freshest key where it is present; null when on no host'}
        hosts: {type: array, items: {$ref: '#/components/schemas/ModelVariantHost'}}
    ModelVariantState:
      type: string
      enum: [present, partial, missing, downloading, mismatch]
      description: 'present: every file on disk, hashes as recorded; partial: some (resume with a download); missing: none of its own; downloading: a download job is queued or running (`job`); mismatch: files whose hash differs from the recorded one (`mismatch`; download again)'
    ModelVariantHost:
      type: object
      required: [host, state, bytes, job]
      properties:
        host: {type: string}
        state: {$ref: '#/components/schemas/ModelVariantState'}
        bytes: {type: [integer, 'null'], minimum: 0, description: 'its own files on that host''s disk (the board''s `On disk for this variant`); null when missing'}
        mismatch: {type: array, items: {type: string}, description: 'state mismatch: the files, relative to `dir`'}
        separate: {type: array, items: {type: string}, description: 'shared components this host keeps as the variant''s own copy because their hashes differ from the owner''s'}
        job:
          oneOf:
            - type: object
              required: [id, state, done_bytes, total_bytes]
              properties:
                id: {type: string, format: uuid}
                state: {type: string, enum: [queued, running]}
                done_bytes: {type: integer, minimum: 0}
                total_bytes: {type: [integer, 'null'], minimum: 0, description: 'null until the runner has listed the source'}
            - type: 'null'
          description: 'state downloading: its download job (the board''s `downloading · 62%` = done / total); null otherwise'
    ModelDownload:
      type: object
      required: [host]
      additionalProperties: false
      properties:
        host: {type: string, pattern: '^[a-z0-9]{1,32}$'}
        variant: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: 'absent = the model''s first variant'}
        addon: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'from 1.36: download this optional add-on (Model.addons[].component) instead of a variant; never with `variant`'}
        accept_licence: {type: boolean, description: 'true: the admin accepted the variant''s licence text as GET /v1/studio/models showed it; required when its must_accept is true'}
    ModelJobKind: {type: string, enum: [download, delete, lora_delete]}
    ModelJobState: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
    ModelJob:
      type: object
      required: [id, kind, host, env, model, variant, addon, lora_id, title, state, progress, failure, result, keeps, licence, requested_by, created_at, started_at, ended_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/ModelJobKind'}
        host: {type: string}
        env: {type: string, description: 'the runner env that does it (the one whose models or loras key lists the model or LoRA)'}
        model: {type: [string, 'null'], description: 'download, delete'}
        variant: {type: [string, 'null'], description: 'download: the variant; delete: null = every variant (or the add-on''s)'}
        addon: {type: [string, 'null'], description: 'from 1.36, download and delete: the optional add-on instead of a variant (`variant` null)'}
        lora_id: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'lora_delete'}
        title: {type: string, description: '`Qwen Image 2.1 · Turbo`, or the LoRA''s name', examples: ['Qwen Image 2.1 · Turbo']}
        state: {$ref: '#/components/schemas/ModelJobState'}
        progress:
          oneOf:
            - type: object
              required: [done_bytes, total_bytes, files_done, files_total, file, eta_s]
              properties:
                done_bytes: {type: integer, minimum: 0}
                total_bytes: {type: [integer, 'null'], minimum: 0}
                files_done: {type: integer, minimum: 0}
                files_total: {type: [integer, 'null'], minimum: 0}
                file: {type: [string, 'null']}
                eta_s: {type: [number, 'null'], minimum: 0}
            - type: 'null'
          description: 'a download''s latest evt.model.progress (kept after it ends); null before the first and for deletes'
        failure:
          oneOf:
            - type: object
              required: [class, detail]
              properties:
                class: {type: string, enum: [not_found, gated, licence, disk_full, hash_mismatch, network, in_use, not_downloadable, internal, host_lost], description: 'from 1.18 host_lost: the host stopped responding while the job was released (contracts/README.md, Several hosts: host loss)'}
                detail: {type: string}
            - type: 'null'
          description: 'failed: why (contracts/README.md, Model jobs: failures); null otherwise'
        result:
          oneOf:
            - type: object
              properties:
                bytes: {type: integer, minimum: 0}
                files: {type: integer, minimum: 0}
                freed_bytes: {type: integer, minimum: 0}
                reused: {type: array, items: {type: string}}
                separate: {type: array, items: {type: string}}
                kept: {type: array, items: {type: string}}
            - type: 'null'
          description: 'succeeded: evt.model.status `result`; null otherwise'
        keeps:
          type: array
          items:
            type: object
            required: [component, from_variant, for]
            properties:
              component: {type: string}
              from_variant: {type: string}
              for: {type: array, minItems: 1, items: {type: string}, description: 'the variants on the host that still load it'}
          description: 'delete: the shared components it leaves on disk, decided when it was queued; [] otherwise'
        licence:
          oneOf:
            - type: object
              required: [id, sha256]
              properties: {id: {type: string}, sha256: {type: string, pattern: '^[0-9a-f]{64}$'}}
            - type: 'null'
          description: 'download: the licence accepted and the SHA-256 of its text; null when none had to be'
        requested_by: {type: string, format: uuid, description: the admin's user id}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time, description: 'the first running status'}
        ended_at: {type: [string, 'null'], format: date-time}
    ModelJobList:
      type: object
      required: [jobs]
      properties: {jobs: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/ModelJob'}}}

    # ---------------------------------------------------------- studio: hosts admin (1.16)
    PinRef:
      type: object
      required: [env, component, model, variant, precision]
      additionalProperties: false
      description: 'one resident entry''s identity (registry `$defs/pin`): what a resident component of GET /v1/studio/hosts shows, with its entry''s env'
      properties:
        env: {type: string, pattern: '^[a-z0-9]{1,32}$'}
        component: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        model: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$'}
        variant: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
        precision: {$ref: '#/components/schemas/Precision'}
        compute: {type: string, enum: [float32, float16], description: 'from 1.39: the entry''s compute as GET /v1/studio/hosts shows it; absent = float32'}
        loras:
          type: array
          maxItems: 32
          description: 'a baked set, in order (lora_id and strength as the admin''s hosts view shows them); absent or empty = the plain component'
          items:
            type: object
            required: [lora_id, strength]
            additionalProperties: false
            properties:
              lora_id: {type: string, pattern: '^([0-9a-f]{64}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'}
              strength: {type: number}
    AfterRun:
      type: string
      enum: [unload, keep_warm, keep_pinned]
      description: 'what stays loaded once a run ends: unload = nothing (the board''s `Unload everything`); keep_warm = everything until memory is needed or the idle timeout passes (the default); keep_pinned = only the pins'
    HostSettingsPut:
      type: object
      required: [after_run, idle_unload_min, reserve_gb]
      additionalProperties: false
      properties:
        after_run: {$ref: '#/components/schemas/AfterRun'}
        idle_unload_min: {type: integer, minimum: 0, maximum: 1440, description: 'keep_warm: minutes idle before everything but the pins is unloaded; 0 = never'}
        reserve_gb: {type: number, minimum: 0, maximum: 1024, multipleOf: 0.5, description: 'the host''s budget is its RAM (on cuda: its VRAM) minus this'}
    HostPins:
      type: object
      required: [pins]
      additionalProperties: false
      properties: {pins: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/PinRef'}}}
    HostSettings:
      type: object
      required: [host, version, after_run, idle_unload_min, reserve_gb, pins, applied, updated_at]
      properties:
        host: {type: string}
        version: {type: integer, minimum: 1}
        after_run: {$ref: '#/components/schemas/AfterRun'}
        idle_unload_min: {type: integer, minimum: 0, maximum: 1440}
        reserve_gb: {type: number, minimum: 0}
        pins: {type: array, items: {$ref: '#/components/schemas/PinRef'}}
        applied: {type: boolean, description: 'every fresh hosts key of the host (but a local server''s `server` env, which holds no weights) reports `policy.settings_version` = version'}
        updated_at: {type: string, format: date-time}
    HostUnload:
      type: object
      additionalProperties: false
      description: 'exactly one of: `all` (the board''s Unload all), `entries` (a component''s ×), `cached_env` (Cached handles ×)'
      oneOf:
        - {required: [all]}
        - {required: [entries]}
        - {required: [cached_env]}
      properties:
        all: {type: boolean, const: true}
        entries: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/PinRef'}}
        cached_env: {type: string, pattern: '^[a-z0-9]{1,32}$'}
    HostUnloadAccepted:
      type: object
      required: [host, requests]
      properties:
        host: {type: string}
        requests:
          type: array
          items:
            type: object
            required: [env, state]
            properties:
              env: {type: string}
              state: {type: string, enum: [asked, after_run], description: 'asked: sent now; after_run: the env is busy and is asked when its run ends'}

    # ---------------------------------------------------------- studio: import (1.16)
    ImportTakeCreate:
      type: object
      required: [owner_id, key, kind, filename, content_type, bytes, width, height, created_at, starred, title, legacy, parents]
      additionalProperties: false
      if: {properties: {kind: {const: video}}, required: [kind]}
      then: {required: [video], properties: {content_type: {const: video/mp4}}}
      else: {not: {required: [video]}, properties: {content_type: {enum: [image/png, image/jpeg, image/webp]}, bytes: {maximum: 52428800}}}
      properties:
        owner_id: {type: string, format: uuid, description: 'the user whose gallery receives it (the CLI resolves `--user <email>` with GET /auth/admin/users)'}
        key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$', description: 'the idempotency key: stable for one old item across runs (the CLI''s choice: contracts/README.md, Import)'}
        kind: {type: string, enum: [image, video]}
        filename: {type: string, minLength: 1, maxLength: 255, description: 'the old file''s name, for logs'}
        content_type: {type: string, enum: [image/png, image/jpeg, image/webp, video/mp4]}
        bytes: {type: integer, minimum: 1, maximum: 2147483648, description: 'an image at most 50 MB, a video at most 2 GB'}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time, description: 'the old item''s creation time: the take''s created_at (its place in the gallery)'}
        starred: {type: boolean}
        title: {type: string, minLength: 1, maxLength: 200}
        legacy: {type: object, description: 'the read-only legacy settings snapshot (at most 65536 bytes as compact JSON): contracts/README.md, Import'}
        parents: {type: array, maxItems: 64, items: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'}, description: 'keys of the imported items it was made from, in input order (lineage)'}
        video:
          type: object
          required: [duration_s, fps, frames, has_audio, poster]
          additionalProperties: false
          properties:
            duration_s: {type: number, exclusiveMinimum: 0}
            fps: {type: number, exclusiveMinimum: 0}
            frames: {type: integer, minimum: 1}
            has_audio: {type: boolean}
            poster:
              type: object
              required: [content_type, bytes, width, height]
              additionalProperties: false
              properties:
                content_type: {type: string, enum: [image/png, image/jpeg, image/webp]}
                bytes: {type: integer, minimum: 1, maximum: 52428800}
                width: {type: integer, minimum: 1}
                height: {type: integer, minimum: 1}
    ImportTake:
      type: object
      required: [take_id, key, state, upload_url, poster_upload_url, expires_at]
      properties:
        take_id: {type: string, format: uuid}
        key: {type: string}
        state: {type: string, enum: [pending, ready]}
        upload_url: {type: [string, 'null'], description: 'pending: the signed PUT link for the file (exactly its content_type and bytes); ready: null'}
        poster_upload_url: {type: [string, 'null'], description: 'pending video: the poster''s link; null otherwise'}
        expires_at: {type: [string, 'null'], format: date-time, description: 'pending: when the links expire'}
    LegacyInfo:
      type: object
      required: [settings, imported_at]
      description: 'a take imported from the old helmstudio: the read-only snapshot of its settings there (never editable; reuse is refused as for an upload)'
      properties:
        settings: {type: object}
        imported_at: {type: string, format: date-time}

    # ---------------------------------------------------------- studio: timelines (API 1.17; contracts/README.md, Timeline)
    TimelineTarget:
      type: object
      required: [width, height, fps, sample_rate]
      additionalProperties: false
      description: 'the sequence''s geometry and rates; the codec is the export''s (H.264 + AAC in MP4)'
      properties:
        width: {type: integer, minimum: 16, maximum: 4096, multipleOf: 2}
        height: {type: integer, minimum: 16, maximum: 4096, multipleOf: 2}
        fps: {type: number, enum: [23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60], description: 'one of the rate table (exact rates 24000/1001, 30000/1001, 60000/1001 for the NTSC ones)'}
        sample_rate: {type: integer, enum: [44100, 48000]}
    TimelineSeconds: {type: number, minimum: 0, maximum: 86400, description: 'seconds, snapped by studio onto the frame grid (an audio track''s in/out: the sample grid); contracts/README.md, Timeline rules: time'}
    TimelineDissolve:
      type: object
      required: [type, frames]
      additionalProperties: false
      properties:
        type: {type: string, const: dissolve}
        frames: {type: integer, minimum: 2, maximum: 240, multipleOf: 2, description: 'centred on the cut: half before it, half after'}
    TimelineShotRef:
      description: 'a generation filling this slot (made by studio only; a write keeps it or drops it): a New shot''s run, or a Re-render batch''s step. In answers it adds `status` and, failed, `error`'
      type: object
      oneOf:
        - {required: [run_id]}
        - {required: [batch_id, step]}
      properties:
        run_id: {type: string, format: uuid}
        batch_id: {type: string, format: uuid}
        step: {type: string, pattern: '^clip_[a-z0-9]{1,16}$', description: 'the re-render pipeline''s step for this clip'}
        status: {type: string, enum: [queued, running, failed], description: 'answers only: the run''s, or the batch step''s (a cancelled or succeeded one is gone from the document)'}
        error: {type: [string, 'null'], description: 'answers only, failed: the run''s error'}
    TimelineClipId: {type: string, pattern: '^[a-z0-9]{1,16}$', description: 'a slot''s id, stable across edits and revisions; the editor makes new ones (unique in the document)'}
    TimelineClip:
      type: object
      required: [id, take_id]
      additionalProperties: false
      description: 'a slot: a take (video: in/out; image: hold; from 1.32 an audio take on an audio track: in/out), or an empty slot (`take_id` null, `hold`): black and silence; on an audio track only a New line''s placeholder (with `shot`, from 1.32)'
      properties:
        id: {$ref: '#/components/schemas/TimelineClipId'}
        take_id: {type: [string, 'null'], format: uuid}
        in: {$ref: '#/components/schemas/TimelineSeconds', description: 'a video take: the source time it starts at (default 0)'}
        out: {$ref: '#/components/schemas/TimelineSeconds', description: 'a video take: the source time it ends at (default its length)'}
        hold: {type: number, exclusiveMinimum: 0, maximum: 3600, description: 'an image take or an empty slot: its length in seconds; from 1.32 also a New line''s placeholder on an audio track (`take_id` null, `at`, `shot`)'}
        at: {$ref: '#/components/schemas/TimelineSeconds', description: 'an audio track: where it starts on the sequence (required there); V1: computed, ignored in a write'}
        gain_db: {type: number, minimum: -60, maximum: 12, default: 0}
        mute: {type: boolean, default: false, description: 'V1: the clip''s own sound is off'}
        transition_in: {$ref: '#/components/schemas/TimelineDissolve'}
        alternatives: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, format: uuid}, description: 'the takes made for this slot, oldest first; the current `take_id` is among them (studio adds it). Replace picks one'}
        shot: {$ref: '#/components/schemas/TimelineShotRef'}
        number: {type: integer, minimum: 1, description: 'From 1.29, V1 only: the shot number ("Shot 4"), given by studio when the clip is added (the highest so far + 1) and kept when it moves; a write cannot change a stored clip''s. contracts/README.md, Timeline rules: shot numbers'}
        offline: {type: boolean, description: 'answers only, true when the take is deleted or gone: the clip keeps its place and length, plays as offline and blocks an export'}
        link: {$ref: '#/components/schemas/TimelineClipId', description: 'From 1.50, an audio-track clip only: the V1 clip it is linked to (its sound clip: it follows that clip''s ripples, goes when it goes and is cut with it; contracts/README.md, Timeline rules: linked clips)'}
    TimelineMarkerColor: {type: string, enum: [red, orange, yellow, green, blue, purple], description: 'a marker''s colour, drawn with the theme''s own shade'}
    TimelineMarker:
      type: object
      required: [id, at]
      additionalProperties: false
      description: 'From 1.50: a named point on the sequence (snapped to frames; drawn on the ruler, a snap target)'
      properties:
        id: {$ref: '#/components/schemas/TimelineClipId', description: 'unique among the markers'}
        at: {$ref: '#/components/schemas/TimelineSeconds', description: 'sequence seconds; with V1 clips never past the end (`marker_past_end`)'}
        name: {type: string, minLength: 1, maxLength: 80}
        color: {$ref: '#/components/schemas/TimelineMarkerColor'}
    TimelineTrackKind: {type: string, enum: [video, audio]}
    TimelineTrack:
      type: object
      required: [kind, clips]
      additionalProperties: false
      properties:
        name: {type: string, pattern: '^(V1|A[2-9])$', description: 'answers only (ignored in a write): V1, then A2…A9 by position (A1 is V1''s own sound, drawn under it)'}
        kind: {$ref: '#/components/schemas/TimelineTrackKind'}
        gain_db: {type: number, minimum: -60, maximum: 12, default: 0}
        mute: {type: boolean, default: false}
        clips: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/TimelineClip'}}
    TimelineDoc:
      type: object
      required: [target, tracks]
      description: 'the editable document: exactly one video track first (V1), then up to 8 audio tracks'
      properties:
        target: {$ref: '#/components/schemas/TimelineTarget'}
        tracks: {type: array, minItems: 1, maxItems: 9, items: {$ref: '#/components/schemas/TimelineTrack'}}
        markers: {type: array, items: {$ref: '#/components/schemas/TimelineMarker'}, description: 'From 1.50: at most 200 (`too_many_markers`); absent = none; answers sort them by time, then id, and leave the list out when empty'}
    TimelineNormalized:
      allOf: [{$ref: '#/components/schemas/TimelineDoc'}]
      type: object
      required: [target, tracks, duration_s, frames]
      description: 'a document as studio stores and answers it: names, V1 `at`, defaults filled, every time snapped'
      properties:
        duration_s: {type: number, minimum: 0, description: '`frames` in seconds'}
        frames: {type: integer, minimum: 0, description: 'the sequence''s length: V1''s end (no V1 clip: the last sound''s)'}
    TimelineDefaults:
      type: object
      additionalProperties: false
      description: 'what New shot''s composer starts with: the cast (elements, offered as mentions and typed into an empty prompt) and the looks (sent as RunRequest.looks)'
      properties:
        cast: {type: array, maxItems: 16, uniqueItems: true, items: {type: string, format: uuid}, description: 'library elements of the caller; one deleted since is left out of answers'}
        looks: {$ref: '#/components/schemas/LookIds'}
    TimelineCreate:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 80, description: 'trimmed; empty or missing = "Untitled sequence"'}
        target: {type: object, additionalProperties: false, description: 'any field left out comes from the first take', properties: {width: {$ref: '#/components/schemas/TimelineTarget/properties/width'}, height: {$ref: '#/components/schemas/TimelineTarget/properties/height'}, fps: {$ref: '#/components/schemas/TimelineTarget/properties/fps'}, sample_rate: {$ref: '#/components/schemas/TimelineTarget/properties/sample_rate'}}}
        take_ids: {type: array, maxItems: 100, items: {type: string, format: uuid}, description: 'clips to start with, in order (the gallery''s multi-selection)'}
        defaults: {$ref: '#/components/schemas/TimelineDefaults'}
    TimelineUpdate:
      type: object
      required: [revision, target, tracks]
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 1, description: 'the revision the edit was made on'}
        target: {$ref: '#/components/schemas/TimelineTarget'}
        tracks: {$ref: '#/components/schemas/TimelineDoc/properties/tracks'}
        markers: {$ref: '#/components/schemas/TimelineDoc/properties/markers', description: 'From 1.50: the whole list (absent = none)'}
    TimelinePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: 'trimmed; blank = 422'}
        defaults: {$ref: '#/components/schemas/TimelineDefaults'}
    TimelineRevision:
      type: object
      required: [revision]
      additionalProperties: false
      properties: {revision: {type: integer, minimum: 1, description: 'the current revision, as the editor has it'}}
    TimelineAddClips:
      type: object
      required: [take_ids]
      additionalProperties: false
      properties:
        take_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}, description: in order}
        track: {type: string, pattern: '^(V1|A[2-9])$', default: V1}
    TimelineTake:
      type: object
      description: 'a take the document names (a clip''s or an alternative), signed for the editor and the preview'
      required: [id, kind, source, title, url, thumb_url, width, height, seed, workflow_id, workflow_title]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/TakeKind'}
        source: {$ref: '#/components/schemas/TakeSource'}
        title: {type: string, maxLength: 200}
        url: {$ref: '#/components/schemas/SignedUrl'}
        thumb_url: {$ref: '#/components/schemas/SignedUrl', description: 'from 1.48 the take''s thumbnail (Take.thumb_url)'}
        width: {type: [integer, 'null'], minimum: 1}
        height: {type: [integer, 'null'], minimum: 1}
        video: {$ref: '#/components/schemas/VideoInfo'}
        audio: {$ref: '#/components/schemas/AudioInfo', description: 'from 1.32, kind audio only: its length, rate and a dialogue''s cues (ticks on the clip)'}
        seed: {type: [integer, 'null'], minimum: 0, description: '`made_with.seed` (the board''s "seed 42"); null without one'}
        workflow_id: {type: [string, 'null'], description: '`made_with.workflow_id`; null for an upload, import, frame or export (no "from this clip", no re-render)'}
        workflow_title: {type: [string, 'null']}
    TimelineProblem:
      type: object
      required: [code, track, clip, message]
      properties:
        code: {type: string, description: 'contracts/README.md, Timeline rules (a code may be added in a minor version)', examples: [dissolve_handles]}
        track: {type: [string, 'null'], examples: [V1]}
        clip: {oneOf: [{$ref: '#/components/schemas/TimelineClipId'}, {type: 'null'}]}
        message: {type: string}
    TimelineError:
      type: object
      required: [detail]
      properties:
        detail: {type: string, description: '`timeline has <n> problems: <first message>`, or why the body does not fit'}
        problems: {type: array, items: {$ref: '#/components/schemas/TimelineProblem'}}
    Timeline:
      allOf: [{$ref: '#/components/schemas/TimelineNormalized'}]
      type: object
      required: [id, name, session_id, revision, defaults, can_undo, can_redo, takes, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        session_id: {type: [string, 'null'], format: uuid, description: 'the session its shots run in (follow it with GET …/sessions/{session_id}/events); null after that session was deleted (the next shot makes a new one)'}
        revision: {type: integer, minimum: 1, description: '1 on create, +1 on every stored change of the document'}
        defaults: {type: object, required: [cast, looks], properties: {cast: {type: array, items: {type: string, format: uuid}}, looks: {$ref: '#/components/schemas/LookIds'}}}
        can_undo: {type: boolean}
        can_redo: {type: boolean}
        takes: {type: object, propertyNames: {format: uuid}, additionalProperties: {$ref: '#/components/schemas/TimelineTake'}, description: 'every take the document names that is not offline'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TimelineSummary:
      type: object
      required: [id, name, target, revision, duration_s, clips, thumb_url, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        target: {$ref: '#/components/schemas/TimelineTarget'}
        revision: {type: integer, minimum: 1}
        duration_s: {type: number, minimum: 0}
        clips: {type: integer, minimum: 0, description: V1 clips}
        thumb_url: {oneOf: [{$ref: '#/components/schemas/SignedUrl'}, {type: 'null'}], description: 'the first V1 take''s thumbnail; null when none'}
        updated_at: {type: string, format: date-time}
    TimelineOp:
      description: 'one named edit (contracts/README.md, Timeline rules: edits; check.py t_edit), from 1.49 the items of TimelineEdits.ops. `fill` is studio''s and not one of them. Seconds are snapped to the frame grid (an audio track''s in / out: samples). A new op is an openapi change and a version'
      type: object
      required: [op]
      oneOf:
        - title: move
          description: 'V1: to `index` (V1 ripples); an audio clip: a new start `at`, optionally on another audio `track`'
          type: object
          required: [op, clip]
          additionalProperties: false
          properties: {op: {const: move}, clip: {$ref: '#/components/schemas/TimelineClipId'}, index: {type: integer, minimum: 0}, at: {$ref: '#/components/schemas/TimelineSeconds'}, track: {type: string, pattern: '^(V1|A[2-9])$'}}
        - title: trim
          description: 'move one edge by `delta` seconds (snapped to frames), clamped to the take and the dissolves'
          type: object
          required: [op, clip, edge, delta]
          additionalProperties: false
          properties: {op: {const: trim}, clip: {$ref: '#/components/schemas/TimelineClipId'}, edge: {type: string, enum: [in, out]}, delta: {type: number, minimum: -86400, maximum: 86400}}
        - title: split
          description: 'cut the clip of `track` under the playhead `at`; the right part gets `id` (absent: studio makes one)'
          type: object
          required: [op, track, at]
          additionalProperties: false
          properties: {op: {const: split}, track: {type: string, pattern: '^(V1|A[2-9])$'}, at: {$ref: '#/components/schemas/TimelineSeconds'}, id: {$ref: '#/components/schemas/TimelineClipId'}, ids: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/TimelineClipId'}, description: 'from 1.50, V1: ids for the right parts of its linked sound clips cut with it, in track order (absent ones: studio makes them)'}}
        - title: remove
          description: 'remove the clip (V1 ripples; from 1.50 with `ripple` an audio track does too)'
          type: object
          required: [op, clip]
          additionalProperties: false
          properties: {op: {const: remove}, clip: {$ref: '#/components/schemas/TimelineClipId'}, ripple: {type: boolean, description: 'from 1.50, an audio-track clip: the later clips of its track move left by its length (V1 always ripples)'}}
        - title: lift
          description: 'V1 only: an empty slot of the clip''s length, same id'
          type: object
          required: [op, clip]
          additionalProperties: false
          properties: {op: {const: lift}, clip: {$ref: '#/components/schemas/TimelineClipId'}}
        - title: replace
          description: 'the clip''s take becomes `take_id`, one of its alternatives'
          type: object
          required: [op, clip, take_id]
          additionalProperties: false
          properties: {op: {const: replace}, clip: {$ref: '#/components/schemas/TimelineClipId'}, take_id: {type: string, format: uuid}}
        - title: set
          description: 'set the clip''s fields; null removes one'
          type: object
          required: [op, clip]
          additionalProperties: false
          properties:
            op: {const: set}
            clip: {$ref: '#/components/schemas/TimelineClipId'}
            gain_db: {type: [number, 'null'], minimum: -60, maximum: 12}
            mute: {type: [boolean, 'null']}
            hold: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 3600}
            transition_in: {oneOf: [{$ref: '#/components/schemas/TimelineDissolve'}, {type: 'null'}]}
            link: {oneOf: [{$ref: '#/components/schemas/TimelineClipId'}, {type: 'null'}], description: 'from 1.50, an audio-track clip: the V1 clip it is linked to (null unlinks)'}
        - title: add
          description: 'append takes in order to `track` (default V1); `ids` for the new clips, in order (absent ones: studio makes them)'
          type: object
          required: [op, take_ids]
          additionalProperties: false
          properties:
            op: {const: add}
            take_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
            track: {type: string, pattern: '^(V1|A[2-9])$'}
            ids: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TimelineClipId'}}
        - title: insert
          description: 'an empty slot of `hold` seconds at the V1 cut nearest `at`'
          type: object
          required: [op, at, hold]
          additionalProperties: false
          properties: {op: {const: insert}, at: {$ref: '#/components/schemas/TimelineSeconds'}, hold: {type: number, exclusiveMinimum: 0, maximum: 3600}, id: {$ref: '#/components/schemas/TimelineClipId'}}
        - title: place
          description: 'an empty slot of `hold` seconds at exactly `at` on V1 (Make shot''s edit); `gap_id` for a gap it needs'
          type: object
          required: [op, at, hold]
          additionalProperties: false
          properties: {op: {const: place}, at: {$ref: '#/components/schemas/TimelineSeconds'}, hold: {type: number, exclusiveMinimum: 0, maximum: 3600}, id: {$ref: '#/components/schemas/TimelineClipId'}, gap_id: {$ref: '#/components/schemas/TimelineClipId'}}
        - title: add_track
          description: 'a new audio track at the end'
          type: object
          required: [op]
          additionalProperties: false
          properties: {op: {const: add_track}}
        - title: remove_track
          description: 'remove an audio track and its clips'
          type: object
          required: [op, track]
          additionalProperties: false
          properties: {op: {const: remove_track}, track: {type: string, pattern: '^(V1|A[2-9])$'}}
        - title: track
          description: 'a track''s gain or mute'
          type: object
          required: [op, track]
          additionalProperties: false
          properties: {op: {const: track}, track: {type: string, pattern: '^(V1|A[2-9])$'}, gain_db: {type: number, minimum: -60, maximum: 12}, mute: {type: boolean}}
        - title: roll
          description: 'from 1.50, V1: the cut before the clip moves by `delta` (the clip before ends later, this one starts later; the length is kept, the dissolve on the cut moves with it)'
          type: object
          required: [op, clip, delta]
          additionalProperties: false
          properties: {op: {const: roll}, clip: {$ref: '#/components/schemas/TimelineClipId'}, delta: {type: number, minimum: -86400, maximum: 86400, description: 'seconds, snapped to frames'}}
        - title: slip
          description: 'from 1.50: the clip shows other frames of its take, in and out moved by `delta` (place and length kept)'
          type: object
          required: [op, clip, delta]
          additionalProperties: false
          properties: {op: {const: slip}, clip: {$ref: '#/components/schemas/TimelineClipId'}, delta: {type: number, minimum: -86400, maximum: 86400, description: 'seconds, snapped to frames'}}
        - title: slide
          description: 'from 1.50, V1: the clip moves along V1 by `delta`, its content and length kept; the clip before and the one after give and take the frames'
          type: object
          required: [op, clip, delta]
          additionalProperties: false
          properties: {op: {const: slide}, clip: {$ref: '#/components/schemas/TimelineClipId'}, delta: {type: number, minimum: -86400, maximum: 86400, description: 'seconds, snapped to frames'}}
        - title: overwrite
          description: 'from 1.50: the clip goes in at `at` over what is there, no ripple (V1: it leaves an empty slot where it was; audio: onto `track`, default its own)'
          type: object
          required: [op, clip, at]
          additionalProperties: false
          properties: {op: {const: overwrite}, clip: {$ref: '#/components/schemas/TimelineClipId'}, at: {$ref: '#/components/schemas/TimelineSeconds'}, track: {type: string, pattern: '^(V1|A[2-9])$'}, ids: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/TimelineClipId'}, description: 'ids for the clips it makes, in track order, then left to right (absent ones: studio makes them; too few in a web replay: ids_short)'}}
        - title: split_all
          description: 'from 1.50: blade on every track at `at` (a clip with a shot or a cut there is skipped)'
          type: object
          required: [op, at]
          additionalProperties: false
          properties: {op: {const: split_all}, at: {$ref: '#/components/schemas/TimelineSeconds'}, ids: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/TimelineClipId'}, description: 'ids for the clips it makes, in track order, then left to right (absent ones: studio makes them; too few in a web replay: ids_short)'}}
        - title: remove_range
          description: 'from 1.50: every track cut at `from` and `to`, what is between removed; V1 and the audio tracks ripple'
          type: object
          required: [op, from, to]
          additionalProperties: false
          properties: {op: {const: remove_range}, from: {$ref: '#/components/schemas/TimelineSeconds'}, to: {$ref: '#/components/schemas/TimelineSeconds'}, ids: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/TimelineClipId'}, description: 'ids for the clips it makes, in track order, then left to right (absent ones: studio makes them; too few in a web replay: ids_short)'}}
        - title: lift_range
          description: 'from 1.50: every track cut at `from` and `to`, what is between lifted (V1: one empty slot; audio: a gap); nothing moves'
          type: object
          required: [op, from, to]
          additionalProperties: false
          properties: {op: {const: lift_range}, from: {$ref: '#/components/schemas/TimelineSeconds'}, to: {$ref: '#/components/schemas/TimelineSeconds'}, ids: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/TimelineClipId'}, description: 'ids for the clips it makes, in track order, then left to right (absent ones: studio makes them; too few in a web replay: ids_short)'}}
        - title: marker
          description: 'from 1.50: put a marker (a new `id` adds one, a known one is replaced whole; absent: studio makes one)'
          type: object
          required: [op, at]
          additionalProperties: false
          properties: {op: {const: marker}, id: {$ref: '#/components/schemas/TimelineClipId'}, at: {$ref: '#/components/schemas/TimelineSeconds'}, name: {type: string, minLength: 1, maxLength: 80}, color: {$ref: '#/components/schemas/TimelineMarkerColor'}}
        - title: remove_marker
          description: 'from 1.50: remove a marker'
          type: object
          required: [op, id]
          additionalProperties: false
          properties: {op: {const: remove_marker}, id: {$ref: '#/components/schemas/TimelineClipId'}}
    TimelineEdits:
      type: object
      required: [base_revision, ops]
      additionalProperties: false
      properties:
        base_revision: {type: integer, minimum: 1, description: 'the revision the ops were planned on (409 when it is not the current one)'}
        ops: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/TimelineOp'}}
        dry_run: {type: boolean, default: false, description: 'try it: the same answer, nothing stored'}
    TimelineDiff:
      type: object
      required: [added, removed, changed, tracks, duration, markers]
      additionalProperties: false
      description: 'what changed between two normalized documents (check.py t_diff), by clip id; a field absent on one side is null'
      properties:
        added: {type: array, items: {$ref: '#/components/schemas/TimelineClipId'}, description: 'new clip ids, in track order (studio-made ones included)'}
        removed: {type: array, items: {$ref: '#/components/schemas/TimelineClipId'}}
        changed:
          type: array
          items:
            type: object
            required: [clip, fields]
            additionalProperties: false
            properties:
              clip: {$ref: '#/components/schemas/TimelineClipId'}
              fields: {type: object, description: 'field → [before, after], among take_id, in, out, hold, at, gain_db, mute, transition_in, alternatives, shot, offline, track and (1.50) link (a V1 ripple shows as `at` changes)', additionalProperties: {type: array, minItems: 2, maxItems: 2}}
        tracks:
          type: object
          required: [added, removed, changed]
          additionalProperties: false
          properties:
            added: {type: array, items: {type: string}}
            removed: {type: array, items: {type: string}}
            changed:
              type: array
              items:
                type: object
                required: [track, fields]
                additionalProperties: false
                properties: {track: {type: string}, fields: {type: object, additionalProperties: {type: array, minItems: 2, maxItems: 2}}}
        duration: {type: array, minItems: 2, maxItems: 2, items: {type: number, minimum: 0}, description: '[before, after] duration_s'}
        markers:
          type: object
          required: [added, removed, changed]
          additionalProperties: false
          description: 'from 1.50: markers by id'
          properties:
            added: {type: array, items: {$ref: '#/components/schemas/TimelineClipId'}}
            removed: {type: array, items: {$ref: '#/components/schemas/TimelineClipId'}}
            changed:
              type: array
              items:
                type: object
                required: [marker, fields]
                additionalProperties: false
                properties: {marker: {$ref: '#/components/schemas/TimelineClipId'}, fields: {type: object, description: 'among at, name, color', additionalProperties: {type: array, minItems: 2, maxItems: 2}}}
    TimelineEditResult:
      type: object
      required: [revision, dry_run, timeline, diff, warnings]
      properties:
        revision: {type: integer, minimum: 1, description: 'the stored revision; a dry run: base_revision'}
        dry_run: {type: boolean}
        timeline: {$ref: '#/components/schemas/Timeline', description: 'as GET …/{timeline_id} answers it (a dry run: what it would be)'}
        diff: {$ref: '#/components/schemas/TimelineDiff'}
        warnings: {type: array, items: {type: string}, description: 'what studio changed beyond the ops (a time snapped to the frame grid); never a refusal'}
    TimelineEditError:
      type: object
      required: [detail]
      description: 'TimelineError plus the failing op: `ops[3]: split_edge`, or `ops[3]: timeline has 2 problems: …`; `{detail}` only when the body does not fit'
      properties:
        detail: {type: string}
        op_index: {type: integer, minimum: 0}
        code: {type: string, description: 'the edit''s error code (unknown_op, unknown_clip, unknown_track, take_not_found, split_edge, split_none, split_shot, lift_track, video_track, too_many_tracks, not_alternative; from 1.50 roll_track, roll_first, least, slip_still, slide_track, slide_end, overwrite_track, overwrite_shot, range_empty, range_shot, ids_short, unknown_marker, link_start) or the first problem''s code'}
        problems: {type: array, items: {$ref: '#/components/schemas/TimelineProblem'}}
    TimelineRevisionItem:
      type: object
      required: [revision, by, via, saved_at, ops_summary, clips, duration_s]
      properties:
        revision: {type: integer, minimum: 1}
        by: {type: string, enum: [user, studio]}
        via: {type: [string, 'null'], enum: [web, api, mcp, assistant, null], description: 'a user write: where it came from (X-Helm-Client; a revision from before 1.49 reads web); studio''s: null'}
        saved_at: {type: string, format: date-time}
        ops_summary: {type: [string, 'null'], description: 'the op names of an /edits call (`split, remove`), else the write''s kind (edit, add, shot, line, rerender, undo, redo, restore, fill); null before 1.49'}
        clips: {type: integer, minimum: 0, description: V1 clips}
        duration_s: {type: number, minimum: 0}
    TimelineRevisionList:
      type: object
      required: [revisions]
      properties: {revisions: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TimelineRevisionItem'}}}
    TimelineRevisionDoc:
      allOf: [{$ref: '#/components/schemas/TimelineRevisionItem'}]
      type: object
      required: [document]
      properties: {document: {$ref: '#/components/schemas/TimelineNormalized'}}
    TimelineRestore:
      type: object
      required: [revision, to]
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 1, description: 'the current revision, as the caller has it'}
        to: {type: integer, minimum: 1, description: 'the kept revision to bring back'}
    TimelineAgentClip:
      type: object
      required: [id, track, index, take_id, take_title, kind, in, out, hold, at, end, length, at_f, end_f, length_f, gain_db, mute, transition_in, alternatives, shot, number, offline, link]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/TimelineClipId'}
        track: {type: string}
        index: {type: integer, minimum: 0, description: 'its place on its track'}
        take_id: {type: [string, 'null'], format: uuid}
        take_title: {type: [string, 'null']}
        kind: {type: string, enum: [video, image, audio, slot], description: 'slot: an empty slot (or a line placeholder)'}
        in: {type: [number, 'null']}
        out: {type: [number, 'null']}
        hold: {type: [number, 'null']}
        at: {type: number, minimum: 0, description: 'sequence seconds'}
        end: {type: number, minimum: 0}
        length: {type: number, minimum: 0}
        at_f: {type: integer, minimum: 0, description: 'frames, on the target''s grid'}
        end_f: {type: integer, minimum: 0}
        length_f: {type: integer, minimum: 0}
        gain_db: {type: number}
        mute: {type: boolean}
        transition_in: {type: [integer, 'null'], description: 'a dissolve''s frames'}
        alternatives: {type: array, items: {type: string, format: uuid}}
        shot: {oneOf: [{$ref: '#/components/schemas/TimelineShotRef'}, {type: 'null'}]}
        number: {type: [integer, 'null'], description: 'V1: the shot number'}
        offline: {type: boolean}
        link: {oneOf: [{$ref: '#/components/schemas/TimelineClipId'}, {type: 'null'}], description: 'from 1.50, an audio-track clip: the V1 clip it is linked to'}
    TimelineAgentView:
      type: object
      required: [id, name, revision, target, duration_s, frames, tracks, clips, links, markers]
      additionalProperties: false
      description: 'GET …/{timeline_id}?view=agent (check.py t_agent_view, plus id, name, revision and take titles): plain data, no signed links'
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        revision: {type: integer, minimum: 1}
        target: {$ref: '#/components/schemas/TimelineTarget'}
        duration_s: {type: number, minimum: 0}
        frames: {type: integer, minimum: 0}
        tracks:
          type: array
          items:
            type: object
            required: [name, kind, gain_db, mute, clips]
            additionalProperties: false
            properties: {name: {type: string}, kind: {$ref: '#/components/schemas/TimelineTrackKind'}, gain_db: {type: number}, mute: {type: boolean}, clips: {type: integer, minimum: 0}}
        clips: {type: array, items: {$ref: '#/components/schemas/TimelineAgentClip'}, description: 'every clip, track by track, in order'}
        links: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/TimelineClipId'}}, description: 'from 1.50: each V1 clip that has linked sound clips → their ids, in track order'}
        markers:
          type: array
          description: 'from 1.50: the markers by time, `at_f` in frames'
          items:
            type: object
            required: [id, at, at_f, name, color]
            additionalProperties: false
            properties: {id: {$ref: '#/components/schemas/TimelineClipId'}, at: {type: number, minimum: 0}, at_f: {type: integer, minimum: 0}, name: {type: [string, 'null']}, color: {oneOf: [{$ref: '#/components/schemas/TimelineMarkerColor'}, {type: 'null'}]}}
    TimelineFrameRequest:
      type: object
      required: [at]
      additionalProperties: false
      properties: {at: {$ref: '#/components/schemas/TimelineSeconds', description: 'sequence seconds'}}
    TimelineFrame:
      type: object
      required: [empty, clip, take_id, kind, t, shown, shown_t, url]
      description: 'check.py frame_at_time, plus the signed image: what V1 shows at `at`'
      properties:
        empty: {type: boolean, description: 'an empty slot, or past the end'}
        clip: {oneOf: [{$ref: '#/components/schemas/TimelineClipId'}, {type: 'null'}]}
        take_id: {type: [string, 'null'], format: uuid}
        kind: {type: [string, 'null'], enum: [video, image, null]}
        t: {type: [number, 'null'], description: 'a video: the source time wanted'}
        shown: {type: [string, 'null'], enum: [image, first, last, poster, null], description: 'what the image is: the image take, the video''s first or last frame, or (an upload''s or import''s video) its poster, whose time is not known'}
        shown_t: {type: [number, 'null'], description: 'the source time the image shows (null: an image, or a poster)'}
        offline: {type: boolean, description: 'the clip''s take is gone: no image'}
        url: {oneOf: [{$ref: '#/components/schemas/SignedUrl'}, {type: 'null'}]}
    TimelineList:
      type: object
      required: [timelines]
      properties: {timelines: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TimelineSummary'}}}
    TimelineSlot:
      description: 'where a New shot goes: an existing V1 slot (an empty slot is filled; a take''s clip is redone: "from this clip"; a take action''s "replace"), a new empty slot at the V1 cut nearest `at` (the playhead; from 1.19 also an extend before''s insert, at the clip''s `at`) of `length` seconds, or (from 1.19, a take action''s "insert after") a new empty slot of `length` right after V1 clip `after`'
      oneOf:
        - {type: object, required: [clip], additionalProperties: false, properties: {clip: {$ref: '#/components/schemas/TimelineClipId'}}}
        - {type: object, required: [after, length], additionalProperties: false, properties: {after: {$ref: '#/components/schemas/TimelineClipId'}, length: {type: number, exclusiveMinimum: 0, maximum: 3600, description: 'the placeholder''s length until the take fills it (the client''s estimate)'}, id: {$ref: '#/components/schemas/TimelineClipId', description: 'the new slot''s id; absent = studio makes one'}}}
        - {type: object, required: [at, length], additionalProperties: false, properties: {at: {$ref: '#/components/schemas/TimelineSeconds'}, length: {type: number, exclusiveMinimum: 0, maximum: 3600}, id: {$ref: '#/components/schemas/TimelineClipId', description: 'the new slot''s id; absent = studio makes one'}, exact: {type: boolean, const: true, description: 'from 1.32 (Make shot): the `place` edit, the slot at exactly frames(at), not the nearest cut (contracts/README.md, Timeline: Make shot)'}}}
    TimelineLineSlot:
      description: 'from 1.32, where a New line goes: a placeholder on audio track `track` at `at` (the playhead) of `length` seconds (the client''s estimate, the template''s planned seconds), or an existing audio clip to redo'
      oneOf:
        - {type: object, required: [clip], additionalProperties: false, properties: {clip: {$ref: '#/components/schemas/TimelineClipId'}}}
        - {type: object, required: [track, at, length], additionalProperties: false, properties: {track: {type: string, pattern: '^A[2-9]$'}, at: {$ref: '#/components/schemas/TimelineSeconds'}, length: {type: number, exclusiveMinimum: 0, maximum: 600}, id: {$ref: '#/components/schemas/TimelineClipId', description: 'the placeholder''s id; absent = studio makes one'}}}
    TimelineLineCreate:
      type: object
      required: [slot, run]
      additionalProperties: false
      description: 'from 1.32: New line (POST …/timelines/{id}/lines)'
      properties:
        slot: {$ref: '#/components/schemas/TimelineLineSlot'}
        run: {$ref: '#/components/schemas/RunRequest', description: 'the docked voice composer''s run: a voice-over or dialogue template (media audio), prefilled with the sequence''s cast as a script'}
    TimelineShotCreate:
      type: object
      required: [slot, run]
      additionalProperties: false
      properties:
        slot: {$ref: '#/components/schemas/TimelineSlot'}
        run: {$ref: '#/components/schemas/RunRequest', description: 'as the docked composer sends it: the sequence''s defaults, and the first/last keyframe rows bound to frame takes (POST /v1/studio/takes/{take_id}/frame) when those options are on'}
    TimelineShot:
      type: object
      required: [timeline, run]
      properties:
        timeline: {$ref: '#/components/schemas/Timeline'}
        run: {$ref: '#/components/schemas/Run'}
    TimelineRerender:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 1}
        clips: {type: array, minItems: 1, maxItems: 22, uniqueItems: true, items: {$ref: '#/components/schemas/TimelineClipId'}, description: 'V1 clips (from 1.32 also audio-track clips made by a workflow) to re-render; absent = every V1 clip with a take'}
        preset: {type: string, minLength: 1, maxLength: 40, description: 'a preset every selected clip''s workflow has in `studio.presets` (for example final); applied over the clip''s own settings; absent = the clip''s own settings and seed'}
    TimelineRerenderAnswer:
      type: object
      required: [timeline, batch]
      properties:
        timeline: {$ref: '#/components/schemas/Timeline'}
        batch: {$ref: '#/components/schemas/Batch'}
    TimelineExportCreate:
      type: object
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 1, description: 'plan: absent = the current one; export: required (409 when not current)'}
        host: {type: string, pattern: '^[a-z0-9]{1,32}$', description: 'run it on this host (one of its envs with `media`); absent = automatic'}
    ExportReason:
      type: object
      required: [code, clip, message]
      properties:
        code: {type: string, enum: [gap, image, transition, not_probed, container, codec, pixel_format, size, aspect, field_order, frame_rate, trimmed, profile, level, time_base, colour, parameter_sets, offline, empty, too_large, no_host], description: 'contracts/README.md, Timeline: export plan (may grow in a minor version)'}
        clip: {oneOf: [{$ref: '#/components/schemas/TimelineClipId'}, {type: 'null'}]}
        message: {type: string, examples: ['Shot 2 is 704 × 448; the sequence is 1280 × 704']}
    ExportPlan:
      type: object
      required: [revision, stream_copy, reasons, blocked, output, frames, duration_s, estimated_bytes, host, env, hardware]
      properties:
        revision: {type: integer, minimum: 1}
        stream_copy: {type: boolean, description: 'the picture is copied as it is; the sound is always re-encoded'}
        reasons: {type: array, items: {$ref: '#/components/schemas/ExportReason'}, description: 'why the picture must be re-encoded, per V1 clip in order; empty with stream_copy'}
        blocked: {type: array, items: {$ref: '#/components/schemas/ExportReason'}, description: 'why it cannot export now (offline clips, empty, no host); empty = it can'}
        output:
          type: object
          required: [width, height, fps, sample_rate, container, video_codec, audio_codec, video_bitrate]
          properties:
            width: {type: integer}
            height: {type: integer}
            fps: {type: number}
            sample_rate: {type: integer}
            container: {type: string, const: mp4}
            video_codec: {type: string, const: h264}
            audio_codec: {type: string, const: aac, description: 'AAC-LC 192 kb/s stereo'}
            video_bitrate: {type: [integer, 'null'], description: 're-encode: bits per second; null for a stream copy'}
        frames: {type: integer, minimum: 0}
        duration_s: {type: number, minimum: 0}
        estimated_bytes: {type: integer, minimum: 0}
        sounds:
          type: array
          maxItems: 1000
          description: 'from 1.32 (always sent): every sound the mix reads, V1 then the audio tracks in order (V1 video clips with sound and audio-track clips with a take; not muted, not offline), with the facts each is resampled from: every one is resampled to `output.sample_rate` and up-mixed to stereo before the mix (contracts/README.md, Timeline: export)'
          items:
            type: object
            required: [clip, track, sample_rate, channels]
            properties:
              clip: {$ref: '#/components/schemas/TimelineClipId'}
              track: {type: string, pattern: '^(V1|A[2-9])$'}
              sample_rate: {type: [integer, 'null'], description: 'an audio take''s own rate (`audio.sample_rate`: 24000, 44100); null when studio does not know it (a video''s sound, an upload): ffmpeg reads it'}
              channels: {type: [integer, 'null'], description: '1 for an audio take made by a run (mono WAV); null when not known'}
        host: {type: [string, 'null'], description: 'the env that would run it now (automatic choice, or the named host''s); null when none'}
        env: {type: [string, 'null']}
        hardware: {type: [boolean, 'null'], description: 'true: a hardware encoder (VideoToolbox or, from 1.18, NVENC); false: software (libx264); null without a host'}
    MediaJobKind: {type: string, enum: [export, frame]}
    MediaJobStatus: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
    MediaJob:
      type: object
      required: [id, kind, status, host, env, timeline_id, revision, source_take_id, mode, progress, take_id, failure, created_at, started_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/MediaJobKind'}
        status: {$ref: '#/components/schemas/MediaJobStatus'}
        host: {type: string}
        env: {type: string}
        timeline_id: {type: [string, 'null'], format: uuid, description: 'export: the sequence'}
        revision: {type: [integer, 'null'], minimum: 1, description: 'export: the revision exported'}
        source_take_id: {type: [string, 'null'], format: uuid, description: 'frame: the video take'}
        mode: {type: [string, 'null'], enum: [copy, conform, null], description: 'export: what was planned (copy = picture stream copy); once it ended, what the runner did (copy can fall back to conform)'}
        reason: {type: [string, 'null'], description: 'export: why the runner fell back to conform (a probe disagreed with the plan); null otherwise'}
        progress:
          oneOf:
            - {type: object, required: [frames, total], properties: {frames: {type: integer, minimum: 0}, total: {type: integer, minimum: 1}}}
            - {type: 'null'}
          description: 'export: frames written of the sequence''s frames (a succeeded export: all of them); null before the first progress and for frame jobs'
        take_id: {type: [string, 'null'], format: uuid, description: 'succeeded: the take it made (an export: a video take, source export; a frame: an image take, source frame)'}
        failure:
          oneOf:
            - {type: object, required: [class, detail], properties: {class: {type: string, enum: [input, invalid, ffmpeg, verify, internal, host_lost], description: 'from 1.18 host_lost: its host stopped responding (contracts/README.md, Several hosts: host loss); export again: another live host is chosen'}, detail: {type: string}}}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    MediaJobList:
      type: object
      required: [jobs]
      properties: {jobs: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/MediaJob'}}}
    TakeFrameRequest:
      type: object
      required: [at]
      additionalProperties: false
      properties:
        at: {type: string, enum: [first, last]}
    TakeFrame:
      type: object
      description: 'exactly one: `take` (200), or `job` (202) whose `take_id` is the frame take once it succeeded'
      oneOf:
        - {required: [take]}
        - {required: [job]}
      properties:
        take: {$ref: '#/components/schemas/Take'}
        job: {$ref: '#/components/schemas/MediaJob'}
    TakeFrameOf:
      type: object
      required: [take_id, at]
      properties:
        take_id: {type: string, format: uuid, description: 'the video take (it may be deleted since)'}
        at: {type: string, enum: [first, last]}
    TakeExport:
      type: object
      required: [timeline_id, timeline_name, revision, job_id, mode]
      properties:
        timeline_id: {type: string, format: uuid, description: 'the sequence (it may be deleted since)'}
        timeline_name: {type: string, description: 'as it was when exported'}
        revision: {type: integer, minimum: 1}
        job_id: {type: string, format: uuid}
        mode: {type: string, enum: [copy, conform]}
    WorkflowKeyframes:
      description: 'what a New shot binds its frames into (contracts/README.md, Timeline: New shot options): keyframe rows (LTX), or from 1.37 two image params (`WorkflowFrameParams`, a workflow''s `studio.keyframes`: MiniMax H3 Image to video)'
      oneOf:
        - type: object
          required: [param, image, seconds, last]
          additionalProperties: false
          properties:
            param: {type: string, examples: [keyframes.images]}
            image: {type: string, description: 'the rows'' Image field', examples: [image]}
            seconds: {type: string, description: 'the rows'' `position: seconds` field', examples: [seconds]}
            last: {type: boolean, description: 'it takes 2 rows or more: "End on the next clip''s first frame" is offered'}
        - $ref: '#/components/schemas/WorkflowFrameParams'
    WorkflowFrameParams:
      type: object
      required: [first, last]
      additionalProperties: false
      description: 'from 1.37: the image param the previous clip''s last frame goes into, and the one the next clip''s first frame goes into (null: "End on the next clip''s first frame" is not offered)'
      properties:
        first: {$ref: '#/components/schemas/StudioPath'}
        last: {oneOf: [{$ref: '#/components/schemas/StudioPath'}, {type: 'null'}]}
      examples: [{first: first.image, last: last.image}]

    # ---------------------------------------------------------- auth_service
    SigninRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, description: 'normalised like sign-up; a malformed one is just a failed sign-in (401)'}
        password: {type: string}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string, description: 'empty = 401'}}
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string}
        new_password: {type: string, minLength: 10, maxLength: 256, description: common passwords are refused}
    User:
      type: object
      required: [id, email, name, roles, disabled, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}, description: sorted; may be empty}
        disabled: {type: boolean}
        created_at: {type: string, format: date-time}
    UserList:
      type: object
      required: [users]
      properties: {users: {type: array, items: {$ref: '#/components/schemas/User'}}}
    Session:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: {type: string, description: 'RS256 JWT (kid in the header; claims iss, sub, email, roles, jti, fid = session family, iat, exp); ACCESS_TTL, default 15 min'}
        refresh_token: {type: string, description: 'opaque; REFRESH_TTL, default 30 days; single use, rotated by /auth/refresh'}
        user: {$ref: '#/components/schemas/User'}
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, use, alg, kid, n, e]
            properties:
              kty: {const: RSA}
              use: {const: sig}
              alg: {const: RS256}
              kid: {type: string}
              n: {type: string, description: base64url modulus}
              e: {type: string, description: base64url exponent}
    Role:
      type: string
      enum: [user, dev, admin]
      description: 'user: the studio; dev: also developer views; admin: user management, only the ADMIN_EMAIL account'
    GrantableRole:
      type: string
      enum: [user, dev]
      description: 'a role the admin can give; admin is not one (422): it belongs to the ADMIN_EMAIL account alone'
    UserCreate:
      type: object
      required: [email, password, roles]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254, description: 'trimmed and lower-cased; a plain address'}
        password: {type: string, minLength: 10, maxLength: 256, description: 'common passwords are refused (422 "password is too common")'}
        name: {type: string, maxLength: 200, description: 'trimmed; empty or missing = the part of the email before @'}
        roles: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GrantableRole'}}
    DisabledRequest:
      type: object
      required: [disabled]
      properties: {disabled: {type: boolean, description: 'true disables (and revokes all sessions), false re-enables; a missing field reads as false'}}
    RolesRequest:
      type: object
      required: [roles]
      properties: {roles: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GrantableRole'}, description: replaces the roles; duplicates are ignored}}
    PasswordRequest:
      type: object
      required: [password]
      properties: {password: {type: string, minLength: 10, maxLength: 256, description: common passwords are refused}}
    ApiKeyCreate:
      type: object
      required: [client]
      properties:
        client: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$', description: client name; created if new}
        scopes: {type: [array, 'null'], items: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$'}, description: 'default []'}
    ApiKey:
      type: object
      required: [id, client_id, client, prefix, scopes, created_at, revoked_at, last_used_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        client: {type: string}
        prefix: {type: string, description: 'first 12 characters of the key ("helm_" + 7), for recognising it'}
        scopes: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time, description: updated at most once a minute}
    ApiKeyCreated:
      allOf:
        - {$ref: '#/components/schemas/ApiKey'}
        - type: object
