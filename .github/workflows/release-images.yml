# Release builds (docs/plan/34-release-builds.md §38): the 9 images for linux/amd64 and linux/arm64 on native runners
# (and the NVIDIA runner's for linux/amd64), the release compose.yml (deploy/release/compose.yml with the version
# baked in), a smoke test of that compose.yml on each kind of machine, and the Mac app's .dmg. It runs only for a
# pushed tag v*; on a tag whose commit is not on main every job after the first is skipped (owner, 2026-11-25), and publishes only
# after both smoke tests pass: one tag ghcr.io/janishar/helmstudio-<name>:<version> per image
# (multi-arch), and the .dmg, compose.yml and SHA256SUMS attached to the GitHub release of that tag if it exists.
name: release-builds

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io/janishar/helmstudio-
  SOURCE: https://github.com/janishar/helmstudio

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      on_main: ${{ steps.main.outputs.on_main }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: the tagged commit is on main (otherwise every other job is skipped)
        id: main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then m=true; else m=false
            echo "::warning::$GITHUB_REF_NAME is not on main: nothing is built (merge into main first, then tag)"; fi
          echo "on_main=$m" >>"$GITHUB_OUTPUT"
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v=${GITHUB_REF_NAME#v} r=true; else v=ci-${GITHUB_SHA::7} r=false; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"; echo "release=$r" >>"$GITHUB_OUTPUT"; echo "version $v, release $r"

  images:
    needs: meta
    if: needs.meta.outputs.on_main == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [kong, auth, studio, pipelines, files, web, seaweedfs, media-tools, setup]
        arch: [amd64, arm64]
        include:
          - {image: kong, context: kong}
          - {image: auth, context: auth_service, contexts: helmgo=helmgo}
          - {image: studio, context: studio_service, contexts: helmgo=helmgo}
          - {image: files, context: files_service, contexts: helmgo=helmgo}
          - {image: pipelines, context: pipelines_service}
          - {image: web, context: web_service}
          - {image: seaweedfs, context: deploy/seaweedfs}
          - {image: media-tools, context: plugins/media-tools}
          - {image: setup, context: ., file: deploy/release/setup.Dockerfile}
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.contexts }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}${{ matrix.image }}:${{ needs.meta.outputs.version }}
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.image }}.tar
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar
          retention-days: 1
          compression-level: 0

  # the release compose.yml: deploy/release/compose.yml with this run's version as the default
  compose:
    needs: meta
    if: needs.meta.outputs.on_main == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh deploy/release/setup.sh
      - run: |
          mkdir out && sed "s/HELMSTUDIO_VERSION:-[^}]*}/HELMSTUDIO_VERSION:-${{ needs.meta.outputs.version }}}/" \
            deploy/release/compose.yml >out/compose.yml
          ! grep -n 'build:' out/compose.yml
          [ "$(grep -c "helmstudio-[a-z-]*:\${HELMSTUDIO_VERSION:-${{ needs.meta.outputs.version }}}" out/compose.yml)" -ge 11 ]
          cd out && docker compose config -q && docker compose --profile nvidia config -q
      - uses: actions/upload-artifact@v4
        with: {name: compose, path: out/compose.yml}

  # the release compose.yml as a user runs it, on this run's images (loaded, never pulled from the registry), on each
  # kind of machine: the first `up` with a throwaway admin, sign in through Kong, one authenticated read; a second `up`
  # with no admin given (the secrets and the admin kept), the same checks; then `down -v`
  smoke:
    needs: [meta, images, compose]
    if: needs.meta.outputs.on_main == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    env:
      ADMIN: ci-admin@example.com
    defaults:
      run: {working-directory: /home/runner/hs}
    steps:
      - run: mkdir -p /home/runner/hs
        working-directory: /home/runner
      - uses: actions/download-artifact@v4
        with: {pattern: 'image-*-${{ matrix.arch }}', path: /home/runner/images, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: compose, path: /home/runner/hs}
      - run: docker version --format 'docker {{.Server.Version}}'; docker compose version; for f in ../images/*.tar; do docker load -q -i "$f"; done
      - name: first up (with the admin)
        run: |
          (umask 077 && openssl rand -hex 16 >"$RUNNER_TEMP/admin_password")
          echo "::add-mask::$(cat "$RUNNER_TEMP/admin_password")"
          HELMSTUDIO_ADMIN_EMAIL=$ADMIN HELMSTUDIO_ADMIN_PASSWORD=$(cat "$RUNNER_TEMP/admin_password") \
            docker compose up -d --wait --wait-timeout 300
      - name: sign in through Kong
        run: |
          cat >"$RUNNER_TEMP/signin.sh" <<'SH'
          set -eu
          key=$(docker compose exec -T web cat /run/secrets/web_api_key) && echo "::add-mask::$key"
          tok=$(jq -n --arg e "$ADMIN" --rawfile p "$RUNNER_TEMP/admin_password" '{email: $e, password: ($p | rtrimstr("\n"))}' |
            curl -fsS -H "x-api-key: $key" -H 'content-type: application/json' -d @- http://127.0.0.1:8300/auth/signin |
            jq -er .access_token) && echo "::add-mask::$tok"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "x-api-key: $key" -H "authorization: Bearer $tok" \
            http://127.0.0.1:8300/v1/studio/sessions)
          echo "signed in; GET /v1/studio/sessions: $code"; [ "$code" = 200 ]
          SH
          sh "$RUNNER_TEMP/signin.sh"
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
      - name: second up (no admin given; the secrets and the admin kept)
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 300
          sh "$RUNNER_TEMP/signin.sh"
      - name: logs
        if: failure()
        run: docker compose ps -a; docker compose logs --tail 80
      - name: down -v
        if: always()
        run: docker compose down -v

  # the NVIDIA runner's image (runner_service/Dockerfile.cuda, target runtime): Intel/AMD only (CUDA wheels); built on
  # every run, pushed on a tag only after both smoke tests (the smoke test has no GPU). Large: the runner's preinstalled
  # toolchains go first, and no GitHub cache.
  runner-cuda:
    needs: [meta, smoke]
    if: needs.meta.outputs.on_main == 'true'
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null; df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: needs.meta.outputs.release == 'true'
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: runner_service
          file: runner_service/Dockerfile.cuda
          target: runtime
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}runner-cuda:${{ needs.meta.outputs.version }}
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          push: ${{ needs.meta.outputs.release == 'true' }}
      - run: df -h /

  mac:
    needs: meta
    if: needs.meta.outputs.on_main == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '26.13.1'}
      - uses: actions/setup-go@v5
        with: {go-version-file: cli/go.mod, cache-dependency-path: cli/go.sum}
      - run: make -C desktop node_modules
      - name: the release's version and image tags
        if: needs.meta.outputs.release == 'true'
        working-directory: desktop
        run: |
          node -e '
            const fs = require("fs"), v = process.argv[1], put = (f, o) => fs.writeFileSync(f, JSON.stringify(o, null, 2) + "\n");
            const p = JSON.parse(fs.readFileSync("package.json")); p.version = v; put("package.json", p);
            const s = JSON.parse(fs.readFileSync("stack.json")); s.composeEnv.IMAGE_TAG = v;
            s.images = s.images.map((i) => i.startsWith(process.env.REGISTRY) ? i.replace(/:[^:]+$/, ":" + v) : i); put("stack.json", s);
          ' "$VERSION"
      - run: make -C desktop test lint dmg
      - run: mkdir dmg && mv desktop/dist.noindex/helmstudio.dmg "dmg/helmstudio-$VERSION.dmg" && ls -l dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dmg/
          compression-level: 0

  # ---------- a tag only, after both smoke tests: push each image by digest (from this run's cache), then one tag

  push:
    if: needs.meta.outputs.release == 'true' && needs.meta.outputs.on_main == 'true'
    needs: [meta, smoke]
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        image: [kong, auth, studio, pipelines, files, web, seaweedfs, media-tools, setup]
        arch: [amd64, arm64]
        include:
          - {image: kong, context: kong}
          - {image: auth, context: auth_service, contexts: helmgo=helmgo}
          - {image: studio, context: studio_service, contexts: helmgo=helmgo}
          - {image: files, context: files_service, contexts: helmgo=helmgo}
          - {image: pipelines, context: pipelines_service}
          - {image: web, context: web_service}
          - {image: seaweedfs, context: deploy/seaweedfs}
          - {image: media-tools, context: plugins/media-tools}
          - {image: setup, context: ., file: deploy/release/setup.Dockerfile}
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.contexts }}
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          outputs: type=image,name=${{ env.REGISTRY }}${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
      - run: mkdir digests && touch "digests/${DIGEST#sha256:}"
        env: {DIGEST: '${{ steps.build.outputs.digest }}'}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: [meta, push]
    if: needs.meta.outputs.on_main == 'true'
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        image: [kong, auth, studio, pipelines, files, web, seaweedfs, media-tools, setup]
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'digest-${{ matrix.image }}-*', path: digests, merge-multiple: true}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - run: |
          img=$REGISTRY${{ matrix.image }}
          docker buildx imagetools create -t "$img:${{ needs.meta.outputs.version }}" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" $(for d in digests/*; do echo "$img@sha256:${d#digests/}"; done)
          docker buildx imagetools inspect "$img:${{ needs.meta.outputs.version }}"

  # the release files (the .dmg, compose.yml, SHA256SUMS): one artifact on every run; on a tag also attached to its GitHub release, if one exists
  release-files:
    needs: [meta, compose, smoke, mac, publish, runner-cuda]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.meta.outputs.on_main == 'true' }}
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: compose, path: files}
      - uses: actions/download-artifact@v4
        with: {name: dmg, path: files}
      - run: cd files && sha256sum ./*.dmg ./compose.yml | sed 's| \./| |' >SHA256SUMS && cat SHA256SUMS && ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: files/
          compression-level: 0
      - if: needs.meta.outputs.release == 'true'
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/* --clobber
          else
            echo "::notice::no GitHub release $GITHUB_REF_NAME yet: the files are this run's artifact release-$VERSION"
          fi
