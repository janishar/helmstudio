# Publishes helm-runtime-sdk to PyPI when a tag
# packages/helm-runtime-sdk/python/v<version> is pushed (docs/releasing.md).
#
# Trusted publishing: no token is stored in the repository. PyPI trusts this workflow,
# by its file name and the pypi environment, from janishar/helmstudio. A
# version already on PyPI is skipped, so running it again is harmless. The pypi
# environment is where a reviewer approves the publish (docs/publishing.md).
#
# This runs no gate: a tag is pushed on a commit that passed `make gate`.

name: publish-python

on:
  push:
    tags: ["packages/helm-runtime-sdk/python/v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/helm-runtime-sdk/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the build tools
        run: python -m pip install --upgrade build twine packaging
      - name: Check the tag names the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          tagged = os.environ["TAG"].rsplit("/v", 1)[1]
          with open("pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["version"]
          if Version(tagged) != Version(declared):
              raise SystemExit(f"the tag says {tagged} and pyproject.toml says {declared}")
          PY
      - name: Build and check the distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Import the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-check/bin/python -c "import helm_runtime_sdk, helm_runtime_sdk.proxy; print(helm_runtime_sdk.API_VERSION)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/helm-runtime-sdk/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/helm-runtime-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
