# The helmstudio platform API — the contract.
#
# Completed in M4 from the M0 outline, against the answers recorded in
# docs/decisions.md under "2026-09-15 · M4 API and SDK" (Q1–Q30). Every
# operation cites the design section or decision it comes from. Awaiting M4's
# first review: nothing implements this revision yet.
#
# Conventions that apply everywhere, so they are not repeated per operation:
#
# - Tags. Every operation is `studio-api`, `launcher` or `public`, exactly one
#   (Q1; `public` added in M6, Q9). Only `studio-api` operations are generated
#   into helm-runtime-sdk. Every `studio-api` operation requires a studio token,
#   with no exception (Q7): the launcher reads the job queue through its own
#   `/launcher/jobs` paths (M4 first review, #2). A `public` operation needs no
#   token, is a GET, carries nothing but the launcher's theme, and is the only
#   kind of operation a studio's page may reach from its own origin.
# - x-helm-group / x-helm-method name the SDK method, identical in Go, Python
#   and Node (04 §4): `x-helm-group: assets`, `x-helm-method: adopt` is
#   `c.Assets.Adopt`, `c.assets.adopt`, `c.assets.adopt`.
# - x-helm-capability names the manifest capability a studio token needs
#   (Q8). `token` means any valid studio token. Absent on launcher operations.
# - x-helm-events on an SSE operation maps each event name to its data schema.
# - Ids are bare ULIDs; timestamps are RFC 3339 (Q29).
# - Errors are always the Error schema (Q4, 04 §4). Status → SDK error kind:
#     400, 413, 416, 422 Invalid · 401 Unauthenticated · 403, 421 Forbidden ·
#     404, 410 NotFound · 409 Conflict · 429, 507 QuotaExceeded ·
#     501 Unsupported · 503 or no connection Unavailable · anything else Internal.
# - PATCH always means a JSON merge patch (RFC 7396) over the resource's
#   writable fields, sent as application/merge-patch+json: an object member
#   merges, an array or scalar replaces, `null` removes (M4 first review, #11).
# - Browser access (M6 Q10, resolving M4 Q27 and first review #12). A studio's
#   page never holds a token. The runtime SDK's same-origin proxy, mounted at
#   /helm/ on the studio's own server, forwards /helm/api/v1/<studio-api path>
#   here with the studio's Bearer token added, and forwards nothing else. So
#   <img src="/helm/api/v1/assets/{id}"> works, and /assets/{id} and
#   /assets/{id}/thumb keep their Bearer security unchanged.
# - Outside this document's servers.url, the daemon serves the helm packages
#   as static files at /sdk/v1/ (helm.css, helm-runtime.js, …; 04 §8), GET and
#   HEAD only, exempt from the Origin check like `public` operations (M6 Q14).
# - Collections return a page: {items, next_cursor} with `limit` (default 50,
#   max 200) and an opaque `cursor` (Q5). A cursor is only valid with the same
#   filters it was issued for. Reclaim previews are single documents, not
#   collections: their confirm digest covers the whole set.
# - JSON request bodies are capped at 1 MiB (413 `too_large`).
openapi: 3.1.0

info:
  title: helmstudio platform API
  version: "1.0.0"
  description: >
    The local, single-machine API a studio's runtime SDK speaks, and the one
    the launcher speaks to the daemon. Served by the daemon at
    127.0.0.1:8700 and, for one studio with no daemon, by `helm dev` and the
    embedded provider (05 §2, §5a). The two are substitutable: one
    conformance suite runs against both (Q25). The in-process embedded
    provider has no token, and still enforces the studio's capabilities,
    read from its manifest, with the same 403 `capability_required`; the
    suite's capability cases run against both providers (M4 first review,
    #7).

servers:
  - url: http://127.0.0.1:8700/api/v1

tags:
  - name: studio-api
    description: >
      What a studio calls, with its HELM_TOKEN. Generated into
      helm-runtime-sdk. Every operation requires a studio token (Q7) and
      touches only the calling studio's namespace unless a capability says
      otherwise (07 §3).
  - name: launcher
    description: >
      What the launcher calls: install, weights, supervision and reclaim. No
      token; the daemon's Host and Origin checks apply (docs/decisions.md, M2
      supervision). Not generated into helm-runtime-sdk.
  - name: public
    description: >
      The launcher's theme, for a studio's page (M6 Q9). No token, GET only,
      and exempt from the Origin check with `Access-Control-Allow-Origin: *`,
      so a page on a studio's own port can follow it directly or through its
      proxy. The Host check still applies. Not generated into helm-runtime-sdk.

security: []

paths:

  # ======================================================================
  # Identity and events (05 §3, 07 §3)
  # ======================================================================

  /me:
    get:
      tags: [studio-api]
      operationId: meGet
      x-helm-group: me
      x-helm-method: get
      x-helm-capability: token
      summary: Who the token belongs to, what it may do, and how much quota is left.
      description: >
        05 §3 and 07 §3. `provider` says which provider answered, which is the
        first question every integration bug asks (05 §4).
      security: [{ studioToken: [] }]
      responses:
        "200":
          description: The caller.
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /events:
    get:
      tags: [studio-api]
      operationId: eventsSubscribe
      x-helm-group: events
      x-helm-method: subscribe
      x-helm-capability: token
      summary: Server-sent events for the calling studio.
      description: >
        R41, 07 §3. Each event carries `id:` (opaque), `event:` (its name)
        and `data:` (JSON). Reconnect with `Last-Event-ID` to resume; the
        provider keeps the last 1024 events. When the id is older than that,
        was issued by a provider that has since restarted, or was never
        issued, `gap` comes first and the stream continues from now (second
        review #2). A studio receives `item` events
        for its own items, or for every studio's with `gallery.read_all`;
        `inbox` for handoffs to it; `job` for its own studio's jobs; `theme`
        to every studio whenever the launcher's theme is set (M6 Q8). A page
        follows the theme through `GET /theme/events` instead, which needs no
        token. `: ping` comments keep the connection open.
      security: [{ studioToken: [] }]
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      x-helm-events:
        theme: { $ref: "#/components/schemas/ThemeEvent" }
        inbox: { $ref: "#/components/schemas/InboxEvent" }
        item: { $ref: "#/components/schemas/ItemEvent" }
        job: { $ref: "#/components/schemas/JobEvent" }
        shutdown: { $ref: "#/components/schemas/ShutdownEvent" }
        gap: { $ref: "#/components/schemas/GapEvent" }
      responses:
        "200":
          description: An event stream.
          content: { text/event-stream: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # ======================================================================
  # KV (R31b, 05 §3, 07 §3)
  # ======================================================================

  /kv/{ns}:
    get:
      tags: [studio-api]
      operationId: kvList
      x-helm-group: kv
      x-helm-method: list
      x-helm-capability: kv
      summary: List keys in a namespace, with sizes and modified times. No values.
      description: >
        07 §3. Ordered by key, ascending. The namespace `shared` is the
        shared namespace and needs `kv.shared` (Q21).
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: prefix
          in: query
          schema: { type: string, maxLength: 200 }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of keys.
          content: { application/json: { schema: { $ref: "#/components/schemas/KVKeyPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /kv/{ns}/{key}:
    get:
      tags: [studio-api]
      operationId: kvGet
      x-helm-group: kv
      x-helm-method: get
      x-helm-capability: kv
      summary: Read one document.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Key" }
      responses:
        "200":
          description: The document. The ETag header equals `etag`.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/KVDoc" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [studio-api]
      operationId: kvPut
      x-helm-group: kv
      x-helm-method: put
      x-helm-capability: kv
      summary: Create or replace a document.
      description: >
        07 §3. The body is the document, a JSON object. With `If-Match`, the
        write happens only when the stored etag matches (409
        `etag_mismatch` otherwise, and on a key that does not exist). Without
        it, the write is unconditional. Every successful write produces a new
        etag. The document's bytes count toward `kv_bytes` (Q20).
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Key" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JSONObject" } } }
      responses:
        "200":
          description: The stored document.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/KVDoc" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
    patch:
      tags: [studio-api]
      operationId: kvPatch
      x-helm-group: kv
      x-helm-method: patch
      x-helm-capability: kv
      summary: Apply a JSON merge patch (RFC 7396) to an existing document.
      description: >
        07 §3. A `null` member removes that member. `If-Match` as for PUT.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Key" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/JSONObject" } } }
      responses:
        "200":
          description: The patched document.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/KVDoc" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
    delete:
      tags: [studio-api]
      operationId: kvDelete
      x-helm-group: kv
      x-helm-method: delete
      x-helm-capability: kv
      summary: Remove a document.
      description: >
        07 §3. With `If-Match`, only when the etag matches. Deleting a key
        that does not exist is 404.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/Key" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "204": { description: "Removed." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ======================================================================
  # Sessions (R31a, 02 §5)
  # ======================================================================

  /sessions:
    get:
      tags: [studio-api]
      operationId: sessionsList
      x-helm-group: sessions
      x-helm-method: list
      x-helm-capability: kv
      summary: The calling studio's sessions, most recently opened first.
      description: >
        Ordered by `opened_at` descending with never-opened sessions last,
        then `created_at` descending. Deleted sessions are not listed.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of sessions.
          content: { application/json: { schema: { $ref: "#/components/schemas/SessionPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [studio-api]
      operationId: sessionsCreate
      x-helm-group: sessions
      x-helm-method: create
      x-helm-capability: kv
      summary: Create a session.
      description: >
        A name is unique among the studio's live sessions (409 `name_taken`).
        The state's bytes count toward `kv_bytes` (Q20).
      security: [{ studioToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreate" } } }
      responses:
        "201":
          description: The new session.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }

  /sessions/{id}:
    get:
      tags: [studio-api]
      operationId: sessionsGet
      x-helm-group: sessions
      x-helm-method: get
      x-helm-capability: kv
      summary: One session. A deleted session, or another studio's, is 404.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: The session.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [studio-api]
      operationId: sessionsUpdate
      x-helm-group: sessions
      x-helm-method: update
      x-helm-capability: kv
      summary: Rename, or merge changes into the state document.
      description: >
        R31a, M4 first review #11. A JSON merge patch over `{name, state}`:
        members of `state` merge into the stored state, and a `null` member
        removes that key. `name` cannot be null. With `If-Match`, only when the
        etag matches: two open tabs must not silently overwrite each other.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/SessionUpdate" } } }
      responses:
        "200":
          description: The updated session.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
    delete:
      tags: [studio-api]
      operationId: sessionsDelete
      x-helm-group: sessions
      x-helm-method: delete
      x-helm-capability: kv
      summary: Soft-delete. Its name becomes free; items keep their session_id.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "204": { description: "Deleted." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{id}:duplicate:
    post:
      tags: [studio-api]
      operationId: sessionsDuplicate
      x-helm-group: sessions
      x-helm-method: duplicate
      x-helm-capability: kv
      summary: Copy a session's state under a new name. The copy has never been opened.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SessionDuplicate" } } }
      responses:
        "201":
          description: The copy.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }

  /sessions/{id}:activate:
    post:
      tags: [studio-api]
      operationId: sessionsActivate
      x-helm-group: sessions
      x-helm-method: activate
      x-helm-capability: kv
      summary: Set opened_at to now. Changes neither the state nor the etag, nor any process.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "204": { description: "Activated." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ======================================================================
  # Records (R32-R33, 06 §6)
  # ======================================================================

  /records/{collection}:
    get:
      tags: [studio-api]
      operationId: recordsQuery
      x-helm-group: records
      x-helm-method: query
      x-helm-capability: records
      summary: Query a collection with the closed filter language. Never SQL.
      description: >
        06 §6 and Q19. Each `where` is `field:op:value`, at most eight, all
        of which must match.

        - field: a top-level document key matching `^[A-Za-z_][A-Za-z0-9_]*$`,
          or one of `id`, `created_at`, `updated_at`. No nested paths. Any
          field may be filtered; `storage.collections[].index` only makes it
          faster.
        - op: `eq ne lt lte gt gte in contains exists`.
        - value: everything after the second `:`, so a value may itself contain
          `:` (a timestamp, a URL); a field and an operator never do. Parsed
          as JSON when it is valid JSON (`42`, `true`, `null`, `"42"`),
          otherwise taken as a literal string. `in` takes a JSON array.
          `contains` is a case-sensitive substring test when the stored value
          is a string and a membership test when it is an array. `exists`
          takes `true` or `false`. `lt`, `lte`, `gt` and `gte` match only
          stored values of the filter value's JSON type, so `seed:gt:10` never
          matches a seed stored as the string "42" (M4, signed off by the
          human at the second review, #5).

        - `created_at` and `updated_at` take RFC 3339 values and compare as
          instants (they are stored as milliseconds), so
          `created_at:gte:2026-09-15T00:00:00Z` works; any other value is
          `bad_filter`, and so are `contains` and `exists` on them. `id`
          compares as a string, which for ULIDs is creation order.

        Every value is bound as a parameter. `order` is `field:asc` or
        `field:desc` on one field, default `created_at:desc`, with `id`
        breaking ties in the same direction. Deleted records are never
        returned. Bad syntax, an unknown operator or more than eight clauses
        is 400 `bad_filter`.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Collection" }
        - name: where
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            items: { type: string }
        - name: order
          in: query
          schema: { type: string, default: "created_at:desc" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of records.
          content: { application/json: { schema: { $ref: "#/components/schemas/RecordPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [studio-api]
      operationId: recordsInsert
      x-helm-group: records
      x-helm-method: insert
      x-helm-capability: records
      summary: Insert a document; returns its id and etag.
      description: >
        06 §6. The body is the document, a JSON object. A studio may write to
        any collection name matching the manifest schema's pattern, declared
        or not. Each live record counts toward the `records` quota (Q20).
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Collection" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JSONObject" } } }
      responses:
        "201":
          description: The stored record.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }

  /records/{collection}/{id}:
    get:
      tags: [studio-api]
      operationId: recordsGet
      x-helm-group: records
      x-helm-method: get
      x-helm-capability: records
      summary: One record. Deleted, in another collection, or another studio's is 404.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Collection" }
        - { $ref: "#/components/parameters/RecordId" }
      responses:
        "200":
          description: The record.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [studio-api]
      operationId: recordsReplace
      x-helm-group: records
      x-helm-method: replace
      x-helm-capability: records
      summary: Replace a document. If-Match on the etag; 409 on conflict.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Collection" }
        - { $ref: "#/components/parameters/RecordId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JSONObject" } } }
      responses:
        "200":
          description: The replaced record.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    patch:
      tags: [studio-api]
      operationId: recordsPatch
      x-helm-group: records
      x-helm-method: patch
      x-helm-capability: records
      summary: Apply a JSON merge patch (RFC 7396). If-Match on the etag; 409 on conflict.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Collection" }
        - { $ref: "#/components/parameters/RecordId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/JSONObject" } } }
      responses:
        "200":
          description: The patched record.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      tags: [studio-api]
      operationId: recordsDelete
      x-helm-group: records
      x-helm-method: delete
      x-helm-capability: records
      summary: Soft-delete, so an undo is possible and a sync never sees a gap.
      description: 06 §6. The record stops counting toward the `records` quota.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Collection" }
        - { $ref: "#/components/parameters/RecordId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "204": { description: "Deleted." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ======================================================================
  # Assets (R34-R37, 06 §4, 07 §4)
  # ======================================================================

  /assets:
    post:
      tags: [studio-api]
      operationId: assetsUpload
      x-helm-group: assets
      x-helm-method: upload
      x-helm-capability: assets
      summary: Upload bytes. Idempotent on content.
      description: >
        R34, Q14. The body is the raw bytes. The daemon hashes them, writes
        `<name>.tmp`, fsyncs and renames into the blob store (06 §4), then
        makes the library hardlink. When the sha256 already exists, nothing is
        stored and the existing asset is returned with 200. Either way the
        caller gains read access to it (Q9). `pinned=true` pins; nothing
        unpins. Images are probed for width and height; video and audio take
        the hints given (Q13). A body over the upload limit is 413
        `too_large` with `details.limit`; a body the disk cannot hold, with
        the same headroom rule as weight downloads, is 507 `disk_space`
        (`QuotaExceeded`: out of room, do not retry) before anything is
        written (M4 first review, #16, second review #9; the limit's value
        is still open). The check uses the request's Content-Length when it
        is sent. An asset stays out of reclaim until an item or item
        input first references it (M4 first review, #3).
      security: [{ studioToken: [] }]
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: "#/components/schemas/AssetKind" }
        - name: filename
          in: query
          description: Names the library file and the blob's extension. Defaults to the asset id plus an extension from the mime.
          schema: { type: string, maxLength: 255 }
        - { $ref: "#/components/parameters/Pinned" }
        - { $ref: "#/components/parameters/HintWidth" }
        - { $ref: "#/components/parameters/HintHeight" }
        - { $ref: "#/components/parameters/HintDuration" }
        - { $ref: "#/components/parameters/HintFps" }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        "201":
          description: A new asset.
          content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } }
        "200":
          description: These bytes were already stored; the existing asset.
          content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }

  /assets:adopt:
    post:
      tags: [studio-api]
      operationId: assetsAdopt
      x-helm-group: assets
      x-helm-method: adopt
      x-helm-capability: assets
      summary: Adopt a file from the stage or data directory by hardlink — no copy, no HTTP body.
      description: >
        R34, 07 §4, Q10 as amended by the M4 first review (#4), Q11.

        **Where the file may be.** `path` must resolve, with no symlink in it,
        inside the caller's stage directory (`HELM_STAGE_DIR`, `paths.stage`)
        or its data directory (`{data}`, `paths.data`). Anywhere else is 422
        `outside_roots`. It must be a regular file (422 `not_a_file`).

        **What happens to it.** The file is hardlinked into the blob store and
        made read-only (0444).
        - From stage, the stage entry is then unlinked.
        - From data, the studio's file stays where it is. It is the blob's
          inode, so it is read-only too.

        **When the bytes already exist.** Nothing is stored and the existing
        asset returns with 200 (02 §7). A stage entry is unlinked; a data file
        is left alone.

        **Adoption never copies.** A blob hardlink that fails across volumes is
        422 `cross_device`, and the file is left in place. A library hardlink
        that fails across volumes still adopts, with `library_path` null and a
        warning.

        An asset stays out of reclaim until an item or item input first
        references it (M4 first review, #3).
      security: [{ studioToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdoptRequest" } } }
      responses:
        "201":
          description: A new asset.
          content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } }
        "200":
          description: These bytes were already stored; the existing asset.
          content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /assets/{id}:
    get:
      tags: [studio-api]
      operationId: assetsRead
      x-helm-group: assets
      x-helm-method: read
      x-helm-capability: assets
      summary: The asset's bytes, with Range.
      description: >
        R37. Readable by the rules in Q9; anything else is 404. `ETag` is the
        sha256. A single byte range answers 206; an unsatisfiable one 416
        (`Invalid`). When the row exists and its file does not, 410
        `asset_missing`. Needs the Bearer header; a studio's page loads it
        through the runtime SDK's same-origin proxy, which adds the header,
        as `/helm/api/v1/assets/{id}` (M6 Q10).
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssetId" }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        "200":
          description: The whole file.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content: { "*/*": { schema: { type: string, contentMediaType: application/octet-stream } } }
        "206":
          description: The requested range.
          headers:
            Content-Range: { schema: { type: string } }
          content: { "*/*": { schema: { type: string, contentMediaType: application/octet-stream } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "416":
          description: Range not satisfiable. Code `range_not_satisfiable`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /assets/{id}/thumb:
    get:
      tags: [studio-api]
      operationId: assetsThumb
      x-helm-group: assets
      x-helm-method: thumb
      x-helm-capability: assets
      summary: A thumbnail, generated once and cached.
      description: >
        R36, Q13. Images only in M4; video and audio answer 501 `unsupported`
        until the ffmpeg decision. The only width is 320 (02 §5's
        `thumb-320`). Needs the Bearer header; a studio's page loads it
        through the runtime SDK's same-origin proxy, as
        `/helm/api/v1/assets/{id}/thumb` (M6 Q10).
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssetId" }
        - name: w
          in: query
          schema: { type: integer, enum: [320], default: 320 }
      responses:
        "200":
          description: The thumbnail.
          content: { image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /assets/{id}/lineage:
    get:
      tags: [studio-api]
      operationId: assetsLineage
      x-helm-group: assets
      x-helm-method: lineage
      x-helm-capability: gallery
      summary: Downstream provenance — every item ever made from this asset, recursively.
      description: >
        02 §8, Q16. Follows `item_inputs` from the asset to the items that
        used it, then from each of those items' assets onward. Other studios'
        items are left out unless the caller holds `gallery.read_all`; the
        walk still passes through them, so a later own item is found. Ordered
        `created_at` descending. Soft-deleted items are left out of the
        result, and the walk passes through them too.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssetId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of items.
          content: { application/json: { schema: { $ref: "#/components/schemas/ItemPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assets:reclaim:
    get:
      tags: [launcher]
      operationId: assetsReclaimPreview
      x-helm-group: assets
      x-helm-method: reclaimPreview
      summary: Exactly which assets reclaim would delete, and the bytes freed.
      description: >
        Q12, 02 §8, M4 first review #1 and #3. An asset is reclaimable when
        all of these hold:

        - It is unpinned.
        - It was referenced by an item or item input at least once.
        - No live (not soft-deleted) item has it as its asset or as an input.
        - No timeline clip names it.

        `total_bytes` counts only assets whose stored file has no link outside
        the asset store and library: an asset adopted from a studio's `{data}`
        is still listed, and frees nothing while the studio keeps its file
        (second review #7). Each item in the preview lists the soft-deleted
        items that name the asset. Reclaim hard-deletes those, because until then a soft delete is
        undoable. Assets never referenced are counted in `unreferenced`, and
        never deleted. `confirm` is a digest of the exact set, including
        those items.
      responses:
        "200":
          description: The preview.
          content: { application/json: { schema: { $ref: "#/components/schemas/AssetReclaimPreview" } } }
    post:
      tags: [launcher]
      operationId: assetsReclaim
      x-helm-group: assets
      x-helm-method: reclaim
      summary: Delete exactly the previewed set.
      description: >
        Q12, 02 §8. When `confirm` no longer matches the current preview,
        nothing is deleted: 409 `preview_changed`, with the current preview in
        `details.preview`. Otherwise, in one transaction:

        1. Hard-delete every soft-deleted item listed. Its inputs, tags, inbox
           entries and search entry go with it.
        2. Delete the asset rows.

        After that commits, reclaim removes each asset's blob and derived
        directory. It removes the library file only when that path still holds
        the blob's inode; a file the user replaced there is left in place and
        reported in `kept_library_paths`.

        A soft-deleted item never blocks reclaim with a foreign-key error.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReclaimConfirm" } } }
      responses:
        "200":
          description: What was deleted.
          content: { application/json: { schema: { $ref: "#/components/schemas/AssetReclaimResult" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ======================================================================
  # Gallery (R38, 07 §5)
  # ======================================================================

  /gallery/items:
    post:
      tags: [studio-api]
      operationId: galleryAdd
      x-helm-group: gallery
      x-helm-method: add
      x-helm-capability: gallery
      summary: Record an output with its params, inputs, tags and session. One call per generation.
      description: >
        07 §5. The item, its inputs, its tags and its search entry are written
        in one transaction (06 §8). `asset_id` and every input's `asset_id`
        must be readable by the caller (Q9), else 404; `session_id` must be one
        of the caller's live sessions, else 422 `unknown_session` (Q15).
        Duplicate `(asset_id, role)` inputs and duplicate tags are collapsed.
      security: [{ studioToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ItemCreate" } } }
      responses:
        "201":
          description: The recorded item.
          content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [studio-api]
      operationId: galleryQuery
      x-helm-group: gallery
      x-helm-method: query
      x-helm-capability: gallery
      summary: Query items, scoped to the caller unless scope=all.
      description: >
        R38. `scope=all` needs `gallery.read_all` (403 otherwise). `studio`
        narrows `scope=all` to one studio. Filters combine with AND; `tag`
        repeats and every tag must be present. `q` is full-text over title and
        `params.prompt` (Q17), FTS5 query syntax. Ordered `created_at`
        descending, `id` breaking ties, with or without `q`. Deleted items are
        never returned.
      security: [{ studioToken: [] }]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [self, all], default: self }
        - name: studio
          in: query
          schema: { $ref: "#/components/schemas/StudioIdValue" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/AssetKind" }
        - name: tag
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: session_id
          in: query
          schema: { $ref: "#/components/schemas/ULID" }
        - name: starred
          in: query
          schema: { type: boolean }
        - name: asset_id
          in: query
          schema: { $ref: "#/components/schemas/ULID" }
        - name: since
          in: query
          description: Items created at or after this time.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Items created before this time.
          schema: { type: string, format: date-time }
        - name: q
          in: query
          schema: { type: string, maxLength: 500 }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of items.
          content: { application/json: { schema: { $ref: "#/components/schemas/ItemPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /gallery/items/{id}:
    get:
      tags: [studio-api]
      operationId: galleryGet
      x-helm-group: gallery
      x-helm-method: get
      x-helm-capability: gallery
      summary: One item. Another studio's without gallery.read_all, or a deleted one, is 404.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ItemId" }]
      responses:
        "200":
          description: The item.
          content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [studio-api]
      operationId: galleryUpdate
      x-helm-group: gallery
      x-helm-method: update
      x-helm-capability: gallery
      summary: Star, tag or rename one of the caller's own items.
      description: >
        07 §3, Q16, M4 first review #11. A JSON merge patch: `tags`, an array,
        replaces the whole set; `title: null` clears the title. Params,
        inputs, asset and session are provenance and cannot change. Another
        studio's item is 404, even with `gallery.read_all`.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ItemId" }]
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/ItemUpdate" } } }
      responses:
        "200":
          description: The updated item.
          content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [studio-api]
      operationId: galleryDelete
      x-helm-group: gallery
      x-helm-method: delete
      x-helm-capability: gallery
      summary: Soft-delete one of the caller's own items.
      description: >
        Q16, M4 first review #1. The item leaves every query, and every
        lineage result. Its row, inputs and tags stay until an asset reclaim
        takes one of the assets it names, which hard-deletes it (see POST
        /assets:reclaim). Until then the delete loses nothing. Its asset, and
        the assets it used as inputs, stop counting as referenced by it.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ItemId" }]
      responses:
        "204": { description: "Deleted." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /gallery/items/{id}/lineage:
    get:
      tags: [studio-api]
      operationId: galleryLineage
      x-helm-group: gallery
      x-helm-method: lineage
      x-helm-capability: gallery
      summary: Upstream provenance — the items whose outputs this item was made from, recursively.
      description: >
        Q16. From the item's inputs to the items whose asset is that input,
        then onward. Inputs no item produced (a user import) end the walk and
        are visible in each item's `inputs`. Other studios' items are left out
        unless the caller holds `gallery.read_all`; the walk still passes
        through them. Soft-deleted items are left out of the result, and the
        walk passes through them too. Ordered `created_at` descending.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of items.
          content: { application/json: { schema: { $ref: "#/components/schemas/ItemPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ======================================================================
  # Handoff and inbox (R39, 07 §5)
  # ======================================================================

  /handoff:
    post:
      tags: [studio-api]
      operationId: handoffSend
      x-helm-group: handoff
      x-helm-method: send
      x-helm-capability: handoff.send
      summary: Put an item in another studio's inbox.
      description: >
        R39, Q23. The item must be readable by the caller, else 404.
        `to_studio` must be a studio the daemon knows (404) and not the
        caller (422 `self_handoff`). Writes an inbox row and an `inbox` event
        to the target; the row lets the target read that item and its asset
        (Q9). The target need not be installed or running.
      security: [{ studioToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HandoffRequest" } } }
      responses:
        "201":
          description: Delivered to the inbox.
          content: { application/json: { schema: { $ref: "#/components/schemas/Handoff" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /inbox:
    get:
      tags: [studio-api]
      operationId: inboxList
      x-helm-group: inbox
      x-helm-method: list
      x-helm-capability: gallery
      summary: Handoffs to the caller not yet consumed, oldest first.
      description: >
        Q22. Reading does not consume. An entry whose item has since been
        deleted is still listed, with `item` null.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of pending entries.
          content: { application/json: { schema: { $ref: "#/components/schemas/InboxPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /inbox/{id}:consume:
    post:
      tags: [studio-api]
      operationId: inboxConsume
      x-helm-group: inbox
      x-helm-method: consume
      x-helm-capability: gallery
      summary: Mark an entry handled. Idempotent.
      description: >
        Q22. A consumed entry leaves the list. Consuming it again is 204.
        Another studio's entry is 404.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxId" }]
      responses:
        "204": { description: "Consumed." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ======================================================================
  # Jobs (R40, 02 §4) — a studio's view. The launcher's is /launcher/jobs.
  # ======================================================================

  /jobs:
    get:
      tags: [studio-api]
      operationId: jobsList
      x-helm-group: jobs
      x-helm-method: list
      x-helm-capability: jobs
      summary: The calling studio's jobs, of every kind, newest first.
      description: >
        R40. Only the token's studio: its install, build, download, update,
        export and uninstall jobs, and the task jobs it reported. Never another
        studio's (M4 first review, #2).
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of jobs.
          content: { application/json: { schema: { $ref: "#/components/schemas/JobPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [studio-api]
      operationId: jobsCreate
      x-helm-group: jobs
      x-helm-method: create
      x-helm-capability: jobs
      summary: Report a long-running piece of the studio's own work as a task job.
      description: >
        R40, Q24. The daemon runs nothing: the studio updates progress and
        state with PATCH, appends log lines, and ends the job itself. The job
        starts `running` unless `state: queued` is given.
      security: [{ studioToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskCreate" } } }
      responses:
        "201":
          description: The new task job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /jobs/{id}:
    get:
      tags: [studio-api]
      operationId: jobsGet
      x-helm-group: jobs
      x-helm-method: get
      x-helm-capability: jobs
      summary: One of the calling studio's jobs. Another studio's is 404.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: The job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [studio-api]
      operationId: jobsUpdate
      x-helm-group: jobs
      x-helm-method: update
      x-helm-capability: jobs
      summary: Report progress on, or finish, a task job the calling studio created.
      description: >
        Q24, M4 first review #11. A JSON merge patch. State may move
        `queued → running`, and from either to `succeeded`, `failed` or
        `cancelled`; a finished job cannot change (409 `job_finished`).
        `progress_num` must not exceed `progress_den`. `last_error: null`
        clears it. Only the studio's own `task` jobs: another studio's job is
        404, and one of its own lifecycle jobs is 403 `not_a_task`.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/TaskUpdate" } } }
      responses:
        "200":
          description: The updated job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/{id}:cancel:
    post:
      tags: [studio-api]
      operationId: jobsCancel
      x-helm-group: jobs
      x-helm-method: cancel
      x-helm-capability: jobs
      summary: Ask for one of the calling studio's task jobs to be cancelled.
      description: >
        Q24. Records `cancel_requested_at` and emits a `job` event. The job
        stays `running` until the studio ends it. Cancelling a finished job
        is 409 `job_finished`. A studio cannot cancel its own install, build,
        download or uninstall jobs (403 `not_a_task`); only the launcher can
        (POST /launcher/jobs/{id}:cancel). Another studio's job is 404.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "204": { description: "Cancellation requested." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/{id}/logs:
    get:
      tags: [studio-api]
      operationId: jobsLogs
      x-helm-group: jobs
      x-helm-method: logs
      x-helm-capability: jobs
      summary: One of the calling studio's job logs as server-sent events, from the start, then live until the job finishes.
      description: >
        Events: `step` when an install step's log begins, `line` per line, and
        `end` once the job has finished and every line has been sent. A task
        job has no `step` events. Another studio's job is 404.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      x-helm-events:
        step: { $ref: "#/components/schemas/JobLogStep" }
        line: { $ref: "#/components/schemas/JobLogLine" }
        end: { $ref: "#/components/schemas/JobLogEnd" }
      responses:
        "200":
          description: An event stream.
          content: { text/event-stream: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [studio-api]
      operationId: jobsAppendLog
      x-helm-group: jobs
      x-helm-method: appendLog
      x-helm-capability: jobs
      summary: Append lines to a running task job's log.
      description: >
        Q24. Written to a log file the daemon owns under the logs root, never
        into the database. A finished job is 409 `job_finished`; a lifecycle
        job is 403 `not_a_task`; another studio's job is 404.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LogAppend" } } }
      responses:
        "204": { description: "Appended." }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }

  # ======================================================================
  # Timeline and export (R44–R49, 05 §6, §7; docs/decisions.md M8 Q7–Q19)
  #
  # A sequence is the framework's document, not a studio's, and it is owned by
  # the studio that created it: that studio reads, edits and exports it, and so
  # does any studio holding gallery.read_all (Q11). Every clip must name an
  # asset the caller may read, checked again at export, so a sequence can never
  # carry bytes out of a studio that could not read them.
  #
  # Times are seconds, snapped by the daemon to the target's frames, or to its
  # samples for a clip on an audio track (Q7). What is stored and returned is
  # the snapped document, so writing it back changes nothing.
  # ======================================================================

  /timeline:
    post:
      tags: [studio-api]
      operationId: timelineCreate
      x-helm-group: timeline
      x-helm-method: create
      x-helm-capability: timeline
      summary: Create a sequence from clips, or from whole tracks.
      description: >
        R44, R45, 05 §7. Either `clips`, which are laid end to end from 0 on
        V1 for video and images and on A1 for sound, or `tracks` — not both.
        Neither makes an empty sequence, which is valid to store and cannot be
        exported until it has a video clip.

        `target.sample_rate` defaults to 48000 (Q9). Every clip must name an
        asset the caller may read (Q11); one it may not is 422
        `invalid_timeline`, worded the same whether or not the asset exists.
      security: [{ studioToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TimelineCreate" } } }
      responses:
        "201":
          description: The new sequence, as it was stored after snapping.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Timeline" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [studio-api]
      operationId: timelineList
      x-helm-group: timeline
      x-helm-method: list
      x-helm-capability: timeline
      summary: The sequences the caller may read, newest first.
      description: >
        Q11. The caller's own, and every studio's when it holds
        `gallery.read_all`. Deleted sequences are not listed.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of sequences.
          content: { application/json: { schema: { $ref: "#/components/schemas/TimelinePage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /timeline/{id}:
    get:
      tags: [studio-api]
      operationId: timelineGet
      x-helm-group: timeline
      x-helm-method: get
      x-helm-capability: timeline
      summary: One sequence. One the caller may not read is 404.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TimelineId" }]
      responses:
        "200":
          description: The sequence. `ETag` is its revision.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Timeline" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [studio-api]
      operationId: timelineUpdate
      x-helm-group: timeline
      x-helm-method: update
      x-helm-capability: timeline
      summary: Edit a sequence. Every edit is a revision.
      description: >
        05 §6, Q10. A JSON merge patch over `name`, `target` and `tracks`;
        `target` members merge, and `tracks` replaces. `If-Match` is required,
        and a stale one is 409 `etag_mismatch`. The document the patch produces
        is validated and snapped as a whole, and the document it replaces is
        kept as the previous revision.

        A clip this write adds must name an asset the caller may read; one
        already in the sequence may stay (Q11).
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TimelineId" }
        - { $ref: "#/components/parameters/IfMatchRequired" }
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/TimelineUpdate" } } }
      responses:
        "200":
          description: The sequence as it was stored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Timeline" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [studio-api]
      operationId: timelineDelete
      x-helm-group: timeline
      x-helm-method: delete
      x-helm-capability: timeline
      summary: Delete a sequence. Its exports and their lineage stay.
      description: >
        Q12. A soft delete: the row stays, so an exported item keeps naming it,
        and its clips stop holding their footage against reclaim. There is no
        restore. `If-Match` is checked when sent.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TimelineId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "204": { description: "Deleted." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /timeline/{id}/revisions:
    get:
      tags: [studio-api]
      operationId: timelineRevisions
      x-helm-group: timeline
      x-helm-method: revisions
      x-helm-capability: timeline
      summary: The sequence's earlier revisions, newest first.
      description: >
        Q10. Each write stores the document it replaced; the newest 100 are
        kept. Undo is `:revert`.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TimelineId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of revisions.
          content: { application/json: { schema: { $ref: "#/components/schemas/TimelineRevisionPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /timeline/{id}:revert:
    post:
      tags: [studio-api]
      operationId: timelineRevert
      x-helm-group: timeline
      x-helm-method: revert
      x-helm-capability: timeline
      summary: Write an earlier revision back as the newest one.
      description: >
        Q10. Undo is the previous revision, written forward rather than
        rewound, so nothing is lost. A revision naming an asset that has since
        been reclaimed, or one the caller may not read, is refused with the
        clips named (422 `invalid_timeline`). `If-Match` is required.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TimelineId" }
        - { $ref: "#/components/parameters/IfMatchRequired" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TimelineRevert" } } }
      responses:
        "200":
          description: The sequence, at its new revision.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Timeline" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /timeline:append:
    post:
      tags: [studio-api]
      operationId: timelineAppend
      x-helm-group: timeline
      x-helm-method: append
      x-helm-capability: timeline
      summary: Add one asset to the end of a track, without stealing focus.
      description: >
        R45, Q19. With `timeline_id`, that sequence; without one, the most
        recently updated sequence the caller owns, and 409 `no_timeline` when
        it owns none. `track` names a track by kind and position — `V1`, `A1`,
        `A2` — and defaults to `V1` for a video or image asset and `A1` for
        sound. It applies to whatever the current revision is, so it needs no
        `If-Match`.
      security: [{ studioToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TimelineAppend" } } }
      responses:
        "200":
          description: The sequence, with the clip appended.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Timeline" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /timeline/{id}:open:
    post:
      tags: [studio-api]
      operationId: timelineOpen
      x-helm-group: timeline
      x-helm-method: open
      x-helm-capability: timeline
      summary: Ask the framework to show its editor on this sequence.
      description: >
        R45, 05 §5a, §7, Q19. The data operation always works and only the
        presentation degrades: until the launcher has a Timeline screen, which
        waits for M9's cookie (Q20), this answers 501 `unsupported` with a
        reason, and a studio hides its button. From then it publishes the
        sequence to a connected launcher page and answers `{opened, surface}`,
        or 501 when no page is connected.
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TimelineId" }]
      responses:
        "200":
          description: A framework surface opened the sequence.
          content: { application/json: { schema: { $ref: "#/components/schemas/TimelineOpened" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /timeline/{id}:plan:
    get:
      tags: [studio-api]
      operationId: timelinePlan
      x-helm-group: timeline
      x-helm-method: plan
      x-helm-capability: timeline
      summary: Which path an export would take, and why.
      description: >
        R47, Q13. Every video clip is probed, and the answer is `copy` when
        every one of them matches the target and each other — codec, profile,
        level, size, aspect ratio, field order, pixel format, time base, frame
        rate, colour tags and parameter sets — and is used whole, with no hold,
        image or transition. Otherwise `conform`, with a reason per clip.

        The picture is copied; sound always goes through the conform graph,
        because a copied AAC stream carries its own priming and padding into
        every cut. So the chip reads "video stream copy", not "no re-encode".

        Needs ffmpeg: without it, 501 `unsupported` with `details.tool`.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TimelineId" }
        - name: preset
          in: query
          schema: { $ref: "#/components/schemas/ExportPreset" }
      responses:
        "200":
          description: The plan.
          content: { application/json: { schema: { $ref: "#/components/schemas/ExportPlan" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /timeline/{id}:export:
    post:
      tags: [studio-api]
      operationId: timelineExport
      x-helm-group: timeline
      x-helm-method: export
      x-helm-capability: timeline
      summary: Export the sequence. Answers with the job that renders it.
      description: >
        R46, R48, Q16, Q17. Export is a Job, so progress, cancellation and the
        log are the ones that already exist. The output is written where
        nothing looks for it and becomes an asset only after ffmpeg exits 0 and
        the file is probed against the target; then it is adopted, and recorded
        as a gallery item carrying `timeline_id` with one `clip` input per
        distinct asset.

        A sequence with no video clip is 422 `invalid_timeline`. A clip the
        caller may no longer read is 422. One export at a time per sequence:
        another is 409 `already_exporting`. Needs ffmpeg (501 `unsupported`).
      security: [{ studioToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TimelineId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExportRequest" } } }
      responses:
        "202":
          description: The export job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "501": { $ref: "#/components/responses/Unsupported" }

  /timeline/{id}/exports:
    get:
      tags: [studio-api]
      operationId: timelineExports
      x-helm-group: timeline
      x-helm-method: exports
      x-helm-capability: timeline
      summary: The sequence's export jobs, newest first.
      description: >
        Q17. Under `timeline`, so a studio that exports need not also hold
        `jobs` to watch what it started. The same jobs appear in `/jobs` for a
        studio that does hold it.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TimelineId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of export jobs.
          content: { application/json: { schema: { $ref: "#/components/schemas/JobPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /timeline/{id}/exports/{job}:cancel:
    post:
      tags: [studio-api]
      operationId: timelineCancelExport
      x-helm-group: timeline
      x-helm-method: cancelExport
      x-helm-capability: timeline
      summary: Stop a running export and leave nothing behind.
      description: >
        Q16, Q17. The ffmpeg leading the export's process group is stopped and
        its partial file removed; the job ends `cancelled`. A finished job is
        409 `job_finished`. The launcher's
        `POST /launcher/jobs/{id}:cancel` reaches the same runner.
      security: [{ studioToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TimelineId" }
        - { $ref: "#/components/parameters/ExportJobId" }
      responses:
        "204": { description: "Cancellation requested." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ======================================================================
  # Launcher: the job queue (docs/decisions.md M3; separated from /jobs by
  # the M4 first review, #2)
  # ======================================================================

  /launcher/jobs:
    get:
      tags: [launcher]
      operationId: launcherJobsList
      x-helm-group: jobs
      x-helm-method: list
      summary: Every studio's install, build, download, update, export and uninstall jobs, newest first.
      description: >
        No token. Never `task` jobs: those are a studio's own data and reach
        only that studio's token (Q7).
      parameters:
        - name: studio
          in: query
          schema: { $ref: "#/components/schemas/StudioIdValue" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of jobs.
          content: { application/json: { schema: { $ref: "#/components/schemas/JobPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /launcher/jobs/{id}:
    get:
      tags: [launcher]
      operationId: launcherJobsGet
      x-helm-group: jobs
      x-helm-method: get
      summary: One lifecycle job, with its steps. A task job is 404.
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: The job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /launcher/jobs/{id}:cancel:
    post:
      tags: [launcher]
      operationId: launcherJobsCancel
      x-helm-group: jobs
      x-helm-method: cancel
      summary: Cancel an install, build, download or uninstall.
      description: >
        docs/decisions.md M3. The running step's process group is killed and
        completed work kept. A finished job is 409 `job_finished`; a task job
        is 404.
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "204": { description: "Cancelled." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /launcher/jobs/{id}/logs:
    get:
      tags: [launcher]
      operationId: launcherJobsLogs
      x-helm-group: jobs
      x-helm-method: logs
      summary: A lifecycle job's build log as server-sent events. A task job is 404.
      description: Events as for GET /jobs/{id}/logs.
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      x-helm-events:
        step: { $ref: "#/components/schemas/JobLogStep" }
        line: { $ref: "#/components/schemas/JobLogLine" }
        end: { $ref: "#/components/schemas/JobLogEnd" }
      responses:
        "200":
          description: An event stream.
          content: { text/event-stream: { schema: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ======================================================================
  # Launcher: studios, install, supervision (01 §6-7; M2 and M3 as served)
  # ======================================================================

  /studios:
    get:
      tags: [launcher]
      operationId: studiosList
      x-helm-group: studios
      x-helm-method: list
      summary: The library — every studio this machine knows about, from every source, ordered by id.
      description: >
        R3b, M7 Q6 and Q18. The library is the set of studios this machine
        knows about, of which installed ones are a subset. One entry per id,
        decided by the highest source that has a file for it — local, the
        repository, then the registry pointer's inline manifest — and decided
        by **existence, not validity**: an invalid winner is listed invalid,
        with its source, its file and its errors, and the lower sources are not
        read in its place. Every entry carries `source`, and `overrides` when
        it shadows another.

        Includes studios still running from a previous daemon whose manifest
        is gone or invalid (`manifest_loaded: false`; M2 review round 1).

        Nothing here touches the network: startup reads the bundled registry,
        the local directory, installed checkouts and the manifest cache, and a
        pointer with nothing cached is listed with `manifest_state: not_fetched`
        (Q7).
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of studios.
          content: { application/json: { schema: { $ref: "#/components/schemas/StudioPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /studios/{id}:
    get:
      tags: [launcher]
      operationId: studiosGet
      x-helm-group: studios
      x-helm-method: get
      summary: One studio.
      parameters: [{ $ref: "#/components/parameters/StudioId" }]
      responses:
        "200":
          description: The studio.
          content: { application/json: { schema: { $ref: "#/components/schemas/Studio" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /studios/{id}:install:
    post:
      tags: [launcher]
      operationId: studiosInstall
      x-helm-group: studios
      x-helm-method: install
      summary: Clone at the pinned ref, run build[], fetch required weights.
      description: >
        R7-R19, docs/decisions.md M3. Install while an install runs returns
        that job. Refused while the studio runs (409 `conflict`), for a host
        that fails `requires` (422 `blocked`), and, before anything is cloned,
        for a manifest declaring `python` when uv is not on PATH (422
        `blocked` with `details: {code: tool_missing, tool: uv}`,
        docs/decisions.md M5 Q3).

        Needs `approval` unless the recorded one already matches (M7 Q10), and
        checks out **the approved commit** rather than the ref's tip — so a
        branch that moved after the screen was shown still builds what was
        approved.
      parameters:
        - { $ref: "#/components/parameters/StudioId" }
        - { $ref: "#/components/parameters/Approval" }
      responses:
        "202":
          description: The install job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /studios/{id}:retry:
    post:
      tags: [launcher]
      operationId: studiosRetry
      x-helm-group: studios
      x-helm-method: retry
      summary: Install again, resuming at the first step that has not succeeded. The same operation as :install.
      description: Needs `approval` on the same terms as `:install` (M7 Q10).
      parameters:
        - { $ref: "#/components/parameters/StudioId" }
        - { $ref: "#/components/parameters/Approval" }
      responses:
        "202":
          description: The install job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /studios/{id}:uninstall:
    post:
      tags: [launcher]
      operationId: studiosUninstall
      x-helm-group: studios
      x-helm-method: uninstall
      summary: Stop the group and remove the checkout helmstudio cloned. Weights and data are kept.
      description: R67, docs/decisions.md M3 Q9 and Q11.
      parameters: [{ $ref: "#/components/parameters/StudioId" }]
      responses:
        "202":
          description: The uninstall job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /studios/{id}:launch:
    post:
      tags: [launcher]
      operationId: studiosLaunch
      x-helm-group: studios
      x-helm-method: launch
      summary: Start the process group in dependency order, health-gating each member.
      description: >
        R20-R25, docs/decisions.md M2 and M5 Q12-Q13. A second heavy group is
        refused with 409 `heavy_conflict`: the arithmetic, what the running
        studio's `busy` probe answered, and a `confirm` digest are in
        `details.heavy`. `preempt=<details.heavy.confirm>` stops the running
        heavy group first. A digest that no longer describes the running group
        (another group runs, or it became busy, idle or unknown, or loaded or
        unloaded a model) is 409 `preview_changed` with `details.heavy` as it
        is now, and nothing is stopped. 409 `already_running`,
        `port_conflict`; 422 `not_launchable` (not installed, a weight not
        fetched, a missing linked directory, a missing or mismatched Python
        environment).

        Needs `approval` unless the recorded one matches (M7 Q10): `cmd` and
        `health.exec` run here and never passed through install, so an Override
        that edits a command shows the user the change instead of running it.
        A studio with `selectable` weights and no selection is 422
        `selection_required`, listing the choices (M7 Q21).
      parameters:
        - { $ref: "#/components/parameters/StudioId" }
        - { $ref: "#/components/parameters/Approval" }
        - name: preempt
          in: query
          description: The `confirm` digest from the heavy_conflict refusal the user confirmed.
          schema: { type: string, maxLength: 64 }
      responses:
        "202":
          description: The group, starting.
          content: { application/json: { schema: { $ref: "#/components/schemas/ProcessGroup" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /studios/{id}:stop:
    post:
      tags: [launcher]
      operationId: studiosStop
      x-helm-group: studios
      x-helm-method: stop
      summary: SIGTERM the group in reverse dependency order, SIGKILL after the grace period.
      description: R26, docs/decisions.md M2. The group's studio token is revoked and its stage directory removed (Q6, 07 §4).
      parameters: [{ $ref: "#/components/parameters/StudioId" }]
      responses:
        "202":
          description: Stopping.
          content: { application/json: { schema: { $ref: "#/components/schemas/Stopping" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /studios/{id}/processes:
    get:
      tags: [launcher]
      operationId: studiosProcesses
      x-helm-group: studios
      x-helm-method: processes
      summary: The studio's current or most recent process group.
      parameters: [{ $ref: "#/components/parameters/StudioId" }]
      responses:
        "200":
          description: The group.
          content: { application/json: { schema: { $ref: "#/components/schemas/ProcessGroup" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /studios/{id}/logs:
    get:
      tags: [launcher]
      operationId: studiosLogFiles
      x-helm-group: studios
      x-helm-method: logFiles
      summary: The studio's retained run logs, newest first.
      description: R30. The last five group runs per studio.
      parameters:
        - { $ref: "#/components/parameters/StudioId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of log files.
          content: { application/json: { schema: { $ref: "#/components/schemas/LogFilePage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /studios/{id}/processes/{name}/logs:
    get:
      tags: [launcher]
      operationId: studiosProcessLog
      x-helm-group: studios
      x-helm-method: processLog
      summary: One process's output as server-sent events.
      description: >
        docs/decisions.md M2. Events: `line` (id: its sequence), `gap` (lines
        this viewer lost for being slow, or bytes the daemon skipped), `end`
        when the process is not live and its tail has been sent. Resume with
        `Last-Event-ID`.
      parameters:
        - { $ref: "#/components/parameters/StudioId" }
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      x-helm-events:
        line: { $ref: "#/components/schemas/ProcessLogLine" }
        gap: { $ref: "#/components/schemas/ProcessLogLine" }
        end: { $ref: "#/components/schemas/ProcessLogEnd" }
      responses:
        "200":
          description: An event stream.
          content: { text/event-stream: { schema: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /studios/{id}/weights/{name}:link:
    post:
      tags: [launcher]
      operationId: weightsLink
      x-helm-group: weights
      x-helm-method: link
      summary: Use a directory the user already has for a declared weight, instead of downloading.
      description: >
        R14a, docs/decisions.md M3 Q23 and review round 1 #6. The directory is
        never written to. 422 `not_linkable` names what the directory lacks.
      parameters:
        - { $ref: "#/components/parameters/StudioId" }
        - { $ref: "#/components/parameters/WeightName" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LinkRequest" } } }
      responses:
        "200":
          description: The linked artifact.
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelArtifact" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /studios/{id}/weights/{name}:fetch:
    post:
      tags: [launcher]
      operationId: weightsFetch
      x-helm-group: weights
      x-helm-method: fetch
      summary: Download an optional weight.
      description: docs/decisions.md M3 Q6.
      parameters:
        - { $ref: "#/components/parameters/StudioId" }
        - { $ref: "#/components/parameters/WeightName" }
      responses:
        "202":
          description: The download job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /studios/{id}/manifest:
    get:
      tags: [launcher]
      operationId: studiosManifest
      x-helm-group: studios
      x-helm-method: manifest
      summary: The resolved manifest text, with its digest, source and file.
      description: >
        Q17, Q18. The text as stored, byte for byte — the same bytes Export
        writes — so an editor round-trips comments and key order. `digest` is
        what `If-Match` on a save compares.
      parameters: [{ $ref: "#/components/parameters/StudioId" }]
      responses:
        "200":
          description: The manifest.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManifestDoc" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /studios/{id}/approval:
    get:
      tags: [launcher]
      operationId: studiosApproval
      x-helm-group: studios
      x-helm-method: approval
      summary: What would run, and the digest that authorises it.
      description: >
        R62, R63, Q10-Q13. Reads the repository and resolves `ref` to a commit
        first, so the preview shows the source that will actually be used, then
        returns every command grouped by when it runs, the submodules, the
        weights with sizes, the capabilities as sentences, the declared hosts
        and the derived level.

        **Only checks that execute nothing run.** Theme conformance and the
        smoke test are listed as not run, with the reason, never as passes.

        `digest` covers everything that executes and where it comes from: the
        id, source and resolved commit, the submodules, every command with its
        `cwd`, `shell` and `env`, the capabilities, the network hosts,
        `python.version` and the declared weights. It does **not** cover sizes,
        free disk or the checkpoint selection (Q21).

        Reading a repository needs the network; a repository that cannot be
        reached is 503 with what is known.
      parameters: [{ $ref: "#/components/parameters/StudioId" }]
      responses:
        "200":
          description: The preview.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalPreview" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /studios/{id}/selection:
    put:
      tags: [launcher]
      operationId: studiosSelect
      x-helm-group: studios
      x-helm-method: select
      summary: Choose which of a studio's selectable weights it launches with.
      description: >
        Q20, Q21. Exactly one selectable binding per studio is selected, which a
        partial unique index enforces rather than a check in Go. Changing it
        while the studio runs is 409 `conflict`; choosing a weight that is
        neither downloaded nor linked is 409 `not_fetched`, naming `:fetch` and
        `:link`. Changing it while stopped needs **no new approval** — every
        selectable weight was approved with the manifest.
      parameters: [{ $ref: "#/components/parameters/StudioId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SelectionRequest" } } }
      responses:
        "200":
          description: The studio, with its new selection.
          content: { application/json: { schema: { $ref: "#/components/schemas/Studio" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ======================================================================
  # Launcher: writing manifests (R3a-R3d, 05 §5a; docs/decisions.md M7 Q17-Q19)
  #
  # The page never parses YAML. It sends text and gets back errors with lines,
  # the criteria and the document as JSON; a form edit goes as a JSON pointer
  # and a value, and the daemon applies it to the node tree. A second parser in
  # JavaScript would disagree with this one about anchors, merge keys, `on` and
  # duplicate keys — and would show one manifest while validating another.
  # ======================================================================

  /launcher/manifests:validate:
    post:
      tags: [launcher]
      operationId: manifestsValidate
      x-helm-group: manifests
      x-helm-method: validate
      summary: Validate manifest or registry-entry text. Writes nothing.
      description: >
        Q17. The same validator `helm validate` and the daemon's loader use,
        through one bytes entry point — a test requires the same verdict and
        the same errors from all three for every file in
        `internal/manifest/testdata` and `studios/`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManifestText" } } }
      responses:
        "200":
          description: The verdict, whether or not it is valid.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManifestCheck" } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /launcher/manifests:edit:
    post:
      tags: [launcher]
      operationId: manifestsEdit
      x-helm-group: manifests
      x-helm-method: edit
      summary: Apply one field edit to manifest text, keeping comments and key order. Writes nothing.
      description: >
        Q17. The edit is a JSON pointer and a value; the daemon applies it to
        the YAML node tree and returns the new text. A `null` value removes the
        key. This is how the form and the YAML pane stay one document.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManifestEdit" } } }
      responses:
        "200":
          description: The edited text, with the verdict for it.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManifestCheck" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /launcher/manifests/{id}:
    put:
      tags: [launcher]
      operationId: manifestsSave
      x-helm-group: manifests
      x-helm-method: save
      summary: Save a local manifest or pointer, creating the Local entry that overrides lower sources.
      description: >
        R3a, Q5, Q18. Written to `<data>/studios/<id>.yaml`. An invalid
        document is refused with its errors (422) rather than saved broken.
        `If-Match` carries the digest the editor last read, so two tabs cannot
        silently overwrite each other; without it a save over an existing file
        is 428.

        Saving does not install, launch or rebuild anything. If the studio is
        installed, the card shows `rebuild_needed`, and the next install or
        launch goes through approval — which is what makes an Override that
        edits a command show the change instead of running it (Q10).
      parameters:
        - { $ref: "#/components/parameters/StudioId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManifestText" } } }
      responses:
        "200":
          description: The saved manifest.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManifestDoc" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The document is invalid, and was not saved.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManifestCheck" } } }
        "428": { $ref: "#/components/responses/IfMatchRequired" }
    delete:
      tags: [launcher]
      operationId: manifestsRevert
      x-helm-group: manifests
      x-helm-method: revert
      summary: Revert a local manifest, so the source beneath it resolves again.
      description: >
        R3a, Q9. **The file is moved, never deleted**: it goes to
        `<data>/studios/_reverted/<id>-<timestamp>.yaml`, which is not scanned,
        and the response says where. A Revert that deleted could destroy the
        only copy of something the user wrote. The underscore matters — an id
        cannot start with one, so the directory can never collide with a
        studio's own.

        An installed or running studio is left alone: the group keeps running
        and the next install or launch goes through approval.
      parameters: [{ $ref: "#/components/parameters/StudioId" }]
      responses:
        "200":
          description: Where the file went, and what resolves now.
          content: { application/json: { schema: { $ref: "#/components/schemas/RevertResult" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /launcher/manifests/{id}:duplicate:
    post:
      tags: [launcher]
      operationId: manifestsDuplicate
      x-helm-group: manifests
      x-helm-method: duplicate
      summary: Copy an entry to a Local manifest under a new id, changing the id and nothing else.
      description: >
        R3a, Q9. For a repository entry the resolved text is copied. Forking a
        studio to point at different weights or flags is this plus an edit.
        A `new_id` already in the library is 409 `id_taken`.
      parameters: [{ $ref: "#/components/parameters/StudioId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DuplicateRequest" } } }
      responses:
        "200":
          description: The new manifest.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManifestDoc" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /launcher/manifests:import:
    post:
      tags: [launcher]
      operationId: manifestsImport
      x-helm-group: manifests
      x-helm-method: import
      summary: Report on manifests given as text or fetched from a URL, then add them on confirmation.
      description: >
        R3c, Q14, Q18. Two phases. Without `confirm`, every item is read and
        reported — what it is, whether it is valid, whether its id collides —
        and a `confirm` digest is returned; **nothing is written**. With
        `{confirm, resolutions}`, exactly the reported set is added, each item
        Overridden, Renamed or Skipped. A stale digest is 409 `preview_changed`.

        **Import is not install.** An imported manifest is a description until
        the user installs it, and installing it goes through approval like
        anything else (Q10) — including one with `local_path`, which the report
        flags as "builds in &lt;path&gt; on this Mac, without cloning".

        **A URL is fetched under Q14's rules:** `https://` only, no redirect to
        another scheme or host, refused when the host resolves to a loopback,
        link-local or private address, at most 1 MiB, 10 s, no cookies or
        credentials. Bytes that are not a manifest are never echoed back as
        text. Files, drops and paste are read by the page and sent as `text`:
        the daemon opens no path a request names.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ImportRequest" } } }
      responses:
        "200":
          description: The report, or what was added.
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /launcher/repositories:read:
    post:
      tags: [launcher]
      operationId: repositoriesRead
      x-helm-group: repositories
      x-helm-method: read
      summary: Read a repository's manifest without cloning or installing it. Writes nothing.
      description: >
        R3b, Q7, Q8, Q14. Git only, never a forge's HTTP API: a depth-1 fetch
        of the ref without file contents, then only `helmstudio.yaml` and
        `.gitmodules`, with the resolved commit recorded. A repository that
        ships no manifest answers with `found: false` and the resolved commit,
        which is what the editor pre-fills `repo` and `ref` from.

        `{path}` is "From folder": a **typed absolute path**, from which only
        `&lt;path&gt;/helmstudio.yaml` is read. There is deliberately no
        directory-listing endpoint, and a browser folder picker never gives a
        page an absolute path — so this is a thing a person types, not a thing
        a page discovers.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RepositoryRead" } } }
      responses:
        "200":
          description: What the repository holds.
          content: { application/json: { schema: { $ref: "#/components/schemas/RepositoryResult" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ======================================================================
  # Launcher: the weights cache (01 §6, 02 §4; M3 as served)
  # ======================================================================

  /models:
    get:
      tags: [launcher]
      operationId: modelsList
      x-helm-group: models
      x-helm-method: list
      summary: Every model artifact, newest first, with the studios bound to it.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of artifacts.
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelArtifactPage" } } }
        "400": { $ref: "#/components/responses/Invalid" }

  /models/{id}:
    get:
      tags: [launcher]
      operationId: modelsGet
      x-helm-group: models
      x-helm-method: get
      summary: One artifact, with the one-item reclaim preview a DELETE must confirm when it is an unused download.
      parameters: [{ $ref: "#/components/parameters/ModelId" }]
      responses:
        "200":
          description: The artifact.
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelArtifactView" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [launcher]
      operationId: modelsDelete
      x-helm-group: models
      x-helm-method: delete
      summary: Unlink a linked artifact, or reclaim an unused download with the confirm from its preview.
      description: >
        docs/decisions.md M3 review round 1 #3. A linked artifact: the symlink
        is removed, never the user's directory. A download: only with
        `confirm`; without it 409 `confirm_required`, with a stale one 409
        `preview_changed`, both carrying `details.preview`. 409 `in_use` names
        the studios bound to it; 409 `not_reclaimable` while it downloads.
      parameters:
        - { $ref: "#/components/parameters/ModelId" }
        - name: confirm
          in: query
          schema: { type: string }
      responses:
        "204": { description: "Unlinked or deleted." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /models:reclaim:
    get:
      tags: [launcher]
      operationId: modelsReclaimPreview
      x-helm-group: models
      x-helm-method: reclaimPreview
      summary: Exactly which downloads reclaim would delete — managed artifacts no studio is bound to.
      responses:
        "200":
          description: The preview.
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelReclaimPreview" } } }
    post:
      tags: [launcher]
      operationId: modelsReclaim
      x-helm-group: models
      x-helm-method: reclaim
      summary: Delete exactly the previewed set, or nothing (409 preview_changed with the current preview).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReclaimConfirm" } } }
      responses:
        "200":
          description: What was deleted.
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelReclaimPreview" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }

  /models:disk:
    get:
      tags: [launcher]
      operationId: modelsDisk
      x-helm-group: models
      x-helm-method: disk
      summary: The models directory and the free space on its volume.
      description: >
        03 §12's "285 GB free", read when asked. A directory that does not exist
        yet is measured on the nearest one above it that does. Its own document
        because a page carries only its items.
      responses:
        "200":
          description: The models directory and its free space.
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelsDisk" } } }

  # ======================================================================
  # Theme (03 §5, 07 §6; docs/decisions.md M6 Q8, Q9)
  # ======================================================================

  /launcher/settings/theme:
    get:
      tags: [launcher]
      operationId: launcherThemeGet
      x-helm-group: settings
      x-helm-method: theme
      summary: The launcher's theme.
      description: >
        Stored in `settings` (02 §5, schema v5); `system` when none is set.
      responses:
        "200":
          description: The theme.
          content: { application/json: { schema: { $ref: "#/components/schemas/ThemeEvent" } } }
    put:
      tags: [launcher]
      operationId: launcherThemeSet
      x-helm-group: settings
      x-helm-method: setTheme
      summary: Set the launcher's theme; every running studio follows it.
      description: >
        Stores the theme and emits `theme` on `/events` and on
        `/theme/events` at once, whether or not it changed. The body is
        exactly `{theme}`. A value other than system, light or dark is 422
        `invalid_theme`; a body that does not parse, or has another member,
        is 400 `bad_request`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThemeEvent" } } }
      responses:
        "200":
          description: The theme now.
          content: { application/json: { schema: { $ref: "#/components/schemas/ThemeEvent" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "422": { $ref: "#/components/responses/Invalid" }

  # ======================================================================
  # Launcher: the Hugging Face token (01 §1 R18, R43; docs/decisions.md M6 Q21)
  # ======================================================================

  /launcher/settings/huggingface-token:
    get:
      tags: [launcher]
      operationId: launcherHFTokenGet
      x-helm-group: settings
      x-helm-method: huggingFaceToken
      summary: Whether a Hugging Face token is stored, and when it was added. Never the token itself.
      description: >
        R43, Q21. The token lives in the OS secret store, never in `helm.db`
        and never in a response: the database records only that one exists and
        when it was added (internal/platform.SecretStore). A token added by
        hand outside helmstudio is `present` with no `added_at`. On a platform
        with no secret store, `present` is false and `unsupported` says why.
      responses:
        "200":
          description: What is known about the stored token.
          content: { application/json: { schema: { $ref: "#/components/schemas/SecretState" } } }
    put:
      tags: [launcher]
      operationId: launcherHFTokenSet
      x-helm-group: settings
      x-helm-method: setHuggingFaceToken
      summary: Store or replace the Hugging Face token.
      description: >
        R18, R43, Q21. Write-only: the value is handed to the OS secret store
        and never read back. An empty token, or one outside printable ASCII,
        is 422 `invalid_token`; a body that does not parse, or has another
        member, is 400 `bad_request`. A platform with no secret store is 501
        `unsupported`. The stored token is read afresh for every Hugging Face
        request, so one added while a download is retrying is used next.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SecretSet" } } }
      responses:
        "200":
          description: What is known about the token now.
          content: { application/json: { schema: { $ref: "#/components/schemas/SecretState" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "422": { $ref: "#/components/responses/Invalid" }
        "501": { $ref: "#/components/responses/Unsupported" }
    delete:
      tags: [launcher]
      operationId: launcherHFTokenDelete
      x-helm-group: settings
      x-helm-method: deleteHuggingFaceToken
      summary: Remove the stored Hugging Face token.
      description: >
        Q21. Deleting when none is stored is 204, so the button is idempotent.
        A platform with no secret store is 501 `unsupported`.
      responses:
        "204": { description: "No token is stored." }
        "501": { $ref: "#/components/responses/Unsupported" }

  # ======================================================================
  # Launcher: about this daemon (03 §12a; the launcher redesign)
  # ======================================================================

  /launcher/settings/about:
    get:
      tags: [launcher]
      operationId: launcherAboutGet
      x-helm-group: settings
      x-helm-method: about
      summary: This daemon's version, the API and SDK majors it serves, and the directories it uses.
      description: >
        What Settings shows under This Mac and About. The SDK majors are what a
        manifest's `sdk` pins are checked against at launch (04 §9). A daemon
        started without its directories answers 501 `unsupported`.
      responses:
        "200":
          description: About this daemon.
          content: { application/json: { schema: { $ref: "#/components/schemas/LauncherAbout" } } }
        "501": { $ref: "#/components/responses/Unsupported" }

  /theme:
    get:
      tags: [public]
      operationId: themeGet
      summary: The launcher's theme, for a studio's page.
      description: >
        No token. Exempt from the Origin check, answered with
        `Access-Control-Allow-Origin: *` (M6 Q9).
      responses:
        "200":
          description: The theme.
          content: { application/json: { schema: { $ref: "#/components/schemas/ThemeEvent" } } }

  /theme/events:
    get:
      tags: [public]
      operationId: themeEvents
      summary: The launcher's theme as a stream a studio's page follows.
      description: >
        No token. Exempt from the Origin check, answered with
        `Access-Control-Allow-Origin: *` (M6 Q9). The current theme is sent
        at once, then every change, each as `event: theme` with `data:` a
        ThemeEvent and no `id:`; there is nothing to resume, since the first
        event after a reconnect is the current theme. `: ping` comments keep
        the connection open. The runtime SDK's browser `themeBridge()` reads it.
      x-helm-events:
        theme: { $ref: "#/components/schemas/ThemeEvent" }
      responses:
        "200":
          description: An event stream.
          content: { text/event-stream: { schema: { type: string } } }

components:

  securitySchemes:
    studioToken:
      type: http
      scheme: bearer
      description: >
        HELM_TOKEN, minted per launch for one studio and its declared
        capabilities, revoked when its group stops (07 §3, Q6). Format
        `hs_live_` plus 52 base32 characters.

  headers:
    ETag:
      description: The resource's etag, quoted. Send it back in If-Match.
      schema: { type: string }

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page, unchanged.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      description: The etag last read. When given and stale, the write is refused with 409 `etag_mismatch`.
      schema: { type: string }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: >
        The revision last read, as the `ETag` header gave it. Required on a
        timeline write, because a merge patch replaces `tracks` whole and a
        blind write would drop another editor's clips (docs/decisions.md M8
        Q10). A stale one is 409 `etag_mismatch`.
      schema: { type: string }
    Namespace:
      name: ns
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_.-]{0,63}$" }
    Key:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,200}$" }
    Collection:
      name: collection
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]*$", maxLength: 64 }
    Approval:
      name: approval
      in: query
      description: >
        The digest from `GET /studios/{id}/approval`, confirming that what is
        about to run is what was shown (M7 Q10). Required whenever the recorded
        approval does not match what would run now; with none the answer is 409
        `approval_required` with the preview in `details`, and with a stale one
        409 `preview_changed`. Nothing is cloned, built or spawned in either
        case.
      schema: { type: string }

    StudioId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/StudioIdValue" }
    WeightName:
      name: name
      in: path
      required: true
      schema: { type: string }
    ModelId:      { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    SessionId:    { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    RecordId:     { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    AssetId:      { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    ItemId:       { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    InboxId:      { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    JobId:        { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    TimelineId:   { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    ExportJobId:  { name: job, in: path, required: true, schema: { $ref: "#/components/schemas/ULID" } }
    Pinned:
      name: pinned
      in: query
      description: A user import. Pinned assets are never reclaimed; nothing unpins.
      schema: { type: boolean, default: false }
    HintWidth:    { name: width, in: query, schema: { type: integer, minimum: 1 } }
    HintHeight:   { name: height, in: query, schema: { type: integer, minimum: 1 } }
    HintDuration: { name: duration_s, in: query, schema: { type: number, exclusiveMinimum: 0 } }
    HintFps:      { name: fps, in: query, schema: { type: number, exclusiveMinimum: 0 } }

  responses:
    Invalid:
      description: >
        The request is malformed. Codes: `bad_request`, `bad_filter`,
        `bad_cursor`, `invalid_document`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: No studio token, or a revoked or unknown one. Code `unauthenticated`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: >
        The token lacks a capability (`capability_required`, with
        `details.capability`), the job is not a task the studio may change
        (`not_a_task`), or the request came from another origin (`bad_origin`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Absent, deleted, or not the caller's to see. Code `not_found`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Gone:
      description: The asset's row exists and its file does not. Code `asset_missing`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: >
        Codes: `etag_mismatch`, `name_taken`, `job_finished`,
        `already_running`, `not_running`, `port_conflict`, `heavy_conflict`
        (with `details.heavy`), `not_installed`, `conflict`, `in_use`,
        `missing`, `confirm_required` and `preview_changed` (with
        `details.preview`), `not_reclaimable`, and from M7:
        `approval_required` (with `details.approval`), `id_taken`,
        `not_fetched`, `already_exists`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    IfMatchRequired:
      description: >
        The write needs `If-Match` and did not carry one. Saving a manifest
        over an existing file without naming the digest the editor read would
        let two tabs overwrite each other silently.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

    Unavailable:
      description: >
        Something outside this machine could not be reached — a repository, a
        URL. Code `unavailable`, with what is known in `details`. Retrying may
        work, which is what separates it from the 4xx codes.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

    TooLarge:
      description: The body is over its limit. Code `too_large`, with `details.limit` in bytes.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unprocessable:
      description: >
        Well-formed but refused. Codes: `outside_roots`, `cross_device`,
        `not_a_file`, `unknown_session`, `self_handoff`, `not_launchable`,
        `blocked`, `not_linkable`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InsufficientStorage:
      description: The disk cannot hold the body with headroom; nothing was written. Code `disk_space`, with `details.needed` and `details.free` in bytes.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    QuotaExceeded:
      description: A per-studio quota is full. Code `quota_exceeded`, with `details` as QuotaDetails.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unsupported:
      description: This provider cannot serve this. Code `unsupported`, with a reason in `message`.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:

    # ---------------------------------------------------------------- common

    ULID:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

    StudioIdValue:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
      description: A manifest id (schema/manifest.json `id`).

    JSONObject:
      type: object
      additionalProperties: true

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: "A stable snake_case code a program branches on." }
        message: { type: string, description: "A sentence for a person." }
        details: { type: object, additionalProperties: true }

    QuotaDetails:
      type: object
      required: [quota, limit, used]
      properties:
        quota: { type: string, enum: [records, kv_bytes] }
        limit: { type: integer }
        used: { type: integer }

    Page:
      type: object
      required: [items, next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.

    # ---------------------------------------------------------------- identity

    Me:
      type: object
      required: [studio_id, capabilities, quota, paths, provider, api_version, daemon_version]
      properties:
        studio_id: { $ref: "#/components/schemas/StudioIdValue" }
        capabilities: { type: array, items: { $ref: "#/components/schemas/Capability" } }
        quota:
          type: object
          required: [records, kv_bytes]
          properties:
            records: { $ref: "#/components/schemas/QuotaUse" }
            kv_bytes: { $ref: "#/components/schemas/QuotaUse" }
        paths:
          type: object
          required: [stage, data]
          properties:
            stage: { type: string, description: "Absolute. The directory :adopt takes files from." }
            data: { type: string, description: "Absolute. The studio's persistent data directory, {data}." }
        provider: { type: string, enum: [daemon, embedded] }
        api_version: { type: string, description: "This document's info.version." }
        daemon_version: { type: string, description: "The daemon's or helm dev's build version." }

    QuotaUse:
      type: object
      required: [limit, used]
      properties:
        limit: { type: integer }
        used: { type: integer }

    Capability:
      type: string
      enum: [kv, records, assets, gallery, timeline, jobs, gallery.read_all, kv.shared, handoff.send]

    # ---------------------------------------------------------------- events

    ThemeEvent:
      type: object
      required: [theme]
      properties:
        theme: { type: string, enum: [system, light, dark] }
    LauncherAbout:
      type: object
      required: [daemon_version, api_version, sdk_majors, paths]
      properties:
        daemon_version: { type: string, description: "`dev` for a build no release stamped." }
        commit: { type: string, description: "The commit the build recorded, when it recorded one." }
        modified: { type: boolean, description: "The build's tree had changes that commit does not hold." }
        api_version: { type: string, description: "This document's `info.version`." }
        sdk_majors:
          type: object
          description: "The major of each SDK package served under `/sdk/v<major>/`."
          required: [css, runtime, ui]
          properties:
            css: { type: integer }
            runtime: { type: integer }
            ui: { type: integer }
        paths:
          type: object
          description: "Absolute directories on this machine (06 §1)."
          required: [data, cache, logs, models, library]
          properties:
            data: { type: string }
            cache: { type: string }
            logs: { type: string }
            models: { type: string }
            library: { type: string }
    SecretState:
      type: object
      description: >
        What the launcher may learn about a stored secret: that it is there,
        and when helmstudio stored it. Never the value (R43).
      required: [present]
      properties:
        present: { type: boolean }
        added_at:
          type: string
          format: date-time
          description: "When helmstudio stored it. Absent for a secret added outside helmstudio."
        unsupported:
          type: string
          description: "Present when this platform has no secret store; says so in the words the screen shows."

    SecretSet:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1 }

    InboxEvent:
      type: object
      required: [inbox_id, item_id, from_studio]
      properties:
        inbox_id: { $ref: "#/components/schemas/ULID" }
        item_id: { $ref: "#/components/schemas/ULID" }
        from_studio: { $ref: "#/components/schemas/StudioIdValue" }
        role: { type: [string, "null"] }
    ItemEvent:
      type: object
      required: [change, item]
      properties:
        change: { type: string, enum: [added, updated, deleted] }
        item: { $ref: "#/components/schemas/Item" }
    JobEvent:
      type: object
      required: [job]
      properties:
        job: { $ref: "#/components/schemas/Job" }
    ShutdownEvent:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    GapEvent:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: "Events were lost; re-read state rather than trusting the stream." }

    # ---------------------------------------------------------------- kv

    KVDoc:
      type: object
      required: [ns, key, doc, etag, updated_at]
      properties:
        ns: { type: string }
        key: { type: string }
        doc: { $ref: "#/components/schemas/JSONObject" }
        etag: { type: string }
        updated_at: { type: string, format: date-time }

    KVKey:
      type: object
      required: [key, bytes, updated_at]
      properties:
        key: { type: string }
        bytes: { type: integer }
        updated_at: { type: string, format: date-time }

    KVKeyPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/KVKey" } }

    # ---------------------------------------------------------------- sessions

    Session:
      type: object
      required: [id, studio_id, name, state, etag, created_at, opened_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        studio_id: { $ref: "#/components/schemas/StudioIdValue" }
        name: { type: string }
        state: { $ref: "#/components/schemas/JSONObject" }
        etag: { type: string }
        created_at: { type: string, format: date-time }
        opened_at: { type: [string, "null"], format: date-time }

    SessionCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        state: { $ref: "#/components/schemas/JSONObject" }

    SessionUpdate:
      type: object
      description: A JSON merge patch over the session's writable fields. `state` members merge; a null member removes that key.
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        state: { $ref: "#/components/schemas/JSONObject" }

    SessionDuplicate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    SessionPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/Session" } }

    # ---------------------------------------------------------------- records

    Record:
      type: object
      required: [id, collection, doc, etag, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        collection: { type: string }
        doc: { $ref: "#/components/schemas/JSONObject" }
        etag: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RecordPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/Record" } }

    # ---------------------------------------------------------------- assets

    AssetKind:
      type: string
      enum: [image, video, audio, other]

    Asset:
      type: object
      required: [id, sha256, kind, mime, bytes, width, height, duration_s, fps, state, pinned, origin_studio, url, thumb, library_path, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        kind: { $ref: "#/components/schemas/AssetKind" }
        mime: { type: string }
        bytes: { type: integer }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        duration_s: { type: [number, "null"] }
        fps: { type: [number, "null"] }
        state: { type: string, enum: [ready, missing, corrupt] }
        pinned: { type: boolean }
        origin_studio:
          type: [string, "null"]
          description: >
            The studio that first stored these bytes. Null for any caller that
            is not that studio, so a dedup hit or a shared read never reveals
            another studio (M4 first review, #9).
        url: { type: string, description: "This API's path to the bytes, e.g. /api/v1/assets/{id}. Needs the Bearer header; a page prefixes /helm to go through its proxy (M6 Q10)." }
        thumb: { type: string, description: "This API's path to the thumbnail, e.g. /api/v1/assets/{id}/thumb?w=320. Needs the Bearer header; a page prefixes /helm to go through its proxy (M6 Q10)." }
        library_path:
          type: [string, "null"]
          description: >
            The readable hardlink, relative to the library root. Null when it
            could not be made (Q11), and null for any caller that is not the
            origin studio, since it names that studio, a month and a filename
            (M4 first review, #9).
        created_at: { type: string, format: date-time }
        warnings:
          type: array
          items: { type: string }
          description: Present on an adopt or upload response when something short of failure happened, such as no library link.

    AdoptRequest:
      type: object
      required: [path, kind]
      additionalProperties: false
      properties:
        path: { type: string, description: "Absolute, inside the caller's stage directory (unlinked after adopting) or its data directory (left in place, read-only)." }
        kind: { $ref: "#/components/schemas/AssetKind" }
        pinned: { type: boolean, default: false }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        duration_s: { type: number, exclusiveMinimum: 0 }
        fps: { type: number, exclusiveMinimum: 0 }

    AssetReclaimItem:
      type: object
      required: [id, sha256, bytes, blob_path, library_path, deleted_items]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        sha256: { type: string }
        bytes: { type: integer }
        blob_path: { type: string }
        library_path: { type: [string, "null"] }
        deleted_items:
          type: array
          items: { $ref: "#/components/schemas/ULID" }
          description: Soft-deleted items that name this asset, as their asset or as an input. Reclaim hard-deletes them.

    AssetReclaimPreview:
      type: object
      required: [items, total_bytes, unreferenced, confirm]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AssetReclaimItem" } }
        total_bytes: { type: integer }
        unreferenced:
          type: object
          required: [count, bytes]
          description: Unpinned assets no item or input has ever referenced. Reported, never reclaimed.
          properties:
            count: { type: integer }
            bytes: { type: integer }
        confirm: { type: string }

    AssetReclaimResult:
      type: object
      required: [items, total_bytes, kept_library_paths]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AssetReclaimItem" } }
        total_bytes: { type: integer }
        kept_library_paths:
          type: array
          items: { type: string }
          description: Library paths left in place because they no longer held the blob's inode.

    ReclaimConfirm:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm: { type: string }

    # ---------------------------------------------------------------- gallery

    ItemInput:
      type: object
      required: [asset_id, role]
      additionalProperties: false
      properties:
        asset_id: { $ref: "#/components/schemas/ULID" }
        role: { type: string, pattern: "^[a-z][a-z0-9_]*$", maxLength: 64, description: "e.g. first_frame, last_frame, reference, audio_bed, clip" }

    Tag:
      type: string
      minLength: 1
      maxLength: 64

    ItemCreate:
      type: object
      required: [kind, asset_id, params]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/AssetKind" }
        asset_id: { $ref: "#/components/schemas/ULID" }
        title: { type: string, maxLength: 500 }
        session_id: { $ref: "#/components/schemas/ULID" }
        params: { $ref: "#/components/schemas/JSONObject" }
        inputs: { type: array, items: { $ref: "#/components/schemas/ItemInput" }, default: [] }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" }, maxItems: 32, default: [] }

    ItemUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: { type: [string, "null"], maxLength: 500 }
        starred: { type: boolean }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" }, maxItems: 32 }

    Item:
      type: object
      required: [id, studio_id, kind, asset_id, asset, session_id, timeline_id, title, params, starred, tags, inputs, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        studio_id: { $ref: "#/components/schemas/StudioIdValue" }
        kind: { $ref: "#/components/schemas/AssetKind" }
        asset_id: { $ref: "#/components/schemas/ULID" }
        asset: { $ref: "#/components/schemas/Asset" }
        session_id: { oneOf: [{ $ref: "#/components/schemas/ULID" }, { type: "null" }] }
        timeline_id:
          oneOf: [{ $ref: "#/components/schemas/ULID" }, { type: "null" }]
          description: >
            Set when this item is a sequence's export (R48, 02 §10). The
            gallery labels such an item "timeline" rather than by a studio
            (M8 Q17).
        title: { type: [string, "null"] }
        params: { $ref: "#/components/schemas/JSONObject" }
        starred: { type: boolean }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        inputs: { type: array, items: { $ref: "#/components/schemas/ItemInput" } }
        created_at: { type: string, format: date-time }

    ItemPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/Item" } }

    # ---------------------------------------------------------------- handoff

    HandoffRequest:
      type: object
      required: [item_id, to_studio]
      additionalProperties: false
      properties:
        item_id: { $ref: "#/components/schemas/ULID" }
        to_studio: { $ref: "#/components/schemas/StudioIdValue" }
        role: { type: string, pattern: "^[a-z][a-z0-9_]*$", maxLength: 64 }

    Handoff:
      type: object
      required: [id, to_studio, item_id, role, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        to_studio: { $ref: "#/components/schemas/StudioIdValue" }
        item_id: { $ref: "#/components/schemas/ULID" }
        role: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    InboxEntry:
      type: object
      required: [id, from_studio, item_id, item, role, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        from_studio: { $ref: "#/components/schemas/StudioIdValue" }
        item_id: { $ref: "#/components/schemas/ULID" }
        item:
          oneOf: [{ $ref: "#/components/schemas/Item" }, { type: "null" }]
          description: Null when the sender has since deleted the item.
        role: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    InboxPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/InboxEntry" } }

    # ---------------------------------------------------------------- jobs

    JobKind:
      type: string
      enum: [install, build, download, update, export, uninstall, task]

    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, interrupted]

    JobError:
      type: object
      required: [code, message]
      description: >
        installations.last_failure and jobs.last_error (02 §4). Install codes:
        clone_failed, tool_missing, env_failed, step_failed, step_timeout,
        cancelled, interrupted, auth_required, disk_space, weights_failed,
        linked_missing, uninstall_failed. env_failed (creating a Python
        environment, docs/decisions.md M5 Q7) has no step_index. A task job's
        code is the studio's own.
      properties:
        code: { type: string }
        message: { type: string }
        phase: { type: string }
        step_index: { type: integer }
        exit_code: { type: integer }
        log_file_id: { $ref: "#/components/schemas/ULID" }

    StepRun:
      type: object
      required: [step_index, step_name, command, state]
      properties:
        step_index: { type: integer }
        step_name: { type: string }
        command: { type: string }
        state: { type: string, enum: [pending, running, succeeded, skipped, failed, interrupted, cancelled] }
        exit_code: { type: integer }
        log_file_id: { $ref: "#/components/schemas/ULID" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    Job:
      type: object
      required: [id, kind, state, progress_num, progress_den, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        kind: { $ref: "#/components/schemas/JobKind" }
        studio_id: { $ref: "#/components/schemas/StudioIdValue" }
        state: { $ref: "#/components/schemas/JobState" }
        subject_kind: { type: string }
        subject_id: { type: string }
        progress_num: { type: integer, minimum: 0 }
        progress_den: { type: integer, minimum: 0 }
        last_error: { $ref: "#/components/schemas/JobError" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        cancel_requested_at: { type: string, format: date-time }
        steps: { type: array, items: { $ref: "#/components/schemas/StepRun" } }
        warnings: { type: array, items: { type: string } }

    JobPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/Job" } }

    TaskCreate:
      type: object
      additionalProperties: false
      properties:
        state: { type: string, enum: [queued, running], default: running }
        subject_kind: { type: string, maxLength: 64 }
        subject_id: { type: string, maxLength: 200 }
        progress_num: { type: integer, minimum: 0, default: 0 }
        progress_den: { type: integer, minimum: 0, default: 0 }

    TaskUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        state: { type: string, enum: [running, succeeded, failed, cancelled] }
        progress_num: { type: integer, minimum: 0 }
        progress_den: { type: integer, minimum: 0 }
        last_error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, maxLength: 64 }
            message: { type: string, maxLength: 4000 }

    LogAppend:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, maxLength: 16384 }

    JobLogStep:
      type: object
      required: [step_index, step_name, command]
      properties:
        step_index: { type: integer }
        step_name: { type: string }
        command: { type: string }
    JobLogLine:
      type: object
      required: [text]
      properties:
        step_index: { type: integer, description: "Absent for a task job." }
        text: { type: string }
    JobLogEnd:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/JobState" }
        last_error: { $ref: "#/components/schemas/JobError" }

    # ---------------------------------------------------------------- studios

    # ---------------------------------------------------------------- timeline

    TimelineTarget:
      type: object
      description: >
        What every clip is conformed to (R44, R47). Geometry and rates only:
        the codec belongs to the export's preset, not the document (M8 Q9).
        Output is always stereo, and is tagged BT.709 limited range when it is
        re-encoded.
      required: [width, height, fps, sample_rate]
      additionalProperties: false
      properties:
        width: { type: integer, minimum: 2, maximum: 8192, description: "Even." }
        height: { type: integer, minimum: 2, maximum: 8192, description: "Even." }
        fps:
          type: number
          enum: [23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60]
          description: >
            One of the rates the daemon knows exactly; 23.976, 29.97 and 59.94
            are 24000/1001, 30000/1001 and 60000/1001, which no JSON number
            writes exactly.
        sample_rate: { type: integer, enum: [44100, 48000] }

    TimelineTargetInput:
      type: object
      description: The target as a request gives it; `sample_rate` defaults to 48000.
      required: [width, height, fps]
      additionalProperties: false
      properties:
        width: { type: integer, minimum: 2, maximum: 8192 }
        height: { type: integer, minimum: 2, maximum: 8192 }
        fps: { type: number, enum: [23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60] }
        sample_rate: { type: integer, enum: [44100, 48000], default: 48000 }

    TimelineTransition:
      type: object
      description: >
        The one transition (01 §14). It is centred on the cut and takes half
        its duration of handle from each side, so adding one moves no clip.
      required: [type, duration]
      additionalProperties: false
      properties:
        type: { type: string, enum: [dissolve] }
        duration: { type: number, exclusiveMinimum: 0, maximum: 10 }

    TimelineClip:
      type: object
      description: >
        A reference with in and out points; sources are never modified or
        copied (R44). `in` and `out` are times in the source, `at` is where it
        sits in the sequence, and an image clip uses `hold` instead.
      required: [asset_id]
      additionalProperties: false
      properties:
        asset_id: { $ref: "#/components/schemas/ULID" }
        in: { type: number, minimum: 0, description: "Where the clip starts in its source. Defaults to 0." }
        out: { type: number, exclusiveMinimum: 0, description: "Where it ends in its source. Defaults to the source's end." }
        at: { type: number, minimum: 0, description: "Where it sits in the sequence. Assigned when clips are laid end to end." }
        hold: { type: number, exclusiveMinimum: 0, description: "How long an image is held. Images only, and never with in or out." }
        gain_db: { type: number, minimum: -60, maximum: 12, description: "Applied to this clip's own sound. Defaults to 0." }
        audio: { type: boolean, description: "Whether a video clip's own sound plays under it. Defaults to true." }
        transition_in: { $ref: "#/components/schemas/TimelineTransition" }
        studio_id:
          type: [string, "null"]
          description: >
            The studio whose asset this is, for the clip's hue and name. Null
            when the caller could not learn it from an item it may read (M8
            Q11). Set by the daemon, and ignored in a request.

    TimelineTrack:
      type: object
      required: [kind, clips]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [video, audio] }
        name:
          type: string
          pattern: "^[VA][0-9]{1,2}$"
          description: "V1, A1, A2 — kind and position. Assigned by the daemon, and ignored in a request."
        gain_db: { type: number, minimum: -60, maximum: 12 }
        clips: { type: array, items: { $ref: "#/components/schemas/TimelineClip" }, maxItems: 500 }

    Timeline:
      type: object
      description: >
        The framework's sequence document (R44, 05 §6). One video track, V1,
        contiguous from 0, and up to eight audio tracks.
      required: [id, name, target, tracks, revision, duration_s, etag, studio_id, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        name: { type: string }
        target: { $ref: "#/components/schemas/TimelineTarget" }
        tracks: { type: array, items: { $ref: "#/components/schemas/TimelineTrack" } }
        revision: { type: integer, description: "Rises by one on every write. The ETag." }
        duration_s: { type: number, description: "V1's end, computed and never stored." }
        etag: { type: string }
        studio_id:
          type: [string, "null"]
          description: The studio that created it; null for the launcher's own (M8 Q11).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TimelinePage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/Timeline" } }

    TimelineCreate:
      type: object
      required: [name, target]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        target: { $ref: "#/components/schemas/TimelineTargetInput" }
        clips:
          type: array
          maxItems: 500
          description: Laid end to end from 0, on V1 for video and images and on A1 for sound. Not with `tracks`.
          items: { $ref: "#/components/schemas/TimelineClip" }
        tracks:
          type: array
          maxItems: 9
          description: The whole document. Not with `clips`.
          items: { $ref: "#/components/schemas/TimelineTrack" }

    TimelineUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        target: { $ref: "#/components/schemas/TimelineTargetInput" }
        tracks: { type: array, items: { $ref: "#/components/schemas/TimelineTrack" }, maxItems: 9 }

    TimelineAppend:
      type: object
      required: [asset_id]
      additionalProperties: false
      properties:
        asset_id: { $ref: "#/components/schemas/ULID" }
        track: { type: string, pattern: "^[VA][0-9]{1,2}$" }
        timeline_id: { $ref: "#/components/schemas/ULID" }

    TimelineRevert:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }

    TimelineRevision:
      type: object
      required: [revision, saved_at, duration_s, clip_count]
      properties:
        revision: { type: integer }
        saved_at: { type: string, format: date-time }
        duration_s: { type: number }
        clip_count: { type: integer }

    TimelineRevisionPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/TimelineRevision" } }

    TimelineOpened:
      type: object
      required: [opened, surface]
      properties:
        opened: { type: boolean }
        surface: { type: string, description: "browser or app." }

    ExportPreset:
      type: string
      enum: [h264]
      description: >
        Encoding only, never size or rate, which the target already states
        (M8 Q9). `h264` is yuv420p, High profile, MP4 with fast start, and
        AAC-LC at 192 kb/s.

    ExportReason:
      type: object
      description: Why an export cannot copy its picture, one per clip that stops it.
      required: [code, message]
      properties:
        code: { type: string, description: "container, codec, profile, level, size, aspect, field_order, pixel_format, time_base, frame_rate, colour, parameter_sets, trimmed, image, transition, not_probed, no_video." }
        message: { type: string }
        track: { type: string }
        clip: { type: integer, description: "The clip's place in its track, counting from 1." }

    ExportPlan:
      type: object
      required: [mode, preset, target, duration_s, frames, reasons]
      properties:
        mode:
          type: string
          enum: [copy, conform]
          description: >
            `copy` copies the picture and re-encodes the sound; `conform`
            re-encodes both. Nothing copies sound (M8 Q13).
        preset: { $ref: "#/components/schemas/ExportPreset" }
        target: { $ref: "#/components/schemas/TimelineTarget" }
        duration_s: { type: number }
        frames: { type: integer }
        reasons: { type: array, items: { $ref: "#/components/schemas/ExportReason" } }

    ExportRequest:
      type: object
      required: [preset]
      additionalProperties: false
      properties:
        preset: { $ref: "#/components/schemas/ExportPreset" }

    InstallState:
      type: string
      enum: [listed, cloning, cloned, building, built, fetching_weights, auth_required, ready, update_available, failed_clone, failed_build, failed_weights, removing]

    Studio:
      type: object
      required: [manifest_loaded, id, name, kinds, heavy, root, root_present, group]
      properties:
        manifest_loaded: { type: boolean, description: "False for a studio still running from a previous daemon whose manifest is gone or invalid. It can be stopped, not launched." }
        id: { $ref: "#/components/schemas/StudioIdValue" }
        name: { type: string }
        description: { type: string }
        kinds: { type: array, items: { type: string, enum: [video, image, audio, text] } }
        heavy: { type: boolean }
        peak_ram_gb: { type: integer }
        root: { type: string, description: "The recorded checkout, or where install will put it." }
        root_present: { type: boolean }
        group: { $ref: "#/components/schemas/ProcessGroup" }
        install_state: { $ref: "#/components/schemas/InstallState" }
        root_path: { type: string }
        commit_sha: { type: string }
        rebuild_needed: { type: boolean, description: "The manifest changed since this checkout was built from it." }
        runtime_env: { $ref: "#/components/schemas/JSONObject" }
        last_failure: { $ref: "#/components/schemas/JobError" }
        size_bytes: { type: integer }
        job_id: { $ref: "#/components/schemas/ULID" }

        # The library (M7 Q6, Q8, Q15, Q18, Q21). An entry exists for every id
        # the machine knows about, installed or not, valid or not.
        source: { $ref: "#/components/schemas/LibrarySource" }
        overrides:
          $ref: "#/components/schemas/LibrarySource"
          description: "The source this entry shadows, when it shadows one. What the card means by \"overrides the registry entry\", and what Revert would go back to."
        level: { $ref: "#/components/schemas/CertificationLevel" }
        manifest_state: { $ref: "#/components/schemas/ManifestState" }
        manifest_valid: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ManifestError" }
          description: "Why an invalid entry is invalid. It is listed rather than hidden (R2, amended M7 Q6), so a typo in an override does not make a studio vanish."
        manifest_file: { type: string, description: "Absolute path, when the manifest is a file on this machine." }
        provenance: { $ref: "#/components/schemas/Provenance" }
        repo: { type: string }
        ref: { type: string }
        local_path: { type: string }
        approval_required: { type: boolean, description: "True when the recorded approval does not match what would run now, so the next install, retry or launch will ask (Q10)." }
        selection: { type: string, description: "The chosen `selectable` weight, when the studio declares any. A launch without one is refused (Q21)." }
        selectable:
          type: array
          items: { $ref: "#/components/schemas/ApprovalWeight" }
          description: "The checkpoints this studio can be launched with, and which are already downloaded or linked."
        rebuild_needed_reason: { type: string, description: "Set when `rebuild_needed`: the manifest changed since this checkout was built from it, which an Override causes." }
        hue:
          $ref: "#/components/schemas/StudioHue"
          description: "The identity hue a launcher draws the studio's stripe and dot in. Always present, including for an entry whose manifest did not load (2026-09-17, the launcher redesign)."

    StudioHue:
      type: object
      description: >
        A studio's identity hue per theme, `#rrggbb`: the manifest's `hue`, or,
        when it declares none or did not load, the entry 03 §2c's ramp gives its
        id. Only ever a stripe, a dot or a timeline clip, never a fill (03 §2).
      required: [dark, light]
      properties:
        dark: { type: string, pattern: "^#[0-9a-f]{6}$" }
        light: { type: string, pattern: "^#[0-9a-f]{6}$" }

    LibrarySource:
      type: string
      enum: [local, repo, registry, running]
      description: >
        Where this entry's manifest came from, highest first (Q6). `local` is
        `<data>/studios/<id>.yaml`; `repo` is `helmstudio.yaml` in the studio's
        own repository at the pinned ref, or in its installed checkout;
        `registry` is the inline manifest a pointer carries. `running` is a
        studio still running from a previous daemon whose manifest is gone.

    CertificationLevel:
      type: string
      enum: [draft, unverified, verified, registry]
      description: >
        Derived, never declared (Q15). A manifest with `local_path` is `draft`
        and everything else is `unverified`, because `verified` means a smoke
        harness ran on this machine and `registry` means CI verified it on
        every release — and neither exists yet. A label on the card, never a
        gate on what a user runs on their own machine.

    ManifestState:
      type: string
      enum: [resolved, not_fetched, invalid]
      description: >
        `not_fetched` is a registry pointer with no inline manifest and nothing
        cached: startup never touches the network (Q7), so it is listed with a
        Fetch action rather than fetched behind the user's back. `invalid` is
        listed with its errors and is not installable or launchable.

    ManifestError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        pointer: { type: string, description: "JSON pointer into the document, for the form field to highlight." }
        line: { type: integer, description: "1-based line in the YAML, resolved against the node." }
        column: { type: integer }

    Provenance:
      type: object
      description: "Where a local entry came from — a note for the card, never a trust signal (Q8). Stored beside the manifest in `<id>.source.json`, not inside it, so an exported manifest stays byte-identical to what upstream would commit."
      required: [kind]
      properties:
        kind: { type: string, enum: [imported, duplicated, written, folder] }
        url: { type: string }
        path: { type: string }
        from_id: { $ref: "#/components/schemas/StudioIdValue" }
        at: { type: string, format: date-time }

    Criterion:
      type: object
      required: [number, title, state]
      properties:
        number: { type: integer }
        title: { type: string }
        state: { type: string, enum: [pass, fail, not_checked] }
        required: { type: boolean }
        detail: { type: string, description: "Why it failed, or why it is not checked." }
        pointer:
          type: string
          description: >
            The field the criterion is about, as a JSON pointer into the
            document checked: the first field a failing criterion is missing, or
            where a passing one is declared. Under `/manifest` in a registry
            entry, as an error's pointer is. Absent for a criterion no field
            answers (2026-09-17, the launcher redesign).

    Criteria:
      type: object
      description: "05 §9, scored only where a manifest alone answers (Q16). `checkable` is the denominator the count reads."
      required: [items, passed, checkable]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Criterion" } }
        passed: { type: integer }
        checkable: { type: integer }

    ManifestText:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, description: "The YAML, as written. A manifest or a registry entry; the validator tells them apart by shape." }

    ManifestDoc:
      type: object
      required: [id, text, digest, source, kind]
      properties:
        id: { $ref: "#/components/schemas/StudioIdValue" }
        text: { type: string, description: "Byte for byte what is stored — the same bytes Export writes." }
        digest: { type: string, description: "sha256 of the text. `If-Match` on a save compares this." }
        source: { $ref: "#/components/schemas/LibrarySource" }
        kind: { type: string, enum: [manifest, pointer] }
        file: { type: string, description: "Absolute path, when it is a file on this machine. The editor shows it and offers Reveal." }
        commit: { type: string, description: "The commit the text was read at, for a repository source." }
        reverted_to: { type: string, description: "Set on a Revert: where the file was moved to." }

    ManifestCheck:
      type: object
      description: "A verdict, whether or not it is valid. `document` is the parsed YAML as JSON, which is what the form renders from — the page never parses YAML itself (Q17)."
      required: [valid, kind, errors]
      properties:
        valid: { type: boolean }
        kind: { type: string, enum: [manifest, pointer, unknown] }
        errors: { type: array, items: { $ref: "#/components/schemas/ManifestError" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/ManifestError" } }
        document: { $ref: "#/components/schemas/JSONObject" }
        text: { type: string, description: "The text this verdict is for; set by :edit, which returns what it wrote." }
        criteria: { $ref: "#/components/schemas/Criteria" }

    ManifestEdit:
      type: object
      additionalProperties: false
      required: [text, pointer]
      properties:
        text: { type: string }
        pointer: { type: string, description: "RFC 6901 JSON pointer to the field, e.g. /processes/0/cmd." }
        value:
          description: "The new value. Absent or null removes the key. Comments and key order around it are kept."

    RevertResult:
      type: object
      required: [id, moved_to]
      properties:
        id: { $ref: "#/components/schemas/StudioIdValue" }
        moved_to: { type: string, description: "`<data>/studios/_reverted/<id>-<timestamp>.yaml`. The file is never deleted (Q9)." }
        now: { $ref: "#/components/schemas/ManifestDoc" }

    DuplicateRequest:
      type: object
      additionalProperties: false
      required: [new_id]
      properties:
        new_id: { $ref: "#/components/schemas/StudioIdValue" }

    ImportItem:
      type: object
      additionalProperties: false
      description: "Exactly one of `text` or `url`. The daemon opens no path a request names (Q14)."
      properties:
        text: { type: string }
        url: { type: string, format: uri }

    ImportResolution:
      type: object
      additionalProperties: false
      required: [index, action]
      properties:
        index: { type: integer, description: "Which reported item this resolves." }
        action: { type: string, enum: [override, rename, skip] }
        new_id: { $ref: "#/components/schemas/StudioIdValue" }

    ImportRequest:
      type: object
      additionalProperties: false
      description: "Without `confirm`, reports and writes nothing. With `{confirm, resolutions}`, adds exactly the reported set."
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImportItem" } }
        confirm: { type: string }
        resolutions: { type: array, items: { $ref: "#/components/schemas/ImportResolution" } }

    ImportItemReport:
      type: object
      required: [index, valid, errors]
      properties:
        index: { type: integer }
        valid: { type: boolean }
        id: { $ref: "#/components/schemas/StudioIdValue" }
        name: { type: string }
        kind: { type: string, enum: [manifest, pointer, unknown] }
        collides_with: { $ref: "#/components/schemas/LibrarySource" }
        errors: { type: array, items: { $ref: "#/components/schemas/ManifestError" } }
        flags:
          type: array
          items: { type: string }
          description: "Sentences worth reading before adding, such as `local_path` building in a directory on this Mac without cloning (Q14)."
        added: { type: boolean, description: "Set on the confirmed pass." }

    ImportReport:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImportItemReport" } }
        confirm: { type: string, description: "Send back to add exactly this set. Absent on the confirmed pass." }

    RepositoryRead:
      type: object
      additionalProperties: false
      description: "Exactly one of `{repo, ref}` or `{path}`. `path` is a typed absolute path, and only `<path>/helmstudio.yaml` is read."
      properties:
        repo: { type: string }
        ref: { type: string }
        path: { type: string }

    RepositoryResult:
      type: object
      required: [found]
      properties:
        found: { type: boolean, description: "False when the repository ships no helmstudio.yaml — which is the common case, and what the editor pre-fills from." }
        commit: { type: string }
        repo: { type: string }
        ref: { type: string }
        text: { type: string }
        check: { $ref: "#/components/schemas/ManifestCheck" }
        submodules: { type: array, items: { $ref: "#/components/schemas/Submodule" } }

    Submodule:
      type: object
      required: [path, url]
      properties:
        path: { type: string }
        url: { type: string }

    ApprovalCommand:
      type: object
      description: "One command, byte for byte as the manifest wrote it, with placeholders left as written."
      required: [when, label, command]
      properties:
        when: { type: string, enum: [install, launch, first_launch], description: "`build[]` at install; each process `cmd` and `health.exec` at every launch; `import.run` once (Q11)." }
        label: { type: string, description: "What the manifest calls it — a step's name, a process's name." }
        command: { type: string }
        cwd: { type: string }
        shell: { type: string, description: "Which shell runs it, not whether one does — `sh -c` and `bash -c` do not mean the same thing by the same string." }
        env: { $ref: "#/components/schemas/JSONObject" }
        flags:
          type: array
          items: { type: string, enum: [control_characters, newline, zero_width, bidirectional] }
          description: "What is in this string that a reader would not see. Shown escaped and flagged rather than rendered."

    ApprovalCheck:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state: { type: string, enum: [pass, warn, fail, not_run] }
        required: { type: boolean }
        detail: { type: string, description: "For `not_run`, why — a smoke test builds and runs the studio, which is what this screen asks permission for (Q13)." }

    ApprovalWeight:
      type: object
      required: [name, selectable]
      properties:
        name: { type: string }
        hf_repo: { type: string }
        revision: { type: string }
        bytes: { type: integer }
        state: { type: string, description: "Whether it is already downloaded or linked." }
        selectable: { type: boolean }
        optional: { type: boolean }

    ApprovalPreview:
      type: object
      description: >
        What would run, and the digest that authorises it (Q10-Q13). The digest
        covers the id, source and resolved commit, the submodules, every
        command with its `cwd`, `shell` and `env`, the capabilities, the network
        hosts, `python.version` and the declared weights — and deliberately not
        sizes, free disk or `selected`, none of which changes what executes.
      required: [studio_id, source, level, digest, commands, capabilities, checks, weights]
      properties:
        studio_id: { $ref: "#/components/schemas/StudioIdValue" }
        name: { type: string }
        source: { $ref: "#/components/schemas/LibrarySource" }
        level: { $ref: "#/components/schemas/CertificationLevel" }
        digest: { type: string, description: "Send back as `approval=` on :install, :retry or :launch." }
        already_approved: { type: boolean, description: "True when the recorded approval already matches, so no confirmation is needed." }
        repo: { type: string }
        ref: { type: string }
        commit: { type: string }
        transport: { type: string, description: "What the repo URL means in words, e.g. \"Clones a directory on this Mac: /Users/…\" (Q14)." }
        local_path: { type: string, description: "Set when nothing is cloned and the build happens in a directory that is already here." }
        submodules: { type: array, items: { $ref: "#/components/schemas/Submodule" } }
        commands: { type: array, items: { $ref: "#/components/schemas/ApprovalCommand" } }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/CapabilitySentence" }
        network_hosts:
          type: array
          items: { type: string }
          description: "Shown as \"The manifest says it contacts these hosts. helmstudio does not restrict network access.\""
        weights: { type: array, items: { $ref: "#/components/schemas/ApprovalWeight" } }
        selection: { type: string, description: "The checkpoint this install would use, defaulting to the first selectable weight declared. Shown here, but not covered by the digest (Q21)." }
        checks: { type: array, items: { $ref: "#/components/schemas/ApprovalCheck" } }
        criteria: { $ref: "#/components/schemas/Criteria" }

    CapabilitySentence:
      type: object
      description: "A capability in the words of what it lets a studio do. The table is 03 §18, and one Go table serves it (Q12)."
      required: [capability, sentence, warning]
      properties:
        capability: { type: string }
        sentence: { type: string }
        warning: { type: boolean, description: "True for `gallery.read_all` and `kv.shared`." }

    SelectionRequest:
      type: object
      additionalProperties: false
      required: [weight]
      properties:
        weight: { type: string, description: "The manifest name of a `selectable` weight." }

    StudioPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/Studio" } }

    ProcessGroup:
      type: object
      required: [studio_id, processes]
      properties:
        studio_id: { $ref: "#/components/schemas/StudioIdValue" }
        group_run_id: { $ref: "#/components/schemas/ULID" }
        state: { type: string, enum: [starting, running, stopping, failed, exited] }
        processes: { type: array, items: { $ref: "#/components/schemas/Process" } }
        failure: { $ref: "#/components/schemas/GroupFailure" }

    Process:
      type: object
      required: [spec_name, role, state, health_state, command]
      properties:
        spec_name: { type: string }
        role: { type: string, enum: [main, sidecar, worker, oneshot] }
        state: { type: string, enum: [queued, starting, running, stopping, exited, failed] }
        health_state: { type: string, enum: ["", unknown, passing, failing] }
        exit_reason: { type: string, enum: [clean, crashed, health_timeout, killed_by_user, preempted, oom] }
        exit_code: { type: integer }
        pid: { type: integer }
        pgid: { type: integer }
        port: { type: integer }
        command: { type: string, description: "The fully substituted argv, as a JSON array in a string." }
        started_at: { type: string, format: date-time }
        health_timeout_s: { type: integer }
        ui: { type: string }

    GroupFailure:
      type: object
      required: [process, exit_reason, last_lines]
      properties:
        process: { type: string }
        exit_reason: { type: string }
        exit_code: { type: integer }
        last_lines: { type: array, items: { type: string } }

    HeavyArithmetic:
      type: object
      description: "`details.heavy` on 409 heavy_conflict and preview_changed. A peak of 0 means undeclared."
      required: [running_studio, running_name, running_peak_gb, wanted_studio, wanted_name, wanted_peak_gb, host_gb, busy, confirm]
      properties:
        running_studio: { type: string }
        running_name: { type: string }
        running_peak_gb: { type: integer }
        wanted_studio: { type: string }
        wanted_name: { type: string }
        wanted_peak_gb: { type: integer }
        host_gb: { type: integer }
        busy: { $ref: "#/components/schemas/BusyState" }
        confirm: { type: string, description: "Send back as `preempt` to confirm stopping the running studio." }

    BusyState:
      type: object
      description: >
        What the running studio's `busy` probes answered when the conflict was
        built (schema/manifest.json, $defs.process.busy; docs/decisions.md M5
        Q12). A group is busy if any member is, otherwise unknown if any member
        is unknown or none declares a probe, otherwise idle. `unknown` is never
        idle: the studio did not answer, answered something other than the
        contract, or declares no probe.
      required: [state]
      properties:
        state: { type: string, enum: [busy, idle, unknown] }
        loaded: { type: boolean, description: "Whether it holds a model, when it said." }
        message: { type: string, description: "The studio's own words; for unknown, why helmstudio cannot tell." }
        progress: { type: number, minimum: 0, maximum: 1 }

    Stopping:
      type: object
      required: [state]
      properties:
        state: { type: string, const: stopping }

    LogFile:
      type: object
      required: [id, group_run_id, process, path, bytes, truncated, cap_bytes, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        group_run_id: { $ref: "#/components/schemas/ULID" }
        process: { type: string }
        path: { type: string, description: "Relative to the logs root." }
        bytes: { type: integer }
        truncated: { type: boolean }
        cap_bytes: { type: integer }
        created_at: { type: string, format: date-time }

    LogFilePage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/LogFile" } }

    ProcessLogLine:
      type: object
      required: [seq]
      properties:
        seq: { type: integer }
        text: { type: string }
        gap: { type: integer }
        gap_unit: { type: string, enum: [lines, bytes] }

    ProcessLogEnd:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    # ---------------------------------------------------------------- weights

    LinkRequest:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, description: "An absolute directory the user already has." }

    ModelArtifact:
      type: object
      required: [id, hf_repo, revision, source, state, dest, path, bytes_on_disk, ref_count, studios, created_at]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        hf_repo: { type: string }
        revision: { type: string }
        commit_sha: { type: string }
        source: { type: string, enum: [managed, linked] }
        state: { type: string, enum: [declared, downloading, interrupted, auth_required, ready, linked, missing] }
        dest: { type: string }
        path: { type: string }
        external_path: { type: string }
        realpath: { type: string }
        total_bytes: { type: integer }
        bytes_on_disk: { type: integer, description: "What a managed artifact holds under the models root, partial files included. Zero for linked." }
        ref_count: { type: integer, description: "The number of studio bindings, counted when read — never stored." }
        studios: { type: array, items: { type: string } }
        verified_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, description: "When a process of a studio bound to it last went running (02 §7). Absent until one has." }
        created_at: { type: string, format: date-time }
        unobtainable:
          type: array
          items: { type: string }
          description: Set only by :link — optional weights of this repository the linked directory lacks.

    ModelArtifactView:
      allOf:
        - { $ref: "#/components/schemas/ModelArtifact" }
        - properties:
            reclaim: { $ref: "#/components/schemas/ModelReclaimPreview" }

    ModelArtifactPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/ModelArtifact" } }

    ModelReclaimItem:
      type: object
      required: [id, hf_repo, revision, path, bytes]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        hf_repo: { type: string }
        revision: { type: string }
        path: { type: string }
        bytes: { type: integer }

    ModelReclaimPreview:
      type: object
      required: [items, total_bytes, confirm]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModelReclaimItem" } }
        total_bytes: { type: integer }
        confirm: { type: string }

    ModelsDisk:
      type: object
      required: [root, free_bytes]
      properties:
        root: { type: string, description: "The models directory." }
        free_bytes: { type: integer, description: "What an unprivileged process can still write on the volume holding it, which is what a download can use." }
