# Isolated dev: catalog_service + its own Postgres, NATS (JetStream) and SeaweedFS (the full stack is deploy/docker-compose.yml).
# Streams/KV: run ../.tools/nats-setup against it; bucket: S3 `ora` (SeaweedFS creates it on first put via weed shell).
name: ora-catalog-dev
services:
  catalog:
    build: {context: ., additional_contexts: {orago: ../orago}}
    env_file: .env
    environment:
      DATABASE_URL: postgres://catalog:catalog@postgres:5432/catalog?sslmode=disable
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://seaweedfs:8333
    ports: ["127.0.0.1:8091:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
      seaweedfs: {condition: service_started}
  postgres:
    image: postgres:18.6-alpine3.24
    environment: {POSTGRES_USER: catalog, POSTGRES_PASSWORD: catalog, POSTGRES_DB: catalog}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "catalog"], interval: 2s, retries: 20}
  nats:
    image: nats:2.15.2-alpine3.22
    command: [-js]
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: [server, -dir=/data, -s3, -s3.port=8333]
    environment: {AWS_ACCESS_KEY_ID: ora-local, AWS_SECRET_ACCESS_KEY: ora-local-secret}
