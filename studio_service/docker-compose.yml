# Isolated dev: studio_service + its own Postgres and NATS (JetStream). The full stack is deploy/docker-compose.yml.
# Streams and KV buckets: run deploy/nats's setup against it. Placeholder credentials, local only.
name: helmstudio-studio-dev
services:
  studio:
    build: {context: ., additional_contexts: {orago: ../orago}}
    env_file: .env
    environment:
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_USER: ""
    ports: ["127.0.0.1:8092:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
  postgres:
    image: postgres:18.7
    environment: {POSTGRES_USER: studio, POSTGRES_PASSWORD: studio, POSTGRES_DB: studio}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "studio"], interval: 2s, retries: 20}
  nats:
    image: nats:2.15.3-alpine3.22
    command: [-js]
