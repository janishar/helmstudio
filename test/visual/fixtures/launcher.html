<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>helmstudio launcher</title>
<script>
  const q = new URLSearchParams(location.search);
  const t = q.get("theme");
  if (t) document.documentElement.setAttribute("data-theme", t);
</script>
<link rel="stylesheet" href="/sdk/v1/helm.css">
<link rel="stylesheet" href="/web/launcher.css">
<script type="module" src="/sdk/v1/helm-ui.js"></script>
</head>
<body class="helm-body">
<div class="helm-app" id="app"></div>
<script type="module">
  // The launcher's own screens, drawn from canned data. These are the real
  // modules the daemon serves — a golden of a mock would prove nothing.
  import { arrive, newContext, newStore, render } from "/web/app.js";
  import { freezeTime, fakeClient, studios, starting, jobs, models, hfToken, about, disk } from "./fake.js";

  freezeTime();

  const q = new URLSearchParams(location.search);
  const screen = q.get("screen") || "catalogue";

  const HASH = {
    catalogue: "#/studios",
    install: "#/studios/h3-studio",
    processes: "#/studios/ltx-studio/processes?log=studio",
    models: "#/models",
    settings: "#/settings",
    // M7b's screens. The editor and the approval screen read a real manifest
    // from a real daemon: see test/visual/daemon_test.go.
    add: "#/add",
    editor: "#/edit/wan-studio",
    approve: "#/studios/wan-studio/approve?do=install",
    import: "#/add",
  };

  const store = newStore();
  store.studios = screen === "processes" ? [starting, ...studios.slice(1)] : studios;
  store.models = models;
  store.jobs = jobs;
  store.hfToken = hfToken;
  store.about = about;
  store.disk = disk;
  store.loaded = true;
  store.theme = q.get("theme") || "system";

  const app = document.getElementById("app");
  // `hash` draws any route, for a behaviour test that needs a screen no golden
  // is taken of. The page starts there without touching its own address —
  // opening a fixture waits for the address it was given — and then follows
  // the address as the launcher does, so a link to an editor section is
  // followed rather than ignored.
  const start = q.get("hash") || HASH[screen];
  const current = () => location.hash || start;
  // A real redraw, drawn in place as the launcher's is, because M7b's screens
  // fetch and then draw themselves again. A no-op would golden the loading
  // state of every one of them.
  const redraw = () => render(app, ctx, current(), "127.0.0.1:8700");
  const ctx = newContext({ client: fakeClient(), store, redraw });
  let at = current();
  window.addEventListener("hashchange", () => {
    const from = at;
    at = current();
    redraw();
    arrive(app, from, at);
  });
  redraw();

  // The switch dialog has no route of its own: it is what a heavy conflict
  // opens, so the golden draws it over the catalogue it is opened from.
  if (screen === "switch") {
    const { switchBody } = await import("/web/switch.js");
    const { dialog } = await import("/web/ui.js");
    dialog({
      title: "Stop ltx studio to launch h3 studio?",
      body: switchBody({
        running_studio: "ltx-studio", running_name: "ltx studio", running_peak_gb: 20,
        wanted_studio: "h3-studio", wanted_name: "h3 studio", wanted_peak_gb: 21,
        host_gb: 32, busy: { state: "idle" }, confirm: "fixture",
      }),
      extra: Object.assign(document.createElement("label"), {
        className: "helm-label",
        style: "display: flex; gap: var(--helm-space-2); align-items: center; margin-top: var(--helm-space-3)",
      }),
      actions: [
        { label: "Cancel", value: null },
        { label: "Stop ltx studio and launch h3 studio", value: "go", class: "helm-btn-danger-fill", primary: true },
      ],
    });
    const box = document.querySelector("dialog .helm-label");
    box.append(Object.assign(document.createElement("input"), { type: "checkbox" }), "Don't ask again this session");
  }

  // The import dialog is what a report looks like, so the fixture drives the
  // real dialog with three real documents rather than drawing a picture of
  // one: valid and new, valid and colliding, and not a manifest at all.
  if (screen === "import") {
    const { importDialog } = await import("/web/importer.js");
    const { IMPORTS } = await import("./fake.js");
    importDialog(ctx);
    const dlg = document.querySelector("dialog");
    for (const text of IMPORTS) {
      dlg.querySelector("textarea").value = text;
      [...dlg.querySelectorAll("button")].find((b) => b.textContent === "Add pasted text").click();
    }
    [...dlg.querySelectorAll("button")].find((b) => b.textContent === "Check").click();
  }

  const { settle } = await import("./settle.js");
  await settle();
</script>
</body>
</html>
