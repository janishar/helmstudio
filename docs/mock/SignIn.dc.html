<style>

body{margin:0}
nav button{flex-direction:column!important;width:58px!important;height:54px!important;gap:3px;font-size:10px;font-weight:500}

*{text-transform:none!important}

nav button svg{width:36px;height:36px;padding:8px;box-sizing:border-box;border-radius:12px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -4px 6px color-mix(in srgb, var(--shd) 35%, transparent),0 8px 14px -4px color-mix(in srgb, var(--shd) 70%, transparent)}
nav button[aria-label="Create"] svg{background:linear-gradient(155deg,#a393ff,#4a2fe0)}

nav button[aria-label="Models"] svg{background:linear-gradient(155deg,#7af5d6,#12967f)}
nav button:not([aria-current]) svg{filter:saturate(.55) brightness(.8)}
nav button[aria-current]{color:var(--t1)!important}
nav button[aria-current] svg{outline:2px solid rgba(255,255,255,.85);outline-offset:2px}
main button,aside button{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 0 color-mix(in srgb, var(--shd) 30%, transparent),0 2px 5px color-mix(in srgb, var(--shd) 45%, transparent)}
[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 14px"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 28px 48px -18px color-mix(in srgb, var(--shd) 85%, transparent),0 10px 18px -10px color-mix(in srgb, var(--shd) 60%, transparent)}

.n{background:linear-gradient(180deg,var(--s3),var(--s1))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 20px 34px -12px color-mix(in srgb, var(--shd) 85%, transparent)!important}
.pi,.po{box-shadow:0 0 8px currentColor}
input[type=range]{filter:drop-shadow(0 2px 3px color-mix(in srgb, var(--shd) 60%, transparent))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--t2)}a:hover{color:var(--t1)}
nav{gap:14px!important}
.i{width:18px;height:18px;margin-left:6px;border-radius:50%;border:0;background:var(--ib);color:var(--it);font:600 11px/18px Inter,sans-serif;padding:0;vertical-align:middle;flex:0 0 auto}
[style*="border-radius: 16px"],[style*="border-radius: 18px"],.set,.crit,.tile{background-image:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 46%)}

.h{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--t2)}

.row span:last-child{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--t2);text-align:right}

.card{border-radius:36px 36px 36px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 40px 70px -24px color-mix(in srgb, var(--shd) 92%, transparent),0 12px 24px -12px color-mix(in srgb, var(--shd) 70%, transparent);background-image:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 40%)}

.in:focus{outline:2px solid var(--a1);outline-offset:2px}
td,th{padding:10px;text-align:left;font-size:13px;border-bottom:1px solid var(--s3);white-space:nowrap}
th{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--t2)}
tbody tr:last-child td{border-bottom:0}

nav button[aria-label="Admin"] svg{background:linear-gradient(155deg,#c9ced9,#5b6478)}
.in{width:100%;height:38px;box-sizing:border-box;border-radius:10px;border:0;background:var(--s4);color:var(--t1);font:inherit;font-size:13px;padding:0 12px}
.tag{padding:2px 8px;border-radius:999px;background:var(--s4);font-size:11px;font-weight:500}

[style*="min-height: 960px"]{background-image:radial-gradient(1100px 620px at 14% -12%,rgba(255,196,120,.11),transparent 62%),radial-gradient(900px 640px at 108% 112%,color-mix(in srgb, var(--a1) 7%, transparent),transparent 60%),repeating-linear-gradient(118deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px)}
nav{margin:14px 0 14px 14px;border:0!important;border-radius:30px;background:var(--s1);align-self:flex-start;padding:14px 4px!important;flex:0 0 68px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 40px -18px color-mix(in srgb, var(--shd) 80%, transparent)}

main button,aside button{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 0 color-mix(in srgb, var(--shd) 28%, transparent),0 3px 6px color-mix(in srgb, var(--shd) 35%, transparent)}
.pic{background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.9)}.pic.pnb{border-color:transparent!important}
</style>

<div data-theme="{{theme}}" style="display: flex; flex-wrap: wrap; min-height: 960px; background: var(--g); color: var(--t1); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px">

<main style="flex: 1 1 100%; min-width: 0; position: relative; overflow: hidden; min-height: 960px; display: flex; align-items: center; justify-content: center; padding: 24px">

<div style="position: absolute; top: 20px; right: 24px; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 999px; background: var(--s1)">

<select id="theme" value="{{theme}}" onChange="{{setTheme}}" style="height: 32px; padding: 0 10px; border-radius: 999px; border: 0; background: var(--s3); color: var(--t1); font: inherit; font-size: 13px">
<option value="forest">Forest ink</option>

<option value="aubergine">Aubergine dusk</option>
<option value="espresso">Espresso</option>
<option value="oxblood">Oxblood</option>

<div class="pic tk" style="left: 250px; top: 410px; width: 170px; height: 220px; transform: rotate(6deg); background: radial-gradient(110px 140px at 70% 25%, color-mix(in srgb, var(--a2) 80%, transparent), transparent 70%), linear-gradient(200deg, var(--s5), var(--a1)); background-image: url(img/mara-rooftop.jpg)"><span class="tag">▶ LTX-2.5</span></div>
<div class="pic tk" style="left: 70px; top: 720px; width: 150px; height: 110px; transform: rotate(-4deg); background: linear-gradient(120deg, color-mix(in srgb, var(--a1) 70%, var(--s3)), var(--s2)); background-image: url(img/sneaker-studio.jpg)"><span class="tag">take</span></div>
<div class="pic tk" style="left: 1090px; top: 130px; width: 180px; height: 230px; transform: rotate(7deg); background: radial-gradient(120px 120px at 30% 70%, color-mix(in srgb, var(--a1) 75%, transparent), transparent 70%), linear-gradient(160deg, var(--s4), var(--a2)); background-image: url(img/outpost-saltflat.jpg)"><span class="tag">Qwen Image 2.1</span></div>

<div class="pic tk" style="left: 1230px; top: 760px; width: 130px; height: 130px; transform: rotate(10deg); background: linear-gradient(210deg, color-mix(in srgb, var(--a2) 65%, var(--s3)), var(--s2)); background-image: url(img/mara-portrait.jpg)"><span class="tag">take</span></div>
</div>

<form aria-label="Sign in" class="card" style="position: relative; z-index: 1; width: 400px; max-width: 100%; box-sizing: border-box; padding: 32px 32px 28px; background-color: var(--s1); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px">
<span class="logo" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M8 16C8 12.4 10.4 10.6 13.3 10.6S18.4 12.6 18.4 16V21" style="fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round"/><path d="M8 7V21" style="stroke:currentColor;stroke-width:3.2;stroke-linecap:round"/><path d="M5.3 1.6H10.7A.9.9 0 0 1 11.6 2.5V5L8 8.4L4.4 5V2.5A.9.9 0 0 1 5.3 1.6Z" style="fill:currentColor"/></svg></span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">helmstudio</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="si-email" style="font-size: 12px; color: var(--t2)">Email</label><input id="si-email" class="in" type="email" autocomplete="username" placeholder="[USER EMAIL]" style="height: 44px; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="si-pass" style="font-size: 12px; color: var(--t2)">Password</label><input id="si-pass" class="in" type="password" autocomplete="current-password" style="height: 44px; font-size: 14px"></div>
<button type="submit" style="margin-top: 4px; height: 50px; border-radius: 14px; border: 0; background: var(--a1); color: var(--on1); background-image: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 55%); font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.04em">Sign in</button>
<p style="margin: 4px 0 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--t2)">No account? Ask your admin.<button type="button" class="i" aria-label="More information" title="There is no public sign-up. The admin creates every account and resets forgotten passwords.">i</button></p>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"forest","options":["forest","ocean","aubergine","espresso","oxblood","indigo","parchment"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
state = { theme: null };
renderVals() {
return {
theme: this.state.theme ?? this.props.theme ?? 'forest',
setTheme: (e) => this.setState({ theme: e.target.value })
};
}
}
</script>
