<style>
/* Create kind tabs: the kind orbs, copied from Magic.dc.html (.kt .ki) */
.ktab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 0}
.ktab .ki{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--k) 30%,#fff) 0,var(--k) 42%,color-mix(in srgb,var(--k) 45%,#000) 100%);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 16%,transparent),0 0 14px 2px color-mix(in srgb,var(--k) 40%,transparent)}.ktab .ki svg{width:14px;height:14px}.ktab .ki.k-video{--k:#ff9a6e}.ktab .ki.k-image{--k:#b8abff}.ktab .ki.k-board{--k:#e8d88a}.ktab .ki.k-voice,.ktab .ki.k-dialogue{--k:#f2b84b}.ktab .ki.k-sound{--k:#7cc7f2}.ktab .ki.k-music{--k:#d59bf6;border-radius:50%;background:radial-gradient(circle,#e9e2f0 0 3px,#0d0b10 3px 4px,transparent 4px),repeating-radial-gradient(circle,#141018 0 1.5px,#2a2236 1.5px 2.5px);box-shadow:0 0 0 3px #d59bf633,0 0 14px 2px #d59bf666}.ktab .ki.k-music svg{display:none}
/* the selected kind tab (owner, 2026-11-27: "make selected one more differentiated"): a thin accent ring as Magic's picked chips, its orb and label at full strength; the other tabs' orbs dimmed until hover or focus (their label stays --t2, the dimmest text that keeps AA in every theme); the focus ring stays the outline outside */
.ktab[aria-selected="true"]{background:var(--s5)!important;color:var(--t1)!important;font-weight:700!important;box-shadow:inset 0 0 0 1px var(--a1)}.ktab[aria-selected="false"] .ki{opacity:.4;filter:saturate(.45)}.ktab[aria-selected="false"]:is(:hover,:focus-visible){color:var(--t1)!important}.ktab[aria-selected="false"]:is(:hover,:focus-visible) .ki{opacity:1;filter:none}.ktab .ki{transition:opacity .12s,filter .12s}
/* the composer's main text box takes its free height, the chip row stays at the bottom (owner, 2026-11-27: "text only in two line it waster bottom empty area") */
[aria-label="Output kind"]+div>:is(textarea,[role="combobox"],.grow){flex:1 0 auto}[aria-label="Output kind"]+div>div:has(>textarea,>[aria-label="Expand"]){flex:1 0 auto;display:flex;flex-direction:column}[aria-label="Output kind"]+div>div:has(>textarea,>[aria-label="Expand"])>:not([aria-label="Expand"]){flex:1 0 auto}
</style>

[data-theme="indigo"]{--g:#0e0f22;--in:#090a18;--p0:#12142b;--s1:#161832;--s2:#20234a;--s3:#292d5c;--s4:#32376c;--s5:#3c417d;--ln:#4b5194;--dash:#6a70b0;--t2:#a5a9cf;--t1:#eceefc;--t1b:#d9dcf3;--ib:#3c417d;--it:#d0d3ee;--a1:#ffc145;--on1:#2b1d00;--a2:#ff7fa8;--on2:#33061a;--shd:#000000;--bad:#ff8a80}

body{margin:0}
nav button{flex-direction:column!important;width:58px!important;height:54px!important;gap:3px;font-size:10px;font-weight:500}
nav button::after{content:attr(aria-label)}
*{text-transform:none!important}
nav button{height:64px!important;gap:5px!important;background:transparent!important}
nav button svg{width:36px;height:36px;padding:8px;box-sizing:border-box;border-radius:12px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -4px 6px color-mix(in srgb, var(--shd) 35%, transparent),0 8px 14px -4px color-mix(in srgb, var(--shd) 70%, transparent)}

nav button[aria-label="Pipelines"] svg{background:linear-gradient(155deg,#6cc4ff,#1f5fe0)}
nav button[aria-label="Gallery"] svg{background:linear-gradient(155deg,#ffb07a,#e0457a)}
nav button[aria-label="Timeline"] svg{background:linear-gradient(155deg,#ffe07a,#f08a1c)}

nav button[aria-label="Magic"] svg{background:linear-gradient(155deg,#f2a8ff,#8a3fd6)}

main button,aside button{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 0 color-mix(in srgb, var(--shd) 30%, transparent),0 2px 5px color-mix(in srgb, var(--shd) 45%, transparent)}
[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 14px"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 28px 48px -18px color-mix(in srgb, var(--shd) 85%, transparent),0 10px 18px -10px color-mix(in srgb, var(--shd) 60%, transparent)}

.pi,.po{box-shadow:0 0 8px currentColor}

button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--t2)}a:hover{color:var(--t1)}
nav{gap:14px!important}
.i{width:18px;height:18px;margin-left:6px;border-radius:50%;border:0;background:var(--ib);color:var(--it);font:600 11px/18px Inter,sans-serif;padding:0;vertical-align:middle;flex:0 0 auto}
[style*="border-radius: 16px"],[style*="border-radius: 18px"],.set,.crit,.tile{background-image:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 46%)}
.tile{flex:1 1 150px;min-height:52px;text-align:left;padding:8px 12px;border-radius:12px;border:0;background:var(--s3);display:flex;align-items:center;gap:10px}
.tile i{flex:0 0 auto;width:32px;height:32px;border-radius:8px;background:var(--ln);display:block}
.tile small{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2)}
.tile b{display:block;font-size:14px;font-weight:600}
.look{text-align:left;padding:0;border:0;background:transparent;display:flex;flex-direction:column;gap:6px}

.chip{height:36px;padding:0 12px;border-radius:10px;border:0;background:var(--s4);font-size:13px;font-weight:500}

[style*="min-height: 960px"]{background-image:radial-gradient(1100px 620px at 14% -12%,rgba(255,196,120,.11),transparent 62%),radial-gradient(900px 640px at 108% 112%,color-mix(in srgb, var(--a1) 7%, transparent),transparent 60%),repeating-linear-gradient(118deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px)}
