<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* themes */
[data-theme="forest"]{--g:#0e1512;--in:#090e0c;--p0:#131c17;--s1:#16201b;--s2:#1e2a24;--s3:#26342d;--s4:#2c3b33;--s5:#32433a;--ln:#3d5146;--dash:#5a7265;--t2:#a9b8ab;--t1:#f0f2e8;--t1b:#dfe5d8;--ib:#354a3f;--it:#cfdacb;--a1:#b9e37a;--on1:#17200a;--a2:#ff8552;--on2:#2b0c02;--shd:#000000}
[data-theme="ocean"]{--g:#0c1320;--in:#080d17;--p0:#101a2a;--s1:#131d2e;--s2:#1c2940;--s3:#24344f;--s4:#2b3d5c;--s5:#33486b;--ln:#40587f;--dash:#5e779e;--t2:#9fb0c6;--t1:#eaf0f7;--t1b:#d6dfeb;--ib:#33486b;--it:#cdd8e6;--a1:#ff8a6b;--on1:#2b0d05;--a2:#7cc7f2;--on2:#06202e;--shd:#000000}
[data-theme="aubergine"]{--g:#15101a;--in:#0f0b13;--p0:#1a1421;--s1:#1f1826;--s2:#2b2135;--s3:#352a41;--s4:#3f324d;--s5:#4a3b5a;--ln:#5c4a6e;--dash:#7a678c;--t2:#b3a6b8;--t1:#f3ecf2;--t1b:#e2d8e3;--ib:#4a3b5a;--it:#d9cedc;--a1:#ffb36b;--on1:#2b1500;--a2:#d59bf6;--on2:#230a33;--shd:#000000}
[data-theme="espresso"]{--g:#17110d;--in:#0f0b08;--p0:#1c1510;--s1:#211914;--s2:#2e231c;--s3:#3a2d24;--s4:#45362b;--s5:#514033;--ln:#655141;--dash:#84705e;--t2:#b8a896;--t1:#f5ece0;--t1b:#e5d9c9;--ib:#514033;--it:#dccfbd;--a1:#f2b84b;--on1:#2a1c00;--a2:#ff8552;--on2:#2b0c02;--shd:#000000}
[data-theme="oxblood"]{--g:#170e10;--in:#0f0809;--p0:#1c1113;--s1:#221517;--s2:#301d20;--s3:#3c2529;--s4:#472d31;--s5:#54363a;--ln:#694549;--dash:#896266;--t2:#bfa8a6;--t1:#f6ecea;--t1b:#e6d8d6;--ib:#54363a;--it:#dccccb;--a1:#f6c177;--on1:#2b1a00;--a2:#ff7d96;--on2:#33060f;--shd:#000000}
[data-theme="indigo"]{--g:#0e0f22;--in:#090a18;--p0:#12142b;--s1:#161832;--s2:#20234a;--s3:#292d5c;--s4:#32376c;--s5:#3c417d;--ln:#4b5194;--dash:#6a70b0;--t2:#a5a9cf;--t1:#eceefc;--t1b:#d9dcf3;--ib:#3c417d;--it:#d0d3ee;--a1:#ffc145;--on1:#2b1d00;--a2:#ff7fa8;--on2:#33061a;--shd:#000000}
[data-theme="parchment"]{--g:#f3ede2;--in:#e9e1d3;--p0:#f8f3ea;--s1:#fbf7ef;--s2:#ffffff;--s3:#efe7d9;--s4:#e6ddcd;--s5:#dcd1be;--ln:#cdbfa8;--dash:#a8987f;--t2:#6e6455;--t1:#1f1a14;--t1b:#3a3228;--ib:#dcd1be;--it:#3a3228;--a1:#c8553d;--on1:#ffffff;--a2:#2f5d8a;--on2:#ffffff;--shd:#b8a688}

body{margin:0}
*{box-sizing:border-box}
.d{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;margin:0;letter-spacing:-0.01em}
.mono{font-family:'JetBrains Mono',monospace}
.mut{color:var(--t2);margin:0}.sm{font-size:12px;line-height:17px}
button{font:inherit;color:inherit;cursor:pointer}
.root{padding:40px 16px;display:flex;flex-direction:column;gap:24px;background:var(--g);color:var(--t1);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;background-image:radial-gradient(1100px 620px at 14% -6%,rgba(255,196,120,.08),transparent 62%)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cell{margin:0;border-radius:36px 36px 36px 14px;background:var(--p0);background-image:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 28px 48px -18px color-mix(in srgb,var(--shd) 85%,transparent);display:flex;flex-direction:column;overflow:hidden}
.cell.wide{grid-column:span 2}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 12px 16px}
figcaption{padding:0 24px 18px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--t2)}
.logo{width:44px;height:44px;flex:0 0 auto;border-radius:14px 14px 14px 6px;display:flex;align-items:center;justify-content:center;color:var(--on1);background:linear-gradient(155deg,var(--a1),var(--a2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -4px 6px color-mix(in srgb,var(--shd) 35%,transparent),0 10px 18px -6px color-mix(in srgb,var(--shd) 80%,transparent)}
.logo.lg{width:64px;height:64px;border-radius:20px 20px 20px 8px}
.logo.sm{width:34px;height:34px;border-radius:11px 11px 11px 5px}
/* window */
.win{border-radius:14px;background:var(--s1);background-image:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 30%);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 70px -24px color-mix(in srgb,var(--shd) 92%,transparent),0 12px 24px -12px color-mix(in srgb,var(--shd) 70%,transparent)}
.tb{height:38px;flex:0 0 38px;display:flex;align-items:center;position:relative;padding:0 14px}
.tt{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;color:var(--t2);pointer-events:none}
.lights{display:flex;gap:8px;position:relative;z-index:1}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.wb{flex:1;min-height:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px}
.brand h2{font-size:22px;line-height:26px}
.sub{margin:2px 0 0;font-size:13px;color:var(--t2)}
.one{flex:1;padding:14px 40px 26px;display:flex;flex-direction:column;gap:22px}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12px}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.st{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px 14px 14px 6px;font-size:14px}
.st .dot{width:24px;height:24px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 11px Inter,sans-serif;background:var(--s3);color:var(--t2)}
.st .sn{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.st .sd{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--t2);white-space:nowrap}
.st.done .dot{background:color-mix(in srgb,var(--a1) 22%,transparent);color:var(--a1)}
.st.done .sn{color:var(--t1b)}
.st.run,.st.ask{background:var(--s3);font-weight:600}
.st.run .dot,.st.ask .dot{background:var(--a1);color:var(--on1)}
.st.run .sd{color:var(--t1)}
.st.todo{color:var(--t2)}.st.todo .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--s5)}
.st.fail{background:color-mix(in srgb,#ff8a80 13%,transparent);font-weight:600}.st.fail .dot{background:#ff8a80;color:#2b0705}
.bar{flex:1;height:6px;border-radius:3px;background:var(--s5);display:block;max-width:180px}.bar span{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--a1),color-mix(in srgb,var(--a1) 70%,var(--a2)))}
.steps.compact{gap:2px}.steps.compact .st{padding:7px 10px;font-size:13px}.steps.compact .dot{width:20px;height:20px;font-size:10px}
.split{flex:1;display:flex;min-height:0}
.side{width:250px;flex:0 0 250px;padding:10px 14px 20px 20px;display:flex;flex-direction:column;gap:18px}
.side .brand{gap:10px}.side .brand h2{font-size:16px;line-height:20px}.side .logo{width:36px;height:36px;border-radius:12px 12px 12px 5px}.side .logo svg{width:22px;height:22px}.side .sub{font-size:12px}
.pane{flex:1;margin:6px 14px 14px 0;padding:22px 24px;border-radius:24px 24px 24px 10px;background:var(--s2);display:flex;flex-direction:column;gap:12px}
.pane h3{font-size:20px}.pane h3.err{color:#ff8a80}
.pane p{margin:0;font-size:13px;line-height:19px}
.big{font-size:15px!important;line-height:22px!important;color:var(--t1)}
.fld{display:flex;flex-direction:column;gap:5px}.fld label{font-size:12px;color:var(--t2)}
.in{width:100%;height:38px;border-radius:10px;border:0;background:var(--s4);color:var(--t1);font:inherit;font-size:13px;padding:0 12px}
.in.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.pick{display:flex;gap:8px}
.note{padding:10px 12px;border-radius:12px 12px 12px 5px;background:color-mix(in srgb,var(--a1) 10%,transparent);color:var(--t1b)}
.act{margin-top:auto;display:flex;justify-content:flex-end;gap:8px}
.pri{height:40px;padding:0 20px;border-radius:12px 12px 12px 5px;border:0;background:var(--a1);color:var(--on1);background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;display:inline-flex;align-items:center}
.ghost{height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--s4);font-size:13px;font-weight:500;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 2px 5px color-mix(in srgb,var(--shd) 45%,transparent)}
.act .ghost{height:40px}
.log{margin:0;padding:10px 12px;border-radius:10px;background:var(--in);font:11px/16px 'JetBrains Mono',monospace;color:var(--t2);white-space:pre-wrap}
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 40px 18px}
.start h2{font-size:22px}
.steps.mini{width:100%;gap:4px}.steps.mini .st{padding:6px 10px;font-size:13px}.steps.mini .dot{width:18px;height:18px}
.st.run .dot:empty::after{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--on1);border-right-color:transparent}
/* menu bar */
.mbs{display:flex;gap:10px;align-items:flex-start;width:100%}
.mb{flex:1;display:flex;flex-direction:column;align-items:flex-end;min-width:0;border-radius:14px 14px 14px 6px;overflow:hidden;background:linear-gradient(160deg,#3a4d6b,#6b4e5e 60%,#b07a52);padding-bottom:16px;height:452px}
.strip{width:100%;height:26px;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 10px;background:rgba(20,20,22,.55);backdrop-filter:blur(10px);font:500 12px -apple-system,'SF Pro Text',Inter,sans-serif;color:#fff}
.mbi{position:relative;display:flex;align-items:center;padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.22)}
.mbi .sdot{position:absolute;right:0;bottom:1px;width:6px;height:6px;box-shadow:0 0 0 1.5px #2a2a2c}
.mbx{opacity:.9;white-space:nowrap}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.sdot.ok{background:#3fd26b}.sdot.wait{background:#f2c14e}.sdot.bad{background:#ff8a80}
.menu{margin:4px 6px 0 0;width:212px;padding:5px;border-radius:10px;background:rgba(40,40,43,.94);box-shadow:0 0 0 .5px rgba(255,255,255,.18),0 18px 40px -8px rgba(0,0,0,.7);font:13px/18px -apple-system,'SF Pro Text',Inter,sans-serif;color:#eee}
.mst{display:flex;align-items:center;gap:8px;padding:4px 9px;font-weight:600}
.msub{padding:0 9px 4px 25px;font-size:12px;color:#a8a8ad}
.menu hr{border:0;height:1px;background:rgba(255,255,255,.12);margin:5px 9px}
.mi{padding:3px 9px;border-radius:5px}
.mi:nth-of-type(1){background:#2f6fde;color:#fff}
.mi.ck{display:flex;gap:4px}.mi.ck span{width:14px;flex:0 0 14px}
/* studio */
.studio{flex-direction:row;background:var(--g)}
.srail{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;border-right:1px solid var(--s3)}
.srail .lights{gap:6px;margin-left:10px;align-self:flex-start;margin-bottom:6px}.srail .lights i{width:11px;height:11px}
.nb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--t2)}.nb.on{background:var(--s2);color:var(--a1)}
.smain{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px}
.stop{display:flex;align-items:center;gap:10px;height:34px}
.chip2{padding:4px 10px;border-radius:999px;background:var(--s2);color:var(--t2);font-size:12px}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--s1);font-size:12px}.seg>*{padding:4px 12px;border-radius:7px;color:var(--t2)}.seg b{background:var(--s5);color:var(--t1);font-weight:500}
.prev{flex:1;border-radius:22px 22px 22px 10px;background:var(--in);display:flex;align-items:center;justify-content:center;padding:24px}
.pv{width:72%;aspect-ratio:16/9;border-radius:10px;border:1px dashed var(--dash);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:500}.pv small{font:11px 'JetBrains Mono',monospace;color:var(--t2)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px}
.pc{padding:5px 10px;border-radius:8px;background:var(--s1);color:var(--t2);display:flex;align-items:center;gap:8px}.pc.on{background:var(--s2);color:var(--t1);font-weight:500}
.pc>i{width:90px;height:4px;border-radius:2px;background:var(--s5);display:block}.pc>i>i{display:block;width:30%;height:4px;border-radius:2px;background:var(--a1)}
.prompt{height:64px;border-radius:18px 18px 18px 8px;background:var(--s1);display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px;color:var(--t1b);font-size:13px}
.saside{width:270px;flex:0 0 270px;background:var(--p0);padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.h2{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--t2)}
.ph{height:56px;border-radius:14px 14px 14px 6px;background:var(--s2)}.ph.s{height:36px;width:70%}
.takes{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.takes i{aspect-ratio:16/10;border-radius:10px;border:1px dashed var(--dash);background:var(--s1)}
/* notes */
.nt .stage{justify-content:flex-start;padding:24px 28px 12px}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:8px 32px;font-size:14px;line-height:21px;color:var(--t1b)}
.notes p{margin:0}.notes b{color:var(--t1)}
</style>
</helmet>

<p style="margin:0;color:var(--t1b);font-size:15px;line-height:22px">Plan 31. First open sets everything up in one window (a VM, the images, the secrets, the runners); every later open starts it; a menu-bar item shows the status. Quitting keeps it running; <b>Quit entirely</b> stops it.</p>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--s1)">

<select id="theme" value="{{theme}}" onChange="{{setTheme}}" style="height:32px;padding:0 10px;border-radius:999px;border:0;background:var(--s3);color:var(--t1);font:inherit;font-size:13px">

</select>
</div>
