<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DropZone · preview</title></head>
<body>
<div style="padding:16px;display:flex;flex-direction:column;gap:20px">
  <div class="hs-drop-page" style="padding:20px;height:90px;color:var(--t2);font-size:13px">Gallery while files are dragged over it</div>
  <div class="hs-drop-field" style="display:flex;gap:8px;padding:4px;width:fit-content"><span class="hs-tile"><i class="hs-pic"></i></span><span class="hs-tile" style="border-style:dashed;border-color:var(--dash)"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg></span></div>
  <div class="ast" style="position:relative;inset:auto;z-index:auto;width:320px;background:none;box-shadow:none"><div class="drop"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>Drop images to attach</div></div>
</div>
</body>
</html>
