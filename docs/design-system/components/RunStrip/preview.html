<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RunStrip · preview</title></head>
<body>
<div class="hs-graph panel" style="margin:14px;padding:16px;height:300px;display:flex;align-items:flex-end;box-sizing:border-box">
  <div class="hs-run" style="width:100%">
    <div class="hs-run-bar">
      <button class="hs-run-btn bevel" type="button"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add node</button>
      <button class="hs-run-btn bevel" type="button">Tidy layout</button>
      <button class="key" type="button" style="height:40px;padding:0 16px;font-size:13px">Generate</button>
      <span class="hs-run-legend"><span><i style="background:var(--t1b)"></i>Text</span><span><i style="background:#86cdea"></i>Value</span><span><i style="background:var(--a1)"></i>Model</span><span><i style="background:#c1a8f5"></i>Conditioning</span><span><i style="background:#f2c14e"></i>Latent</span><span><i style="background:#f3a0bd"></i>Image</span></span>
    </div>
    <div class="hs-run-pv">
      <div><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>Live preview</div>
      <div><span>Sampler 8 / 20</span><span>0:12</span></div>
    </div>
  </div>
</div>
</body>
</html>
