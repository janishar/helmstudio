<!-- @dsCard group="Status" height=330 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusTile · the logo's status · preview</title></head>
<body>
<div class="hs-row" style="align-items:flex-start;gap:14px">
  <span style="position:relative;display:inline-flex;align-self:flex-start;padding:14px;border-radius:30px;background:var(--s1)"><span style="position:relative;display:inline-flex"><a class="tile" href="#" aria-label="helmstudio · Runner down" title="helmstudio · Runner down" aria-haspopup="dialog" aria-expanded="true" style="--tile: linear-gradient(155deg, var(--a1), var(--a2)); color: var(--on1); border-radius: var(--radius-tile) var(--radius-tile) var(--radius-tile) var(--radius-tile-tail)"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16C8 12.4 10.4 10.6 13.3 10.6S18.4 12.6 18.4 16V21" style="fill:none;stroke-width:3.2;stroke-linecap:round;stroke:currentColor"/><path d="M8 7V21" style="fill:none;stroke-width:3.2;stroke-linecap:round;stroke:currentColor"/><path d="M5.3 1.6H10.7A.9.9 0 0 1 11.6 2.5V5L8 8.4L4.4 5V2.5A.9.9 0 0 1 5.3 1.6Z" style="fill:currentColor"/></svg></a><span class="logo-dot" aria-hidden="true"></span></span></span>
  <div class="hpop" role="dialog" aria-label="Status">
    <span class="hh">Status<span class="mono">checked 2 s ago</span></span>
    <div class="hrw"><span class="sd ok" aria-hidden="true"></span><span class="hn">Studio</span><span class="hs">Answering</span></div>
    <div class="hrw"><span class="sd ok" aria-hidden="true"></span><span class="hn">torch runner<small>mac-studio</small></span><span class="hs">Ready</span></div>
    <div class="hrw"><span class="sd bad" aria-hidden="true"></span><span class="hn">mlx runner<small>mac-studio</small></span><span class="hs bad">Stopped</span></div>
    <div class="hrw"><span class="sd ok" aria-hidden="true"></span><span class="hn">native runner<small>mac-studio</small></span><span class="hs">Ready</span></div>
    <div class="hrw"><span class="sd off" aria-hidden="true"></span><span class="hn">NVIDIA<small>gcp · RTX PRO 6000</small></span><span class="hs">Offline since 10:12</span></div>
    <p class="hint">Runners on a Mac restart from helmstudio there.</p>
    <div class="hft"><button class="chip" type="button" style="height:32px;background:var(--s4)">Open Models</button></div>
  </div>
</div>
</body>
</html>
