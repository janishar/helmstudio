<!-- @dsCard group="Create" height=400 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ModelPopup · preview</title></head>
<body>
<div class="hs-col" style="align-items:flex-start;gap:6px">
  <button class="chip sq bevel" type="button" aria-haspopup="dialog" aria-expanded="true">MiniMax Music 3</button>
  <div class="pop" role="dialog" aria-label="Model" style="width:320px;box-sizing:border-box">
    <div role="group" aria-label="Model" style="display:flex;flex-direction:column;gap:2px">
      <span class="heading" style="padding-bottom:4px">Model</span>
      <button class="mi" type="button" role="menuitemradio" aria-checked="true"><span>MiniMax Music 3<small>best, the default · 30 s in ≈ 2:30 · 26.6 GB</small></span></button>
      <button class="mi" type="button" role="menuitemradio" aria-checked="false"><span>ACE-Step 1.5 · 2B<small>fast · drafts and edits · 30 s in 16 s · 23 GB</small></span></button>
      <button class="mi" type="button" role="menuitemradio" aria-checked="false"><span>ACE-Step 1.5 · XL<small>fast · better · about 2× the memory</small></span></button>
    </div>
    <button class="hs-link" type="button" style="margin-top:6px">All settings</button>
  </div>
</div>
<div class="hs-abar" style="margin:0 16px 16px">
  <button class="hs-src drop" type="button" aria-disabled="true" title="Not on MiniMax Music 3"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span><small>Reference</small><b>Drop a song</b></span></button>
  <button class="chip sq bevel" type="button">MiniMax Music 3</button>
  <button class="chip sq bevel" type="button" title="Run on: Auto picks a free machine"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>Auto</button>
  <button class="chip sq bevel" type="button">3:00</button>
  <button class="chip sq bevel" type="button" aria-disabled="true" title="Not on MiniMax Music 3">BPM · key</button>
  <button class="key video hs-key" type="button" style="margin-left:auto"><span>Generate</span><span class="mono">≈ 2:30 per 30 s · 26.6 GB</span></button>
</div>
</body>
</html>
