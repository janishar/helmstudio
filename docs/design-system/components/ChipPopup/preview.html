<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ChipPopup · preview</title></head>
<body>
<div class="hs-col" style="align-items:flex-start;gap:6px">
  <button class="chip sq bevel" type="button" aria-haspopup="dialog" aria-expanded="true">16:9</button>
  <div class="pop" role="dialog" aria-label="Aspect" style="width:260px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="heading">Aspect</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="opt" type="button" aria-pressed="false">1:1</button>
        <button class="opt" type="button" aria-pressed="true">16:9</button>
        <button class="opt" type="button" aria-pressed="false">9:16</button>
        <button class="opt" type="button" aria-pressed="false">4:3</button>
      </div>
      <button class="hs-link" type="button">All settings</button>
    </div>
  </div>
</div>
</body>
</html>
