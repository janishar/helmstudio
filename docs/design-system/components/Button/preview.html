<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button · preview</title></head>
<body>
<div class="hs-row">
  <button class="key hs-key" type="button"><span>Generate</span></button>
  <button class="key video hs-key" type="button"><span>Generate</span></button>
  <button class="key hs-key" type="button" disabled><span>Write a prompt</span></button>
  <button class="key hs-key" type="button"><span>Generate</span><span class="mono">Fix line 2 first</span></button>
</div>
<div class="hs-row" style="padding-top:0">
  <button class="chip bevel" type="button">Retry</button>
  <button class="act" type="button">Add to timeline</button>
  <button class="chip sq icon bevel" type="button" aria-label="Add image, video or audio"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
  <button class="hs-back" type="button" aria-label="Back"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="hs-x" type="button" aria-label="Close"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <button class="hs-link" type="button">All settings</button>
</div>
</body>
</html>
