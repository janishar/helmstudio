<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>KindTabs · preview</title>
<style>
.kts{display:flex;flex-direction:column;gap:6px;padding:6px;width:max-content}
.kts .ktab{height:63px;width:64px;padding:0;border-radius:12px;border:0;background:transparent;color:var(--t2);font:600 12px Inter,sans-serif}
.kts .ktab[aria-selected="true"]{background:var(--s5);color:var(--t1)}
.ktab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 0}
.ktab .ki{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--k) 30%,#fff) 0,var(--k) 42%,color-mix(in srgb,var(--k) 45%,#000) 100%);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 16%,transparent),0 0 14px 2px color-mix(in srgb,var(--k) 40%,transparent)}.ktab .ki svg{width:14px;height:14px}.ktab .ki.k-video{--k:#ff9a6e}.ktab .ki.k-image{--k:#b8abff}.ktab .ki.k-board{--k:#e8d88a}.ktab .ki.k-voice,.ktab .ki.k-dialogue{--k:#f2b84b}.ktab .ki.k-sound{--k:#7cc7f2}.ktab .ki.k-music{--k:#d59bf6;border-radius:50%;background:radial-gradient(circle,#e9e2f0 0 3px,#0d0b10 3px 4px,transparent 4px),repeating-radial-gradient(circle,#141018 0 1.5px,#2a2236 1.5px 2.5px);box-shadow:0 0 0 3px #d59bf633,0 0 14px 2px #d59bf666}.ktab .ki.k-music svg{display:none}
</style></head>
<body>
<div class="hs-row"><div class="kts panel" role="tablist" aria-label="Output kind">
<button class="ktab bevel" type="button" role="tab" aria-selected="false"><i class="ki k-image" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#14201a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></i>Image</button>
<button class="ktab bevel" type="button" role="tab" aria-selected="false"><i class="ki k-video" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#14201a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9M12.4 3.4l3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></i>Video</button>
<button class="ktab bevel" type="button" role="tab" aria-selected="false"><i class="ki k-voice" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#14201a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></i>Voice</button>
<button class="ktab bevel" type="button" role="tab" aria-selected="true"><i class="ki k-music" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#14201a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></i>Music</button>
<button class="ktab bevel" type="button" role="tab" aria-selected="false"><i class="ki k-sound" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#14201a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></i>Sound</button>
</div></div>
</body>
</html>
