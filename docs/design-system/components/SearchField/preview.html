<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SearchField · preview</title></head>
<body>
<div class="hs-row" style="align-items:flex-start;gap:14px">
  <div class="pop" style="width:320px;padding:8px;display:flex;flex-direction:column;gap:2px">
    <div class="sf" role="search"><svg class="g" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><input type="search" aria-label="Search sessions" placeholder="Search sessions"><kbd class="k" title="Press / to search">/</kbd></div>
    <div style="padding:7px 10px;font-size:13px">Fox at dusk</div>
    <div style="padding:7px 10px;font-size:13px">Snow owl</div>
  </div>
  <div class="pop" style="width:320px;padding:8px;display:flex;flex-direction:column;gap:2px">
    <div class="sf" role="search" style="box-shadow:inset 0 0 0 1px var(--a1)"><svg class="g" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><input type="search" aria-label="Search sessions" value="fox cub"><span class="sfh">2</span><button class="sfx" type="button" aria-label="Clear search"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="sf-on" style="padding:7px 10px;font-size:13px;border-radius:10px"><mark>Fox</mark> <mark>cub</mark>, first steps</div>
    <div class="sf-older"><span class="oh">From older sessions</span><div style="padding:7px 10px;font-size:13px"><mark>Fox</mark> <mark>cub</mark> in snow</div><button class="chip" type="button" style="height:32px;align-self:flex-start;font-size:12px">Load more matches</button></div>
  </div>
  <div class="pop" style="width:260px;padding:8px">
    <div class="sf" role="search"><svg class="g" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><input type="search" aria-label="Search sessions" value="foxglove"><button class="sfx" type="button" aria-label="Clear search"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="sf-none"><p>No sessions match.</p><button class="chip" type="button" style="height:28px;font-size:12px">Clear search</button></div>
  </div>
</div>
</body>
</html>
