<!-- @dsCard group="Models" height=190 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FolderPick · preview</title>
<style>
.pick{display:flex;flex-direction:column;gap:6px;padding:16px;max-width:560px}
.po2{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s3);font-size:13px}
.po2[aria-checked="true"]{box-shadow:inset 0 0 0 1.5px var(--a1);background:var(--s4)}
.po2[aria-disabled="true"]{background:transparent;box-shadow:inset 0 0 0 1px var(--ln);color:var(--t2)}
.po2 input{accent-color:var(--a1);margin:0}
.po2 .m{font-family:var(--font-mono);font-size:12px;color:var(--t2)}
.po2 .n{display:flex;align-items:center;gap:8px;min-width:0}
.dl{padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--a1) 24%,var(--s4));font-size:11px;font-weight:500}
</style></head>
<body>
<div class="pick" role="radiogroup" aria-label="Folder">
  <label class="po2" role="radio" aria-checked="true"><input type="radio" name="f" checked><span class="n"><b>Mac</b><span class="m">~/GenAI/models</span><span class="dl">Downloads</span></span><span class="m">43 GB free</span></label>
  <label class="po2" role="radio" aria-checked="false"><input type="radio" name="f"><span class="n"><b>Studio</b><span class="m">/Volumes/Studio/models</span></span><span class="m">1.1 TB free</span></label>
  <label class="po2" role="radio" aria-disabled="true"><input type="radio" name="f" disabled><span class="n"><b>T9</b><span class="m">/Volumes/T9/models</span></span><span>Not connected</span></label>
</div>
</body>
</html>
