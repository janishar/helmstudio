<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TimelineClip · preview</title></head>
<body>
<div style="padding:16px;display:flex;flex-direction:column;gap:10px">
  <div style="position:relative;height:56px">
    <button class="tl-clip vid fs" type="button" style="position:absolute;left:0;width:170px;height:56px"><b>Fox trots in</b><small>0:05 · LTX-2</small><span class="tl-edge" style="left:0" aria-hidden="true"></span><span class="tl-edge" style="right:0" aria-hidden="true"></span></button>
    <button class="tl-clip img on" type="button" style="position:absolute;left:176px;width:130px;height:56px"><b>Fox at dusk</b><small>0:03 · still</small></button>
    <button class="tl-clip shot" type="button" style="position:absolute;left:312px;width:150px;height:56px"><b>Shot 3</b><span class="hs-tl-prog"><span><span style="width:40%"></span></span></span><small>Generating 8 / 20</small></button>
  </div>
  <div style="position:relative;height:56px">
    <button class="tl-clip empty" type="button" style="position:absolute;left:0;width:170px;height:56px"><b>Shot 4</b><small>no take yet</small></button>
    <button class="tl-clip off" type="button" style="position:absolute;left:176px;width:130px;height:56px"><b>Rooftop</b><small>offline</small></button>
  </div>
  <div style="position:relative;height:36px">
    <button class="tl-clip aud wv" type="button" style="position:absolute;left:0;width:300px;height:36px;justify-content:center"><b>Tutorial intro</b><small>0:07</small></button>
  </div>
</div>
</body>
</html>
