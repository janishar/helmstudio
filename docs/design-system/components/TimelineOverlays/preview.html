<!-- @dsCard group="Timeline" height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TimelineOverlays · preview</title></head>
<body>
<div style="padding:16px;display:flex;flex-direction:column;gap:18px">
  <div class="panel" style="position:relative;height:110px;padding:0 14px;overflow:hidden">
    <span class="tl-clip vid" style="position:absolute;left:14px;top:30px;width:190px;height:56px"><b>Fox trots in</b><small>0:05</small></span>
    <span class="tl-ghost" style="left:204px;top:30px;width:60px"></span>
    <span class="tl-edgebar" style="left:201px;top:30px"></span>
    <span class="tl-tag" style="left:110px;top:4px">+0:12 · 0:05:12</span>
    <span class="tl-clip img" style="position:absolute;left:300px;top:30px;width:120px;height:56px"><b>Fox at dusk</b><small>0:03</small></span>
    <span class="tl-snapl" style="left:299px;top:22px;bottom:0"></span>
    <span class="tl-tag ok" style="left:296px;top:4px"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 15 4 4"/><path d="M2.352 10.648a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l6.029-6.029a1 1 0 1 1 3 3l-6.029 6.029a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l6.365-6.367A1 1 0 0 0 8.716 4.282z"/><path d="m5 8 4 4"/></svg>Playhead</span>
    <span class="tl-bl" style="left:470px;top:22px;bottom:0"></span>
    <span class="tl-cur" style="left:476px;top:40px"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg></span>
    <span class="tl-tag" style="left:466px;top:4px">0:07:03</span>
    <span class="tl-edgebar warn" style="left:600px;top:30px"></span>
    <span class="tl-tag warn" style="left:580px;top:4px">End of take</span>
  </div>
  <div class="tl-src" style="max-width:600px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="tl-pv">In frame</span><span class="mono" style="font-size:12px;color:var(--t2)">In 0:00:12</span></div>
    <div style="display:flex;flex:1;flex-direction:column;align-items:center;gap:4px"><span class="mono" style="font-size:10px;color:var(--t2)">take 8.0 s</span><div class="tl-take"><span class="tl-used" style="left:10%;width:55%"></span></div><span class="mono" style="font-size:10px;color:var(--t2)">+0:06</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="tl-pv">Out frame</span><span class="mono" style="font-size:12px;color:var(--t2)">Out 0:05:00</span></div>
  </div>
</div>
</body>
</html>
