<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AssistantMinBar · preview</title></head>
<body>
<div class="hs-row" style="gap:20px;align-items:flex-start">
  <div class="ast-min" style="position:relative;right:auto;bottom:auto"><button type="button" aria-label="Open the Assistant · waiting"><span class="lg"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg><span class="dot ask"></span></span><span class="tx"><span>Waiting for you</span><small>Generate 3 takes</small></span></button></div>
  <div class="ast-min" style="position:relative;right:auto;bottom:auto"><button type="button" aria-label="Open the Assistant · working"><span class="lg"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></span><span class="tx"><span>Working…</span><small>Reading the model</small></span></button><button class="no" type="button">Stop</button></div>
  <div class="ast-min" style="position:relative;right:auto;bottom:auto"><button type="button" aria-label="Open the Assistant · new answer"><span class="lg"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg><span class="dot new"></span></span><span class="tx"><span>New answer</span></span></button></div>
</div>
</body>
</html>
