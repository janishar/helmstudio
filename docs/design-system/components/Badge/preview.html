<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge · preview</title></head>
<body>
<div class="hs-row">
  <span class="tag">Default</span>
  <span class="tag tag-accent">New</span>
  <span class="st">Plain</span>
  <span class="st st-ok">Done</span>
  <span class="st st-run">Running</span>
  <span class="st st-wait">Waiting</span>
  <span class="st st-bad">Failed</span>
</div>
<div class="hs-row" style="padding-top:0">
  <i class="hs-thumb" style="width:auto;aspect-ratio:auto;height:28px;background:transparent;position:relative;padding:0 2px"><u class="bmu" style="position:static">Music</u></i>
  <i class="hs-thumb" style="width:auto;aspect-ratio:auto;height:28px;background:transparent;position:relative;padding:0 2px"><u class="bsn" style="position:static">Sound</u></i>
  <i class="hs-thumb" style="width:auto;aspect-ratio:auto;height:28px;background:transparent;position:relative;padding:0 2px"><u class="bvo" style="position:static">Voice</u></i>
</div>
</body>
</html>
