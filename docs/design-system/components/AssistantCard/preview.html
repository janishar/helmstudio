<!-- @dsCard group="Assistant" height=600 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AssistantCard · preview</title></head>
<body>
<div style="padding:14px">
<div class="ast drw" style="position:relative;inset:auto;z-index:auto;height:auto;gap:14px">
  <section class="cf" aria-label="Confirm: Generate 3 takes">
    <h3><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg><b>Generate 3 takes</b><span class="gpu">GPU</span></h3>
    <dl><dt>Workflow</dt><dd>FLUX.2 dev</dd><dt>Prompt</dt><dd>A fox at dusk, low sun</dd><dt>Seeds</dt><dd>7, 8, 9</dd></dl>
    <div class="est"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6h4"/></svg>about 1 min · 3 × 18 s</div>
    <div class="cfb"><button class="go" type="button">Generate</button><button class="no" type="button">Not now</button></div>
    <p class="fine">Nothing runs until you say so.</p>
  </section>
  <section class="cf danger" aria-label="Confirm: Delete 2 takes">
    <h3><b>Delete 2 takes</b></h3>
    <p class="qt">Fox at dusk · seed 7, Fox at dusk · seed 8</p>
    <div class="cfb"><button class="go" type="button">Delete</button><button class="no" type="button">Not now</button></div>
  </section>
  <div class="opts">
    <button class="opt rec" type="button"><span class="kbd">1</span><span><b>Longer shot</b><small>8 s, same seed</small></span><span class="tag">Best fit</span></button>
    <button class="opt" type="button"><span class="kbd">2</span><span><b>New seed</b><small>keeps the prompt</small></span></button>
  </div>
</div>
</div>
</body>
</html>
