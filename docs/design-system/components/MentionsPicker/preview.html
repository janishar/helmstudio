<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MentionsPicker · preview</title></head>
<body>
<div style="padding:14px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap">
<div class="ast" style="position:relative;inset:auto;z-index:auto;width:320px;background:none;box-shadow:none;overflow:visible;padding-top:300px">
  <div style="position:relative">
    <div class="pop at" role="listbox" aria-label="Pick a skill, take or element">
      <div class="atq"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><span>fox</span></div>
      <h4>Skills</h4>
      <button class="pr" type="button" role="option" aria-selected="false"><i class="pic" style="color:var(--a2);background:var(--s3)"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg></i><span>@storyboard</span><small>skill</small></button>
      <h4>Elements</h4>
      <button class="pr on" type="button" role="option" aria-selected="true"><i class="pic hs-pic" style="width:26px"></i><span>@fox</span><small>element</small></button>
      <h4>Takes · newest first</h4>
      <button class="pr" type="button" role="option" aria-selected="false"><i class="pic hs-pic"></i><span>Fox at dusk · seed 7</span><small>2m</small></button>
    </div>
    <form class="cmp" onsubmit="return false">
    <textarea rows="2" aria-label="Message" >Use @fox</textarea>
    <div class="cmpb">
      <button class="att" type="button" aria-label="Attach an image"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg></button>
      <button class="aut" type="button" role="switch" aria-checked="false"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></svg>Auto</button>
      <small><span class="kbd">⌘J</span> open or close · <span class="kbd">@</span> takes</small>
      <button class="snd" type="submit" aria-label="Send"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
    </div></form>
  </div>
</div>
<div class="pop hs-at" role="listbox" aria-label="Elements">
  <div role="option" aria-selected="true"><i class="pic hs-pic"></i><span><b>@fox</b><small>character · red fox, white tail tip</small></span></div>
  <div role="option" aria-selected="false"><i><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></i><span><b>@rooftop</b><small>location</small></span></div>
  <div role="option" aria-selected="false"><i><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg></i><span><b>@lantern</b><small>prop</small></span></div>
</div>
</div>
</body>
</html>
