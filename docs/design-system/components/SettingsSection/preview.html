<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SettingsSection · preview</title></head>
<body>
<div class="apage" style="padding:16px;max-width:560px">
  <section class="panel sec" aria-label="Default model">
    <div class="pgh"><h2>Default model</h2><a href="#">Hub</a></div>
    <span class="line">Picks the model a new chat starts with.</span>
    <div class="g2">
      <div class="fl"><label for="m1">Provider</label><select id="m1" class="in"><option>On this machine</option></select></div>
      <div class="fl"><label for="m2">Model</label><select id="m2" class="in"><option>Qwen3 8B</option></select></div>
    </div>
    <span class="warn">Remote models are off · Edit to pick another</span>
    <div class="sv"><span style="flex:auto"></span><button class="chip bevel" type="button" style="height:34px">Cancel</button><button class="key" type="button" style="height:34px;padding:0 18px;font-size:13px">Save</button></div>
    <p class="fine">Sends nothing out.</p>
  </section>
</div>
</body>
</html>
